that reliably rises and never changes a decision. If no value would make you act differently, it is not worth reporting."},{term:"Viability",origin:"General",moduleId:"exploration",definition:"Whether policy, operational, legal, financial and organisational conditions can sustain the solution. The business and policy lens in DVF."},{term:"Vision",origin:"Deck",moduleId:"thinking",definition:"A description of the future state the product or service is trying to create. The destination, not the route."},{term:"Ways of Working",origin:"Deck",moduleId:"government",definition:"The DES behaviours plus the Digital Delivery Framework \u2014 an end-to-end, repeatable delivery pipeline underpinned by seven principles."},{term:"Whole-of-service",origin:"Deck",moduleId:"government",definition:"Optimising the end-to-end experience across channels and systems, including assisted and non-digital, rather than one interface or project."},{term:"WSJF",origin:"SAFe",moduleId:"delivery",definition:"Weighted Shortest Job First: relative cost of delay divided by relative job duration or size. A comparative sequencing aid, not a guarantee."}],io=[{id:"x-think-1",moduleId:"thinking",prompt:"A service has been live for three years, has a named owner, a backlog and a quarterly improvement cycle. Funding arrives as a series of discrete projects. What is it?",options:["A project, mislabelled as a product","Neither \u2014 funding model decides","A programme of work","A product, funded by projects"],answer:3,optionNotes:["Ownership, backlog and improvement cadence are the defining properties. It is a product regardless of how the money arrives.","Funding is a constraint on a product, not its definition. The deck is explicit that product thinking can operate inside project funding.","A programme coordinates related projects. It says nothing about enduring ownership of a service.",""],rationale:"Ongoing ownership, an evolving backlog and an improvement cadence make it a product. The funding model is a constraint to work within, not a definition."},{id:"x-think-2",moduleId:"thinking",prompt:"Which is the clearest example of the deck's 'delivery \u2192 learning' shift?",options:["Publishing a release calendar for the coming quarter","Running a retrospective on how the team's process went","Instrumenting a release so it produces evidence that changes the next decision","Increasing deployment frequency so releases reach users sooner and more often"],answer:2,optionNotes:["A calendar communicates timing. It generates no evidence about whether the work mattered.","Retrospectives improve how the team works. Useful, but they examine process rather than whether the product changed anything.","","Frequency is a delivery capability. Shipping more often without measuring effect just produces wrong answers faster."],rationale:"The shift is about each release being expected to teach you something that alters what you do next \u2014 not about cadence or process hygiene."},{id:"x-think-3",moduleId:"thinking",prompt:"Your vision statement could describe almost any government service. What is the likely problem?",options:["It describes a generic quality rather than a specific future state","It is far too short to be useful","It has no measurable target attached to it","It is aspirational rather than operational, so nobody can act on it"],answer:0,optionNotes:["","Length is not the issue; some of the best visions are one line.","Visions are not supposed to carry targets \u2014 that is what key results do.","A vision should be aspirational. That is its job."],rationale:"'Simpler, faster, better' fits everything and therefore guides nothing. A vision has to name who it is for and what specifically becomes possible."},{id:"x-think-4",moduleId:"thinking",prompt:"Which trade-off is the deck actually asking product managers to make?",options:["User needs versus the needs of the business","What to pursue now versus what to explicitly defer","Time spent on discovery versus time spent on delivery","Speed of delivery versus quality of the build"],answer:1,optionNotes:["The role exists to hold these together, not to pick one.","","The deck argues these run in parallel, an increment apart \u2014 not that you choose between them.","A real tension, but not the strategic choice the deck names."],rationale:"Strategy is choosing priorities, focusing investment and deciding what not to do. Naming the deferral is what makes it a decision rather than a wish list."},{id:"x-disc-1",moduleId:"discovery",prompt:"Support data shows the top call reason is 'status enquiry'. What does that tell you on its own?",options:["That the provider portal needs a status page adding to it","That status information is hard to find in the current service","That people are calling about status, and nothing about why","That self-service would reduce the call volume"],answer:2,optionNotes:["A solution derived from a call-reason code. This is exactly the jump discovery exists to prevent.","Plausible, but it is an inference. They might be calling because they distrust what they can see.","","That is a hypothesis, and an untested one. Calls might move to another channel instead."],rationale:"Operational data tells you what is happening at volume. It never tells you why, and call-reason codes are assigned by staff under time pressure."},{id:"x-disc-2",moduleId:"discovery",prompt:"A five-whys chain ends at 'because the service grew through several projects and was never consolidated'. What kind of finding is that?",options:["An invalid conclusion \u2014 five whys should end at a user","A user need the team can act on","A usability problem in the interface","A structural cause outside the current team's control"],answer:3,optionNotes:["Five whys should end at a cause, wherever it sits. Ending at a structural one is common in government and is useful information.","It describes the system's history, not what any user is trying to achieve.","Usability is what people experience. This explains why the experience is that way.",""],rationale:"The deck's own chain ends here deliberately. Naming a structural cause tells you the problem cannot be fully solved at the interface \u2014 which changes what you propose and to whom."},{id:"x-disc-3",moduleId:"discovery",prompt:"Which is the strongest evidence that a persona is doing real work?",options:["It is grounded in interviews and observation","It changes a prioritisation decision","It has a name and a photograph","It was signed off by stakeholders"],answer:1,optionNotes:["Necessary, but not sufficient \u2014 well-researched personas still gather dust.","","Presentation. It can be beautifully produced and entirely invented.","Sign-off establishes agreement, not accuracy."],rationale:"Research grounding is the entry price. The test the deck applies to every artefact is whether it improves a consequential decision."},{id:"x-disc-4",moduleId:"discovery",prompt:"Which of these belongs in a journey map rather than a service blueprint?",options:["The user's emotional low point","The queue that assessment requests sit in","The legacy system holding application records","The team responsible for manual verification"],answer:0,optionNotes:["","Back-stage process. Blueprint.","Supporting system. Blueprint.","Back-stage people. Blueprint."],rationale:"Journey maps capture the user's experience over time \u2014 goals, touchpoints, emotions, pain points. Blueprints capture what happens behind the curtain to produce it."},{id:"x-out-1",moduleId:"outcomes",prompt:"A key result reads 'improve the provider experience'. What is missing?",options:["A named initiative and a delivery date","Agreement from the stakeholders","A named owner inside the team","A baseline, a target and a timeframe"],answer:3,optionNotes:["Initiatives are how you might move it. Their absence does not stop it being measurable.","Agreement on an unmeasurable statement is agreement about nothing.","Ownership matters but is not what makes a key result measurable.",""],rationale:"Without a baseline you cannot tell whether it moved; without a target you cannot tell whether it moved enough; without a timeframe you cannot tell when to check."},{id:"x-out-2",moduleId:"outcomes",prompt:"Your team hits a grade 4 on every key result, three quarters running. What is the most likely explanation?",options:["Exceptional delivery performance across the year","The measures are well designed and stable","The targets are being set below what the team already expects to achieve","The grading scale is being applied far too generously by the team each quarter"],answer:2,optionNotes:["Possible, but consistently exceeding every target is a stronger signal about the targets than the team.","Well-designed targets should occasionally be missed. Never missing means they carry no information.","","Generous grading is a variant of the same problem, but the deck's scale is specific enough that target-setting is the usual culprit."],rationale:"Targets that are always exceeded have stopped being targets. A mix of 2s and 3s with clear insight is more useful to the organisation than a wall of 4s."},{id:"x-out-3",moduleId:"outcomes",prompt:"Which pairing would best detect that a faster online form is pushing failures onto the phone channel?",options:["Completion rate and assisted-channel contact volume","Time on page and bounce rate across the whole form journey","Submission count and validation error count","Completion rate and satisfaction score"],answer:0,optionNotes:["","Both are online engagement measures and neither speaks to the other channel.","Both count online activity. A user who abandons and phones instead appears in neither.","Both measure the online channel. Neither can see the phone queue."],rationale:"Displacement is only visible if you measure the place the demand moves to. That is precisely what a guardrail on the assisted channel is for."},{id:"x-out-4",moduleId:"outcomes",prompt:"A dashboard reports 'notifications sent: 42,000'. Under what condition is that worth reporting?",options:["Never \u2014 it is a pure activity count and says nothing about result","When it is paired with whether recipients acted on them","When the number is growing quarter on quarter","When it is compared against the same quarter last year"],answer:1,optionNotes:["Too absolute \u2014 as a denominator for an action rate it is genuinely useful.","","Growth in an activity count tells you the system is busier, not better.","A comparison of two activity counts is still an activity count."],rationale:"Volume becomes meaningful the moment it is the denominator of a behaviour: of 42,000 sent, how many led to the action the notification existed to prompt?"},{id:"x-exp-1",moduleId:"exploration",prompt:"Which option should always be on the table before a build option is chosen?",options:["Extending an existing departmental system to cover it","Doing nothing at all until the next financial year","Removing the step or changing the process entirely","Buying a commercial off-the-shelf product instead"],answer:2,optionNotes:["A sensible reuse option, but again a technology response.","A legitimate choice, but deferral is not the same as questioning whether the step needs to exist.","","Sometimes right, but it is still a build-or-buy solution to an assumed problem."],rationale:"The deck asks for non-build, process and policy options in the option set. The cheapest fix is often deleting a step that only exists because of how the department is organised."},{id:"x-exp-2",moduleId:"exploration",prompt:"You run a prototype test with eight providers. Six complete the task, two do not. What have you learned?",options:["Nothing useful here \u2014 a sample of eight providers is far too small to conclude anything","The design works for roughly 75% of providers, so it is ready","The design is ready to build once the two failures are patched","The concept is broadly comprehensible, and two failure modes are worth understanding"],answer:3,optionNotes:["Eight is a reasonable qualitative sample for comprehension. The failures are the most informative part.","Eight participants cannot support a percentage. Treating qualitative counts as rates is a common misreading.","Comprehension is one risk. Feasibility, viability and scale are untested.",""],rationale:"Small-sample qualitative work tells you what can go wrong and why, not how often. The two failures are the finding; go and understand them."},{id:"x-exp-3",moduleId:"exploration",prompt:"'We'll build a small version and see how it goes.' What is missing for this to be an MVP?",options:["A budget and an approved delivery plan","A defined decision and a result that would change it","Full accessibility conformance from day one","A production release plan agreed with the operations team"],answer:1,optionNotes:["Cost matters, but a funded release that teaches you nothing is still not an MVP.","","Required regardless \u2014 but its presence does not make something an MVP.","An MVP may or may not go to production; that is not the defining property."],rationale:"'See how it goes' has no decision attached, so any result can be rationalised. An MVP exists to produce evidence about a specific question you have committed to acting on."},{id:"x-exp-4",moduleId:"exploration",prompt:"Policy will not permit the detail your design depends on. Which lens has failed, and what happens next?",options:["Viability \u2014 test whether the outcome is reachable within the constraint, or argue to change it","Desirability \u2014 redesign the service around what users say they would prefer instead","Feasibility \u2014 find a technical workaround that avoids the policy constraint entirely and ship it","Usability \u2014 simplify the interface until the missing detail is no longer needed"],answer:0,optionNotes:["","Users may well want it. That is not the blocker.","The technology is not the constraint here; the rule is.","Simplifying does not make a prohibited disclosure permitted."],rationale:"Policy and legal conditions are the viability lens. The two legitimate moves are designing to meet the intent within the constraint, or taking evidence to the policy owner."},{id:"x-del-1",moduleId:"delivery",prompt:"Two items: A is high value, high urgency, very large. B is moderate value, moderate urgency, very small. What does WSJF typically suggest?",options:["Neither \u2014 WSJF cannot compare items like these","A first, because urgency breaks the tie","A first, because value dominates the score","B first, because dividing by size favours it"],answer:3,optionNotes:["Relative comparison is exactly what WSJF is for.","Time criticality is part of cost of delay, still divided by size.","Value is the numerator, but the whole point of the formula is that it is divided by size.",""],rationale:"Cost of delay divided by job size systematically favours small valuable work, because benefit and learning arrive sooner per unit of effort. Judgement can still override."},{id:"x-del-2",moduleId:"delivery",prompt:"A stakeholder asks for a date for something in the 'Later' band. What is the right response?",options:["Give the date the team currently believes is achievable for the work","Give a date with a very wide confidence range attached to it","Explain what must be true before a date is meaningful, and what moves it to Next","Refuse to discuss anything at all beyond the items that are already in the Now band"],answer:2,optionNotes:["A believed date becomes a remembered commitment, regardless of caveats.","A range still implies you have estimated something you have not yet scoped or validated.","","Unhelpful. Stakeholders need direction even where dates are not available."],rationale:"Confidence bands exist because the evidence does not yet support a date. The useful answer converts the question into what would need to be resolved for one to exist."},{id:"x-del-3",moduleId:"delivery",prompt:"Which is the clearest sign a backlog has become a requirements dump?",options:["Items describe solutions with no stated outcome or measure","It has not been reordered for over a month","Multiple business areas are able to add items to it directly","It contains considerably more than 200 items"],answer:0,optionNotes:["","Concerning, but the ordering could still be correct.","The deck explicitly says anyone in the team may add; product management orders.","Size alone is normal for a long-lived product."],rationale:"The defect is not volume or authorship, it is items that cannot be traced to a user or service outcome \u2014 which makes their priority unjustifiable and their success unmeasurable."},{id:"x-del-4",moduleId:"delivery",prompt:"Halfway through a PI, discovery invalidates the hypothesis behind a committed feature. What should happen?",options:["Finish it anyway \u2014 the PI commitment was already made and communicated","Stop it, record what was learned, and re-plan the remaining capacity","Finish a reduced version of it to show progress","Continue and re-evaluate it at PI close instead"],answer:1,optionNotes:["Delivering something you now believe will not work is the sunk-cost fallacy with a governance wrapper.","","A smaller version of an invalidated idea is still an invalidated idea.","Waiting until close means spending the remaining weeks on it regardless."],rationale:"The plan changes when the evidence does \u2014 that is the 'adaptive' quality. Learning mid-increment is the parallel discovery stream working as intended."},{id:"x-life-1",moduleId:"lifecycle",prompt:"Which is the strongest evidence that a Discovery phase has actually finished?",options:["The discovery report has been written and signed off by the board","The time allocated to the phase has elapsed","You can state the problem, the users, the constraints and the unknowns","A preferred solution has been agreed with all of the stakeholders involved"],answer:2,optionNotes:["Sign-off records agreement with a document, not that the uncertainty has reduced.","Time elapsing is a budget event, not a knowledge event.","","Agreeing a solution in Discovery means it has run past its purpose into Alpha's territory."],rationale:"Discovery ends when you can articulate the problem and constraints clearly and name the remaining unknowns. Naming what you still do not know is part of the output."},{id:"x-life-2",moduleId:"lifecycle",prompt:"A Live service's completion rate has drifted down 8% over six months with no release in that period. What is the most likely cause?",options:["The original design was simply wrong from the start and is only now showing","Measurement error somewhere in the analytics","The code has degraded over time without releases","Something outside the service changed \u2014 users, policy or upstream systems"],answer:3,optionNotes:["Possible, but it would not explain a gradual change with a stable baseline earlier.","Worth ruling out, but drift with no release usually points outward, not at the instrument.","Code does not rot on its own without deploys. Dependencies around it do change.",""],rationale:"Services sit inside a moving system. Live-phase measurement exists to catch exactly this: the product did not change, but its context did."},{id:"x-life-3",moduleId:"lifecycle",prompt:"Why does the deck describe the lifecycle as a loop rather than a sequence?",options:["Because teams often have to redo work they thought was finished","Because measuring one release is the discovery input for the next","Because Agile delivery methods are iterative by design","Because in practice the phases frequently overlap with one another"],answer:1,optionNotes:["Rework is a symptom of a broken sequence, not the reason for the loop.","","True but circular \u2014 it names the method rather than the reason.","They do overlap, but overlap is not what makes it a loop."],rationale:"The loop closes because what you measure after release is what tells you which problem to solve next. Treating measurement as a terminal report breaks it."},{id:"x-life-4",moduleId:"lifecycle",prompt:"Which handover is sufficient at the Beta-to-Live transition?",options:["Documentation and runbooks, plus a named owner and an improvement cadence","A closure report and a benefits realisation statement signed off by the board","Transfer to the operations team with an agreed SLA","Documentation, runbooks and an agreed support rota"],answer:0,optionNotes:["","Documents the past and assigns nobody to the future.","An SLA covers availability, not whether the service achieves its outcome.","Keeps it running. Nobody is accountable for whether it still works for users."],rationale:"Operational support keeps a service up; product ownership keeps it useful. Without a named owner, measures and a cadence, quality decays with nobody accountable for noticing."},{id:"x-role-1",moduleId:"roles",prompt:"A designer and an engineer disagree about an approach in refinement. What is the product manager's job?",options:["Ask the Product Owner to break the tie between them","Decide it personally, since the product manager owns the product","Escalate the disagreement to the Solution Architect for a ruling","Make the trade-off explicit against the outcome, then get it decided"],answer:3,optionNotes:["It is not a backlog-clarity question, so it is not the PO's to break.","Deciding technical detail by authority wastes the expertise in the room.","Escalating a reversible team decision spends senior time and teaches the team not to decide.",""],rationale:"The trio exists so desirability, feasibility and viability are argued in the same conversation. The PM's contribution is framing the trade-off against the outcome, not overruling it."},{id:"x-role-2",moduleId:"roles",prompt:"Which decision most clearly belongs at the strategic layer?",options:["How a particular validation error message is worded","Whether to split a story into two smaller ones","Whether to retire a service and fold it into another","Which features go into the next Program Increment"],answer:2,optionNotes:["Delivery layer \u2014 'how do we deliver this well?'","Delivery layer.","","Coordination layer \u2014 'what should we deliver next?'"],rationale:"The strategic layer asks what future we are trying to create, and owns cross-product experience and service direction. Retirement and consolidation sit squarely there."},{id:"x-role-3",moduleId:"roles",prompt:"What is the practical cost of leaving decision rights unstated?",options:["Decisions default to whoever is most persistent","Teams make considerably more mistakes","Documentation grows without bound","Governance forums become longer and more frequent"],answer:0,optionNotes:["","Sometimes, but the deeper issue is that nobody knows whose call it was.","Documentation is not the mechanism by which authority gets captured.","A symptom, but not the core cost."],rationale:"Authority does not stay vacant. Unstated rights get filled by availability and persistence, which is how a service ends up shaped by whoever attends the most meetings."},{id:"x-role-4",moduleId:"roles",prompt:"In the deck's model, who is best placed to say whether the team is working on the right things?",options:["The Senior Responsible Officer","The Product Manager","The Scrum Master","The Product Owner"],answer:1,optionNotes:["Owns the project outcomes and champions the change, at a level above product direction.","","Owns team process and flow, not product direction.","Asks the complementary question: do teams have what they need to deliver successfully?"],rationale:"The deck pairs the two questions explicitly: the product manager asks whether we are working on the right things; the Product Owner asks whether teams can deliver them."},{id:"x-gov-1",moduleId:"government",prompt:"Which is the best evidence that the Digital Service Standard is being met, rather than merely claimed?",options:["Sign-off by the delivery manager at the governance gate","A completed self-assessment template held by the delivery team","Research, testing and performance data for each criterion","A statement of intent recorded in the approved business case"],answer:2,optionNotes:["Sign-off attests to process, not to criteria being met.","A template records that the questions were asked, not what the answers were.","","Intent is not evidence, and business cases are written before the work."],rationale:"The standard expects demonstration across the lifecycle. Governance evidence should show how criteria are being met, not that a document was completed."},{id:"x-gov-2",moduleId:"government",prompt:"Principle 4 says decisions belong closest to the problem. What does that require of governance?",options:["Delegating every decision to the delivery teams without exception","Faster approval turnaround from the forums","Fewer governance forums in the schedule","Delegating reversible decisions, reserving forums for risk"],answer:3,optionNotes:["Material risk, investment and cross-service trade-offs still need governance.","Speed helps but does not change which decisions need to go there at all.","Fewer forums without changed thresholds just delays the same decisions.",""],rationale:"The principle is about placement, not volume or speed. Reversible and local decisions go down; material risk and investment stay up."},{id:"x-gov-3",moduleId:"government",prompt:"Which is a legitimate reason for an accessibility issue to reach a governance gate unresolved?",options:["The assessment template did not require it to be checked at all","It was found late and a dated remediation plan is presented","It affects only a small number of users","It will be fixed in a later delivery phase"],answer:1,optionNotes:["Gate scope does not change the legal and standard obligation.","","Small user numbers do not reduce the obligation, and they usually undercount the people who never got far enough to be measured.","Deferral without a plan is the same decision as ignoring it."],rationale:"Finding a problem late is normal. Arriving without a plan, dates and interim mitigation is what turns a finding into a failure of assurance."},{id:"x-gov-4",moduleId:"government",prompt:"Which artefact belongs to the Pre-Delivery phase rather than Pre-Approval?",options:["A refined backlog with measures and baselines defined","The investment case for the programme","Options analysis with the associated risks and mitigations","Outcome hypotheses and early user evidence"],answer:0,optionNotes:["","The investment case is the Pre-Approval output by definition.","Options and risks support the investment decision \u2014 Pre-Approval.","Evidence and hypotheses make the case for investment \u2014 Pre-Approval."],rationale:"Pre-Delivery is where planning gets the right level of detail and the runway is established: refined backlog, validated approach, and baselines captured before build starts."},{id:"x-int-1",moduleId:"integration",prompt:"Which is the most honest thing to put in a status report when the outcome measure has not moved?",options:["It is too early to tell anything from the data yet","The measure needs revising because it is not the right one","Delivery is on track against the agreed plan and budget","The measure has not moved \u2014 here is what we will do"],answer:3,optionNotes:["Sometimes legitimate \u2014 but stated without a date by which it will be tellable, it is a way of deferring the conversation.","Sometimes right, but leading with it looks like moving the goalposts and destroys the baseline.","True and irrelevant if the work is not producing the change it was funded for.",""],rationale:"The chain of evidence is only useful if you report the link that is breaking. Naming it early is what lets a decision still be made."},{id:"x-int-2",moduleId:"integration",prompt:"Which of the six 'what good looks like' qualities is most at risk when a team optimises a single headline metric?",options:["Collaborative","Evidence based","User centred","Adaptive"],answer:2,optionNotes:["Collaboration concerns how options get shaped, which single-metric focus does not directly damage.","Ironically the metric is evidence \u2014 the problem is that it is the wrong evidence, narrowly held.","","The plan may still adapt; it just adapts toward the wrong target."],rationale:"Optimising one number reliably produces decisions that serve the number rather than the people behind it \u2014 which is the failure mode user-centredness names."},{id:"x-int-3",moduleId:"integration",prompt:"You have three minutes with a Minister's adviser. What do they need?",options:["The outcome, the evidence, the risk, and the decision","The full evidence base behind the current product position","The technical architecture and integration detail","The delivery timeline with all of its milestones"],answer:0,optionNotes:["","Depth without framing is unusable in three minutes.","Almost never the right level for this audience.","Timeline without outcome invites a question about dates rather than value."],rationale:"Adjust the depth, not the facts. At the most senior level that means outcome, evidence, risk and the decision required \u2014 in that order."},{id:"x-int-4",moduleId:"integration",prompt:"What most reliably distinguishes a defensible prioritisation decision from a defensive one?",options:["It was made in a formal governance forum with minutes","It can name the evidence that would change it","It has agreement from all stakeholders","It follows an agreed scoring model"],answer:1,optionNotes:["Venue is not reasoning.","","Agreement can be reached about an unjustifiable decision.","A score is the output of a judgement, not the justification for it."],rationale:"A defensible decision is falsifiable: you can state what would make you change your mind. A defensive one is protected from evidence rather than grounded in it."}],pt=[{id:"provider-status",title:"Provider application status",subtitle:"The deck's running case, worked end to end",outcome:"worked",summary:"Providers phone the support centre constantly to check where participant applications have got to. The obvious response is a status page. This case follows the chain properly and arrives somewhere better than the obvious response.",steps:[{moduleId:"thinking",stage:1,heading:"Framing it as a product, not a ticket",decision:"Accept the request as specified and plan a status page, or hold it open long enough to establish what the calls are actually about.",tempting:"Accepting is tempting because the request is specific, sponsored and immediately plannable \u2014 and because pushing back on a branch head reads as obstruction rather than diligence.",body:"The request arrived as 'build a status page', already scoped and already funded as a project deliverable. The product manager's first move was not to refuse it but to ask what would still be true in two years: who owns the status experience, who notices when it degrades, and what happens when the underlying systems change again.",insight:"The request was not wrong, it was premature. Reframing it as an owned capability rather than a deliverable is what created room to ask why the calls happen at all."},{moduleId:"discovery",stage:2,heading:"Finding the actual difficulty",decision:"Trust the volume of status calls as the problem, or find out what people were unable to work out for themselves.",tempting:"Call volume is a real number from a real system, which makes it feel like evidence about cause when it is only evidence about symptom.",body:"Call-reason coding said 'status enquiry' was the top driver. Twelve provider interviews and four hours of contact-centre observation said something more specific: providers were not confused about where an application was, they were unable to tell whether they needed to do anything. Most calls ended with the agent saying 'nothing needed at your end'.",artefact:"Our providers are currently experiencing uncertainty about whether action is required from them when supporting a participant's application. This occurs across the provider portal and the support line, and has been happening since the 2023 platform split. This is critical because it generates avoidable support demand and delays participants. Evidence: call-reason coding, 12 interviews, 4 hours of contact-centre observation.",insight:"The stated problem was 'I cannot see the status'. The real problem was 'I cannot tell whether it is my turn.' A status page answers the first and not the second."},{moduleId:"outcomes",stage:3,heading:"Defining success before building",decision:"Measure the thing that is easy to count, or the thing that would tell you the problem had gone.",tempting:"Page views were available on day one and would have risen no matter what \u2014 a measure that cannot fail is comfortable to commit to.",body:"The team wrote the objective around resolution rather than deflection, precisely because deflection is easy to fake by making it harder to call. A guardrail was set on the assisted channel so that any improvement achieved by pushing demand elsewhere would show up immediately.",artefact:`Objective: providers can tell whether action is required, without contacting us.
KR1: avoidable status contacts down 30% (baseline 4,100/month).
KR2: providers correctly state their next action unprompted in 8 of 10 usability sessions.
Leading: proportion of sessions reaching the next-action panel.
Guardrail: median time to resolution for unresolved cases does not worsen.`,insight:"The guardrail is the part that gets cut under pressure and the part that later proves you did not simply displace the problem."},{moduleId:"exploration",stage:4,heading:"Testing the cheap thing first",decision:"Build the integration, or test the assumption that would make the integration worthless.",tempting:"The integration was well understood and the team could start it immediately; testing first feels like delay when everyone already agrees on the destination.",body:"Three options went on the table: the requested status page, an action-required notification, and a non-build option of changing the provider's default view. The riskiest assumption was shared by all three \u2014 that providers would trust departmental status enough to act on it. A prototype with manually supplied data tested comprehension and trust before any integration work was scoped.",artefact:`Decision: whether to fund the status integration.
Riskiest assumption: providers will act on departmental status rather than ringing to confirm it.
Method: clickable prototype, manually supplied data, 8 representative providers.
Proceed if 6 of 8 state the correct next action unprompted AND say they would not call to confirm.`,insight:"The expensive integration was never the question. Whether the information would be believed was the question, and it cost eight conversations to answer."},{moduleId:"delivery",stage:5,heading:"Ordering the work honestly",decision:"Sequence by what the sponsor asked for first, or by what would produce learning soonest per unit of effort.",tempting:"Sponsor order is the path of least resistance and needs no justification in the room.",body:"The feature was sized to a single PI and written with a measurement field from the start. A dependency on the assessment platform's status API was recorded as a risk rather than assumed away, and the roadmap said Now/Next/Later rather than naming dates the evidence could not support.",artefact:`Feature hypothesis: providers shown a plain-language next action will resolve without contacting support.
Measurement: successful self-service rate for status queries, target 65% in the first PI after release.
In scope: application progress and required action. Out of scope: payment status.
Dependency: status API refresh frequency from the assessment platform.`,insight:"The measurement field is what made the next stage possible. Without it the PI would have closed with the benefit assumed."},{moduleId:"government",stage:8,heading:"Meeting the standard without theatre",decision:"Treat the Standard as a gate to pass at the end, or as criteria to design against from the start.",tempting:"Assessing at the end is how most projects do it, and it defers work that has no immediate deadline attached.",body:"Accessibility testing during Beta found that status was conveyed by colour alone in the first build. It was fixed before Live rather than logged as an enhancement. At the gate the team presented the finding, the fix and the residual risk on data freshness rather than a completed template.",insight:"Presenting a problem you have already fixed builds more governance confidence than presenting a clean template. It also makes the next honest report easier."},{moduleId:"integration",stage:9,heading:"What the evidence said afterwards",decision:"Report the headline improvement, or report what the measure set as a whole showed.",tempting:"The headline was genuinely good, and leading with it would have been true.",body:"Avoidable contacts fell 34%. The guardrail held: time to resolution for unresolved cases was flat. Usability sessions reached 9 of 10 on next-action comprehension. One finding was uncomfortable \u2014 providers with the largest caseloads still called, because they were checking several participants at once and the design assumed one.",insight:"The result was good and incomplete. Naming the caseload finding turned a successful release into the start of the next cycle rather than the end of the project."}],closing:"The team ended up building roughly what was originally asked for, but with a different core: an action-required signal rather than a status display. That difference came entirely from stage 2, and would have been invisible if the work had started at stage 5."},{id:"employer-vacancy",title:"Employer vacancy drop-off",subtitle:"A case where the method catches the mistake \u2014 late",outcome:"corrected",summary:"Employers were abandoning the vacancy-advertising form at high rates. The team fixed the form, the completion rate improved sharply, and the outcome did not move at all. This case is included because a method that only ever endorses itself teaches nothing.",steps:[{moduleId:"discovery",stage:2,heading:"Where the team started \u2014 and stopped",decision:"Treat the drop-off as the problem, or ask what employers were trying to achieve when they abandoned.",tempting:"The drop-off was precisely located and unambiguous, which makes it feel like a problem rather than a symptom of one.",body:"Analytics showed 61% abandonment at the position-details step. The team ran a heuristic review, found the step long and the wording dense, and moved straight to redesign. No employer was interviewed. The reasoning felt sound: the data showed exactly where people left.",insight:"Analytics told them WHERE. Nobody established WHY. The team treated a location as a diagnosis \u2014 the single most common discovery failure."},{moduleId:"outcomes",stage:3,heading:"The measure that let it happen",decision:"Track completion of the form, or track whether the vacancy got filled.",tempting:"Completion is inside the team's control and moves quickly; fill rate depends on the labour market and takes months to read.",body:`Success was defined as form completion rate. It was specific, baselined and time-bound \u2014 it looked like a good key result and satisfied every formal test anyone would apply to it.

What it never asked was whether a completed form produced a filled vacancy. Completion is a step in the employer's journey, not the thing the employer came for, and the two can move in opposite directions: a shorter form is easier to finish and can carry less of the information a jobseeker needs to decide whether to apply. Nothing in the measure would report that, which is precisely why the measure survived review.`,artefact:`Objective: make advertising a vacancy easier.
KR1: completion rate 39% \u2192 65% by March.
(no guardrail, no outcome measure beyond the form itself)`,insight:"A well-formed key result measuring the wrong thing is more dangerous than a vague one, because it passes review and then drives the work."},{moduleId:"delivery",stage:5,heading:"A clean delivery of the wrong thing",decision:"Ship on the evidence held, or ask what the completion measure could not see.",tempting:"Everything the team was measuring said the work was succeeding, and stopping to question a measure that is going the right way is counter-intuitive.",body:`The redesign shipped in one PI. Completion rose from 39% to 71%, comfortably beating the target. The team graded the key result a 4, closed the epic and moved on. Delivery performance was genuinely excellent and nobody involved did anything careless.

That is what makes this the instructive case. Every signal the team had agreed to watch said the work was succeeding, and the signal that would have contradicted it \u2014 whether vacancies were being filled \u2014 had never been agreed as something to watch. A team cannot notice what it has not instrumented, and by the time the epic closed there was no longer anyone looking.`,insight:"Every delivery signal was green. This is what makes output-based measurement so persistent: it rewards teams accurately for the wrong achievement."},{moduleId:"integration",stage:9,heading:"The finding nobody was looking for",decision:"Explain the fill-rate result as market conditions, or investigate whether the change caused it.",tempting:"The market explanation was plausible, external, and required nobody to have been wrong.",body:"Six months later an unrelated analysis showed vacancies filled had not moved. Digging in: the abandoned step had been acting as an unintentional filter. Employers who found it hard were largely those posting roles with pay or conditions that would not attract candidates. Making the form easier produced more listings, not more filled vacancies \u2014 and increased assessment workload downstream.",insight:"The friction was doing work nobody had noticed. Removing it optimised the measure and degraded the service, which is the exact failure a guardrail on a downstream outcome would have caught within weeks."},{moduleId:"outcomes",stage:3,heading:"What the correction looked like",decision:"Revert the simplification, or keep it and add what the shortened form had removed.",tempting:"Reverting is clean, defensible and undoes the harm immediately \u2014 it also discards a genuine improvement.",body:"The team rewrote the measure set around the outcome the service exists for, kept the completion improvement, and added the guardrail that should have been there. Crucially they did not revert the redesign \u2014 the form genuinely was better, it just was not sufficient.",artefact:`Objective: employers fill roles through the service.
KR1: vacancies filled within 30 days 22% \u2192 30%.
Leading: completion rate (retained \u2014 it moves early).
Guardrail: downstream assessment workload per filled vacancy does not rise.
Guardrail: proportion of listings receiving zero applications does not rise.`,insight:"Completion rate was not a bad measure. It was a leading indicator being used as an outcome. That distinction is the whole of stage 3."}],closing:"Nothing in this case required unusual insight to avoid. A single guardrail on a downstream outcome would have surfaced the problem in the first month instead of the sixth. That is the entire argument for defining the measure set before delivery rather than after."},{id:"identity-policy",title:"The mandated identity step",subtitle:"Product work against a constraint that will not move",outcome:"worked",summary:"Legislation requires identity verification before a participant record can be created. Research shows it is where the most vulnerable applicants abandon. The constraint is real and is not going to change this financial year. This case is about what product management can still do when the obvious answer \u2014 remove the step \u2014 is not available.",steps:[{moduleId:"discovery",stage:2,heading:"Establishing what is actually binding",decision:"Accept 'identity verification is mandatory' as the constraint, or find out precisely what the legislation requires.",tempting:"Taking the constraint at the level it was handed over is faster, and challenging a legal requirement feels well outside a product manager's remit.",body:`The team read the instrument rather than the summary of it. It requires that identity be established to a specified assurance level before a record is created. It does not specify a document set, a channel, an order of steps, or that verification happen in one sitting.

That distinction is the entire case. 'Identity must be verified' is binding. 'Applicants must upload three documents in a single session before proceeding' was an implementation decision made years earlier by people solving a different problem, and had been inherited as though it were the law.`,artefact:`Binding:      identity established to assurance level 2 before record creation
Not binding:  which documents, which channel, what order, single session
Source:       s.14(2), read directly \u2014 not the process guide summarising it`,insight:"Constraints arrive bundled with the implementation someone chose for them. Separating the two is often the whole of the available design space, and it costs an afternoon of reading."},{moduleId:"discovery",stage:2,heading:"Finding who the step actually excludes",decision:"Treat the 31% abandonment as a general usability problem, or find out whether it is concentrated.",tempting:"An aggregate abandonment rate suggests an aggregate fix \u2014 better instructions, a clearer page \u2014 which is cheap and looks responsive.",body:`Disaggregated, the rate was not general at all. Applicants with a current driver licence and a stable address abandoned at 6%. Applicants without one \u2014 people recently released from custody, people escaping family violence with no documents in their own name, people with no fixed address \u2014 abandoned at 74%.

Observation with twelve people in the second group found the failure was not comprehension. They understood the page. They did not have the documents, could not obtain them quickly, and the service offered no path that acknowledged this.`,artefact:`Abandonment at identity step
  with standard documents      6%   (n=1,240)
  without standard documents  74%   (n=310)
The aggregate 31% describes nobody.`,insight:"An average across two populations with different experiences describes neither. Disaggregation before intervention is the difference between fixing a page and finding the actual exclusion."},{moduleId:"exploration",stage:4,heading:"Options when the constraint stays",decision:"Redesign the screen, or change what the journey does when verification cannot complete.",tempting:"Redesigning the screen is squarely within the team's control, needs nobody's permission, and would produce a visible improvement to show at the next checkpoint.",body:`The team listed options against the binding requirement rather than the inherited process. Verification still had to happen before a record existed \u2014 but nothing required the applicant to be alone, unaided, in one sitting, or online.

Three options survived: an assisted pathway where a caseworker completes verification with the applicant present; a save-and-return state so a partial application persists while documents are obtained; and a referral to the existing documentation-support service, which already existed and which no one in the journey had ever been told about.`,artefact:`Option                         Binding req met?   Cost      Reaches the 74%?
Rewrite the screen             yes                low       no
Assisted pathway               yes                medium    yes
Save and return                yes                medium    partly
Remove the step                NO                 --        --`,insight:"The option that removes the constraint is usually the only one anybody names, and it is usually the one that is unavailable. Listing options against what is actually binding produces three you had not considered."},{moduleId:"government",stage:8,heading:"Taking the evidence to the policy owner",decision:"Implement the workaround quietly, or give the policy owner the data they have never had.",tempting:"Implementing quietly avoids a difficult conversation and delivers the improvement sooner. It also leaves the underlying requirement untouched for every other service that inherits it.",body:`The team presented the disaggregated abandonment data to the policy area as a finding, not a complaint, and did not ask for an exemption. The framing was: here is who your requirement is currently excluding, here is what we can do inside it, and here is what only you can change.

The policy owner had never seen the requirement's effect on people without documents, because nothing in the assurance process reported it. They kept the assurance level and revised the guidance to name the assisted pathway as an acceptable route \u2014 which then applied across every service using the instrument.`,insight:"A policy owner is not the opposition. They are usually the person with the least visibility of what their instrument does at the counter, because nothing routinely reports it back to them."},{moduleId:"outcomes",stage:3,heading:"Measuring the thing that mattered",decision:"Report the overall abandonment rate, or the rate for the group the work existed to reach.",tempting:"The overall rate improved and is the number the dashboard already carried.",body:`The team measured completion for the group without standard documents specifically, and paired it with a guardrail on assisted-channel wait times \u2014 because a pathway that works only by pushing people into a queue that then takes six weeks has moved the problem rather than solved it.

Abandonment in that group fell from 74% to 22% over two quarters. The overall rate moved from 31% to 14%, which is the number that would have been reported anyway and which would have looked like a modest usability win.`,artefact:`Outcome:    applicants without standard documents complete identity verification
Baseline:   26% completion
Target:     60% by Q4
Actual:     78%
Guardrail:  assisted-channel wait <= 5 working days (held at 3)`,insight:"The headline would have improved on its own and told you almost nothing. The measure that made the work legible was the one scoped to the people it was for."}],closing:"Nothing here required the constraint to move, and the constraint did not move. What moved was the assumption that the inherited process was the requirement. That distinction \u2014 binding versus inherited \u2014 is available on almost every piece of government product work, and it is where most of the real design space is hiding."},{id:"service-decay",title:"The service that quietly stopped working",subtitle:"What Live costs when nobody owns it",outcome:"corrected",summary:"A claims service launched well, met every target, and the project closed. Eighteen months later completion had drifted down eight points with no release in that period. This case is about what a product manager does when the problem is that nobody has been looking \u2014 and about why the Beta-to-Live handover is where services are most often lost.",steps:[{moduleId:"lifecycle",stage:6,heading:"The handover that recorded everything except ownership",decision:"At closure, treat the service as delivered, or as something that now needs an owner.",tempting:"Everything was genuinely finished. The documentation was complete, the runbooks existed, operations had accepted support, and the benefits statement was signed. Closure was the correct administrative act.",body:`The handover pack was thorough. It transferred the ability to keep the service running \u2014 incidents, availability, patching \u2014 to a team accountable for exactly that.

What it did not transfer was accountability for whether the service still worked for the people using it. Nobody was named against completion rate. No cadence existed at which anyone would look. Operations were meeting every commitment they had been given, and the service was degrading, and both of those were true at once.`,artefact:`Transferred:   incident response, availability, patching, support rota
Not transferred: completion rate, user research, the backlog, the outcome
Named owner for service performance: (blank)`,insight:"Operational ownership and product ownership are different things, and a closure pack that transfers only the first will pass every review. The gap is invisible until a measure moves."},{moduleId:"outcomes",stage:3,heading:"Reading a drift with no release to blame",decision:"Attribute the drop to the original design, or work outward from what could have changed.",tempting:"'The design was never right' is available immediately, requires no investigation, and is unfalsifiable \u2014 which is precisely why it survives so long in post-launch conversations.",body:`The code had not changed in the period. That rules out the design as a cause of the *change*, whatever its merits: a static system producing a declining result means something around it moved.

The team worked through the four things that move underneath a stable service. Users: a new cohort had entered following an eligibility expansion. Policy: a rule change had added a condition. Upstream: a register had altered a field's format. Volume: a seasonal peak had pushed a queue past a threshold with no alarm on it. Three of the four had happened.`,artefact:`Completion, monthly (no releases in period)
  Mar 82% ####################
  Jun 79% ###################
  Sep 76% ##################
  Dec 74% #################
Candidate causes:  users [yes]  policy [yes]  upstream [yes]  volume [no]`,insight:"A drift with no release is diagnostic, not mysterious. It narrows the cause to the environment, and the environment has a short and checkable list."},{moduleId:"discovery",stage:2,heading:"Which of the three actually caused it",decision:"Fix all three plausible causes, or establish which one is responsible.",tempting:"Fixing all three is decisive, fast to authorise, and feels responsible. It also guarantees you will never learn which one mattered, and two of the three fixes carry their own risk.",body:`The team segmented completion by cohort and by date. The eligibility expansion had brought in applicants whose circumstances the form handled poorly, but their completion was flat, not falling. The upstream field change affected a validation path used by 2% of applicants.

The policy rule change matched the timing exactly, and the decline was concentrated among applicants the change was specifically intended to help \u2014 because the form asked about the new condition in language lifted directly from the instrument.`,artefact:`Segment                     Mar    Dec    Delta
Pre-existing cohort         83%    76%    -7
New eligibility cohort      71%    70%    -1
Affected by upstream field  79%    77%    -2
Subject to new condition    80%    58%   -22   <-- here`,insight:"Three plausible causes and one real one is the normal ratio. Segmenting before acting cost a week and prevented two changes that would have been risk without benefit."},{moduleId:"roles",stage:7,heading:"Fixing the thing that let it happen",decision:"Fix the wording and close the incident, or fix the absence of an owner.",tempting:"The wording fix is a day's work, resolves the visible problem, and is the entire ask as it was handed to the team.",body:`The wording change took a day and recovered the completion rate within a month. The team also proposed the structural fix, which was harder to get funded because nothing was visibly broken any more.

What they asked for was small: a named product owner for the service, four measures reported monthly, and a standing half-day each month to look at them. Not a team, not a project \u2014 an owner and a cadence.`,artefact:`Fix:        reword the condition question in plain language  (1 day)
Structural: named owner for service performance             (0.1 FTE)
            four measures, reported monthly
            half-day monthly review, standing
Detection:  four months  ->  target one month`,insight:"The wording was the fault. The absence of an owner was the reason it took four months to find. Fixing only the first guarantees the next one takes four months too."},{moduleId:"integration",stage:9,heading:"Reporting it without burying it",decision:"Report the recovery, or report the four months.",tempting:"The recovery is a genuine success and reflects well on everyone involved, including the people who would have to fund the structural fix.",body:`The team led with the gap in detection rather than the fix. The sentence was: a policy change reduced completion for the group it was meant to help, it took us four months to notice because nobody owned the measure, we have fixed the cause in a day, and we are asking for the owner so the next one takes a month.

That framing made the structural request fundable. Leading with the recovery would have made it a story about competence, and competence does not need investment.`,insight:"How a result is framed determines what happens next. Leading with the fix closes the item; leading with the detection gap opens the decision that prevents the recurrence."}],closing:"This service was never badly built and was never badly run. It was unowned, which is a different failure and a much more common one. The Beta-to-Live transition is where it happens, it happens quietly, and the cost is measured in how long it takes anyone to notice."}],Ln=[{id:"provider",title:"Provider application status",short:"The deck's case. Support demand driven by uncertainty.",brief:"Providers frequently contact support because they cannot reliably understand participant application progress. Information is fragmented across systems, policy and operational constraints matter, and any response must remain accessible, secure and clear about escalation.",twist:"The obvious answer \u2014 a status page \u2014 is close to right but not quite. Whether you find the gap depends entirely on how you handle stage 2."},{id:"vacancy",title:"Employer vacancy drop-off",short:"High abandonment on a form. The obvious fix makes things worse.",brief:"Employers abandon the vacancy-advertising service at 61% at the position-details step. Leadership wants the form simplified and has asked for a completion-rate target. The service exists so that roles get filled, and downstream assessment capacity is already stretched.",twist:"Removing the friction is straightforward and will move the completion rate. Whether it moves the outcome is a different question, and the brief contains enough to work out why."},{id:"own",title:"A service you actually work on",short:"Bring your own. Hardest and most useful.",brief:"Choose a service you are responsible for or close to. You will not have clean evidence, the constraints will be real, and someone will already have a preferred solution. That is the point \u2014 the method has to survive contact with an actual organisation.",twist:"The discipline that matters here is honesty about what you do not know. Mark assumptions as assumptions rather than quietly promoting them to facts."}],so=[{moduleId:"thinking",good:"The team can name the outcome the work is meant to change, and who owns it after go-live.",usual:"The team can name the scope and the date, and ownership after go-live is unassigned.",tell:"Ask three people what changes for users if this succeeds. If you get three different answers, there is no outcome \u2014 only scope."},{moduleId:"thinking",good:"Strategy states what is deliberately not being pursued this year.",usual:"Strategy lists priorities, all of which are 'high'.",tell:"Count the things labelled top priority. More than three and the prioritisation has not happened yet."},{moduleId:"discovery",good:"The problem statement describes observed behaviour and cites where the evidence came from.",usual:"The problem statement describes a missing feature.",tell:"Remove every proposed solution from the statement. If nothing meaningful is left, it was a solution wearing a problem's clothes."},{moduleId:"discovery",good:"Analytics locate the problem; qualitative work explains it; the two are checked against each other.",usual:"Analytics locate the problem and the team infers the cause from the location.",tell:"Ask what would have to be true for the obvious explanation to be wrong. If nobody has checked, you have a location, not a diagnosis."},{moduleId:"outcomes",good:"Every key result has a baseline, and at least one guardrail protects a group or channel.",usual:"Key results have targets but no baselines, and no guardrails at all.",tell:"Ask what number it is today. If nobody knows, you cannot demonstrate improvement later \u2014 only assert it."},{moduleId:"outcomes",good:"The measure would change the decision if it moved the wrong way.",usual:"The measure is reported monthly and has never changed anything.",tell:"Name the last decision this metric altered. If there isn't one, it is a vanity metric regardless of how rigorous it looks."},{moduleId:"exploration",good:"At least one option in the set is non-build \u2014 process, policy, guidance, or removing a step.",usual:"Every option is a different way to build the same thing.",tell:"If all your options need engineering, you started generating after the solution had already been chosen."},{moduleId:"exploration",good:"The stop condition was written before the test ran.",usual:"The result is interpreted after the fact, and always supports continuing.",tell:"Ask what result would have killed this. If the honest answer is 'none', the test was theatre."},{moduleId:"delivery",good:"Every feature carries a measurement field, and it is filled in.",usual:"Features carry acceptance criteria, so you learn whether it was built but never whether it worked.",tell:"Open the last three completed features. If none records what changed, the loop is not closing."},{moduleId:"delivery",good:"The roadmap uses confidence bands beyond the current increment.",usual:"The roadmap gives dates for everything, and the far ones are quietly known to be fiction.",tell:"Ask what evidence supports the date twelve months out. If it is 'that is when the funding ends', it is a constraint, not a forecast."},{moduleId:"lifecycle",good:"A live service has a named owner, a measure and a review cadence.",usual:"A live service has a support rota and an SLA for availability.",tell:"Ask who decides what gets improved next. If the answer is a team that no longer exists, decay has already started."},{moduleId:"roles",good:"Reversible decisions are made by the team; governance sees material risk and investment.",usual:"Everything is escalated, so governance is busy and slow on the things that matter.",tell:"Look at the last governance agenda. Count items that could have been decided by the team without meaningful risk."},{moduleId:"roles",good:"The Product Owner spends most of the week on refinement and acceptance.",usual:"The Product Owner spends most of the week relaying questions between the team and the business.",tell:"If the PO is the only route to an answer, decision rights were never agreed \u2014 that is a structural problem, not a workload one."},{moduleId:"government",good:"Gate papers show what was learned, what changed as a result, and what is still uncertain.",usual:"Gate papers show that the required documents exist and are signed.",tell:"Search the last gate paper for the word 'assumption'. Zero mentions usually means the risks were smoothed rather than surfaced."},{moduleId:"government",good:"Accessibility is tested during Beta and blockers are fixed before Live.",usual:"Accessibility is assessed near Live and issues become post-launch enhancements.",tell:"Ask when the first assistive-technology test is scheduled. If it is after the build is complete, it is an audit, not design."},{moduleId:"integration",good:"Priority decisions can name the evidence that would reverse them.",usual:"Priority decisions cite a scoring model or a sponsor.",tell:"Ask what would change your mind. An answer you cannot give is a decision that cannot be argued with \u2014 which is not the same as a good one."},{moduleId:"integration",good:"Results are reported disaggregated, so harm to a subgroup is visible.",usual:"Results are reported as averages, and the average is genuinely better.",tell:"Split the headline number by channel, assistive technology and caseload size. If nobody has, you do not yet know who you helped."}];var de="15 August 2026",Na=[{id:"deck",title:"Product Management Fundamentals \u2014 12AUG2026",publisher:"DEWR / Digital Experience and Solutions Division",note:"Primary course spine, 98 slides across nine sections. Slide ranges are shown on each stage.",checked:de},{id:"dss",title:"Digital Service Standard, Version 2.0",publisher:"Australian Government / Digital Transformation Agency",url:"https://www.digital.gov.au/policy/digital-experience/digital-service-standard",altUrl:"https://www.digital.gov.au/sites/default/files/documents/2024-10/Digital%20Service%20Standard.pdf",altLabel:"PDF",note:"Current standard: 10 criteria, reduced from the former 13. Fully in effect \u2014 new services from 1 July 2024, and public-facing services that existed before that date from 1 July 2025.",checked:de},{id:"scrum",title:"The Scrum Guide (2020)",publisher:"Ken Schwaber and Jeff Sutherland",url:"https://scrumguides.org/docs/scrumguide/v2020/2020-Scrum-Guide-US.pdf",note:"Authoritative definitions for Product Goal, Product Backlog, Sprint Goal and Increment. Note that Scrum does not define epics, features or Program Increments.",checked:de},{id:"wsjf",title:"Weighted Shortest Job First",publisher:"Scaled Agile Framework",url:"https://framework.scaledagile.com/wsjf/",note:"Defines WSJF as relative cost of delay divided by relative job duration/size, and cost of delay as user/business value plus time criticality plus risk reduction or opportunity enablement.",checked:de},{id:"cdh",title:"Opportunity Solution Trees",publisher:"Teresa Torres, Product Talk",url:"https://www.producttalk.org/2016/08/opportunity-solution-tree/",note:"Free, full article. Mapping a clear outcome to opportunities, then to solutions and assumption tests, by a product trio.",checked:de},{id:"svpg",title:"The Product Operating Model: An Introduction",publisher:"Marty Cagan, Silicon Valley Product Group",url:"https://www.svpg.com/product-vs-feature-teams/",note:"Outcome-accountable teams and the value, usability, feasibility and viability risks addressed in discovery.",checked:de},{id:"eriksson",title:"What, exactly, is Product Management?",publisher:"Martin Eriksson, Mind the Product",url:"https://www.mindtheproduct.com/what-exactly-is-a-product-manager/",note:"Origin of the business / technology / user-experience intersection framing quoted on slides 8 and 54 of the source deck, where it appears unattributed.",checked:de},{id:"ideo",title:"Introduction to Design Thinking",publisher:"IDEO",url:"https://designthinking.ideo.com/introduction",note:"Human-centred innovation balancing desirability, feasibility and viability.",checked:de},{id:"lean",title:"What is a Lean Canvas?",publisher:"Ash Maurya",url:"https://ashmaurya.com/blog/what-is-lean-canvas",note:"The canvas as a one-page model of assumptions to expose and test, adapted on slide 33 of the deck.",checked:de},{id:"perri",title:"Product strategy and the build trap",publisher:"Melissa Perri",url:"https://melissaperri.com/blog",note:"Free articles. Named in the deck's recommended reading (slide 97); the source of the 'build trap' framing behind outputs-versus-outcomes.",checked:de},{id:"cddo",title:"Introduction to Product Management (UK Government)",publisher:"Central Digital and Data Office with GDS, on FutureLearn",url:"https://digitalpeople.blog.gov.uk/2024/10/15/introduction-to-product-management-now-available-on-futurelearn/",note:"Free. The closest public comparator to this course: product management written for government delivery, built by CDDO with GDS and departmental colleagues. Useful for seeing which parts of the practice are common across jurisdictions and which are specific to DES.",checked:de},{id:"servicemanual",title:"GOV.UK Service Manual",publisher:"Government Digital Service",url:"https://www.gov.uk/service-manual",note:"Free. The reference standard for digital service delivery in government, and the model the Australian Digital Service Standard sits alongside. Read it for the phase guidance and the communities of practice.",checked:de},{id:"pichler",title:"Product Roadmaps and Product Strategy",publisher:"Roman Pichler",url:"https://www.romanpichler.com/blog/goal-oriented-agile-product-roadmap/",note:"Named in the deck's recommended reading (slide 97). Goal-oriented roadmaps as an alternative to dated feature lists.",checked:de},{id:"retrieval",title:"Test-Enhanced Learning",publisher:"Roediger and Karpicke (2006)",url:"https://pubmed.ncbi.nlm.nih.gov/16507066/",note:"Retrieving knowledge strengthens later retention more effectively than passive restudy over longer delays.",checked:de},{id:"spacing",title:"Distributed Practice in Verbal Recall Tasks",publisher:"Cepeda et al. (2006)",url:"https://pubmed.ncbi.nlm.nih.gov/16719566/",note:"Quantitative review supporting study distributed across time rather than massed into one sitting.",checked:de},{id:"techniques",title:"Improving Students' Learning With Effective Learning Techniques",publisher:"Dunlosky et al. (2013)",url:"https://pubmed.ncbi.nlm.nih.gov/26173288/",note:"Rates practice testing and distributed practice as high-utility. Note that it rates rereading and highlighting as low-utility \u2014 which is why this system makes you retrieve.",checked:de}],U=[{id:"thinking",number:1,title:"Product thinking and strategy",subtitle:"Move from delivering scope to creating value",minutes:45,slides:"1\u201320",outcome:"Explain what makes something a product, distinguish product from project thinking, connect vision to strategic choices, and apply product thinking inside a project-funded environment.",coreIdea:"A product is an enduring vehicle for value. Product management keeps user needs, organisational outcomes and technical reality in productive tension \u2014 and it works partially before it works perfectly.",sections:[{heading:"Product is an ownership model, not merely software",body:"A product can be a digital service, a policy-enabled capability, an operational system or a combination of these. What matters is that it serves identifiable users, has ongoing ownership, evolves through evidence and is judged by the value it creates. The deck puts it directly: a service is the series of interactions that helps someone do something; a product is the tool created to deliver that service.",bullets:["A project is a temporary structure for coordinating investment and delivering change.","A product persists after launch and must be operated, measured and improved.","A release is an output; a changed user or organisational result is an outcome.","A product solves a problem, delivers value, supports outcomes, evolves over time and has ongoing ownership."],example:"Launching an application-status page is an output. Providers resolving their status questions without calling support is an outcome.",sourceIds:["deck","scrum"]},{heading:"The product manager's central judgement",body:"Product management is often described as the intersection of business, technology and user experience \u2014 a framing that originates with Martin Eriksson and appears on slides 8 and 54 of the deck without attribution. The role is not to collect every request or write every requirement. It is to make evidence-informed choices where user value, organisational value and technical constraints meet, and to keep the team aligned on why the work matters.",bullets:["Desirable or valuable: people have a meaningful need and will use the result.","Viable: policy, operational, financial, legal and service constraints can sustain it.","Feasible and usable: the team can build and operate it, and people can understand it.","The deck names three accountabilities: vision and strategy, execution and delivery, and product success."],sourceIds:["eriksson","svpg","ideo","deck"]},{heading:"Vision gives direction; strategy makes choices",body:"Vision describes the future state worth moving toward. Strategy identifies the critical problems and choices that create progress toward it. A roadmap then communicates a current sequence of bets \u2014 it is not the strategy itself. The deck is blunt about this: strategy is not doing everything, building every feature or satisfying every stakeholder. It is choosing priorities, focusing investment, making trade-offs and deciding what not to do.",bullets:["Vision should be stable enough to orient multiple delivery cycles.","Strategy says where to focus and, crucially, what not to pursue now.","Priorities should be traceable to evidence, constraints and desired outcomes.","A list that accommodates every stakeholder is a decision deferred, not a strategy."],example:"Vision: providers can understand and manage applications with confidence. Strategy: first reduce uncertainty at the three points that generate most avoidable support demand. Deliberate non-priority: no changes to the assessment workflow this year.",sourceIds:["deck","svpg","perri"]},{heading:"Product thinking survives inside project funding",body:"Government funds projects, not products. Departments run project frameworks, not product frameworks. Delivery is measured by outputs more often than by value. All of this is true, and none of it makes product thinking impossible \u2014 it makes partial adoption the realistic goal. The deck's own framing is that product management is not all or nothing.",bullets:["Doing some discovery is better than doing none.","Using outcomes imperfectly is better than tracking only outputs.","Testing one assumption is better than testing none.","Getting some user feedback after a release is better than none."],example:"A project with fixed scope and a fixed date can still run a two-week bounded discovery on the riskiest assumption, and still define one outcome measure and one guardrail before build starts.",sourceIds:["deck"]},{heading:"The shift in thinking, in four pairs",body:"The deck compresses the whole first section into four contrasts. They are worth memorising because they diagnose most disagreements you will have about priority.",table:{caption:"Slide 13 \u2014 A shift in thinking",head:["From","To","What changes in practice"],rows:[["Projects","Products","Ownership continues after go-live; someone is accountable for performance."],["Outputs","Outcomes","Success is a measured change, not a delivered artefact."],["Requirements","Problems","The team is briefed on the problem and constraints, not handed a solution."],["Delivery","Learning","Each release is expected to produce evidence that changes the next decision."]]},sourceIds:["deck","perri"]},{heading:"Worked reasoning: the request that arrives as a solution",body:`A branch head emails: 'We need a dashboard so providers can see their application status.' The weak move is to accept it, because it is specific, sponsored and easy to plan. The work then proceeds without anyone establishing what problem the dashboard solves, so success becomes 'the dashboard shipped' \u2014 which it will, on time, and the phones will keep ringing. 

Product thinking does not mean refusing the request. It means holding the request and the problem apart long enough to see whether they match. Ask what the branch head has observed that makes a dashboard feel necessary. The answer here was 'providers keep calling and my staff spend half their day on it.' That is a different statement: it names a cost, a group and a behaviour. It admits several solutions \u2014 a dashboard, but also proactive notifications, clearer timeframes at submission, or removing the wait that generates the anxiety. It also implies a measure the dashboard alone never would: avoidable status calls. 

Notice what has not happened. Nobody has been told they are wrong, no governance has been bypassed, and the dashboard may still be the answer. What changed is that success is now defined as fewer avoidable calls rather than a delivered artefact, so the team can tell afterwards whether it worked \u2014 and can stop if it does not.`,bullets:["A solution arriving as a request is not a problem to fight; it is evidence that somebody feels a cost worth naming.","The question that reframes almost anything: 'What have you seen that makes this feel necessary?'","If the answer names a behaviour, a group and a cost, you have a problem statement. If it names a feature, keep going."],example:"The dashboard was built \u2014 and so were submission-time expectations and a status notification. Avoidable calls fell 41%. The dashboard accounted for less of that than anyone predicted, which is only knowable because the measure was the calls and not the dashboard."}],questions:[{id:"thinking-q1",moduleId:"thinking",prompt:"Which statement best distinguishes a product from a project?",options:["A product has ongoing ownership and is improved against outcomes","A product uses Agile delivery while a project uses waterfall planning","A product is digital while a project can also include policy work","A product has no fixed constraints on time, cost or scope"],answer:0,optionNotes:["","Method is not the distinction. A project can be run iteratively and a product can be managed badly in either method.","Both can be either. The deck explicitly says a product may be a digital application, a policy, a set of operational procedures, or a combination.","Products operate under constraints permanently \u2014 funding, policy, legacy systems and capacity. The difference is duration of ownership, not absence of limits."],rationale:"Method and medium do not define the distinction. Ongoing ownership, learning and outcome accountability do."},{id:"thinking-q2",moduleId:"thinking",prompt:"A list containing
