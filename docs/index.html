ace. Two eliminated approaches are the phase succeeding, and saying so out loud is what protects the next Alpha from the same pressure."}],assignment:{title:"Draw the evidence loop",instruction:"Map how evidence will flow through a real service after release.",prompts:["What operational and user evidence will be observed?","Who interprets it and makes backlog decisions?","What cadence will connect learning to the next increment?","Which phase is your service in, and what would have to be true to move to the next one?"],modelAnswer:`Named owner after go-live: the product manager for provider claiming, not the project. Named in the closure pack, with 0.1 FTE against it.

Four measures reviewed monthly: first-submission rejection rate; median submission-to-payment days; assisted-channel contacts; and the proportion of claims where validation fires and is corrected.

Cadence: half a day, monthly, standing. Not a governance forum \u2014 a look at four numbers and a decision about whether anything needs doing.

What would tell us it is decaying: rejection rate drifting up with no release in the period. That means something outside the service moved \u2014 a policy change, a new provider cohort, an upstream system change, or volume. All four are checkable in an afternoon if someone is watching; none are findable at all if nobody is.

What the handover must transfer beyond runbooks: accountability for those four measures, the remaining backlog, and the research contacts. Operational ownership without product ownership passes every review and still loses the service.`,criteria:["A named owner for performance, distinct from operational support","A small number of measures \u2014 not a dashboard of everything available","A stated cadence at which someone will actually look","Says what a decline would mean and where to look first"]}},{id:"roles",number:7,title:"Roles, teams and decision rights",subtitle:"Put accountability close to the evidence",minutes:50,slides:"75\u201385",outcome:"Distinguish complementary product roles, name the surrounding delivery and governance roles, explain the product trio, and design decision rights across strategic, coordination and delivery layers.",coreIdea:"Strong product work is cross-functional. Role clarity should make collaboration and decisions easier \u2014 not create hand-offs between silos.",sections:[{heading:"Product manager and Product Owner are different horizons",body:"Organisations define these titles differently, and arguing about the definitions is usually a proxy for an unresolved accountability question. In the deck's model the two share a common objective but focus on different horizons.",table:{caption:"Slide 77 \u2014 the split",head:["Product Manager","Product Owner"],rows:[["Vision","Backlog management"],["Strategy","Story refinement"],["Outcomes","Acceptance criteria"],["Roadmaps","Sprint support"],["Stakeholder alignment","Clarifying requirements"]]},bullets:["The deck's two guiding questions: the PM asks 'are we working on the right things?'; the PO asks 'do teams have everything they need to deliver successfully?'","Do not use titles as a substitute for explicit accountability.","Avoid making the Product Owner a requirements courier.","Avoid separating strategic discovery from the team that must deliver and operate the result."],sourceIds:["deck","scrum"]},{heading:"The trio combines product, design and technology",body:"A product trio brings viability, desirability and feasibility into the same discovery conversation \u2014 product manager (viable), designer (desirable), technology lead (feasible). It is a collaboration pattern, not a committee that replaces broader research, delivery and stakeholder expertise. The deck shows trios operating at all three organisational layers, not only in delivery teams.",sourceIds:["cdh","svpg","deck"]},{heading:"Three layers, three questions",body:"The deck separates the organisation into strategic, coordination and delivery layers, each with its own question, scope and accountability. Escalate constraints, not every routine decision.",table:{caption:"Slides 82\u201385 \u2014 how the layers work together",head:["Layer","Its question","Responsible for","Typical work"],rows:[["Strategic","What future are we trying to create?","Direction, user needs and service outcomes \u2014 the why","Service strategy, cross-product experience, future service design, long-term technology direction, emerging user needs, organisational outcomes"],["Solution / coordination","What should we deliver next?","Translating strategy into roadmaps, priorities and features \u2014 the what and when","Roadmaps, feature prioritisation, dependency management, exploring solution options, product-level outcomes, cross-team coordination"],["Tactical / delivery","How do we successfully deliver this work?","Design, build, test and release \u2014 the how and how much","Refinement, sprint planning, story development, quality assurance, user validation, sprint showcases"]]},bullets:["State who decides, who contributes evidence and who must be consulted.","Place reversible, local decisions closest to the team.","Reserve governance attention for material risk, investment and cross-service trade-offs."],sourceIds:["deck","svpg"]},{heading:"The roles around you",body:"Product managers in DES do not operate alone, and the deck names the surrounding structure explicitly. Knowing who owns what saves you from either escalating unnecessarily or making a decision that was never yours.",table:{caption:"Slides 79 and 92 \u2014 the wider delivery and governance structure",head:["Role","Layer","Owns"],rows:[["Senior Responsible Officer","Governance","The project outcomes, delivery roadmap, championing the change"],["Senior Supplier","Governance","Supplier-side commitment and capability"],["Project Board","Governance","Investment and material risk decisions"],["Lead Delivery Manager","Coordination","Delivery across teams; removing systemic impediments"],["Product Manager","Coordination / strategic","Outcomes, priorities, product direction"],["Product Owner","Delivery","Building, curating and prioritising a refined, validated backlog"],["UX Lead / Designers","Solution","User research, service and interaction design"],["Solution Architect / Architects","Solution","Technical approach and integrity"],["Scrum Master","Delivery","Team process, flow and impediment removal"],["BAs, Developers, Testers","Delivery","Making working increments"]]},sourceIds:["deck"]},{heading:"Worked reasoning: the Product Owner who became a courier",body:`The delivery team asks a question in refinement. The Product Owner says they will find out, goes to the business area, returns two days later with an answer. This repeats. Velocity drops, the Product Owner is working late, and the obvious diagnosis is that they need better time management or the team should ask fewer questions. Both are wrong, and both blame a person for a structural fault. 

Nobody has agreed who is allowed to decide what. In the absence of that agreement, every question becomes an escalation by default, and the Product Owner becomes a relay rather than a decision-maker. 

Sort the questions from a fortnight of refinement into three piles and the shape appears. Some are reversible and local \u2014 the wording of a validation message, the order of two fields. Those should be decided in the room, by the people in it, and changed later if they are wrong. Some are business rules with a genuine owner: eligibility thresholds, retention periods. Those need a named person and an agreed response time, not an ad-hoc hunt. A few are genuinely strategic \u2014 whether to support a channel at all \u2014 and belong at a forum. The fix is one conversation naming which pile is which, and who holds the second. The Product Owner's week changes immediately, and so does the team's, because the default stops being 'ask and wait'.`,bullets:["Reversible and local decisions belong with the people closest to the work; the cost of being wrong is a later change.","Business rules need a named owner and an agreed response time, not goodwill.","If decision rights are unstated they default to whoever is most persistent or most available \u2014 neither of which is a design."],example:"Of 31 questions raised in one fortnight, 24 were reversible and local. The team had been treating all 31 the same way because nobody had ever said they could decide anything."}],questions:[{id:"roles-q1",moduleId:"roles",prompt:"What is the product trio intended to achieve?",options:["Approve every user story before development can begin on it","Separate discovery work cleanly from delivery work","Replace stakeholder consultation with a smaller decision group","Combine product, design and technology perspectives in discovery"],answer:3,optionNotes:["Approval gates are the opposite of the intent. The trio is for shaping options, not signing off tickets.","It exists to connect them. Separating the two is the failure mode it addresses.","The trio is a working pattern, not a substitute for the people who hold policy, operational and user expertise.",""],rationale:"The trio improves cross-functional judgement about value, usability, feasibility and viability at the point options are shaped."},{id:"roles-q2",moduleId:"roles",prompt:"Where should a reversible, team-local design decision usually sit?",options:["With the delivery team closest to the evidence","At the highest governance board","With whichever stakeholder raises it most persistently","Outside the product team entirely"],answer:0,optionNotes:["","Board time is a scarce resource for material risk and investment. Spending it on reversible decisions delays everything else.","Persistence is not authority. This is how decision rights are captured by whoever has the most availability.","Removing the decision from the people with the relevant knowledge guarantees a slower and worse answer."],rationale:"Placing reversible decisions close to the relevant knowledge reduces delay while governance retains material risk and investment decisions."},{id:"roles-q3",moduleId:"roles",prompt:"Which question belongs to the solution / coordination layer?",options:["What future are we trying to create?","What should we deliver next?","How do we successfully deliver this work?","Who approves the business case?"],answer:1,optionNotes:["That is the strategic layer.","","That is the tactical / delivery layer.","Approval sits with governance and is not one of the three layer questions."],rationale:"The coordination layer translates strategy into roadmaps, priorities and features \u2014 it owns the what and the when, between the strategic why and the delivery how."},{id:"roles-q4",moduleId:"roles",prompt:"In the deck's structure, who owns the project outcomes and champions the change?",options:["The Senior Responsible Officer","The Lead Delivery Manager for the project","The Product Manager for the service","The Scrum Master on the team"],answer:0,optionNotes:["","The Lead Delivery Manager owns delivery across teams, not the project outcomes themselves.","The product manager owns product outcomes, priorities and direction \u2014 which is related but narrower, and sits below the SRO in the governance structure.","The Scrum Master owns team process and impediment removal within a delivery team."],rationale:"The SRO owns the project outcomes, the delivery roadmap and championing the change. Knowing this matters because product decisions that alter the outcome need the SRO, not just the board."}],scenarios:[{id:"roles-s1",moduleId:"roles",context:"Designers research users, analysts write requirements and developers receive work months later. Each group says the others missed critical context.",prompt:"What structural change is most useful?",options:["Add a more thorough hand-over document between the functions","Create shared cross-functional discovery with clear decision rights","Remove the user research step in order to shorten the chain","Let each function maintain and publish its own roadmap"],answer:1,optionNotes:["Better documentation reduces loss at a hand-off. It does not remove the hand-off, which is where the context is lost.","","The chain would be shorter and the output worse. Research is not the bottleneck; sequencing is.","Three roadmaps is three strategies. This formalises the disagreement instead of resolving it."],rationale:"Shared work reduces information loss and lets design, product and technology shape viable options together."},{id:"roles-s2",moduleId:"roles",context:"Your Product Owner is spending most of each sprint relaying questions between the delivery team and three business areas, and has no time for refinement. The backlog is filling with unrefined items and the team is starting sprints with unclear acceptance criteria.",prompt:"What is the underlying problem?",options:["The Product Owner needs better time management and prioritisation","The delivery team should be asking considerably fewer questions","The Product Owner has become a requirements courier, with no agreed decision rights","The role should be merged into the product manager position entirely"],answer:2,optionNotes:["Treating a structural problem as a personal one guarantees it recurs with the next person in the seat.","The questions are legitimate. They arise because nobody has been given authority to answer them.","","Merging the roles increases the load on one person without resolving where the answers are supposed to come from."],rationale:"The deck warns specifically against the Product Owner becoming a requirements courier. The fix is agreeing who can decide what \u2014 reversible and local decisions to the team, business rules with named owners and agreed response times."}],assignment:{title:"Clarify decision rights",instruction:"Choose one recurring product decision and make the accountability explicit.",prompts:["Who owns the decision?","Whose evidence or expertise must shape it?","What threshold requires escalation, and what should remain with the team?","Which layer does this decision actually belong to \u2014 strategic, coordination or delivery \u2014 and where is it being made now?"],modelAnswer:`Decisions the team should make without asking: wording of validation messages, field order, which of two equivalent technical approaches, how to split a story. All reversible, all local, and the cost of being wrong is a later change.

Decisions with a named business owner and an agreed response time: what counts as acceptable evidence for a claim; retention periods; whether a rejection reason can be waived. Owner is the claims policy lead, agreed response within three working days.

Decisions that belong at a forum: whether to support bulk upload at all; whether to change the evidence requirement in policy; investment beyond the current PI.

The trio on this work: me on the outcome and the trade-offs, the designer on how providers understand a rejection, the tech lead on what is knowable at submission time. The feasibility question was the one that reframed the whole approach, which is the argument for having them in discovery rather than consulted after it.

What I would stop doing: writing acceptance criteria. It is Product Owner work, and while I am doing it nobody is on the outcome.`,criteria:["Sorts decisions into at least two tiers by reversibility and cost of being wrong","Business-rule decisions have a named owner and an agreed response time","The trio is described by the question each member answers, not by job title","Identifies something the product manager should stop absorbing"]}},{id:"government",number:8,title:"Product practice in government",subtitle:"Work with policy, assurance and delivery constraints without losing the outcome",minutes:65,slides:"86\u201392",outcome:"Apply product principles inside DES ways of working and delivery phases, use the current Digital Service Standard accurately, distinguish it from internal governance, and protect inclusion, accessibility, security and service continuity.",coreIdea:"Government product practice combines user-centred evidence with public value, policy intent, stewardship, assurance and whole-of-service responsibility.",sections:[{heading:"Constraints are design inputs",body:"Policy intent, legislation, privacy, security, accessibility, records, procurement, funding and legacy systems shape the feasible solution space. Surface them early in discovery so they inform options rather than arriving as late-stage blockers.",bullets:["A policy requirement is not automatically a user need.","Compliance says what must be true; design still determines how people experience it.","Whole-of-service outcomes include assisted and non-digital channels."],sourceIds:["deck","dss"]},{heading:"Ways of Working: behaviours and framework",body:"DES ways of working has two core elements. The behaviours describe how people are expected to operate; the Digital Delivery Framework is the end-to-end, repeatable delivery pipeline that ensures consistent practice.",bullets:["We put user needs at the centre.","We are accountable and take ownership for solving issues.","We empower our people.","We connect and work across boundaries.","We do the basics brilliantly.","We are innovative and contemporary."],sourceIds:["deck"]},{heading:"The seven principles in practice",body:"These are the division's stated operating principles. Each one has an implication that changes what a product manager actually does \u2014 which is why they are worth knowing by number, not just by sentiment.",table:{caption:"Slides 88\u201389 \u2014 principles and their implications",head:["#","Principle","What it means in practice"],rows:[["1","Start with the problem, not the solution","Understand user needs, policy intent and root causes before committing to solutions. Discovery comes before build."],["2","Validate before you scale","Reduce risk through prototypes, testing and incremental releases rather than a single large commitment."],["3","Deliver value early and often","Prefer incremental delivery of valuable outcomes over large, infrequent releases."],["4","Decisions belong closest to the problem","People with the greatest understanding of users and delivery realities make day-to-day decisions."],["5","Focus on outcomes, not outputs","Measure success by value created, not volume of work completed. Outcomes over features, benefits over deliverables, value over activity."],["6","Design for the whole service","Optimise the end-to-end experience rather than individual systems, projects or organisational silos. Reuse before rebuild."],["7","Learn continuously","Discovery, validation and improvement continue throughout the life of a service."]]},sourceIds:["deck"]},{heading:"The four DES delivery phases",body:"DES has an agreed end-to-end delivery pipeline for all projects, divided into four phases with stage gates between them. This is the pipeline your work actually sits inside, and it is distinct from both the DTA service phases and the Digital Service Standard.",table:{caption:"Slides 90\u201391 \u2014 the DES pipeline",head:["Phase","Focus","Product management contribution"],rows:[["Pre-Approval","Establishing the case for investment","Problem definition, user evidence, outcome hypotheses, options and their risks"],["Pre-Delivery","Planning with the right amount of detail; establishing the runway","Refined backlog, validated approach, measures and baselines defined before build"],["Delivery","Building and releasing increments","Ordering the backlog, protecting the outcome, running discovery an increment ahead"],["Closure","Transitioning and completing the project","Handing over enduring ownership, measures and improvement cadence \u2014 not just documentation"]]},bullets:["The stated purpose: projects are well planned with the right amount of detail, teams have a clear runway, there is a shared view of success, and stage gates build in quality and predictability.","The product risk sits at Closure \u2014 a project closes, but the product does not.","Do not confuse these four phases with the DTA's Discovery/Alpha/Beta/Live, or with the Digital Service Standard. They are three different things that coexist."],sourceIds:["deck"]},{heading:"Use the current Digital Service Standard accurately",body:"Version 2.0 has 10 criteria, reduced from the former 13, and forms part of the Digital Experience Policy. It expects agile, user-centred work and consideration of the criteria across the service lifecycle. It is now fully in effect: it applied to new and redeveloped services from 1 July 2024, and to public-facing services that already existed before that date from 1 July 2025.",bullets:["The standard covers accessibility, inclusion, security, trust, adaptability and measurement.","Internal DES delivery phases can coexist with this external standard but should not be mistaken for it.","Governance evidence should demonstrate how the criteria are being met, not merely that a template was completed.","Staff-facing internal services sit outside the Phase 2 scope; check current DTA guidance before assuming applicability."],sourceIds:["dss"]},{heading:"Make governance a learning and risk conversation",body:"Strong gates examine evidence, unresolved risk, outcome confidence and readiness for the next investment \u2014 not only schedule and document completion. Product evidence can strengthen business cases and assurance decisions rather than competing with them.",bullets:["Show what was learned and what changed as a result.","Make residual assumptions and guardrails visible.","Preserve a clear owner for benefits and service performance after project closure.","A gate that only checks artefact completeness will approve a well-documented failure."],sourceIds:["deck","dss"]},{heading:"Worked reasoning: the policy requirement that made things worse for users",body:`Policy requires a declaration screen with specific wording before submission. Research shows providers do not understand it, skim it, and a proportion abandon at that point. The weak responses sit at two extremes. Refusing to implement it treats a legitimate policy instrument as an obstacle and is not a decision a product manager gets to make. Implementing it without comment discards evidence that the department paid to gather and would want. Neither is the job. 

Separate the intent from the implementation, because a policy requirement almost always specifies both and only one of them is actually binding. The intent here is that providers make an informed declaration and that the department can demonstrate they did. The implementation is a particular screen with particular words. The evidence does not challenge the intent \u2014 it shows the implementation is failing to achieve it, since a declaration nobody understands is not informed consent, and the department's assurance position is weaker than it looks. 

That reframes the conversation with the policy owner from 'we would like an exemption' to 'the current wording is not producing the thing you need, and here is what people did.' The move is to meet the intent with an evidence-informed design, keep the mandated wording where it must appear, and take the comprehension data back to the owner as a finding rather than a complaint.`,bullets:["Policy usually specifies both an intent and an implementation. Establish which is binding before proposing anything.","Evidence that an implementation fails its own intent is useful to the policy owner, not hostile to them.","Take friction data to the owner as a finding. An exemption request invites a no; a finding invites a conversation."],example:"The mandated sentence stayed, in a plain-language frame explaining what it meant and why. Comprehension went from 31% to 78% in testing, and the policy owner used the result to revise the standard wording department-wide."}],questions:[{id:"government-q1",moduleId:"government",prompt:"Which statement about the Digital Service Standard Version 2.0 is correct?",options:["It replaces internal departmental governance arrangements entirely","It contains 13 criteria and applies at one gate","It applies only during the Alpha phase of delivery","It contains 10 criteria and applies across the service lifecycle"],answer:3,optionNotes:["It sits alongside internal governance. Both apply, and confusing them is a common source of duplicated or missed evidence.","Thirteen was the former standard. Version 2.0 reduced it to 10.","It is explicitly lifecycle-wide. Treating it as a single-phase checkpoint is exactly what that framing exists to prevent.",""],rationale:"Version 2.0 reduced the former 13 criteria to 10 and explicitly encourages lifecycle-wide application."},{id:"government-q2",moduleId:"government",prompt:"How should policy constraints enter product work?",options:["They should be set aside during design and applied afterwards","Only at final assurance","As early discovery inputs that shape options and evidence","As user needs, since they define what the service must do"],answer:2,optionNotes:["Designing without constraints produces options that cannot be built, and wastes the design effort.","Late arrival is what turns a constraint into a blocker and forces rework.","","A policy requirement is not automatically a user need. Conflating them means never noticing when policy is creating the difficulty."],rationale:"Early involvement helps the team design within the real service and legal context and prevents late rework."},{id:"government-q3",moduleId:"government",prompt:"Which are the four DES delivery phases, in order?",options:["Initiation, Planning, Execution, Benefits Realisation","Problem, Options, Build, Measure","Discovery, Alpha, Beta, Live","Pre-Approval, Pre-Delivery, Delivery, Closure"],answer:3,optionNotes:["Generic project phasing, not the DES pipeline.","This resembles the product lifecycle loop rather than the delivery pipeline.","That is the DTA service design and delivery process \u2014 a different framework that coexists with the DES pipeline.",""],rationale:"DES divides its end-to-end pipeline into Pre-Approval, Pre-Delivery, Delivery and Closure, with stage gates between them. Keep it distinct from the DTA phases and from the Digital Service Standard."},{id:"government-q4",moduleId:"government",prompt:"Principle 6 is 'design for the whole service'. Which decision best reflects it?",options:["Considering phone, paper and assisted channels, and reusing existing capability","Delivering the digital service first and addressing other channels in a later project","Standardising the interface across all departmental systems","Optimising the online form's completion rate as the primary measure"],answer:0,optionNotes:["","Deferring other channels to a later project is how end-to-end problems become permanent, since the later project is rarely funded.","Interface consistency is a usability concern. Whole-of-service is about the end-to-end journey across channels and systems.","A single-channel measure can improve while the overall service worsens \u2014 for example by pushing failures to the phone queue."],rationale:"The principle optimises the end-to-end service experience rather than individual systems, projects or silos \u2014 and its stated implications include whole-of-service thinking and reuse before rebuild."},{id:"government-q5",moduleId:"government",prompt:"Which product-management risk is concentrated in the Closure phase?",options:["The backlog becomes too detailed to manage","The project closes without enduring ownership of performance","Stakeholders lose interest in the published roadmap after handover","The team over-invests in further discovery"],answer:1,optionNotes:["Backlog detail is a Pre-Delivery and Delivery concern.","","Attention does fade, but the structural risk is that nobody is accountable, not that nobody is interested.","Over-investment in discovery is a Pre-Approval or Pre-Delivery risk, if it is one at all."],rationale:"A project closes; the product does not. Closure must hand over ownership, measures and an improvement cadence, or the service degrades with nobody accountable for noticing."}],scenarios:[{id:"government-s1",moduleId:"government",context:"The project has completed its templates, but research found a major accessibility barrier and the benefits measures have no baseline.",prompt:"What should the team present at the gate?",options:["Present the evidence, remediation plan and impact on readiness","Reclassify the accessibility issue as a future enhancement instead","Proceed on the basis that the documentation is complete","Defer the accessibility issue to Beta and proceed now"],answer:0,optionNotes:["","Accessibility is a legal and standard obligation and part of service quality. It cannot be reclassified as optional polish.","This is precisely the failure mode the stage exists to describe: a gate that checks artefacts approves a well-documented failure.","Deferral without a plan is the same decision as ignoring it, taken with better manners."],rationale:"Assurance should use evidence to make an informed risk and investment decision; accessibility is part of service quality, not optional polish. A missing baseline also means benefits cannot later be demonstrated."},{id:"government-s2",moduleId:"government",context:"A policy area asks you to add a mandatory declaration screen. Research shows most users cannot tell what they are declaring, and the assisted channel already handles the same declaration verbally with a plain-language script.",prompt:"What is the strongest product response?",options:["Decline, since research shows that users do not understand it","Meet the policy intent, design with the evidence, and measure comprehension","Escalate to the Project Board for a decision on it","Implement the screen exactly as specified, since the requirement is mandatory"],answer:1,optionNotes:["The obligation is real and cannot be declined. The question is how it is met, not whether.","","Board time is for material risk and investment. This is a design decision that belongs with the team and the policy owner.","Compliance says what must be true; it rarely dictates the interaction. Implementing the specification literally satisfies the letter and fails the intent."],rationale:"A policy requirement is not automatically a user need, but nor is it optional. Compliance defines what must be true; design determines how people experience it \u2014 and the assisted channel has already solved the comprehension problem."}],assignment:{title:"Prepare an evidence-based gate brief",instruction:"Frame a decision for governance in one page.",prompts:["What outcome and public value justify the work?","What evidence supports the proposed direction and what remains uncertain?","What risks, standards, guardrails and ownership conditions must be satisfied before proceeding?","Which DES phase gate is this, and what specifically must be true to pass it?"],modelAnswer:`Constraint: claims evidence requirements are set in the program guidelines, which are not changing this financial year.

What is actually binding versus inherited: binding is that specified evidence must be held before payment. Inherited is that the provider must upload it as a document at submission \u2014 the guidelines do not specify the mechanism, and where the department already holds the evidence it could be checked rather than re-supplied.

Digital Service Standard criteria most engaged: solve a whole problem for users (the claim spans portal, phone and assessment), make it accessible and inclusive (providers vary enormously in capability and connection), and use and contribute to open standards and common platforms (the participant record already exists).

Inclusion risk: small providers without dedicated admin staff are the ones most affected by rejections and least able to absorb rework. Measure their rejection rate separately rather than in the aggregate, because the aggregate is dominated by large providers.

What I take to the policy owner: the proportion of rejections caused by evidence the department already holds. That is a finding they cannot get from anywhere else, and it is not an exemption request.`,criteria:["Separates what the instrument binds from the implementation inherited with it","Names specific Standard criteria rather than the Standard in general","Identifies a group at risk of exclusion and how it will be measured separately","Any policy conversation is framed as evidence, not as a request for relief"]}},{id:"integration",number:9,title:"Integration and capstone",subtitle:"Run the whole chain from need to measured value",minutes:60,slides:"93\u201398",outcome:"Integrate the course into a defensible product approach and explain the reasoning to users, delivery partners, stakeholders and governance.",coreIdea:"Product management is a connected chain of decisions: need \u2192 problem \u2192 outcome \u2192 options \u2192 evidence \u2192 ordered delivery \u2192 measurement \u2192 learning.",sections:[{heading:"Maintain the chain of evidence",body:"Every major item should trace backward to an outcome and forward to a way of learning. If a feature cannot be connected to a user or service problem, an intended result and a measure, its priority is unclear. The deck's closing questions are the shortest version of this test: what problem are we solving, what outcome are we trying to create, what evidence do we have, and what have we learned?",sourceIds:["deck","svpg"]},{heading:"What good looks like",body:"The deck names six qualities. They are worth treating as a checklist for your own work rather than as a poster: outcome focused, user centred, evidence based, collaborative, adaptive, value driven.",bullets:["Outcome focused: success is a measured change, not a delivered artefact.","User centred: decisions are grounded in what users actually do.","Evidence based: claims are traceable to something observed.","Collaborative: product, design and technology shape options together.","Adaptive: the plan changes when the evidence does.","Value driven: work that does not move a result needs a different justification."],sourceIds:["deck"]},{heading:"Tell the product story at three levels",body:"Executives need the outcome, evidence, investment and risk. Delivery teams need the problem context, goal, guardrails and near-term decisions. Users and operational partners need clear changes, support and feedback paths.",bullets:["Keep one truth; adjust the depth, not the facts.","Explain trade-offs and confidence honestly.","Separate evidence, assumption and decision in the way you speak."],sourceIds:["deck"]},{heading:"Reflection becomes practice",body:"Mastery comes from repeatedly making and explaining product decisions. The capstone uses the provider application-status case that runs through the source deck so you can practise the complete method, self-assess against a rubric, and export a reusable product brief.",bullets:["The deck's reflection questions: what problem are you solving and is it the right one? How are you measuring success? What assumptions need validation? What feedback loops exist? How will you know you have delivered value?","Retrieval and spacing are why this system makes you recall before it lets you reread."],sourceIds:["deck","retrieval","spacing","techniques"]},{heading:"Worked reasoning: reporting a result you did not want",body:`The headline measure improved 14%. Broken down, one cohort \u2014 providers using assistive technology \u2014 got materially worse. The board meets on Thursday and asked for the headline. The weak move is to report 14% and mention the cohort in an appendix, which is technically complete and functionally a lie, because the number that gets remembered is the one in the first sentence. The move that feels brave and is actually careless is to lead with the failure, which invites cancellation of work that is mostly succeeding. Neither serves the decision the board is there to make. 

Lead with what changes what they do. The board's job is to decide whether to scale this to all providers next quarter. The 14% says scaling is worth considering; the cohort result says scaling now would extend a harm to a larger group, and that is decision-relevant in a way the headline is not. 

So the sentence is: the intervention works, it is not yet safe to scale, here is what we need to establish first, and here is when we will know. That is not softening the finding \u2014 it is putting it where it acts. It also protects the work, because a board that learns about the cohort later, from somebody else, will not remember that it was in an appendix.`,bullets:["Lead with the thing that changes the decision in front of the audience, not the thing that is most flattering or most dramatic.","An average that hides a harmed group is not a summary; it is a different claim.","Say what you need to establish and by when. A finding without a next step reads as either panic or excuse."],example:"The board approved a four-week extension rather than the scale-up. The cause was a single component that had never been tested with a screen reader, and it was fixed inside that window \u2014 which a cancelled programme would not have been."}],questions:[{id:"integration-q1",moduleId:"integration",prompt:"Which chain best represents product reasoning?",options:["Workshop \u2192 roadmap \u2192 backlog \u2192 sprint \u2192 release \u2192 report","Feature \u2192 deadline \u2192 launch \u2192 status report \u2192 next feature","Need \u2192 problem \u2192 outcome \u2192 options \u2192 evidence \u2192 delivery \u2192 measurement","Budget \u2192 requirements \u2192 build \u2192 test \u2192 deploy \u2192 closure \u2192 benefits report"],answer:2,optionNotes:["Each of these is a real artefact, but the chain has no problem at the front and no measurement at the end.","This is delivery without a rationale. It can be executed perfectly and still change nothing.","","This is a funding and assurance sequence. It manages the project, not the product."],rationale:"The full chain preserves the relationship between evidence, decisions, delivery and achieved value."},{id:"integration-q2",moduleId:"integration",prompt:"What should change when presenting the product story to different audiences?",options:["The stated outcome itself","The underlying facts of the situation","The evidence that is cited","The level of detail and framing"],answer:3,optionNotes:["If the outcome changes by audience, there is no shared understanding of what the work is for.","Changing the facts by audience is how organisations end up with three incompatible versions of the same project.","The evidence should be consistent; how much of it you present can vary.",""],rationale:"Different audiences need different depth, but the decision, evidence and outcome should remain consistent."},{id:"integration-q3",moduleId:"integration",prompt:"A stakeholder asks why a highly requested feature is not on the roadmap. What is the strongest form of answer?",options:["It was not included in the approved scope","It did not score highly enough in the prioritisation exercise this quarter","The outcome it serves is already better addressed by work in flight","The team does not have the capacity this year"],answer:2,optionNotes:["Scope is a procedural answer to a value question. It also implies nothing can ever change, which is untrue.","A score is the output of a judgement, not the justification for it. It invites an argument about the scoring instead of the substance.","","Capacity is true but incomplete. It implies the item would be next if resources appeared, which may not be the case."],rationale:"Traceability is what makes a prioritisation decision defensible. Naming the outcome, the evidence and the condition under which you would change your mind turns a refusal into a shared model."},{id:"integration-q4",moduleId:"integration",prompt:"Which of the deck's six 'what good looks like' qualities is most directly at risk when a team keeps a dated plan after the evidence has changed?",options:["Value driven","User centred","Collaborative","Adaptive"],answer:3,optionNotes:["Value drive is about justifying work by results. Related, but the direct failure here is the refusal to change.","User-centredness is about grounding decisions in user evidence. It may also suffer, but it is not what a frozen plan primarily violates.","Collaboration concerns how options are shaped, not how plans respond to evidence.",""],rationale:"Adaptive means the plan changes when the evidence does. Holding a dated plan to protect stakeholder confidence is the specific failure this quality names."}],scenarios:[{id:"integration-s1",moduleId:"integration",context:"A pilot improves self-service overall, but increases unsuccessful attempts among users relying on assistive technology.",prompt:"Which response demonstrates the strongest product judgement?",options:["Treat it as a guardrail failure, investigate and adapt before scaling","Report the aggregate figure and address the detail in a later release cycle","Declare success because the average has improved","Cancel the product permanently and start again"],answer:0,optionNotes:["","Reporting the aggregate while knowing the disaggregated result is misleading by omission, and it scales the harm in the meantime.","An average can improve while a specific group is actively harmed. This is exactly what guardrails exist to surface.","The evidence supports adaptation, not abandonment. Most of the intervention is working."],rationale:"Outcomes must not hide distributional harm. The evidence should change the scaling decision and the next experiment."},{id:"integration-s2",moduleId:"integration",context:"You have ten minutes with the SRO before a board meeting. Delivery is on schedule, but discovery has shown the primary outcome measure will probably not move because the root cause sits in a policy process outside your control.",prompt:"What do you lead with?",options:["Delivery status, since that is what the board reports on","The outcome risk, the evidence behind it, and the decision you need","A request to change the outcome measure to one the project can influence","Nothing yet \u2014 wait until measurement confirms it after release"],answer:1,optionNotes:["Leading with green delivery status when you know the outcome is at risk trains the board to trust a signal that is not measuring the thing that matters.","","Changing the measure to one you can move is how a project reports success while the problem persists. It also destroys the baseline.","Waiting until after release means raising it when the decision can no longer be influenced and the cost is sunk."],rationale:"Executives need outcome, evidence, investment and risk. The chain of evidence is only useful if you are willing to report the link that is breaking \u2014 and the SRO owns the project outcomes, so this is precisely their decision."}],assignment:{title:"Complete the capstone brief",instruction:"Use the dedicated Capstone workspace to produce an end-to-end product approach for the provider application-status case.",prompts:["Can every proposed action trace to evidence and an outcome?","Are the riskiest assumptions explicit and testable?","Would a delivery team and a governance board understand what happens next and why?","Which of the deck's six qualities is weakest in your brief, and what would fix it?"],modelAnswer:`The chain: providers cannot tell whether a claim will be accepted (problem, evidenced by 38% rejection and six observations) \u2192 so claims are rejected and resubmitted, costing provider effort and assessment capacity (why it matters) \u2192 reduce first-submission rejection to 20% by June, with an assisted-channel guardrail (outcome) \u2192 inline validation of the top three reasons, tested first against whether rejections are detectable at submission (option and evidence) \u2192 shipped ahead of the dashboard on cost of delay (ordered delivery) \u2192 rejection rate and validation-correction rate reviewed monthly by a named owner (measurement and learning).

To an executive: rejection rate is down 14 points, the mechanism is confirmed, and the remaining rejections are concentrated in evidence the department already holds \u2014 which is a policy decision, not a build. I need a decision on whether to pursue that.

To the delivery team: the top three reasons are done and working; next is establishing which of the remaining eleven are detectable, before we commit to any of them.

To providers: fewer claims will come back, here is what changed, and here is where to tell us when it gets it wrong.

Same facts, three depths.`,criteria:["Every link in the chain connects backwards to a problem and forwards to a measure","The executive version leads with the decision needed, not with delivery status","The three versions differ in depth and framing but not in facts","Nothing in the chain is asserted without saying what it rests on"]}}],Qo=U.flatMap(e=>[...e.questions,...e.scenarios.map(t=>({id:t.id,moduleId:t.moduleId,prompt:t.prompt,options:t.options,answer:t.answer,rationale:t.rationale,optionNotes:t.optionNotes,context:t.context}))]).concat(io),qv=220,Ov=1,zv=2;function Ma(e){return e?e.trim().split(/\s+/).filter(Boolean).length:0}function Wv(e){let t=Ma(e.outcome)+Ma(e.coreIdea);for(let o of e.sections){t+=Ma(o.heading)+Ma(o.body)+Ma(o.example);for(let r of o.bullets??[])t+=Ma(r);if(o.table){for(let r of o.table.head)t+=Ma(r);for(let r of o.table.rows)for(let n of r)t+=Ma(n)}}let a=t/qv+e.questions.length*Ov+e.scenarios.length*zv;return Math.max(5,Math.round(a/5)*5)}for(let e of U)e.minutes=Wv(e);var lo=U.reduce((e,t)=>e+t.minutes,0);function Hp(e){let t=U.find(a=>a.id===e);return t?[...t.questions,...io.filter(a=>a.moduleId===e)]:[]}function uo(e){return U.find(t=>t.id===e)}function jp(e){return Na.find(t=>t.id===e)}var Ra=[{n:1,stage:"thinking",title:"Product Management Basics",text:"IT PMO | Digital experience and solutions division"},{n:2,stage:"thinking",title:"Session Outcomes",text:"Discover user needs and opportunities Define desired outcomes and measures of success Explore and validate solution options Deliver value through Agile teams Measure outcomes and continuously improve products By the end of this session, you will understand how Product Managers"},{n:3,stage:"thinking",title:"Outline",text:"9. Close"},{n:4,stage:"thinking",title:"Product Thinking",text:"Understanding how Product Management creates value"},{n:5,stage:"thinking",title:"What is a (digital) product?",text:"A digital product is a technology-enabled capability that helps users achieve a goal and delivers measurable value to the organisation. Solves a problem Delivers value Supports outcomes Evolves over time Has ongoing ownership"},{n:6,stage:"thinking",title:"Products enable Service Delivery",text:"A service is a series of interactions that helps someone (i.e. a job seeker, employer or provider) do something like apply for a job, add a vacancy, or book an appointment. A product is a tool created to deliver the services. It could be a digital product (i.e. a web application), a policy, a set of operational procedures, or (often) a combination of these"},{n:7,stage:"thinking",title:"What is Product Management?",text:""},{n:8,stage:"thinking",title:"What is Product Management?",text:"\u201Cthe intersection of business, technology and user experience to strategically drive the vision, development, launch and continued support an improvement of a product\u201D You are here"},{n:9,stage:"thinking",title:"What is Product Management?",text:""},{n:10,stage:"thinking",title:"OK cool\u2026so what should Product Managers actually do?",text:"Vision and Strategy Define why a product exists. This involves understanding user needs, conducting market research, generating insights, defining problems, framing opportunities, aligning stakeholders and producing artifacts that clearly articulate the product strategy Execute and Deliver Translate validated assumptions into actionable solution artifacts (requirements). Product Managers continuously prioritise backlogs and work closely with digital delivery teams to turn requirements into delivered value Product Success Ensure the product delivers continuous value to users/customers whilst achieving organisation objectives. This involves launching the product, analysing performance metrics and iterating based on user feedback Explore Options Translate problems and opportunities into potential solution options. This includes designing experiments to validate your riskiest assumptions, defining the MVP and refining measures of success Deliver value to users and customers"},{n:11,stage:"thinking",title:"The reality can be somewhat different\u2026",text:"\u201CDiscovery? Validation? We don\u2019t have time for all that \u2013 we just have to deliver something!\u201D \u201CI don\u2019t have any experience doing this\u201D \u201CWait this looks like a full-time gig \u2013 I already have a day job!\u201D \u201CJust do what IT wants\u201D \u201CJust give me the requirements so I can build something\u201D"},{n:12,stage:"thinking",title:"Product Management is not all or nothing",text:"Doing some discovery is better than none Using outcomes imperfectly is better than only focusing on outputs Testing one assumption is better than testing none Getting some user feedback after a release is better than none"},{n:13,stage:"thinking",title:"A Shift in Thinking",text:"Projects Outputs Requirements Delivery Products Outcomes Problems Learning"},{n:14,stage:"thinking",title:"Product Vision",text:"Vision describes the future we want to create \u201C A simpler, faster and more transparent experience for employers and providers\u201D Vision Characteristics:"},{n:15,stage:"thinking",title:"Product Strategy",text:"Strategy explains how we will move towards the vision \u201C A simpler, faster and more transparent experience for employers and providers\u201D Vision = Destination Reduce administrative effort Increase self-service Improve transparency Strategy = Direction"},{n:16,stage:"thinking",title:"Sources of Strategy",text:""},{n:17,stage:"thinking",title:"Strategy is about choices",text:"Strategy is NOT: Doing everything Building every feature Satisfying every stakeholder Strategy IS: Choosing priorities Focusing investment Making trade-offs Deciding what not to do Strategy is primarily about prioritisation and deciding what not to do"},{n:18,stage:"thinking",title:"That all sounds great but\u2026.",text:"Government funds projects, not products Our department has a project management framework, not a product management framework User Impact is often a secondary consideration We are largely measured by delivery outputs not value"},{n:19,stage:"thinking",title:"Product thinking can exist inside project delivery",text:"Constraint | What we can still do Fixed funding | Validate assumptions early Fixed scope | Prioritise within scope Project governance | Measure outcomes Delivery pressure | Seek feedback sooner"},{n:20,stage:"thinking",title:"Key Messages",text:"1. Products create value, projects deliver change 2. Product Management balances user needs, business outcomes and technology constraints. 3. Product Managers are accountable for value, not just delivery. 4. Product Management is about progress, not perfection. 5. Vision describes the destination. 6. Strategy provides the direction. 7. Strategy requires making choices. 8. Product Thinking can exist inside traditional project environments. 9. The goal is to move from activity and delivery towards outcomes and value."},{n:21,stage:"discovery",title:"Product Discovery",text:"Discovery helps us identify the right problems to solve before exploring solutions."},{n:22,stage:"discovery",title:"Product Discovery Overview",text:""},{n:23,stage:"discovery",title:"Understanding Users",text:"Sources of Insight: Interviews Observation Workshops Analytics Support Data Surveys What are we trying to understand? current experience: what users are experiencing now and the products they use to complete their goal stated needs: the things users explicitly tell you that they need, for example they may need your service to be mobile responsive unstated needs: the things users expect your service to have, for example they may need information that\u2019s easy to understand created needs: what users are forced to do because of policy or the way government works, for example they may have to use different online accounts for different stages of the same service actual goals: what the users are really trying to do when they use the service and its products, for example planning to travel, not just applying for a passport."},{n:24,stage:"discovery",title:"Discovery Artefacts",text:"Artefacts help us make user insights visible Personas Understand Users Journey Maps Understand Experiences Service Blueprints Understand Service Delivery"},{n:25,stage:"discovery",title:"Personas",text:"Purpose Personas help teams develop a shared understanding of their users. Key Inputs Interviews Observation Surveys Analytics Existing service knowledge Key Characteristics A persona typically contains: User Goals Needs Behaviours Motivations Challenges Context"},{n:26,stage:"discovery",title:"Journey Maps",text:"Purpose Journey Maps help teams identify where improvements will have the greatest impact on users. Key Inputs Research findings Interviews Observations Process knowledge Key Characteristics A Journey Map typically contains: User goals Activities Touchpoints Emotions / experience indicators Pain Points Opportunities"},{n:27,stage:"discovery",title:"Service Blueprints",text:"Purpose Understand how services operate behind the scenes. Key Inputs User research Journey Maps Process documentation Operational knowledge Key Characteristics A Service Blueprint typically contains: User actions Front Stage activities Back Stage activities Supporting systems Supporting processes"},{n:28,stage:"discovery",title:"From Insights to Problems",text:"Discovery generates insights, not solutions Discovery produces: Interview notes Survey responses Analytics Feedback Observations Discovery does not produce: Requirements Features Solutions"},{n:29,stage:"discovery",title:"Root Cause Analysis",text:"Symptom | Root Cause High call volume | Information difficult to find Low adoption | Process too complex Long processing times | Manual activities Problem Providers frequently call the support centre to check the status of participant applications Why? Because they cannot easily determine the status of an application Why? Because status information is not available through self-service channels Why? Because application progress is stored across multiple systems Why? Because the service evolved through several projects over time and information was never consolidated Why? Because previous investments focused on delivering policy commitments and functionality rather than end-to-end user visibility. Root Cause The problem is not high call volumes. The problem is users lack visibility of application progress due to fragmented service design and system architecture. The 5 Whys Analysis Fishbone (cause-and-effect) diagram"},{n:30,stage:"discovery",title:"Problem Statements",text:'\u201COur [Who] are currently experiencing [What] when trying to [Goal]. This issue occurs in [Where] and has been happening since [When]. This is a critical problem because [Why/Impact].\u201D Who: Who is directly affected by the problem (e.g. customers, employees, users)? What: What is the unmet need or the specific symptom of the problem? Goal: what is the user trying to achieve? Where: Where does this problem occur (e.g. what service/product)? When: When does an issue happen or how long has it been occurring? Why: Why is this problem important and what is the impact (e.g. poor user experience, operational inefficiency)? "Our customer service team is currently experiencing a 48-hour average ticket resolution time when trying to resolve account issues. This issue occurs in our Sydney and Melbourne call centres and has been happening since we upgraded the CRM platform last month. This is a critical problem because it has caused a 15% drop in customer satisfaction scores and a rise in subscription cancellations."'},{n:31,stage:"discovery",title:"Reframing Problems as Opportunities",text:"\u201CHow Might We\u201D is a popular design thinking technique used to reframe problems into actionable opportunities How might we format How might we [Intended Action] for [Who] so that [Desired Outcome]? Opportunity How might we improve visibility for providers so that they can easily view the progress of an application? Problem: Users struggle to track application progress"},{n:32,stage:"discovery",title:"Hypothesis Statements",text:"We believe that [doing this] for [these people] will achieve [this outcome]. We\u2019ll know this is true when we see [this feedback / behaviour change] We believe providing providers with application status visibility will reduce support calls by 20%. We'll know this is true when call volumes reduce following implementation."},{n:33,stage:"discovery",title:"Lean Canvas",text:"Problem What problem does the organisation have that you are trying to solve? Users What types of users are impacted? Hypotheses Combine the assumptions from 2, 3, 4 and 5 into hypothesis statement(s) Solution Ideas What options will solve our problem and meet the needs of our users at the same time? Business Outcomes How will you know if you have solved the problem? What will you measure? What\u2019s the most important thing we need to learn first? For each hypothesis, identify its riskiest assumptions (i.e. the whole thing will fail if it\u2019s wrong User Outcomes & Benefits What behaviour changes can we observe that tells us they\u2019ve achieved their goal? 1 How will we validate our assumptions? Design experiments to learn quickly whether the riskiest assumptions are true or false 2 3 4 5 6 7 8"},{n:34,stage:"discovery",title:"Discovery Outputs",text:"Discovery generates: Insights Personas Journey Maps Service Blueprints Problem Statements Opportunities Hypotheses These become inputs into solution exploration"},{n:35,stage:"discovery",title:"From Vision to Value",text:"Discovery creates evidence and understanding. We now know what problem we are trying to solve and what change we want to create."},{n:36,stage:"outcomes",title:"Outcomes & Success",text:"Success must be defined before delivery begins"},{n:37,stage:"outcomes",title:"Outcomes over Outputs",text:"Outcomes Outputs The things we build or deliver that represent tangible artefacts of work. e.g. a new feature in an app, or a deployed service aka The What The changes in behaviour, performance, or experience that result from delivering outputs, reflecting real-world impact. e.g. increased client satisfaction, reduced time to complete a task aka The Why"},{n:38,stage:"outcomes",title:"What good outcomes look like",text:"User / Customer Value Making services easier, faster or better Operational Efficiency Reduce effort, waste or cost Financial Impact Deliver savings or avoid expenditure Risk Reduction Improve compliance, security or operational resilience Learning and Feedback Reducing uncertainty and validating assumptions"},{n:39,stage:"outcomes",title:"Outcome Examples",text:"New login feature Users can access service faster New form Submission time reduced by 20% System deployed Increased user satisfaction"},{n:40,stage:"outcomes",title:"What are OKRs?",text:"Objectives and Key Results (OKRs) is a simple goal/outcome setting framework used by teams and individuals to create alignment and engagement around challenging & ambitious goals with measurable results. Objectives Key Results Actions Insights Inspirational goals that describe what you want to achieve and set clear direction. An objective should motivate and challenge teams and individuals Metrics that show how you are progressing towards achieving your objective. For each objective, you should have a small set (two to five) of key results The actions/activities (i.e. Releases / Features) you will need to execute to drive progress towards your key results Analysis of actual results once you have completed the required actions and activities. Your learnings provide insight as to whether you should persevere or pivot Where do we need to go? How do we know if we are getting there? What will we do to get there? What can we change or do better?"},{n:41,stage:"outcomes",title:"OKR Structure",text:"Objective Key Results Actions / Activities We will as measured by via OKR Formula Enhance digital experience for Service X by the end of this FY Increase the use of Product Y by 20% Improve average user satisfaction rating from 3.5 to 4.5 Reduce number of calls to help desk by 15% 4 Exceeded expected results 3 Sufficient achievement against expected results 2 Made progress, but fell short of expected results No progress against expected results 1"},{n:42,stage:"outcomes",title:"Lagging vs Leading Indicators",text:"Lagging Indicators Leading Indicators Used to measure past performance Used as a predictive measure of future performance Feature usage Completion rate Customer satisfaction Outcome achieved"},{n:43,stage:"outcomes",title:"From Problem to Outcome",text:"Product Managers maintain a clear connection between Discovery, Delivery and Measurement"},{n:44,stage:"outcomes",title:"Connecting Strategy to Delivery",text:""},{n:45,stage:"outcomes",title:"Take-aways",text:"Outcomes matter more than outputs Success should be defined before delivery begins OKRs help connect strategy and delivery Measurement is essential Learning is continuous If it doesn\u2019t move a key result, why are we doing it?"},{n:46,stage:"outcomes",title:"We have defined the outcome(s). We now know how success will be measured",text:""},{n:47,stage:"exploration",title:"Solution Exploration",text:"Turning ideas into solutions"},{n:48,stage:"exploration",title:"Solution Exploration Overview",text:"We now understand: Users Problems Opportunities Outcomes Now we explore solutions."},{n:49,stage:"exploration",title:"Generating Ideas",text:"Workshops Co-Design Brainstorming AI Tools Ideation Principles Generate many ideas Encourage diverse perspectives Avoid premature judgement Focus on outcomes"},{n:50,stage:"exploration",title:"Desirable: people want it Viable: the organisation can sustain it Feasible: teams can build and operate it",text:"Desirable, Viable, Feasible Desirable (Human) Feasible (Technology) Viable (Business & Policy) The ideal solution sits at the intersection of desirability (human), feasibility (technology) and viability (business). The Desirable, Viable and Feasible (DVF) is a three-lens approach used in Design thinking to act as a filter before teams invest time and resources in delivery. Product delivery requires a conscious balance:"},{n:51,stage:"exploration",title:"DESIGN THINKING In Practice",text:"Desirable \u2013 do users want it? Ask yourself the following questions: Can we demonstrate evidence of validated user needs to support why we\u2019re proposing a particular solution? Is it clear how our solution will solve these identified user needs? Can we clearly state how our solution contributes to ambition of the business case and policy intent? Does the proposed solution align to the approved business case and/or policy intent? Can the solution be reasonably sustained over the long term, through either existing or proposed changes to business processes? Do we understand the business changes required to support the new solution, have these been validated with impacted stakeholders? Have they been costed and planned? Does the solution align with both endorsed WofG and internal DES technology strategies and frameworks? Is it technically possible to deliver our solution within the time allowed and with our current resources and technology stack? Have we taken a security-by-design approach? Does our solution scale to meet future demand? Viable \u2013 does it support business/policy outcomes? Feasible \u2013 can we realistically deliver and sustain it?"},{n:52,stage:"exploration",title:"Delivery fails when one perspective dominates",text:"User-led but unsustainable Strategically valuable but undeliverable Technically elegant but unused Easiest to build right now but unlikely to deliver the outcome Desirable (Human) Feasible (Technology) Viable (Business & Policy)"},{n:53,stage:"exploration",title:"Common Trade-Offs",text:"Balance means finding the right trade-offs. A trade-off isn\u2019t a compromise you regret \u2013 it\u2019s a choice you make on purpose Desirable and Feasible = Usable and Buildable Users will use it Teams can realistically deliver it Risk: may not align to business priorities Feasible and Viable = Operable and Sustainable Affordable to run Technically sound Risk: may not solve genuine user problems Desirable and Viable = Valuable and Needed Delivers meaningful benefits Aligns to strategic objectives Risk: may not be technically achievable in current constraints"},{n:54,stage:"exploration",title:"Bringing the Three Lenses Together",text:"\u201Cthe intersection of business, technology and user experience to strategically drive the vision, development, launch and continued support an improvement of a product\u201D You are here"},{n:55,stage:"exploration",title:"Idea Validation",text:"Prototypes and experiments provide opportunities to validate assumptions before committing to full delivery. Wireframes Prototypes A/B Testing"},{n:56,stage:"exploration",title:"Minimum Viable Product (MVP)",text:"The smallest thing we can build that delivers value and generates learning MVPs are: Focused Intentional Designed to reduce uncertainty MVPs aren\u2019t: A poor-quality solution An unfinished product"},{n:57,stage:"exploration",title:"From Vision to Value",text:"We have reduced uncertainty and selected a viable solution approach."},{n:58,stage:"delivery",title:"Product Delivery",text:"Validated ideas become deliverable product backlog items"},{n:59,stage:"delivery",title:"Product Backlog(s)",text:"The Product Backlogs are emerging lists of all the things that need to be done. Teams draw from a common Product Backlog to fill their Sprint backlogs with high-value work. Somewhere to capture all the things that need to be done Owned and maintained by Product Management; can be added to by anyone in the team Prioritised in order of value, with priority being set by product management It changes and adapts as new work is identified Work is captured in an agreed hierarchy of Epics, Features, Stories and Tasks depending on the granularity of the work There are different levels of granularity that are important for each role Backlog Basics Tracks the overall project details and is used for DES project status reports. A significant body of work that delivers substantial organisational or user value Demonstrable functionality delivered at the end of each increment. Smaller increments of testable outcomes delivered inside a Sprint. How teams describe their steps to deliver a Story. Project Epic Feature Story Task Backlog hierarchy in DES At a high level, all backlogs in DSD follow the same hierarchy: Product Management use the product backlog to: Identify emerging work as more is understood about the solution Refine upcoming work with the team so that it\u2019s ready to be delivered in the near term Monitor progress of deliverables against project outcomes Manage scope through regular conversations with the delivery team Monitor the quality of work produced, ensuring it aligns against project outcomes"},{n:60,stage:"delivery",title:"Common Backlog Structure",text:"Most teams will use a multi-dimensional product backlog to capture, prioritise and visualise the key activities we need to undertake to complete the project. Below is a high-level view of our Product Backlog and how it informs work across the project. Epics are typically contributed by multiple teams and delivered over many PIs. They describe key project outcomes and help us logically group out work into higher themes. Features are delivered within a PI and typically require input from multiple teams to complete. They describe chunks of valuable functionality that directly contribute to realising the outcomes of the Epic it relates to. Stories are delivered within a Sprint and owned by specific teams. Completed Stories should demonstrate the smallest amount of value that contributes to a Feature. Tasks are a set of small actions that need to be completed to finish a Story. Tasks help build accountability and transparency of effort for the team."},{n:61,stage:"delivery",title:"What Is An Epic?",text:"An Epic describes a measurable business outcome to be delivered. Epics map directly to identified benefits in the project\u2019s business case, high-level requirements and significant pain points/opportunities captured in the service blueprint. Minimum Epic Detail Epics are hypothesis-driven and should be captured in terms that describe the delivery of an outcome, when the work has been completed. Epic Hypothesis Epic Description Business Outcomes & Benefits What measurable outcomes are we tracking to confirm we\u2019ve completed what we set out to do? Objectives and Key Results Desired Delivery Period In and Out of Scope Dependencies When do we anticipate the Epic to be complete? Remember, Epics can span multiple PIs. Captures what the intended solution should deliver to users, in comparison to the current state. Tie each Epic to one or many anticipated business outcomes and/or benefits. Be prescriptive on what\u2019s in and out of scope for each Epic. What critical dependencies are associated with the Epic? Sizing Estimate Epics are sized on estimated people days, relative to other Epics."},{n:62,stage:"delivery",title:"What Is A Feature?",text:"Features describe smaller tangible outcomes that contribute directly to realising the intent of the Epic it relates to. Features are our key artefact to measure medium-term progress and should result in a demonstrable output each PI. Describe the user outcome/s you\u2019d expect to see demonstrated should the work be completed. Feature Hypothesis Sizing Estimate Acceptance Criteria In/Out of Scope Include metrics in which to measure the success of the Feature. For example, \u201C30% reduction in processing time\u201D. Feature Measurement Risks/Issues/Dependencies Area/Iteration Path What are known risks and dependencies can be identified against the Feature? Active issues may result in the Feature being refined or reprioritised. The minimum quality, functionality and usability requirements for the Feature to be deemed complete. Provide a T-Shirt size for each Feature based on collective effort to deliver. Base estimates relative to other Features of similar scope/complexity. What scope are we explicitly targeting for delivery for this Feature? Ensure Features have been created under the correct Area Path (backlog) and Iteration Path (PI/Sprint) so we can track its delivery. Minimum Feature Detail Written as a position statement: \u201Cfor [users], who [opportunity/outcome], the [solution] is a [tangible deliverable] that [provides value] unlike [current solution]. Feature Description"},{n:63,stage:"delivery",title:"What Is A User Story?",text:"User Stories help us communicate an outcome and have a conversation about the detail, scope and shared expectations in a multi-disciplinary team. Stories help track short-term delivery outcomes and give us opportunities to adjust based on regularly feedback. Written in the following format: as a <persona> (the who) I want <a goal> (the what) so that <I can do something> (the why) Story Description Story Points Area Path Stories are scoped for delivery inside a Sprint. The Iteration Path needs to align with the expected delivery of the work. Iteration Path Related Work Stories need to be \u201Cchildren\u201D of their parent Features. Ensure we\u2019ve properly created Stories under their related Feature. The team\u2019s estimated effort to deliver the Story. Captured as Story Points, using the following scale: 1, 2, 3, 5, 8, 13, 20, 100. Stories should be owned by individual delivery teams with an Area Path mapped to their backlog. Minimum Story Detail The minimum quality, functionality and usability requirements for the Story. Common formats described later in the deck. Acceptance Criteria"},{n:64,stage:"delivery",title:"Backlog Prioritisation",text:"Weighted Shortest Job First (WSJF) Value Time Criticality Risk Reduction Opportunity Enablement Job Size (Effort) Impact vs Effort High Impact Low Impact Low Effort High Effort Quick Wins Big Ticket Items Fill-in jobs Thankless tasks Prioritisation is not a one-off activity \u2013 it happens continuously"},{n:65,stage:"delivery",title:"Product Roadmaps",text:"Outcome Now Next Later Objective 1 Objective 2 Objective 3 Objective 4 Key Result 1 Key Result 2 Key Result 1 Key Result 1 Key Result 2 Key Result 1 Key Result 1 Key Result 1 Key Result 2 Key Result 1 Key Result 1 Key Result 2 Key Result 1 Key Result 2 Key Result 1 Key Result 1 Key Result 2 Key Result 1 Outcome PI X PI Y PI X Objective 1 Objective 2 Objective 3 Objective 4 Feature Feature Feature Feature Feature Feature Feature Feature Outcome Roadmap Feature Roadmap Direction Priorities Outcomes Detailed Plans Commitments Fixed Scope"},{n:66,stage:"delivery",title:"Thursday Day 1 | Friday Day 2 | Monday Day 3 | Tuesday Day 4 | Wednesday Day 5 | Thursday Day 6 | Friday Day 7 | Monday Day 8 | Tuesday Day 9 | Wednesday Day 10",text:"Sprint Planning (Scrum of Scrums) | Stand Up | Stand Up (Scrum of Scrums) Refinement #1 | Stand Up | Stand Up (Scrum of Scrums) | Stand Up Refinement #2 | Stand Up | Stand Up (Scrum of Scrums) | Stand Up (Sprint Showcase) Review + Retro DES maintain a common planning and delivery cycle that unlocks greater synchronisation and collaboration. We do this by: 2 week (10 day) Sprints to deliver small increments of value. 10 week (50 day) Program Increments (PIs) to deliver key business outcomes. Sprint 1 10 Days | Sprint 2 10 Days | Sprint 3 10 Days | Sprint 4 10 Days | Sprint 5 10 Days Program Increment 1 50 Days | Program Increment 2 50 Days | Program Increment 3 50 Days | Program Increment 4 50 Days | Program Increment 5 50 Days Delivery Cadence"},{n:67,stage:"delivery",title:"Iterative Delivery",text:"Teams deliver usable increments of releasable functionality on a regular cadence that solve validated user needs. Below is the high-level flow of work: [10 Week Timebox] Business Outcome Highest-priority and highest-value user need/s to be delivered at a specific point in time. Refinement Delivery Candidate Features Taken from the Product Backlog, representing the key functionality to be delivered. Measurement Increment Planning Confirming the detail, scope and feasibility of each feature to be delivered over a 10-week increment. Team Backlogs Product Backlog feeds team-level backlogs of work to be delivered over the PI. Delivery Sprints Teams produce increments of testable functionality within 5 x 10-day timeboxes. Releasable Product The output of each PI should result in releasable functionality to users that satisfies the business outcome. Measure Teams measure the impact and success of the functionality released to inform future planning and delivery cycles."},{n:68,stage:"delivery",title:"Continuous Discovery, Exploration and Delivery",text:"Refinement activities Increment 5 Product Discovery | Solution Exploration Delivery activities Increment 5 Program Increment Planning | Beta and Live Implementation Team Backlogs | Sprints Refinement activities increment 6 Product Discovery | Solution Exploration Delivery activities Increment 6 Program Increment Planning | Beta and Live Implementation Team Backlogs | Sprints Delivery Activities Increment 7 Program Increment Planning | Beta and Live Implementation Team Backlogs | Sprints Refinement | PI #2 | PI #3 | PI #4 | PI #5 | PI #6 | PI #7 | PI #8 Delivery | PI #1 | PI #2 | PI #3 | PI #4 | PI #5 | PI #6 | PI #7 Refinement activities Increment 4 Product Discovery | Solution Exploration Continuous delivery relies on parallel Discovery/Solution exploration streams of work, where Product Management is working on discovery and exploration an increment in advance, while delivery teams are delivering the features identified from the previous refinement work. Release Release Release"},{n:69,stage:"delivery",title:"Linking it all Together",text:""},{n:70,stage:"delivery",title:"We have moved from ideas into delivery.",text:""},{n:71,stage:"lifecycle",title:"The Product Lifecycle",text:"From \u201Cuser need identified\u201D to \u201Cuser need met\u201D"},{n:72,stage:"lifecycle",title:"The Product Lifecycle",text:"Product Management continuously improve product performance by leading the end-to-end product development lifecycle from \u2018need identified\u2019 to \u2018need met\u2019 Solve the right problem Build the right thing Build the thing right"},{n:73,stage:"lifecycle",title:"Alignment with Government best practice",text:"The Product Lifecycle aligns closely with the DTA Service design and delivery process DISCOVERY ALPHA BETA / LIVE"},{n:74,stage:"lifecycle",title:"A continuous loop",text:"The product lifecycle is a continuous loop \u2013 not a linear process We: Discover problems or opportunities Define solutions Deliver value Measure Outcomes Iterate and Improve"},{n:75,stage:"roles",title:"Roles and Responsibilities",text:""},{n:76,stage:"roles",title:"Product Management Responsibilities",text:"Strategy and Vision Define why a product exists. This involves understanding user needs, conducting market research, generating insights, defining problems, framing opportunities, aligning stakeholders and producing artifacts that clearly articulate the product strategy Execute and Deliver Translate validated assumptions into actionable solution artifacts (backlogs). Product Managers continuously prioritise backlogs and work closely with digital delivery teams to turn backlog items into delivered value Product Success Ensure the product delivers continuous value to users/customers whilst achieving organisation objectives. This involves launching the product, analysing performance metrics and iterating based on user feedback Explore Options Translate problems and opportunities into potential solution options. This includes designing experiments to validate your riskiest assumptions, defining the MVP and refining measures of
