 every stakeholder's requested feature is primarily\u2026",options:["A product strategy","An unmade set of choices","A measurable outcome set","A product vision statement"],answer:1,optionNotes:["Strategy requires focus and trade-offs. A list that accommodates everyone has made no trade-off.","","An outcome is a measured change. A feature list is a set of proposed outputs.","A vision describes a future state, not an inventory of requests."],rationale:"Strategy requires focus and trade-offs. Accepting everything avoids the strategic decision."},{id:"thinking-q3",moduleId:"thinking",prompt:"Your department funds projects, runs a project framework and reports on delivery milestones. What does the deck say this means for product management?",options:["Product management applies only to the digital components of the project itself","Product management cannot be applied until the departmental funding model changes","Product thinking can operate inside project delivery, and partial adoption is worthwhile","The project framework should be abandoned entirely for a product framework"],answer:2,optionNotes:["Whole-of-service thinking is the point. Restricting product practice to the digital layer reproduces the problem it is meant to solve.","This is the counsel of despair the deck explicitly argues against. Waiting for the operating model to change means never starting.","","Nothing in the deck proposes replacing the departmental framework. The two are designed to coexist."],rationale:"'Product management is not all or nothing.' Some discovery beats none; imperfect outcomes beat outputs alone."},{id:"thinking-q4",moduleId:"thinking",prompt:"In the shift-in-thinking pairs, what replaces 'requirements'?",options:["Feature epics","Acceptance criteria","Roadmap items","Problems to solve"],answer:3,optionNotes:["An epic is a backlog container. It can carry a requirement mindset just as easily as an outcome mindset.","Acceptance criteria are still needed \u2014 they define done for a slice. The shift is about what the team is briefed on.","A roadmap communicates sequence and confidence. It is not the counterpart to requirements.",""],rationale:"Slide 13 pairs projects/products, outputs/outcomes, requirements/problems and delivery/learning. Teams briefed on problems can find better solutions than the one someone specified."}],scenarios:[{id:"thinking-s1",moduleId:"thinking",context:"Funding and the delivery date are fixed. A senior stakeholder says discovery is pointless because the team must deliver the approved scope.",prompt:"What is the strongest product-management response?",options:["Remove all discovery and ask the business for detailed requirements up front","Reject the project outright because product work cannot operate under these constraints","Use bounded discovery to test the riskiest assumptions within the approved constraints","Promise every requested feature and measure success after the project closes"],answer:2,optionNotes:["This guarantees the approved scope is built exactly as imagined, including whichever parts are wrong. It converts a delivery risk into a certainty.","Constraints are the normal condition of government delivery. Refusing to work inside them removes product practice from where it is most needed.","","Measuring after closure means measuring after the team has disbanded and the budget has closed \u2014 the point at which nothing can be changed."],rationale:"Product thinking can operate within project constraints. The practical move is to reduce uncertainty early and protect the most valuable outcome inside the approved envelope."},{id:"thinking-s2",moduleId:"thinking",context:"You inherit a service with a clear vision statement, a 40-item feature list and no stated priorities. Every item has an internal sponsor and the team is delivering roughly in the order requests arrived.",prompt:"What is the first thing to establish?",options:["A steering committee vote to rank all forty of the items","A commitment to deliver the top twenty items this financial year","A detailed estimate for all forty items so the sponsors can see the total cost","The two or three problems that most block the vision, and what will be deferred"],answer:3,optionNotes:["A vote ranks preferences, not value. It converts the loudest voice into a number and gives the result false authority.","This picks a quantity before establishing a rationale. It also re-commits to the arrival-order problem, just with a cut line.","Estimating everything is expensive and answers a question nobody needs answered. It also implies all 40 items are still candidates.",""],rationale:"The missing artefact is not an estimate or a ranking \u2014 it is the strategic choice. Naming the critical problems, and what is explicitly not being pursued, is what turns a vision and a list into a strategy."}],assignment:{title:"Write a one-page strategic chain",instruction:"Choose a service you know. Connect one user group to a future state, a strategic focus and a deliberate non-priority.",prompts:["Who is the user and what are they trying to achieve?","What future state should the vision describe?","What problem will you focus on first \u2014 and what will you explicitly defer?","Which of the four shift-in-thinking pairs is hardest in your context, and what would make it easier?"],modelAnswer:`User: provider administrators submitting participant claims, trying to get a claim paid without a rejection they have to chase.

Future state: a provider can submit a claim once, know immediately whether it will be accepted, and be told what to fix if it will not.

First focus: rejection-and-resubmission, because it consumes both provider effort and departmental assessment capacity, and every rejected claim is a cost paid twice.

Explicitly deferred: the reporting dashboard providers have asked for. It is genuinely wanted, it will not reduce rejections, and naming it as deferred is what stops it drifting into scope through goodwill.

Hardest pair: requirements to problems. Our funding is approved against a defined scope, so arriving with a problem rather than a specification reads as being unprepared. What would make it easier is one worked example where a problem framing produced a cheaper answer than the specified one.`,criteria:["Names a specific user group and what they are trying to achieve \u2014 not 'users' in general","Describes a future state, not a feature or a system","Names one first focus AND something explicitly deferred","The deferred item is something genuinely wanted, not a straw man"]}},{id:"discovery",number:2,title:"Discovery and problem framing",subtitle:"Build evidence before committing to a solution",minutes:55,slides:"21\u201335",outcome:"Plan discovery, distinguish four kinds of user need, tell evidence from assumption, diagnose root causes, and write testable problem, opportunity and hypothesis statements.",coreIdea:"Discovery reduces uncertainty about users, problems and opportunities. It produces insight, not requirements \u2014 and it should change a decision, not merely generate artefacts.",sections:[{heading:"Understand behaviour in context",body:"Interviews, observation, workshops, analytics, support data and surveys reveal different parts of the service. Triangulation matters because stated preferences, actual behaviour and system constraints frequently disagree.",bullets:["Research the whole journey, including non-digital channels and workarounds.","Separate direct evidence from interpretation and inherited belief.","Include people with varied access, capability and support needs."],sourceIds:["deck","dss","cdh"]},{heading:"Four kinds of need \u2014 and the one government creates",body:"The deck distinguishes what users are experiencing now from what they say, what they assume and what the system forces on them. The fourth category is the one most often mistaken for a user need, and it is the one product managers in government are uniquely placed to challenge.",table:{caption:"Slide 23 \u2014 what are we trying to understand?",head:["Kind of need","What it is","How you find it"],rows:[["Current experience","What users do now, and the tools they already use to reach their goal.","Observation, analytics, support data, walking the process."],["Stated needs","What users explicitly tell you they need \u2014 for example, a mobile-responsive service.","Interviews, surveys, feedback channels."],["Unstated needs","What users expect without ever asking \u2014 for example, information they can understand.","Observation of failure and hesitation; usability testing."],["Created needs","What users are forced to do because of policy or the way government works.","Journey mapping and blueprinting; asking why a step exists at all."]]},example:"'Providers need a form to request a status update' is a created need. The underlying need is to know the status. The form exists because the department has no self-service channel \u2014 that is a design decision, not a user requirement.",sourceIds:["deck"]},{heading:"Artefacts are thinking tools",body:"Personas summarise meaningful behavioural patterns; journey maps show the experience over time; service blueprints connect visible interactions to backstage people, processes and systems. None of them is the outcome. Their value is the decision they improve.",table:{caption:"Slides 25\u201327 \u2014 what each artefact is for",head:["Artefact","Purpose","Typically contains"],rows:[["Persona","Shared understanding of who the users are.","Goals, needs, behaviours, motivations, challenges, context."],["Journey map","Find where improvement will have the greatest impact.","User goals, activities, touchpoints, emotions, pain points, opportunities."],["Service blueprint","Understand how the service operates behind the scenes.","User actions, front-stage activities, back-stage activities, supporting systems and processes."]]},bullets:["A persona must be grounded in research, not a demographic stereotype.","A blueprint exposes why the front-stage experience behaves as it does.","If an artefact would not change what the team does next, it is decoration."],sourceIds:["deck","dss"]},{heading:"Discovery produces insight, not requirements",body:"The deck draws a hard line here. Discovery produces interview notes, survey responses, analytics, feedback and observations. It does not produce requirements, features or solutions. The moment a discovery report contains a solution, it has stopped being evidence and started being advocacy.",bullets:["Discovery outputs: insights, personas, journey maps, blueprints, problem statements, opportunities, hypotheses.","These become the inputs to solution exploration \u2014 the next stage, not this one.","A five-whys chain moves from the visible symptom to the structural cause."],example:"Five whys, from the deck: providers call support \u2192 they cannot determine application status \u2192 status is not available through self-service \u2192 progress is stored across multiple systems \u2192 the service grew through several projects and was never consolidated \u2192 past investment prioritised policy commitments and functionality over end-to-end user experience.",sourceIds:["deck"]},{heading:"Move from symptom to testable opportunity",body:"A good problem statement names the affected group, their goal, the observed difficulty, where and when it occurs, and the consequence \u2014 without embedding a preferred solution. 'How might we' then reframes the problem as an invitation to explore several responses, and a hypothesis commits to one of them in a form that evidence can contradict.",bullets:["Problem: an evidence-based description of the current gap. Who / what / goal / where / when / why it matters.","How might we: an invitation to explore, not a proposal.","Hypothesis: a proposed intervention, audience, expected outcome and observable signal.","A hypothesis you cannot imagine being wrong is not a hypothesis."],example:"We believe giving providers timely application-status visibility will reduce avoidable status calls. We will look for lower call volume and higher successful self-service, while checking that unresolved cases still reach support.",sourceIds:["deck","cdh"]},{heading:"The Lean Canvas as an assumption model",body:"The deck adapts Ash Maurya's Lean Canvas as a one-page way to hold the whole problem-to-measure chain while it is still uncertain. Its real function is not documentation \u2014 it is to make the riskiest assumption visible so you know what to test first.",table:{caption:"Slide 33 \u2014 the deck's canvas fields",head:["Field","The question it answers"],rows:[["Problem","What problem does the organisation have that you are trying to solve?"],["Users","What types of users are impacted?"],["Solution ideas","What options could solve the problem and meet user needs?"],["Business outcomes","How will you know if you have solved it? What will you measure?"],["Hypotheses","Combine the assumptions above into testable hypothesis statements."],["Riskiest assumption","For each hypothesis: what, if wrong, makes the whole thing fail?"]]},sourceIds:["lean","deck"]},{heading:"Worked reasoning: when the analytics and the interviews disagree",body:`Analytics show 38% of providers abandon at the identity step. Interviews say the identity step is 'fine \u2014 a bit annoying but fine.' The weak move is to pick the evidence you prefer: quantitative teams discount the interviews as a small sample, qualitative teams discount the analytics as lacking context. Both are reading a disagreement as a contest, when it is usually a signal that the two are measuring different things. 

Work the disagreement rather than resolving it. The analytics measure everyone who arrived at that step. The interviews measured eight providers recruited through an existing contact list \u2014 people who had already succeeded at identity, repeatedly, because that is how they became reachable contacts. The sample was not too small; it was selected on the outcome being studied. That reframes the finding: the step is fine for people who can complete it, and the 38% are largely absent from the research. 

The next move is not a redesign. It is to find people the drop-out represents \u2014 providers using shared devices, providers whose documents do not match the register, providers without a mobile number attached to their record. Observation of those users found three distinct failure modes, only one of which any interface change could address; the other two were data problems in a different system.`,bullets:["When two sources disagree, ask what each one is a sample of before asking which is right.","Recruiting through existing contacts selects for people who already succeed \u2014 the most common quiet bias in government research.","'The sample is too small' is usually the wrong critique. 'The sample cannot contain the people we are asking about' is the right one."],example:"The redesign the team almost shipped would have addressed roughly a third of the drop-out. Naming the other two causes moved the conversation to the register data owner, who had the actual fix and no idea the problem existed."}],questions:[{id:"discovery-q1",moduleId:"discovery",prompt:"Which is the best problem statement?",options:["Providers cannot reliably determine application progress and make avoidable calls","We need an application-status dashboard built for providers","The old system is bad and providers dislike using it","Build automated status notifications by the end of October this year"],answer:0,optionNotes:["","This is a solution. It forecloses every other option \u2014 including changing the notification, the policy or the process.","This has no user, no goal, no evidence and no consequence. Nothing can be tested against it.","This is a commitment with a date. It presumes both the solution and the timeline before the problem is understood."],rationale:"It names the affected group, the goal they cannot reach, the observed behaviour and the consequence, without prescribing a solution."},{id:"discovery-q2",moduleId:"discovery",prompt:"What makes a discovery artefact useful?",options:["It is visually polished","It improves a consequential decision","It was created collaboratively in a workshop","It contains every research quote"],answer:1,optionNotes:["Polish helps communication but is not the test. A beautiful journey map that changes nothing has failed.","","Collaboration improves shared understanding, but a workshop can equally produce a well-attended guess.","Completeness is not the goal \u2014 synthesis is. A document nobody can act on is an archive, not an artefact."],rationale:"Artefacts are means for shared understanding and decision quality, not ends in themselves."},{id:"discovery-q3",moduleId:"discovery",prompt:"A provider says: 'I need the weekly reconciliation spreadsheet emailed to me every Monday.' The spreadsheet exists only because two departmental systems do not talk to each other. What kind of need is this?",options:["A stated need that is also a created need","A description of the current experience only","A viability constraint on the service","An unstated need the provider has not articulated"],answer:0,optionNotes:["","It does describe current experience, but stopping there misses the point: the need exists because of a system boundary, and that boundary is changeable.","Viability is about whether the organisation can sustain a solution. This is about where the requirement came from.","Unstated needs are the expectations users never articulate. This one was articulated very precisely."],rationale:"It is stated \u2014 they asked for it explicitly \u2014 and created, because it exists only as a workaround for how government has organised its systems. Treating it as a pure user requirement would automate the workaround instead of removing it."},{id:"discovery-q4",moduleId:"discovery",prompt:"According to the deck, which of these does discovery NOT produce?",options:["Problem statements","Requirements","Hypotheses","Insights"],answer:1,optionNotes:["Problem statements are a discovery output \u2014 they synthesise evidence into a testable framing.","","Hypotheses are a discovery output and the bridge into solution exploration.","Insights are the primary output of discovery."],rationale:"Slide 28 is explicit: discovery produces interview notes, survey responses, analytics, feedback and observations \u2014 not requirements, features or solutions. Those belong to solution exploration and delivery."}],scenarios:[{id:"discovery-s1",moduleId:"discovery",context:"Analytics show users abandon a form at the identity step. Stakeholders assume the page needs clearer instructions.",prompt:"What should the team do next?",options:["Treat the drop-off rate as proof of the underlying cause","Rewrite the instructions immediately and measure the effect afterwards","Observe representative users and inspect error and support data first","Remove the identity verification step from the journey"],answer:2,optionNotes:["Analytics tell you where users stop, never why. Drop-off is the symptom the investigation starts from.","Possibly the right fix, but chosen before the cause is known. If the real barrier is a document people do not have, clearer instructions change nothing.","","This treats a legal and security control as an inconvenience. Viability constraints are design inputs, not obstacles to delete."],rationale:"The data identifies where the problem occurs, not why. Targeted qualitative and operational evidence should diagnose the cause before an intervention is chosen."},{id:"discovery-s2",moduleId:"discovery",context:"A discovery report lands on your desk. It is 60 pages, beautifully produced, and concludes with a recommendation to build a mobile app. The research section contains 14 interviews, none of which mention mobile.",prompt:"What is the most useful critique?",options:["The interviews should have asked directly about mobile preferences","The sample size is far too small to support any firm conclusion at all","The report should have been considerably shorter","The recommendation is not traceable to the evidence, and discovery should not recommend solutions"],answer:3,optionNotes:["Asking users to choose a channel invites them to design for you. Stated channel preferences are weak evidence compared with observed behaviour.","Fourteen interviews is a reasonable qualitative sample. Sample size is not the defect here.","Length is a symptom, not the problem. A three-page report with the same disconnect would be equally unusable.",""],rationale:"Two failures at once: the conclusion has no evidential chain, and discovery has crossed into prescribing a solution. The deck separates these deliberately \u2014 discovery produces insight and hypotheses, solution exploration chooses among options."}],assignment:{title:"Build an evidence ledger",instruction:"For a real service problem, separate what is known, inferred and unknown before proposing an intervention.",prompts:["What direct evidence exists?","What assumptions are being treated as facts?","Which unknown could most change the decision, and how would you investigate it?","Which of the current requirements are created needs \u2014 artefacts of how the department works rather than what users need?"],modelAnswer:`Direct evidence: 38% of claims are rejected at first submission (system data, 12 months); the top three rejection reasons are missing evidence, wrong service date and duplicate claim (assessment records); six providers observed submitting claims.

Treated as fact but actually inference: that providers do not read the guidance. Observation showed they read it and it did not answer the question they had. The guidance describes the field, not the decision the provider is making.

Most decision-relevant unknown: whether the evidence requirement can be validated at submission or only after assessment. If it can be validated at submission, an inline check solves most of it. If it cannot, the whole approach changes. Investigate by walking three rejected claims through with an assessor and establishing what they had to look up.

Created needs: the requirement to re-enter participant details already held against the participant record, and the requirement to attach a document the department itself issued. Both exist because two systems do not talk to each other, not because anyone needs them.`,criteria:["Separates observed evidence from inference, and labels the inference","At least one belief the team holds is identified as an assumption rather than a fact","The named unknown would actually change the decision, not just add detail","Identifies at least one created need \u2014 a requirement the department itself generated"]}},{id:"outcomes",number:3,title:"Outcomes, measures and OKRs",subtitle:"Define success before delivery begins",minutes:50,slides:"36\u201346",outcome:"Write useful outcomes and OKRs, grade them honestly, distinguish leading from lagging signals, and design measures that support learning rather than vanity reporting.",coreIdea:"An output says what was produced. An outcome says what changed. Measurement closes the loop between intent, delivery and evidence \u2014 and if the work does not move a key result, it needs a different justification.",sections:[{heading:"Start with the change, not the artefact",body:"Outcomes may describe user behaviour or experience, operational performance, financial impact, risk reduction or learning. They must be specific enough to influence choices but not so narrow that teams optimise a proxy at the expense of the service.",table:{caption:"Slides 37\u201339 \u2014 outputs and the outcomes they are meant to create",head:["Output (the what)","Outcome (the why)"],rows:[["New login feature","Users can access the service faster"],["New form","Submission time reduced by 20%"],["System deployed","Increased user satisfaction"],["Status notifications sent","Providers resolve status questions without assistance"]]},bullets:["The deck names five kinds of good outcome: user value, operational efficiency, financial impact, risk reduction, and learning or reduced uncertainty.","Learning counts as an outcome. Reducing uncertainty is a legitimate result of a cycle.","Guardrail: accessibility, support demand or error risk does not worsen for other groups."],sourceIds:["deck","dss","svpg","perri"]},{heading:"OKRs connect direction to evidence",body:"An objective describes a meaningful direction. Key results describe measurable evidence that the objective is being achieved. Actions are hypotheses about how to move those results; they are not substitutes for the result. The deck's formula is compact: we will [objective], as measured by [key results], via [actions].",bullets:["Objective: qualitative, specific and motivating.","Key result: a measurable change with baseline, target and timeframe. Two to five per objective.","Action: work the team believes will influence a key result.","Insight: what the movement in the key result taught you."],example:"Objective: Make application progress understandable without assistance. KR1: Increase successful status self-service from 42% to 70% by June. KR2: Reduce avoidable status calls by 30%. Guardrail: unresolved-case escalation stays above 95%.",sourceIds:["deck"]},{heading:"Grade key results honestly",body:"The deck uses a four-point grading scale. Its value is that it makes partial achievement sayable. A team that scores 2 and explains why has produced more organisational learning than a team that quietly rewrites the target to 100%.",table:{caption:"Slide 41 \u2014 OKR grading",head:["Grade","Meaning"],rows:[["4","Exceeded expected results"],["3","Sufficient achievement against expected results"],["2","Made progress, but fell short of expected results"],["1","No progress against expected results"]]},bullets:["Grade the key result, not the effort that went into it.","A consistent 4 across every objective usually means the targets were set too low.","Record the insight alongside the grade \u2014 the grade without the reason teaches nobody anything."],sourceIds:["deck"]},{heading:"Use a measurement system, not one magic number",body:"Lagging indicators measure past performance and confirm an outcome after it occurs. Leading indicators are predictive measures of future performance and provide earlier signals, but they require validation. Pair them with diagnostic measures and guardrails, and define the population, denominator, baseline, period and exclusions before anyone reports on them.",table:{caption:"Slide 42 \u2014 indicator types with worked examples",head:["Type","Purpose","Example"],rows:[["Leading","Predictive signal of future performance","Feature usage; completion rate"],["Lagging","Confirmation of past performance","Customer satisfaction; outcome achieved"],["Guardrail","Detects harm or displacement","Escalation rate for unresolved cases; assistive-technology success rate"]]},bullets:["Outcome: did the desired change occur?","Leading: are behaviours moving in the expected direction?","Guardrail: did the intervention create unacceptable harm or push the problem somewhere else?","Define the denominator before you publish the percentage."],sourceIds:["deck","dss"]},{heading:"Worked reasoning: the measure that improved for the wrong reason",body:`A team sets a key result: reduce median application completion time from 18 minutes to 12 by June. In April it reads 11 minutes. The weak move is to close it as achieved, because that is what the number says and the quarter is ending. 

Before accepting a measure that moved, establish why it moved \u2014 because a measure has no way of telling you whether it improved for the reason you intended. Three explanations fit the same number. The form got easier, which is the intended one. Or the hardest applications stopped being submitted online and moved to the phone channel, so the online median improved by losing its slowest cases. Or a validation change now rejects incomplete submissions earlier, so half-finished attempts never enter the denominator. Only the first is a success; the second is displacement and the third is a measurement artefact. 

Distinguishing them costs one afternoon: check whether phone volume rose in the same period, and whether total submissions held steady. Here phone contacts rose 22% in the same window. The measure was real, the improvement was not \u2014 the effort had moved rather than reduced, and the providers most affected were the ones least able to absorb it. That is why the guardrail exists: not to be cautious, but because a headline measure with no counterweight can only ever tell you good news.`,bullets:["Ask of every improvement: what else would be true if this were real, and is it?","Displacement and denominator changes look identical to success in the headline figure.","A guardrail is chosen at the same time as the measure, because after the fact you will pick one that is already satisfied."],example:"The finding was not 'the change failed'. It was 'the change works for people who can complete it online, and we have made the service worse for those who cannot' \u2014 which is a different and far more useful thing to take to a governance forum."}],questions:[{id:"outcomes-q1",moduleId:"outcomes",prompt:"Which is a key result rather than an action or output?",options:["Launch the redesigned provider portal to every user group by June","Run five discovery interviews with providers before the June release","Reduce median completion time from 18 to 12 minutes by June","Create a delivery roadmap covering the next three quarters"],answer:2,optionNotes:["A launch is an output. It can happen on time and change nothing.","Interviews are an action. They might produce insight, but the count of interviews is not a result.","","A roadmap is a communication artefact, not a measured change."],rationale:"It describes a measurable change with a baseline, a target and a timeframe. The others are activities or outputs."},{id:"outcomes-q2",moduleId:"outcomes",prompt:"Why pair an outcome measure with a guardrail?",options:["To avoid the effort of agreeing a baseline before delivery starts","To convert a delivery output into a strategic objective","To make the reporting dashboard look more comprehensive","To detect harmful trade-offs or displaced problems"],answer:3,optionNotes:["Guardrails need baselines just as much as targets do. Without one you cannot tell whether it has worsened.","Guardrails constrain how an outcome is pursued. They have nothing to do with strategy formation.","More metrics is not the aim. A guardrail has a specific job: catching the harm your target might cause.",""],rationale:"A target can be achieved in a way that harms another user group, channel or risk domain. Guardrails make that visible before it scales."},{id:"outcomes-q3",moduleId:"outcomes",prompt:"Under the deck's grading scale, what does a grade of 2 mean?",options:["Made progress, but fell short of expected results","Sufficient achievement against expected results","Exceeded the expected results by a clear margin this quarter","No measurable progress against the expected results"],answer:0,optionNotes:["","That is grade 3 \u2014 the target was substantially met.","That is grade 4.","That is grade 1."],rationale:"The four-point scale exists to make partial achievement reportable. A 2 with a clear explanation of what was learned is more useful to the organisation than a target quietly revised downward."},{id:"outcomes-q4",moduleId:"outcomes",prompt:"Which pairing correctly matches an indicator to its type?",options:["Form completion rate measured at quarter end \u2014 lagging indicator","Feature usage in the first fortnight \u2014 leading indicator","Number of releases shipped this quarter \u2014 lagging indicator","Customer satisfaction score after release \u2014 leading indicator"],answer:1,optionNotes:["Completion rate is leading \u2014 it moves early and predicts the later outcome.","","Release count is an output measure. It is neither leading nor lagging with respect to any outcome, because it measures activity rather than change.","Satisfaction is lagging: it reports how people felt about an experience they have already had."],rationale:"The deck pairs feature usage and completion rate as leading, and customer satisfaction and outcome achievement as lagging. Release counts measure activity, which is the trap the whole stage warns about."}],scenarios:[{id:"outcomes-s1",moduleId:"outcomes",context:"A team launches status notifications and wants to know whether they created value.",prompt:"Which measure set is strongest?",options:["Successful self-service, avoidable status-call rate, user comprehension and unresolved-case escalation","Number of notifications sent, emails opened and portal sessions started each week","Release delivered on the agreed date, within the agreed budget and to the scope signed off at planning","Status page views, unique visitors and average time spent on the page"],answer:0,optionNotes:["","This counts the activity the team performed. It would rise even if every notification were ignored or misunderstood.","This measures project performance, not product value. Both can be true while nothing improves for users.","Views tell you people arrived, not that they understood or that their question was answered."],rationale:"The set combines outcome, behavioural, experience and guardrail evidence instead of counting activity alone."},{id:"outcomes-s2",moduleId:"outcomes",context:"Your key result is 'reduce avoidable status calls by 30%'. Two months in, calls are down 34%. Support tells you the improvement began the week the phone menu was restructured to route status enquiries to a callback queue with a four-day wait.",prompt:"What is the correct reading?",options:["The key result has been met and the objective can now be closed off","Displacement, not resolution, moved the measure \u2014 the missing guardrail is the finding","The key result should be raised to 50% since progress is already ahead of schedule","The phone menu change should be reversed so the product's true effect can be isolated"],answer:1,optionNotes:["The number moved; the problem did not. Closing here would bank an improvement that users experienced as a four-day wait.","","Raising a target you have not actually influenced compounds the error rather than correcting it.","Reversing an operational change to protect the cleanliness of a metric puts measurement ahead of service. Instrument the displacement instead."],rationale:"Calls fell because the demand was pushed into a queue, not because uncertainty was resolved. A guardrail on time-to-resolution or unresolved-case escalation would have caught it \u2014 which is exactly what guardrails are for."}],assignment:{title:"Create a measure tree",instruction:"Turn one service objective into measurable evidence and safeguards.",prompts:["State one objective in plain language.","Write two key results with baselines, targets and timeframes.","Add one leading indicator and one guardrail; explain what each protects against.","For each key result, state what a grade of 2 would look like and what you would do about it."],modelAnswer:`Objective: providers get claims right first time.

KR1: reduce first-submission rejection rate from 38% to 20% by 30 June.
KR2: reduce median time from first submission to payment from 19 days to 12.
Guardrail: assisted-channel contacts do not rise above the current baseline of 340 per week.

The guardrail exists because the fastest way to reduce rejections is to reject less strictly, and the second fastest is to push providers to phone before submitting. Both would move KR1 and neither would be a success.

Leading indicator: proportion of claims where the inline validation fires and the provider corrects before submitting. It moves within days and tells us the mechanism is working.
Lagging indicator: rejection rate itself, which takes a full assessment cycle to read.

Grading honestly: if we land at 26% we grade it a 2 \u2014 progress, short of expectation \u2014 and say what we learned, rather than restating the target as 26%.`,criteria:["Key results describe measured change with a baseline, a target and a date","At least one guardrail, and it protects against a plausible way of gaming the key result","Distinguishes a leading from a lagging indicator and says why each is there","Could someone tell from the key results alone whether the objective was achieved?"]}},{id:"exploration",number:4,title:"Solution exploration and validation",subtitle:"Learn cheaply before you build deeply",minutes:55,slides:"47\u201357",outcome:"Generate options, apply the desirable/viable/feasible lenses and their trade-off pairs, expose assumptions, select appropriate experiments, and define an MVP as the smallest coherent test of value.",coreIdea:"Discovery asks whether a solution is valuable, usable, feasible and viable before the organisation makes an expensive commitment. A trade-off is not a compromise you regret \u2014 it is a choice you make on purpose.",sections:[{heading:"Diverge before you converge",body:"Generate several ways to address the opportunity before comparing them. Workshops, co-design, brainstorming and AI-assisted ideation all broaden the option space, but evidence and constraints \u2014 not workshop popularity \u2014 must drive the decision.",bullets:["Generate many ideas; encourage diverse perspectives; avoid premature judgement; focus on outcomes.","Separate idea generation from evaluation, in time and preferably in the agenda.","Include non-build options: process change, policy change, guidance, removing a step entirely.","Compare options against the intended outcome and the critical constraints, not against each other's polish."],sourceIds:["deck","ideo"]},{heading:"Desirable, viable, feasible \u2014 the three lenses",body:"The DVF model is a filter applied before the organisation invests time and resources. The ideal solution sits at the intersection of desirability (human), feasibility (technology) and viability (business and policy). Delivery fails when one perspective dominates.",table:{caption:"Slides 50\u201352 \u2014 the lenses and their failure modes",head:["Lens","The question","What dominance alone produces"],rows:[["Desirable (human)","Do users want it? Is the need validated?","User-led but unsustainable"],["Feasible (technology)","Can teams build and operate it?","Technically elegant but unused"],["Viable (business and policy)","Can the organisation sustain it?","Strategically valuable but undeliverable"],["None \u2014 expedience","What can we do fastest?","Easiest to build now, unlikely to deliver the outcome"]]},sourceIds:["deck","ideo","svpg"]},{heading:"The trade-off pairs tell you what you are risking",body:"Any two lenses without the third produce a recognisable kind of failure. Naming the pair you are currently sitting on is the fastest way to say what evidence you still owe.",table:{caption:"Slide 53 \u2014 common trade-offs",head:["Pair","What you get","What you are risking"],rows:[["Desirable + Feasible","Usable and buildable \u2014 users will use it, teams can deliver it","May not align to business or policy priorities"],["Feasible + Viable","Operable and sustainable \u2014 affordable to run, technically sound","May not solve a genuine user problem"],["Desirable + Viable","Valuable and needed \u2014 meaningful benefits, aligned to strategy","May not be technically achievable in the current landscape"]]},example:"A proposal that policy loves and users need, but which requires real-time integration with three systems that batch overnight, is Desirable + Viable. The debt you owe is a feasibility spike \u2014 not another stakeholder briefing.",sourceIds:["deck"]},{heading:"Map risks and assumptions",body:"A promising idea can fail because users do not value it, cannot use it, the team cannot deliver or operate it, or policy and business constraints make it untenable. Write assumptions explicitly and rank them by importance and uncertainty. The riskiest assumption is the one that, if wrong, makes the whole thing fail.",bullets:["Value/desirability: will this solve a problem that matters?","Usability: can people understand and successfully use it?","Feasibility: can it be built and operated with the available technology and capability?","Viability: can policy, service, legal, financial and organisational conditions sustain it?"],sourceIds:["svpg","ideo","lean"]},{heading:"Match the experiment to the uncertainty",body:"An experiment is a deliberate way to obtain decision-relevant evidence. The method should follow from the kind of risk, not from what the team is comfortable running.",table:{caption:"Choosing a validation method",head:["Risk","Method","What it tells you"],rows:[["Problem and value","Interviews, observation, demand tests","Whether the problem matters enough to act on"],["Usability and comprehension","Wireframes, prototypes, usability testing","Whether people can understand and complete the task"],["Feasibility","Technical spike against representative interfaces and data","Whether it can be built and operated"],["Viability","Operational simulation, policy and legal review, costing","Whether the organisation can sustain it"],["Comparative effect at scale","A/B or staged rollout with a control","Which variant actually moves the measure"]]},bullets:["Define the decision first, then the evidence that would change it.","Test the riskiest assumption with the cheapest credible evidence.","Predefine what result would support, weaken or kill the idea \u2014 before you run it."],example:"Before integrating three legacy systems, use a realistic prototype and manually supplied status data to test whether the proposed information actually reduces uncertainty for providers.",sourceIds:["cdh","svpg","lean"]},{heading:"What an MVP is, and what it is not",body:"The deck defines an MVP as the smallest thing we can build that delivers value and generates learning. MVPs are focused, intentional and designed to reduce uncertainty. They are not a poor-quality solution and not an unfinished product. In government the distinction matters more than usual: 'minimum' never licenses an inaccessible, insecure or misleading experience.",bullets:["Minimum refers to scope of the bet, not to quality of the build.","An MVP still has to meet accessibility and security obligations.","If it cannot produce evidence that would change your next decision, it is not an MVP \u2014 it is just a small release."],sourceIds:["deck","dss"]},{heading:"Worked reasoning: choosing which assumption to test first",body:`A team has a validated problem and four solution ideas. There is money for one test before the funding decision. The weak move is to test the idea people like most, which produces a confirmation of enthusiasm and no new information. The slightly-less-weak move is to test whatever is cheapest to test, which optimises for effort rather than for what you would learn. Neither asks the only question that matters: which uncertainty, if resolved badly, would stop this being worth doing at all? 

List the assumptions the favoured option rests on, then place each one on two axes: how uncertain it is, and how much it would cost to be wrong. Assumptions that are certain do not need testing regardless of consequence. Assumptions that are uncertain but cheap to be wrong about can be resolved by building and observing. The ones worth an experiment sit in the corner where you genuinely do not know and the answer changes the decision. 

For a proactive SMS notification the assumptions were: providers want it, contact data is good enough to reach them, messages will be understood without context, and the volume will not overwhelm the call centre when people ring to ask what the message meant. Desirability was near-certain from discovery. Contact-data quality was unknown and fatal \u2014 an SMS service that reaches 60% of providers is not a service. That was the test.`,bullets:["Uncertain and consequential is the only quadrant worth an experiment.","Cheapness is a tie-breaker between candidate tests, never the reason to choose one.","If you cannot name the result that would stop the work, you are not running a test."],example:"Contact data reached 71% of active providers, and the failures clustered in the smallest organisations. The service still went ahead \u2014 but with an assisted-channel fallback designed in from the start rather than discovered at Beta."}],questions:[{id:"exploration-q1",moduleId:"exploration",prompt:"What is the best definition of an MVP in this context?",options:["Whatever scope happens to fit in the time before the announced deadline","The cheapest possible release that can be shipped","The smallest coherent test that produces evidence about value and risk","A complete product delivered with fewer features than planned"],answer:2,optionNotes:["Deadline-driven scope is a delivery constraint. It says nothing about what the release is designed to find out.","Cost is not the defining property. A cheap release that teaches you nothing has failed at the only job an MVP has.","","This describes a reduced product, not a test. The purpose is learning, not a trimmed launch."],rationale:"The purpose is learning and risk reduction. 'Minimum' does not excuse an incoherent, inaccessible or unsafe experience."},{id:"exploration-q2",moduleId:"exploration",prompt:"Which experiment best tests technical feasibility?",options:["A stakeholder vote to decide the preferred technical option","A persona workshop run with the delivery team and the designers","A satisfaction survey run with users before the release","A technical spike against representative interfaces and data"],answer:3,optionNotes:["A vote measures preference among people who mostly cannot assess the technical risk.","Personas address desirability. They tell you nothing about whether an integration will hold.","Asking about satisfaction with something nobody has used produces speculation, not evidence.",""],rationale:"A bounded technical spike directly tests the engineering uncertainty under relevant conditions."},{id:"exploration-q3",moduleId:"exploration",prompt:"A solution is affordable to run and technically sound, but research has not established that anyone struggles with the problem it addresses. Which trade-off pair is this, and what is the risk?",options:["All three lenses are satisfied","Desirable + Feasible \u2014 risks misalignment with business priorities","Feasible + Viable \u2014 risks not solving a genuine user problem","Desirable + Viable \u2014 risks not being technically achievable"],answer:2,optionNotes:["Desirability is unevidenced, so the intersection has not been reached.","Desirable + Feasible would mean the user need is validated. Here it is precisely what is missing.","","Desirable + Viable would again require a validated need. The description gives you sustainability and technical soundness only."],rationale:"Affordable to run plus technically sound is Feasible + Viable. It is the classic profile of an internally convenient solution that no user asked for."},{id:"exploration-q4",moduleId:"exploration",prompt:"When is an A/B test the appropriate validation method?",options:["When you need to test whether a legacy integration is achievable within the budget","When you need to decide which of the ideas stakeholders prefer most","When you need to understand why users behave in a particular way","When you need to compare the effect of variants on a measure at sufficient scale"],answer:3,optionNotes:["That is a technical spike. An A/B test needs a working implementation of both variants.","Preference is not the question an experiment answers, and stakeholders are not the population under test.","A/B tests measure difference, never explanation. Pair one with qualitative research if you need the why.",""],rationale:"A/B and staged rollouts isolate the comparative effect of variants against a control. They need traffic volume and a working build, which is why they sit late in the validation sequence rather than early."}],scenarios:[{id:"exploration-s1",moduleId:"exploration",context:"The team believes SMS notifications will reduce calls, but policy limits the detail a message may contain and provider contact data may be stale.",prompt:"What is the best first test?",options:["Test message comprehension, contact-data quality and operational handling with a small controlled cohort","Ask executives whether they would prefer SMS over email for this","Choose email instead because it is cheaper to run and already integrated with the existing provider records","Build the full integration and release it to every provider at once"],answer:0,optionNotes:["","Executive preference is not evidence about comprehension or data quality, which are the two live risks.","Switching channel on cost grounds sidesteps the actual uncertainties, which apply to email as well.","This spends the largest amount of money before answering the cheapest questions. Both risks named in the brief remain untested."],rationale:"It targets the highest-risk value, viability and data assumptions before major integration work \u2014 comprehension under the policy constraint, and whether the contact data can even reach people."},{id:"exploration-s2",moduleId:"exploration",context:"A workshop generated 30 ideas. The team voted with dot stickers and the top-ranked idea is a chatbot. The two engineers present did not vote and have since said the required content simply does not exist in any structured form.",prompt:"What should happen next?",options:["Discard the chatbot entirely and take the second-ranked idea from the workshop","Treat the vote as an input, then test the shortlist against the outcome and the three lenses","Run the workshop again with a better voting method and a wider group","Proceed with the chatbot \u2014 it has the clearest mandate from everyone who attended the workshop"],answer:1,optionNotes:["Rank order from the same flawed process has the same problem. The method is the issue, not the winner.","","The problem is not the voting mechanism \u2014 it is treating any vote as the decision. A better-run vote produces a better-run guess.","Popularity in a room is not evidence. A mandate from people who cannot assess feasibility is not a mandate."],rationale:"The deck separates idea generation from evaluation for exactly this reason. Engineers have already surfaced a feasibility risk; that is decision-relevant evidence and it outranks the sticker count."}],assignment:{title:"Design an assumption test",instruction:"Choose one proposed solution and design a small experiment that could genuinely change the decision.",prompts:["What must be true for the solution to work?","Which assumption is both uncertain and critical?","What evidence will you collect, from whom, and what result would cause you to pivot?","Which trade-off pair is your option currently sitting on, and what evidence do you therefore still owe?"],modelAnswer:`Riskiest assumption: that rejection reasons are knowable at submission time. If assessment requires judgement that cannot be encoded, inline validation cannot work and the whole approach fails.

Why this one: it is both uncertain \u2014 nobody has checked \u2014 and consequential, because being wrong invalidates the option entirely rather than requiring a redesign. Desirability is not in doubt; providers have asked for this repeatedly.

Cheapest credible test: take 40 recently rejected claims, and have two assessors independently mark which rejections could have been detected from the submitted data alone. No engineering, two days, and it produces a number we can act on.

What would stop us: if under half are detectable at submission, inline validation addresses a minority of the problem and the better option is changing what evidence is required at all \u2014 which is a policy conversation, not a build.

MVP if it passes: validation on the three top rejection reasons only, for one provider cohort, with the existing submission flow otherwise untouched. Smallest thing that produces a real rejection-rate number.`,criteria:["Names one assumption and justifies it as both uncertain and consequential","The test is proportionate \u2014 cheapest thing that resolves the assumption, not the most thorough","States in advance what result would stop the work","The MVP is scoped as a test of value, not as a smaller version of the full build"]}},{id:"delivery",number:5,title:"Delivery, backlogs and roadmaps",subtitle:"Translate outcomes into ordered, testable increments",minutes:70,slides:"58\u201370",outcome:"Structure and refine a backlog to the level of detail DES expects, work within the sprint and Program Increment cadence, use prioritisation methods with judgement, and communicate direction without turning a roadmap into a false promise.",coreIdea:"Delivery is a learning system: order work toward a goal, release usable increments on a predictable cadence, measure the effect and adapt the plan.",sections:[{heading:"The backlog is an ordered model of current intent",body:"The Scrum Guide describes the Product Backlog as an emergent, ordered list and the single source of work for the Scrum Team. The deck adds the local reality: the backlog is owned and maintained by product management, can be added to by anyone in the team, is prioritised in order of value with priority set by product management, and changes as new work is identified.",bullets:["Product Goal: the longer-term target the backlog emerges against.","Product Backlog: what may improve the product, ordered as knowledge changes.","Sprint Backlog: the Sprint Goal, the selected items and the developers' plan.","Anyone may add; product management orders. Those are different rights and confusing them is a common failure."],sourceIds:["scrum","deck"]},{heading:"Levels exist to preserve traceability, not to create bureaucracy",body:"Epics, features and stories move a team from outcome to increment. Note that epics, features and Program Increments are not Scrum terms \u2014 they come from scaled frameworks and local practice, and their definitions vary between organisations. What follows is how the deck defines them for DES.",table:{caption:"Slides 60\u201363 \u2014 the DES backlog hierarchy",head:["Level","Horizon","Definition"],rows:[["Epic","Many PIs, multiple teams","A measurable business outcome. Maps directly to benefits in the business case, high-level requirements and significant pain points in the service blueprint."],["Feature","Within a PI, often multiple teams","A smaller tangible outcome contributing to its epic. Should result in a demonstrable output each PI."],["Story","Within a sprint, one team","A small slice a team can complete and validate. Written as: as a [persona] I want [goal] so that [reason]."],["Task","Within a sprint","The work breakdown beneath a story."]]},sourceIds:["deck","scrum"]},{heading:"Minimum detail at each level",body:"The deck specifies what each backlog level must carry. This is the most directly operational content in the whole presentation \u2014 Area Path and Iteration Path are Azure DevOps fields, and getting them wrong is why work goes missing from a PI plan.",table:{caption:"Slides 61\u201363 \u2014 minimum detail",head:["Level","Required fields"],rows:[["Epic","Epic hypothesis; epic description; business outcomes and benefits; objective. Hypothesis-driven, expressed as the outcome delivered when the work is complete."],["Feature","Feature hypothesis; sizing estimate; acceptance criteria; in/out of scope; feature measurement (e.g. '30% reduction in processing time'); risks, issues and dependencies."],["Story","Story description in as-a/I-want/so-that form; story points; area path; iteration path aligned to the sprint in which delivery is expected."]]},bullets:["Every level carries a hypothesis or an outcome. None of them is a specification handed down.","Feature measurement is not optional \u2014 it is how you find out whether the feature worked.","Iteration path must align to the sprint the work is actually expected in, or PI reporting silently drifts."],sourceIds:["deck"]},{heading:"The DES delivery cadence",body:"DES maintains a common planning and delivery cycle so teams synchronise. Two-week sprints deliver small increments of value; ten-week Program Increments deliver key business outcomes. Knowing this cadence is what makes the backlog levels meaningful \u2014 a feature is 'PI-sized' only because a PI is ten weeks.",table:{caption:"Slides 66\u201367 \u2014 cadence",head:["Cycle","Length","Delivers"],rows:[["Sprint","2 weeks (10 working days)","Small increments of releasable value"],["Program Increment (PI)","10 weeks (50 working days)","Key business outcomes"]]},bullets:["The PI flow: business outcome \u2192 candidate features from the backlog \u2192 refinement \u2192 increment planning \u2192 delivery \u2192 measurement.","Refinement confirms the detail, scope and feasibility of each feature before the increment starts.","Five sprints fit inside a PI, which is why feature sizing and iteration paths have to be honest."],sourceIds:["deck"]},{heading:"Discovery runs an increment ahead of delivery",body:"Continuous delivery relies on parallel streams. Product management works on discovery and solution exploration an increment in advance, while delivery teams build the features identified from the previous refinement cycle. The two streams share outcomes, people and feedback \u2014 otherwise you get a discovery function producing documents nobody builds.",bullets:["Discovery for PI N+1 happens during delivery of PI N.","Releases occur throughout, not only at PI boundaries.","Operational data and research from live releases feed back into the opportunity and product backlogs.","Continuous does not mean chaotic \u2014 it means the loops overlap on a known cadence."],sourceIds:["deck","cdh","svpg"]},{heading:"Prioritisation is economic judgement made explicit",body:"Impact/effort and WSJF make trade-offs discussable; they do not manufacture certainty. SAFe defines WSJF as relative cost of delay divided by relative job duration or size. Scores should be relative, evidence-informed and revisited \u2014 prioritisation is not a one-off activity.",table:{caption:"Slide 64 \u2014 the WSJF components",head:["Component","Contributes to"],rows:[["User and business value","Cost of delay (numerator)"],["Time criticality","Cost of delay (numerator)"],["Risk reduction and opportunity enablement","Cost of delay (numerator)"],["Job size or effort","Denominator"]]},bullets:["WSJF = cost of delay \xF7 job size. Higher score sequences earlier.","Smaller valuable work often moves earlier because it creates learning and benefit sooner.","Impact/effort quadrants: quick wins, big-ticket items, fill-in jobs, thankless tasks.","Dependencies, safety, legislated mandates and confidence still require judgement over the score."],sourceIds:["wsjf","deck"]},{heading:"A roadmap communicates direction at the right confidence",body:"Outcome roadmaps emphasise objectives and key results over time horizons; feature roadmaps specify likely solution work against PIs. The deck shows both. Use Now/Next/Later or similar confidence bands where exact dates would imply certainty the evidence does not support.",bullets:["Outcome roadmap: Now / Next / Later, each carrying objectives and their key results.","Feature roadmap: PI X / PI Y, each carrying candidate features under an objective.","The further out, the lower the confidence and the coarser the commitment should be.","A dated 18-month feature list is a forecast presented as a promise."],sourceIds:["deck","svpg","pichler"]},{heading:"Worked reasoning: the roadmap that promised dates it could not keep",body:`The published roadmap shows four features with quarterly dates. Discovery has just invalidated the hypothesis behind the second one. The weak move is to keep the date and quietly change what ships under that name, which preserves confidence for one quarter and destroys it permanently the first time somebody notices. The other weak move is to stop publishing a roadmap, which reads as evasion and removes the only artefact stakeholders have for planning their own work. Both mistakes come from treating a roadmap as a commitment register rather than a statement of intent at a stated confidence. 

Rebuild it around what you actually know. Work in the current increment has been refined, sized and started: you can commit to that, and dates are meaningful. Work in the next increment has a validated problem but unproven solutions: you can commit to the outcome and not the shape. Work beyond that is a direction. Publishing all three with the same visual weight and the same date format is the lie \u2014 not the dates themselves. 

The invalidated feature moves out of the committed band and its outcome stays, with an honest note that the approach did not survive testing and the team is exploring others. The conversation with the sponsor then becomes about the outcome and the evidence rather than about a slipped date, which is a conversation you can actually have.`,bullets:["A roadmap is a confidence statement. Presenting three confidence levels in one format is what makes it a false promise.","'What would have to be true before a date is meaningful?' converts a date demand into a useful conversation.","Removing an approach while keeping its outcome shows the work is being steered, not abandoned."],example:"The sponsor's actual concern turned out to be a Ministerial commitment tied to the outcome, not the feature. Once that was on the table the team could propose a different route to the same outcome \u2014 which the date-defence conversation had been hiding for two months."}],questions:[{id:"delivery-q1",moduleId:"delivery",prompt:"How does the Scrum Guide describe the Product Backlog?",options:["An emergent, ordered list of what is needed to improve the product","A release contract agreed with stakeholders at the start","A fixed requirements baseline agreed at the start of the delivery phase","The Product Owner's private list of outstanding tasks"],answer:0,optionNotes:["","Treating the backlog as a contract is what produces the dated 40-item roadmap this stage warns about.","'Emergent' is the opposite of a baseline. A frozen backlog cannot respond to what delivery teaches you.","It is the single source of work for the whole Scrum Team, and anyone in the team may add to it."],rationale:"Ordered and emergent are deliberate: the backlog changes as the team learns and is not a frozen specification."},{id:"delivery-q2",moduleId:"delivery",prompt:"In WSJF, a higher score generally indicates\u2026",options:["A guaranteed return on the investment the team has made","High relative cost of delay compared with job size","The largest job in the backlog by size","The most senior sponsor behind the request"],answer:1,optionNotes:["WSJF sequences relative economic urgency. It forecasts nothing and guarantees less.","","Job size is the denominator \u2014 a larger job lowers the score, all else equal.","Sponsorship is not a WSJF input. If it is driving your scores, the model is being used as cover."],rationale:"WSJF sequences relative economic urgency against relative duration or size. It is a comparative aid, not a guarantee."},{id:"delivery-q3",moduleId:"delivery",prompt:"How long is a Program Increment in the DES cadence, and what is it meant to deliver?",options:["2 weeks, delivering small increments of releasable value","6 weeks, delivering a release candidate","10 weeks, delivering key business outcomes","12 weeks, delivering a completed epic"],answer:2,optionNotes:["That is the sprint: two weeks, ten working days, small increments of value.","Six weeks is not part of the DES cadence.","","Epics span many PIs by definition, so no single PI is expected to complete one."],rationale:"DES runs two-week sprints inside ten-week PIs. Five sprints per PI is why features are sized to a PI and stories to a sprint."},{id:"delivery-q4",moduleId:"delivery",prompt:"Which field is required on a feature but not on a story?",options:["Area path and the owning team","Story points as estimated by the delivery team","Iteration path for the current sprint","In/out of scope and feature measurement"],answer:3,optionNotes:["Area path is a story-level field.","Story points are a story-level field.","Iteration path is a story-level field, aligning the story to the sprint it is expected in.",""],rationale:"Features carry a hypothesis, sizing estimate, acceptance criteria, in/out of scope, feature measurement and risks/issues/dependencies. Feature measurement is the one most often skipped and the one that determines whether you learn anything."},{id:"delivery-q5",moduleId:"delivery",prompt:"In the continuous discovery and delivery model, what is product management working on while teams deliver PI N?",options:["Nothing \u2014 discovery pauses entirely during delivery","Acceptance testing for everything in PI N","Discovery and solution exploration for PI N+1","The business case for the next financial year"],answer:2,optionNotes:["Pausing discovery during delivery is exactly the failure the parallel-stream model is designed to prevent.","Acceptance sits with the delivery team and Product Owner within the increment.","","Business case work happens, but it is not what the parallel-stream model describes."],rationale:"Product management runs an increment ahead so that refined, validated features are ready when the next PI starts. Otherwise planning fills with unvalidated work."}],scenarios:[{id:"delivery-s1",moduleId:"delivery",context:"A six-month roadmap lists 40 dated features, but discovery has invalidated several underlying assumptions.",prompt:"What should the product manager do?",options:["Stop publishing any roadmap until the evidence settles and the dates become reliable again","Keep the published dates to preserve stakeholder confidence","Replace the whole roadmap with an unprioritised list of ideas from stakeholders","Reframe around outcomes and confidence bands, explain what changed and reorder"],answer:3,optionNotes:["Silence is read as drift. Stakeholders need direction and rationale more than they need dates.","Confidence built on dates you know are wrong is a debt that comes due with interest at the first missed milestone.","Removing order removes the strategy. Stakeholders lose the ability to see what matters most.",""],rationale:"Transparency means updating the plan when evidence changes while preserving direction, rationale and stakeholder dialogue."},{id:"delivery-s2",moduleId:"delivery",context:"At PI planning a team commits to eight features. Six have acceptance criteria and sizing; two are one-line titles with an executive's name attached. The PI is ten weeks and the team's historical throughput is five features.",prompt:"What is the strongest response?",options:["Take the six refined features, refine the other two next PI, and make the gap explicit","Split the two unrefined items into stories immediately so that they can be committed","Commit to the two sponsored items first, because they already have executive attention","Commit to all eight items and manage the resulting shortfall later in the PI"],answer:0,optionNotes:["","Decomposing an item that has no hypothesis, scope boundary or measurement produces detailed stories about an unvalidated idea.","Sponsorship is not refinement. Committing unrefined work first maximises the chance the PI delivers the least validated thing in it.","Committing to 60% more than throughput supports guarantees a shortfall. Managing it later means discovering it at week eight."],rationale:"Refinement exists to confirm detail, scope and feasibility before an increment starts. Two problems are live here \u2014 unrefined work and a capacity overcommitment \u2014 and both need naming rather than absorbing."}],assignment:{title:"Order a small backlog",instruction:"Choose five candidate items and make your trade-offs visible.",prompts:["State the Product Goal or outcome they serve.","Estimate relative value, urgency/risk reduction and size.","Order the items, then explain one case where judgement should override the score.","Take your top item and write it to the deck's minimum detail for its level \u2014 epic, feature or story."],modelAnswer:`Feature: inline validation of the three highest-volume rejection reasons.
Outcome it serves: reduce first-submission rejection rate (KR1).
Measurement: rejection rate for claims that passed inline validation, compared with those that did not.
In scope: the three named reasons, provider portal only.
Out of scope: assisted channel, bulk upload, the remaining eleven rejection reasons.

Order: this before the reporting dashboard, despite the dashboard having a more senior sponsor. WSJF reasoning \u2014 similar effort, but the validation work carries a cost of delay measured in provider effort and assessment capacity every week it is not shipped, while the dashboard's cost of delay is reputational and flat.

Roadmap framing: Now \u2014 inline validation, dates meaningful because it is refined and started. Next \u2014 assisted-channel parity, outcome committed, shape not yet proven. Later \u2014 remaining rejection reasons, direction only, no dates.

What I will say to the dashboard sponsor: the outcome their dashboard serves is visibility of claim status, and here is the evidence that fewer rejections serves it better and sooner.`,criteria:["The item names its outcome and how it will be measured, not just what will be built","Prioritisation is argued economically \u2014 cost of delay against size \u2014 not by seniority","The roadmap distinguishes confidence levels rather than giving everything a date","Something is explicitly out of scope"]}},{id:"lifecycle",number:6,title:"Lifecycle and continuous learning",subtitle:"Connect discovery, delivery, release and improvement",minutes:40,slides:"71\u201374",outcome:"Relate the product lifecycle to the DTA service design and delivery process, and explain why discovery and measurement continue after release.",coreIdea:"The lifecycle is a loop: discover problems, define solutions, deliver value, measure outcomes, iterate and improve.",sections:[{heading:"Solve the right problem; build the right thing; build it right",body:"These are linked responsibilities, not three isolated departments. Product, design and technology need shared context so that feasibility knowledge improves discovery and user evidence improves delivery. The deck frames the whole lifecycle as moving a service from 'need identified' to 'need met'.",sourceIds:["deck","svpg"]},{heading:"Government phases manage increasing confidence",body:"The DTA service design and delivery process moves through Discovery, Alpha and Beta/Live. Discovery understands users and constraints; Alpha explores and tests different ways to meet those needs; Beta builds and trials an accessible, secure service; Live sustains and improves it. Note the deck presents Beta and Live as a combined stage \u2014 this course separates them because the ownership question at go-live is where services most often fail.",table:{caption:"Slide 73 \u2014 DTA phases",head:["Phase","Purpose","Typical evidence produced"],rows:[["Discovery","Understand users, policy intent and constraints","Insights, problem statements, opportunities"],["Alpha","Explore and test several approaches","Prototypes, validated or killed hypotheses"],["Beta","Build and trial an accessible, secure service","Live usage under real conditions, performance data"],["Live","Operate and continue improving","Ongoing performance, research and feedback"]]},bullets:["A phase is not permission to stop learning.","The Digital Service Standard should be considered across the whole lifecycle, not at a single gate.","Non-digital channels and end-to-end service impacts remain in scope throughout."],sourceIds:["dss","deck"]},{heading:"Continuous does not mean chaotic",body:"Teams can explore upcoming opportunities while delivering validated work, provided both streams share outcomes, people and feedback. Reviews, operational data and research continuously update the opportunity and product backlogs. The loop is: discover problems or opportunities, define solutions, deliver value, measure outcomes, iterate and improve.",sourceIds:["deck","cdh","svpg"]},{heading:"Worked reasoning: the service that went Live and quietly decayed",body:`A service launches, meets its targets, and the project closes. Eighteen months later completion is down 8% with no release in that period and nobody can say why. The weak reading is that the original design was wrong, which is both unfalsifiable and useless. The code did not change, so something around it did \u2014 and that is the whole argument for treating Live as a phase with an owner rather than as an ending. 

Work outward from what could have moved. Users change: a new cohort with different circumstances enters the service. Policy changes: an eligibility rule shifts and the guidance no longer matches the form. Upstream systems change: a register the service reads starts returning a field differently. Volume changes: a seasonal peak pushes a queue past a threshold nobody set an alarm on. Each is invisible to a team that no longer exists, and each is obvious within a week to an owner watching a small number of measures. 

Here it was policy. A rule change had added a condition the form asked about in language taken from the legislation, and completion fell among exactly the people the change was meant to help. No release had broken anything. The service had simply stopped matching the world, which is the normal condition of any service nobody is holding.`,bullets:["A measure that drifts without a release means the world changed, not the code.","Users, policy, upstream systems and volume \u2014 the four things that move underneath a stable service.","The Beta-to-Live handover is where ownership is either named or lost; everything above follows from which one happened."],example:"The fix was a wording change and took a day. Finding it took four months, because there was no owner, no measure being watched, and no cadence at which anyone would have looked."}],questions:[{id:"lifecycle-q1",moduleId:"lifecycle",prompt:"What is the primary job of Alpha in the government service process?",options:["Operate the service indefinitely once it has gone live","Explore and test different ways to meet user needs","Freeze the requirements before the build starts","Complete procurement for the delivery partner"],answer:1,optionNotes:["That is Live.","","Freezing requirements is the opposite of what Alpha is for \u2014 it exists to find out which approach works.","Procurement may occur, but it is not the purpose of the phase."],rationale:"Alpha is for testing hypotheses and approaches before committing to the Beta service."},{id:"lifecycle-q2",moduleId:"lifecycle",prompt:"When should product discovery stop?",options:["It should continue as new evidence and needs emerge","At the end of the formal Discovery phase","When the business case has been approved and the funding released","At first release to the public"],answer:0,optionNotes:["","The phase is named Discovery; it is not the only place discovery happens.","Approval funds the work. It does not resolve the uncertainty in it.","First release is where the most valuable evidence starts arriving, not where enquiry ends."],rationale:"The intensity and the questions change, but continuous improvement requires ongoing discovery and measurement."},{id:"lifecycle-q3",moduleId:"lifecycle",prompt:"Which phase produces evidence about how the service behaves under real conditions with real users at scale?",options:["Alpha, using prototypes","Beta, with a live trial","None until after closure","Discovery, through research"],answer:1,optionNotes:["Alpha tests approaches with prototypes. Useful, but not under real operating conditions.","","Waiting until after closure means nobody is funded or accountable to act on what is found.","Discovery produces evidence about needs and constraints, before a service exists."],rationale:"Beta builds and trials an accessible, secure service with real users. It is the first point at which operational reality tests the design."},{id:"lifecycle-q4",moduleId:"lifecycle",prompt:"The deck describes the product lifecycle as 'a continuous loop, not a linear process'. What does that imply for measurement?",options:["Measurement should wait until the service is stable enough to give clean numbers","Measurement is a closure activity that confirms benefits were realised","Measurement feeds the next cycle of discovery and reprioritisation","Measurement is only required where a business case claimed a benefit"],answer:2,optionNotes:["Waiting for clean numbers usually means waiting past the point where the finding could have changed anything.","Measurement at closure informs a report. It cannot inform a decision, because the decisions are already made.","","Benefit claims set a floor for what must be measured, not a ceiling. Guardrails and user outcomes matter regardless."],rationale:"In a loop, measurement is an input to the next iteration: discover, define, deliver, measure, iterate. Treating it as a terminal reporting step breaks the loop."}],scenarios:[{id:"lifecycle-s1",moduleId:"lifecycle",context:"A service has moved to Live. The project team is disbanding and no owner has been assigned for performance, research or backlog decisions.",prompt:"What is the strongest response?",options:["Wait for user complaints to indicate where attention is needed after go-live","Produce a more thorough closure report for the board","Accept this \u2014 reaching Live means the work is finished","Assign ownership, measures and an improvement cadence before transition"],answer:3,optionNotes:["Complaints are a lagging, heavily filtered signal. Most users who fail simply stop.","A closure report documents the past. It assigns nobody to the future.","Live is the phase where the service meets the most users. Treating it as an endpoint is how accessibility and performance decay unnoticed.",""],rationale:"A live service needs durable ownership and feedback loops; otherwise value, accessibility and operational quality decay invisibly."},{id:"lifecycle-s2",moduleId:"lifecycle",context:"An Alpha tested three approaches. Two failed with users and one succeeded. The governance board asks the team to move all three into Beta so that no work is wasted.",prompt:"What should the product manager argue?",options:["Move the successful option across and archive the other two without any further discussion","Agree \u2014 the development effort is already sunk so it should be used","Alpha exists to eliminate approaches; carrying failures into Beta creates rework","Move all three across but resource the successful one more heavily"],answer:2,optionNotes:["The right decision, but taken silently. The board needs to see that Alpha worked \u2014 eliminating two options is a return on the investment, not a loss.","Sunk cost is the fallacy the phase gate exists to interrupt. The money is spent either way; the only question is what happens next.","","Splitting resource across approaches that failed with users spreads the same mistake across a larger budget."],rationale:"Alpha exists to narrow the option sp
