 success Deliver value to users and customers"},{n:77,stage:"roles",title:"Product Managers vs Product Owners",text:"Product Managers and Product Owners share a common objective but focus on different horizons. Product Managers Product Owners Vision Strategy Outcomes Roadmaps Stakeholder Alignment Backlog management Story refinement Acceptance criteria Sprint support Clarifying requirements"},{n:78,stage:"roles",title:"What does a Typical Sprint Look Like?",text:"Thursday Day 1 | Friday Day 2 | Monday Day 3 | Tuesday Day 4 | Wednesday Day 5 | Thursday Day 6 | Friday Day 7 | Monday Day 8 | Tuesday Day 9 | Wednesday Day 10 Sprint Planning (Scrum of Scrums) | Stand Up | Stand Up (Scrum of Scrums) Refinement #1 | Stand Up | Stand Up Product Sync | Stand Up Refinement #2 | Stand Up | Stand Up (Scrum of Scrums) | Stand Up (Sprint Showcase) Review + Retro Thursday Day 1 | Friday Day 2 | Monday Day 3 | Tuesday Day 4 | Wednesday Day 5 | Thursday Day 6 | Friday Day 7 | Monday Day 8 | Tuesday Day 9 | Wednesday Day 10 Priority workshop | Roadmap updates | Testing prep | Testing Tuesday | Backlog refinement | Product Sync | Golf | Research prep | User Interviews | Backlog refinement Product Manager Product Owner Are we working on the right things? Do teams have everything they need to deliver successfully?"},{n:79,stage:"roles",title:"Other Key Roles",text:"Senior Supplier Delivery Manager Architects Scrum Master Senior Responsible Officer Designers BAs / Devs / Testers"},{n:80,stage:"roles",title:"The Product Trio",text:"Product Manager (Viable) Technology Lead (Feasible) Designer (Desirable)"},{n:81,stage:"roles",title:"Product Trios at Multiple Levels",text:"Design Product Strategy Coordination Delivery Technology Design Product Technology Design Product Technology"},{n:82,stage:"roles",title:"Tactical Team",text:"Refinement Spring Planning Story Development Quality Assurance User validation Sprint Showcases \u201CHow do we successfully deliver this work?\u201D"},{n:83,stage:"roles",title:"Solution / Coordination Team",text:"Roadmaps Feature prioritisation Dependency management Exploring solution options Product-level outcomes Cross-team coordination \u201CWhat should we deliver next?\u201D"},{n:84,stage:"roles",title:"Strategic Team",text:"Service Strategy Cross-product experience Future service design Long term tech direction Emerging user needs Organisational outcomes \u201CWhat future are we trying to create?\u201D"},{n:85,stage:"roles",title:"How the layers work together",text:"Design Product Strategy Coordination Delivery Responsible for Responsible for Responsible for Direction, user needs and service outcomes Translate strategy into roadmaps, priorities and features Design, build, test and release solutions Why What When How How much Technology Design Product Technology Design Product Technology"},{n:86,stage:"government",title:"DES Context",text:"How these concepts apply in the DES landscape"},{n:87,stage:"government",title:"WoW Foundations",text:"Our Ways of Working has several core elements. We are accountable and take ownership for solving issues Behaviours We empower our people We connect and work across boundaries We do the basics brilliantly We put user needs at the centre We are innovative and contemporary Digital Delivery Framework Methods Our Digital Delivery Framework is an end-to-end, repeatable delivery pipeline. It ensures consistent delivery practices and the best outcomes for customers and clients. The following principles underpin the framework: Have a plan, but adjust as you go Set clear governance and a shared purpose Be disciplined and transparent Collaboration underpins success We apply industry best practices and whole of government endorsed methods, including: Design Thinking: central to the DES delivery framework. It ensures solutions are built around real user needs, driving higher adoption, satisfaction, and business value. Project Management: Delivery enabled through defined scope, structured planning, risk management, and disciplined tracking against milestones tied to business outcomes. Agile: Adaptability and rapid delivery of project outcomes through iterative development and continuous feedback. Lean: Lean thinking emphasises identifying value, minimising waste, optimising delivery and continually improving."},{n:88,stage:"government",title:"PRINCIPLES IN PRACTICE",text:"1. Start with the problem, not the solution We seek to understand user needs, policy intent and root causes before committing to solutions. 2. Validate before you scale 3. Deliver value early and often 4. Decisions belong closest to the problem. We reduce risk through prototypes, testing and incremental releases. We prefer incremental delivery of valuable outcomes over large, infrequent releases. People with the greatest understanding of users and delivery realities should make day-to-day decisions. Implications Discovery comes before design Evidence outweighs assumptions Costing follows understanding Implications MVP before full solution Alpha before large scale investment Feeback before broad rollout Implications Smaller releases Faster feedback Reduced delivery risk Implications Empowered teams Reduced governance bottlenecks Faster decision making"},{n:89,stage:"government",title:"PRINCIPLES IN PRACTICE",text:"5. Focus on outcomes, not outputs We measure success by the value we create, not the volume of work we complete. 6. Design for the whole service 7. Learn continuously We optimise for the end-to-end service experience rather than individual systems, projects or organisational silos. Discovery, validation and improvement continue throughout the life of a service. Implications Outcomes over features Benefits over deliverables Value over activity Implications Whole of service thinking Reuse before rebuild Better user experience Implications Continuous Discovery Continuous Alpha Ongoing measurement and improvement"},{n:90,stage:"government",title:"Our Agreed Delivery Phases",text:"DES have an agreed end-to-end delivery pipeline for all projects. This pipeline is divided into 4 key phases: Pre-Approval, Pre-Delivery, Delivery and Closure. At a high level, these phases are described below: Phase Objective | Work with business areas and technical SMEs to understand the problem, create high-level vision and refine the funding request (NPP, DCB etc.). | Refine the problem and create a suite of experience, architecture and planning artefacts that confirm the target state of the project. | Teams work agreed timeboxes and deliver demonstratable increments of the agreed solution, through design/build/test/refine practices. | Business take ownership of the delivered product as the project closes and the service transitions to BAU. Focus What this provides: Applying these phases consistently across the Division will ensure: Projects are well planned with the right amount of detail Teams have a clear runway to maximise delivery output There is a shared view of success across all interested / impacted stakeholders Stage gates between the phases builds in quality and predictability PRE-APPROVAL PRE-DELIVERY DELIVERY CLOSURE"},{n:91,stage:"government",title:"Mapping to DES Project Phases",text:"PRE APPROVAL PRE DELIVERY DELIVERY"},{n:92,stage:"government",title:"Team Structures",text:"To deliver modern digital solutions, we need a structure that brings product, design and technology partners into the delivery process. Senior Responsible Officer Senior Supplier Lead Delivery Manager Product Manager Project Board Strategy Solution Delivery UX Lead Product Owner Solution Architect Scrum Master Dev Tester Responsible for Responsible for Responsible for Owning the project outcomes, delivery roadmap and championing the change. Building, curating and prioritising a backlog of refined and validated work. Making working increments to that product that solve customer needs. BA What Why When How How much"},{n:93,stage:"integration",title:"Closing",text:""},{n:94,stage:"integration",title:"Bringing It All Together",text:"What problem are we solving? What outcome are we trying to create? What evidence do we have? What have we learned?"},{n:95,stage:"integration",title:"What good looks like",text:"Outcome focused User Centred Evidence based Collaborative Adaptive Value driven"},{n:96,stage:"integration",title:"Reflection and Next Steps",text:"What problem are you solving? Is it actually the right one? How are you measuring success? What assumptions need validation? What feedback loops exist? How will you know you've delivered value?"},{n:97,stage:"integration",title:"Recommended reading",text:"Martin Eriksson \u2013 Foundational Product Management concepts and product leadership Marty Cagan - Empowered teams, product operating models and modern Product Management practices Teresa Torres \u2013 Continuous Discovery and research-driven Product Management Melissa Perri \u2013 Product Strategy and organisational alignment Roman Pichler \u2013 Product leadership, roadmaps and strategic Product Management"},{n:98,stage:"integration",title:"",text:""}];var Sn="pm-fundamentals",Vp={manifest:{id:Sn,title:"Product Management Fundamentals",subtitle:"Product management for Australian Government service delivery",publisher:"DEWR Digital Experience and Solutions",source:"Product Management Fundamentals \u2014 12AUG2026",reviewed:de,status:"available",summary:"Nine stages from user need to measured value, built from the departmental deck and turned into something you practise rather than sit through."},modules:U,sources:Na,totalMinutes:lo,slideCount:98},Xo=[Vp];function Uv(e){return Xo.find(t=>t.manifest.id===e)}function Gp(e){return Uv(e)??Vp}function _p(e){let t=e.modules.reduce((a,o)=>a+o.questions.length+o.scenarios.length,0)+io.length+Aa.length;return{stages:e.modules.length,questions:t,cards:We.length,slides:e.slideCount,minutes:e.totalMinutes}}var zd="module/",Ud="module:",Hv=["library","dashboard","path","diagnostic","review","practice","result
