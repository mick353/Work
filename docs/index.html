ing to create?","What should we deliver next?","How do we successfully deliver this work?","Who approves the business case?"],answer:1,optionNotes:["That is the strategic layer.","","That is the tactical / delivery layer.","Approval sits with governance and is not one of the three layer questions."],rationale:"The coordination layer translates strategy into roadmaps, priorities and features \u2014 it owns the what and the when, between the strategic why and the delivery how."},{id:"roles-q4",moduleId:"roles",prompt:"In the deck's structure, who owns the project outcomes and champions the change?",options:["The Senior Responsible Officer","The Lead Delivery Manager","The Product Manager","The Scrum Master"],answer:0,optionNotes:["","The Lead Delivery Manager owns delivery across teams, not the project outcomes themselves.","The product manager owns product outcomes, priorities and direction \u2014 which is related but narrower, and sits below the SRO in the governance structure.","The Scrum Master owns team process and impediment removal within a delivery team."],rationale:"The SRO owns the project outcomes, the delivery roadmap and championing the change. Knowing this matters because product decisions that alter the outcome need the SRO, not just the board."}],scenarios:[{id:"roles-s1",moduleId:"roles",context:"Designers research users, analysts write requirements and developers receive work months later. Each group says the others missed critical context.",prompt:"What structural change is most useful?",options:["Add a more thorough hand-over document","Create shared cross-functional discovery and refinement with clear decision rights","Remove the user research step to shorten the chain","Let each function maintain its own roadmap"],answer:1,optionNotes:["Better documentation reduces loss at a hand-off. It does not remove the hand-off, which is where the context is lost.","","The chain would be shorter and the output worse. Research is not the bottleneck; sequencing is.","Three roadmaps is three strategies. This formalises the disagreement instead of resolving it."],rationale:"Shared work reduces information loss and lets design, product and technology shape viable options together."},{id:"roles-s2",moduleId:"roles",context:"Your Product Owner is spending most of each sprint relaying questions between the delivery team and three business areas, and has no time for refinement. The backlog is filling with unrefined items and the team is starting sprints with unclear acceptance criteria.",prompt:"What is the underlying problem?",options:["The Product Owner needs better time management","The delivery team should be asking fewer questions","The Product Owner has become a requirements courier, and decision rights have not been agreed with the business areas","The role should be merged into the product manager position"],answer:2,optionNotes:["Treating a structural problem as a personal one guarantees it recurs with the next person in the seat.","The questions are legitimate. They arise because nobody has been given authority to answer them.","","Merging the roles increases the load on one person without resolving where the answers are supposed to come from."],rationale:"The deck warns specifically against the Product Owner becoming a requirements courier. The fix is agreeing who can decide what \u2014 reversible and local decisions to the team, business rules with named owners and agreed response times."}],assignment:{title:"Clarify decision rights",instruction:"Choose one recurring product decision and make the accountability explicit.",prompts:["Who owns the decision?","Whose evidence or expertise must shape it?","What threshold requires escalation, and what should remain with the team?","Which layer does this decision actually belong to \u2014 strategic, coordination or delivery \u2014 and where is it being made now?"]}},{id:"government",number:8,title:"Product practice in government",subtitle:"Work with policy, assurance and delivery constraints without losing the outcome",minutes:65,slides:"86\u201392",outcome:"Apply product principles inside DES ways of working and delivery phases, use the current Digital Service Standard accurately, distinguish it from internal governance, and protect inclusion, accessibility, security and service continuity.",coreIdea:"Government product practice combines user-centred evidence with public value, policy intent, stewardship, assurance and whole-of-service responsibility.",sections:[{heading:"Constraints are design inputs",body:"Policy intent, legislation, privacy, security, accessibility, records, procurement, funding and legacy systems shape the feasible solution space. Surface them early in discovery so they inform options rather than arriving as late-stage blockers.",bullets:["A policy requirement is not automatically a user need.","Compliance says what must be true; design still determines how people experience it.","Whole-of-service outcomes include assisted and non-digital channels."],sourceIds:["deck","dss"]},{heading:"Ways of Working: behaviours and framework",body:"DES ways of working has two core elements. The behaviours describe how people are expected to operate; the Digital Delivery Framework is the end-to-end, repeatable delivery pipeline that ensures consistent practice.",bullets:["We put user needs at the centre.","We are accountable and take ownership for solving issues.","We empower our people.","We connect and work across boundaries.","We do the basics brilliantly.","We are innovative and contemporary."],sourceIds:["deck"]},{heading:"The seven principles in practice",body:"These are the division's stated operating principles. Each one has an implication that changes what a product manager actually does \u2014 which is why they are worth knowing by number, not just by sentiment.",table:{caption:"Slides 88\u201389 \u2014 principles and their implications",head:["#","Principle","What it means in practice"],rows:[["1","Start with the problem, not the solution","Understand user needs, policy intent and root causes before committing to solutions. Discovery comes before build."],["2","Validate before you scale","Reduce risk through prototypes, testing and incremental releases rather than a single large commitment."],["3","Deliver value early and often","Prefer incremental delivery of valuable outcomes over large, infrequent releases."],["4","Decisions belong closest to the problem","People with the greatest understanding of users and delivery realities make day-to-day decisions."],["5","Focus on outcomes, not outputs","Measure success by value created, not volume of work completed. Outcomes over features, benefits over deliverables, value over activity."],["6","Design for the whole service","Optimise the end-to-end experience rather than individual systems, projects or organisational silos. Reuse before rebuild."],["7","Learn continuously","Discovery, validation and improvement continue throughout the life of a service."]]},sourceIds:["deck"]},{heading:"The four DES delivery phases",body:"DES has an agreed end-to-end delivery pipeline for all projects, divided into four phases with stage gates between them. This is the pipeline your work actually sits inside, and it is distinct from both the DTA service phases and the Digital Service Standard.",table:{caption:"Slides 90\u201391 \u2014 the DES pipeline",head:["Phase","Focus","Product management contribution"],rows:[["Pre-Approval","Establishing the case for investment","Problem definition, user evidence, outcome hypotheses, options and their risks"],["Pre-Delivery","Planning with the right amount of detail; establishing the runway","Refined backlog, validated approach, measures and baselines defined before build"],["Delivery","Building and releasing increments","Ordering the backlog, protecting the outcome, running discovery an increment ahead"],["Closure","Transitioning and completing the project","Handing over enduring ownership, measures and improvement cadence \u2014 not just documentation"]]},bullets:["The stated purpose: projects are well planned with the right amount of detail, teams have a clear runway, there is a shared view of success, and stage gates build in quality and predictability.","The product risk sits at Closure \u2014 a project closes, but the product does not.","Do not confuse these four phases with the DTA's Discovery/Alpha/Beta/Live, or with the Digital Service Standard. They are three different things that coexist."],sourceIds:["deck"]},{heading:"Use the current Digital Service Standard accurately",body:"Version 2.0 has 10 criteria, reduced from the former 13, and forms part of the Digital Experience Policy. It expects agile, user-centred work and consideration of the criteria across the service lifecycle. It is now fully in effect: it applied to new and redeveloped services from 1 July 2024, and to public-facing services that already existed before that date from 1 July 2025.",bullets:["The standard covers accessibility, inclusion, security, trust, adaptability and measurement.","Internal DES delivery phases can coexist with this external standard but should not be mistaken for it.","Governance evidence should demonstrate how the criteria are being met, not merely that a template was completed.","Staff-facing internal services sit outside the Phase 2 scope; check current DTA guidance before assuming applicability."],sourceIds:["dss","dsspdf"]},{heading:"Make governance a learning and risk conversation",body:"Strong gates examine evidence, unresolved risk, outcome confidence and readiness for the next investment \u2014 not only schedule and document completion. Product evidence can strengthen business cases and assurance decisions rather than competing with them.",bullets:["Show what was learned and what changed as a result.","Make residual assumptions and guardrails visible.","Preserve a clear owner for benefits and service performance after project closure.","A gate that only checks artefact completeness will approve a well-documented failure."],sourceIds:["deck","dss"]}],questions:[{id:"government-q1",moduleId:"government",prompt:"Which statement about the Digital Service Standard Version 2.0 is correct?",options:["It replaces internal departmental governance","It contains 13 criteria","It applies only during the Alpha phase","It contains 10 criteria and should be considered across the service lifecycle"],answer:3,optionNotes:["It sits alongside internal governance. Both apply, and confusing them is a common source of duplicated or missed evidence.","Thirteen was the former standard. Version 2.0 reduced it to 10.","It is explicitly lifecycle-wide. Treating it as a single-phase checkpoint is the failure it was revised to prevent.",""],rationale:"Version 2.0 reduced the former 13 criteria to 10 and explicitly encourages lifecycle-wide application."},{id:"government-q2",moduleId:"government",prompt:"How should policy constraints enter product work?",options:["They should be set aside during design and applied afterwards","Only at final assurance","As early discovery inputs that shape options and evidence","As user needs, since they define what the service must do"],answer:2,optionNotes:["Designing without constraints produces options that cannot be built, and wastes the design effort.","Late arrival is what turns a constraint into a blocker and forces rework.","","A policy requirement is not automatically a user need. Conflating them means never noticing when policy is creating the difficulty."],rationale:"Early involvement helps the team design within the real service and legal context and prevents late rework."},{id:"government-q3",moduleId:"government",prompt:"Which are the four DES delivery phases, in order?",options:["Initiation, Planning, Execution, Benefits Realisation","Problem, Options, Build, Measure","Discovery, Alpha, Beta, Live","Pre-Approval, Pre-Delivery, Delivery, Closure"],answer:3,optionNotes:["Generic project phasing, not the DES pipeline.","This resembles the product lifecycle loop rather than the delivery pipeline.","That is the DTA service design and delivery process \u2014 a different framework that coexists with the DES pipeline.",""],rationale:"DES divides its end-to-end pipeline into Pre-Approval, Pre-Delivery, Delivery and Closure, with stage gates between them. Keep it distinct from the DTA phases and from the Digital Service Standard."},{id:"government-q4",moduleId:"government",prompt:"Principle 6 is 'design for the whole service'. Which decision best reflects it?",options:["Considering the phone, paper and assisted channels alongside the digital journey, and reusing an existing capability rather than rebuilding","Delivering the digital service first and addressing other channels in a later project","Standardising the interface across all departmental systems","Optimising the online form's completion rate as the primary measure"],answer:0,optionNotes:["","Deferring other channels to a later project is how end-to-end problems become permanent, since the later project is rarely funded.","Interface consistency is a usability concern. Whole-of-service is about the end-to-end journey across channels and systems.","A single-channel measure can improve while the overall service worsens \u2014 for example by pushing failures to the phone queue."],rationale:"The principle optimises the end-to-end service experience rather than individual systems, projects or silos \u2014 and its stated implications include whole-of-service thinking and reuse before rebuild."},{id:"government-q5",moduleId:"government",prompt:"Which product-management risk is concentrated in the Closure phase?",options:["The backlog becomes too detailed","The project closes without enduring ownership of the product's performance and improvement","Stakeholders lose interest in the roadmap","The team over-invests in discovery"],answer:1,optionNotes:["Backlog detail is a Pre-Delivery and Delivery concern.","","Attention does fade, but the structural risk is that nobody is accountable, not that nobody is interested.","Over-investment in discovery is a Pre-Approval or Pre-Delivery risk, if it is one at all."],rationale:"A project closes; the product does not. Closure must hand over ownership, measures and an improvement cadence, or the service degrades with nobody accountable for noticing."}],scenarios:[{id:"government-s1",moduleId:"government",context:"The project has completed its templates, but research found a major accessibility barrier and the benefits measures have no baseline.",prompt:"What should the team present at the gate?",options:["Present the evidence, remediation plan, missing baseline and impact on readiness before seeking the next investment","Reclassify accessibility as a future enhancement","Proceed on the basis that documentation is complete","Defer the accessibility issue to Beta and proceed"],answer:0,optionNotes:["","Accessibility is a legal and standard obligation and part of service quality. It cannot be reclassified as optional polish.","This is precisely the failure mode the stage exists to describe: a gate that checks artefacts approves a well-documented failure.","Deferral without a plan is the same decision as ignoring it, taken with better manners."],rationale:"Assurance should use evidence to make an informed risk and investment decision; accessibility is part of service quality, not optional polish. A missing baseline also means benefits cannot later be demonstrated."},{id:"government-s2",moduleId:"government",context:"A policy area asks you to add a mandatory declaration screen. Research shows most users cannot tell what they are declaring, and the assisted channel already handles the same declaration verbally with a plain-language script.",prompt:"What is the strongest product response?",options:["Decline, since research shows users do not understand it","Meet the policy intent, but design the interaction using the evidence and the existing plain-language script, and measure comprehension","Escalate to the Project Board for a decision","Implement the screen as specified \u2014 the requirement is mandatory"],answer:1,optionNotes:["The obligation is real and cannot be declined. The question is how it is met, not whether.","","Board time is for material risk and investment. This is a design decision that belongs with the team and the policy owner.","Compliance says what must be true; it rarely dictates the interaction. Implementing the specification literally satisfies the letter and fails the intent."],rationale:"A policy requirement is not automatically a user need, but nor is it optional. Compliance defines what must be true; design determines how people experience it \u2014 and the assisted channel has already solved the comprehension problem."}],assignment:{title:"Prepare an evidence-based gate brief",instruction:"Frame a decision for governance in one page.",prompts:["What outcome and public value justify the work?","What evidence supports the proposed direction and what remains uncertain?","What risks, standards, guardrails and ownership conditions must be satisfied before proceeding?","Which DES phase gate is this, and what specifically must be true to pass it?"]}},{id:"integration",number:9,title:"Integration and capstone",subtitle:"Run the whole chain from need to measured value",minutes:60,slides:"93\u201398",outcome:"Integrate the course into a defensible product approach and explain the reasoning to users, delivery partners, stakeholders and governance.",coreIdea:"Product management is a connected chain of decisions: need \u2192 problem \u2192 outcome \u2192 options \u2192 evidence \u2192 ordered delivery \u2192 measurement \u2192 learning.",sections:[{heading:"Maintain the chain of evidence",body:"Every major item should trace backward to an outcome and forward to a way of learning. If a feature cannot be connected to a user or service problem, an intended result and a measure, its priority is unclear. The deck's closing questions are the shortest version of this test: what problem are we solving, what outcome are we trying to create, what evidence do we have, and what have we learned?",sourceIds:["deck","svpg"]},{heading:"What good looks like",body:"The deck names six qualities. They are worth treating as a checklist for your own work rather than as a poster: outcome focused, user centred, evidence based, collaborative, adaptive, value driven.",bullets:["Outcome focused: success is a measured change, not a delivered artefact.","User centred: decisions are grounded in what users actually do.","Evidence based: claims are traceable to something observed.","Collaborative: product, design and technology shape options together.","Adaptive: the plan changes when the evidence does.","Value driven: work that does not move a result needs a different justification."],sourceIds:["deck"]},{heading:"Tell the product story at three levels",body:"Executives need the outcome, evidence, investment and risk. Delivery teams need the problem context, goal, guardrails and near-term decisions. Users and operational partners need clear changes, support and feedback paths.",bullets:["Keep one truth; adjust the depth, not the facts.","Explain trade-offs and confidence honestly.","Separate evidence, assumption and decision in the way you speak."],sourceIds:["deck"]},{heading:"Reflection becomes practice",body:"Mastery comes from repeatedly making and explaining product decisions. The capstone uses the provider application-status case that runs through the source deck so you can practise the complete method, self-assess against a rubric, and export a reusable product brief.",bullets:["The deck's reflection questions: what problem are you solving and is it the right one? How are you measuring success? What assumptions need validation? What feedback loops exist? How will you know you have delivered value?","Retrieval and spacing are why this system makes you recall before it lets you reread."],sourceIds:["deck","retrieval","spacing","techniques"]}],questions:[{id:"integration-q1",moduleId:"integration",prompt:"Which chain best represents product reasoning?",options:["Workshop \u2192 roadmap \u2192 backlog","Feature \u2192 deadline \u2192 launch","Need \u2192 problem \u2192 outcome \u2192 options \u2192 evidence \u2192 delivery \u2192 measurement \u2192 learning","Budget \u2192 requirements \u2192 closure"],answer:2,optionNotes:["Each of these is a real artefact, but the chain has no problem at the front and no measurement at the end.","This is delivery without a rationale. It can be executed perfectly and still change nothing.","","This is a funding and assurance sequence. It manages the project, not the product."],rationale:"The full chain preserves the relationship between evidence, decisions, delivery and achieved value."},{id:"integration-q2",moduleId:"integration",prompt:"What should change when presenting the product story to different audiences?",options:["The stated outcome","The underlying facts","The evidence cited","The level of detail and framing"],answer:3,optionNotes:["If the outcome changes by audience, there is no shared understanding of what the work is for.","Changing the facts by audience is how organisations end up with three incompatible versions of the same project.","The evidence should be consistent; how much of it you present can vary.",""],rationale:"Different audiences need different depth, but the decision, evidence and outcome should remain consistent."},{id:"integration-q3",moduleId:"integration",prompt:"A stakeholder asks why a highly requested feature is not on the roadmap. What is the strongest form of answer?",options:["It was not in the approved scope","It did not score highly enough in prioritisation","The outcome it would serve is already better addressed by work in flight, and here is the evidence and the measure that would change that judgement","The team does not have capacity this year"],answer:2,optionNotes:["Scope is a procedural answer to a value question. It also implies nothing can ever change, which is untrue.","A score is the output of a judgement, not the justification for it. It invites an argument about the scoring instead of the substance.","","Capacity is true but incomplete. It implies the item would be next if resources appeared, which may not be the case."],rationale:"Traceability is what makes a prioritisation decision defensible. Naming the outcome, the evidence and the condition under which you would change your mind turns a refusal into a shared model."},{id:"integration-q4",moduleId:"integration",prompt:"Which of the deck's six 'what good looks like' qualities is most directly at risk when a team keeps a dated plan after the evidence has changed?",options:["Value driven","User centred","Collaborative","Adaptive"],answer:3,optionNotes:["Value drive is about justifying work by results. Related, but the direct failure here is the refusal to change.","User-centredness is about grounding decisions in user evidence. It may also suffer, but it is not what a frozen plan primarily violates.","Collaboration concerns how options are shaped, not how plans respond to evidence.",""],rationale:"Adaptive means the plan changes when the evidence does. Holding a dated plan to protect stakeholder confidence is the specific failure this quality names."}],scenarios:[{id:"integration-s1",moduleId:"integration",context:"A pilot improves self-service overall, but increases unsuccessful attempts among users relying on assistive technology.",prompt:"Which response demonstrates the strongest product judgement?",options:["Treat the accessibility result as a critical guardrail failure, investigate the cause and adapt before scaling","Report the aggregate figure and address the detail in a later release","Declare success because the average improved","Cancel the product permanently"],answer:0,optionNotes:["","Reporting the aggregate while knowing the disaggregated result is misleading by omission, and it scales the harm in the meantime.","An average can improve while a specific group is actively harmed. This is exactly what guardrails exist to surface.","The evidence supports adaptation, not abandonment. Most of the intervention is working."],rationale:"Outcomes must not hide distributional harm. The evidence should change the scaling decision and the next experiment."},{id:"integration-s2",moduleId:"integration",context:"You have ten minutes with the SRO before a board meeting. Delivery is on schedule, but discovery has shown the primary outcome measure will probably not move because the root cause sits in a policy process outside your control.",prompt:"What do you lead with?",options:["Delivery status, since that is what the board reports on","The outcome risk, the evidence behind it, and the decision you need \u2014 with the schedule position as context","A request to change the outcome measure to one the project can influence","Nothing yet \u2014 wait until the measurement confirms it after release"],answer:1,optionNotes:["Leading with green delivery status when you know the outcome is at risk trains the board to trust a signal that is not measuring the thing that matters.","","Changing the measure to one you can move is how a project reports success while the problem persists. It also destroys the baseline.","Waiting until after release means raising it when the decision can no longer be influenced and the cost is sunk."],rationale:"Executives need outcome, evidence, investment and risk. The chain of evidence is only useful if you are willing to report the link that is breaking \u2014 and the SRO owns the project outcomes, so this is precisely their decision."}],assignment:{title:"Complete the capstone brief",instruction:"Use the dedicated Capstone workspace to produce an end-to-end product approach for the provider application-status case.",prompts:["Can every proposed action trace to evidence and an outcome?","Are the riskiest assumptions explicit and testable?","Would a delivery team and a governance board understand what happens next and why?","Which of the deck's six qualities is weakest in your brief, and what would fix it?"]}}],Wn=Q.flatMap(e=>[...e.questions,...e.scenarios.map(t=>({id:t.id,moduleId:t.moduleId,prompt:t.prompt,options:t.options,answer:t.answer,rationale:t.rationale,optionNotes:t.optionNotes,context:t.context}))]),gl=Q.reduce((e,t)=>e+t.minutes,0),ay=Wn.length;function ja(e){return Q.find(t=>t.id===e)}function hf(e){return Un.find(t=>t.id===e)}var gf={definition:"Definition",application:"Application",discrimination:"Tell apart"},Gt=[{id:"f01",moduleId:"thinking",kind:"definition",front:"Product",back:"An enduring vehicle for delivering value to identifiable users, with ongoing ownership and improvement. It may be software, a policy, operational procedures, or a combination."},{id:"f02",moduleId:"thinking",kind:"definition",front:"Project",back:"A temporary structure for coordinating investment and delivery toward a defined change."},{id:"f03",moduleId:"thinking",kind:"definition",front:"Product vision",back:"A description of the future state the product or service is trying to create."},{id:"f04",moduleId:"thinking",kind:"definition",front:"Product strategy",back:"The focused choices about which critical problems to solve to progress toward the vision \u2014 including what not to pursue."},{id:"f05",moduleId:"thinking",kind:"discrimination",front:"Vision or strategy: 'Reduce administrative effort, increase self-service, improve transparency'",back:"Strategy. It names directions of travel and implies trade-offs. The vision is the destination \u2014 'a simpler, faster and more transparent experience for employers and providers'."},{id:"f06",moduleId:"thinking",kind:"application",front:"A sponsor says the fixed date means there is no time for discovery. What is the product move?",back:"Bounded discovery on the riskiest assumption inside the approved constraints. Product management is not all or nothing \u2014 some discovery beats none."},{id:"f07",moduleId:"thinking",kind:"definition",front:"The four shift-in-thinking pairs",back:"Projects \u2192 products. Outputs \u2192 outcomes. Requirements \u2192 problems. Delivery \u2192 learning."},{id:"f08",moduleId:"discovery",kind:"definition",front:"Discovery",back:"Work that reduces uncertainty about users, problems, opportunities and solution risks before and during delivery."},{id:"f09",moduleId:"discovery",kind:"definition",front:"Persona",back:"A research-grounded synthesis of user goals, needs, behaviours, motivations, challenges and context \u2014 not a demographic stereotype."},{id:"f10",moduleId:"discovery",kind:"definition",front:"Service blueprint",back:"A view connecting user actions and front-stage interactions to back-stage activities, supporting systems and processes."},{id:"f11",moduleId:"discovery",kind:"definition",front:"Created need",back:"Something users are forced to do because of policy or the way government works \u2014 a need manufactured by the system, not held by the user."},{id:"f12",moduleId:"discovery",kind:"discrimination",front:"Stated, unstated or created: 'I need the reconciliation spreadsheet emailed each Monday' \u2014 the spreadsheet exists only because two systems don't integrate",back:"Stated and created. Explicitly asked for, but the need exists only as a workaround. Automating it would entrench the workaround instead of removing it."},{id:"f13",moduleId:"discovery",kind:"definition",front:"Hypothesis",back:"A testable statement linking a proposed action for a group to an expected outcome and observable evidence \u2014 including what would show it false."},{id:"f14",moduleId:"discovery",kind:"application",front:"Discovery has produced a 60-page report recommending a mobile app. What are the two failures?",back:"The recommendation is not traceable to the evidence, and discovery has crossed into prescribing a solution. Discovery produces insight and hypotheses, not requirements or features."},{id:"f15",moduleId:"discovery",kind:"definition",front:"Lean Canvas riskiest assumption",back:"For each hypothesis, the claim that \u2014 if wrong \u2014 makes the whole thing fail. It is what you test first."},{id:"f16",moduleId:"discovery",kind:"discrimination",front:"Journey map or service blueprint?",back:"Journey map: the user's experience over time \u2014 goals, activities, touchpoints, emotions, pain points. Blueprint: what happens behind the scenes to produce that experience."},{id:"f17",moduleId:"outcomes",kind:"definition",front:"Output",back:"The thing produced or delivered \u2014 a feature, form, policy or release. The what."},{id:"f18",moduleId:"outcomes",kind:"definition",front:"Outcome",back:"A meaningful change in behaviour, performance, experience, risk or value resulting from the work. The why."},{id:"f19",moduleId:"outcomes",kind:"definition",front:"Leading indicator",back:"A predictive measure of future performance \u2014 for example feature usage or completion rate. It must itself be validated."},{id:"f20",moduleId:"outcomes",kind:"definition",front:"Lagging indicator",back:"A measure of past performance \u2014 for example customer satisfaction or outcome achieved."},{id:"f21",moduleId:"outcomes",kind:"definition",front:"Guardrail measure",back:"A measure that detects unacceptable harm, trade-offs or displacement while pursuing the primary outcome."},{id:"f22",moduleId:"outcomes",kind:"definition",front:"OKR grading scale",back:"4 exceeded expected results; 3 sufficient achievement; 2 made progress but fell short; 1 no progress."},{id:"f23",moduleId:"outcomes",kind:"application",front:"Calls fell 34% \u2014 but only because status enquiries were routed to a four-day callback queue. What happened?",back:"Displacement, not resolution. The measure moved without the outcome changing. A guardrail on time-to-resolution would have caught it."},{id:"f24",moduleId:"outcomes",kind:"discrimination",front:"Key result or action: 'Run five user interviews'",back:"Action. A key result is a measurable change with baseline, target and timeframe \u2014 'reduce median completion time from 18 to 12 minutes by June'."},{id:"f25",moduleId:"outcomes",kind:"definition",front:"The five kinds of good outcome",back:"User value; operational efficiency; financial impact; risk reduction; learning and reduced uncertainty."},{id:"f26",moduleId:"exploration",kind:"definition",front:"Desirability / value risk",back:"Whether the problem matters and people will choose or benefit from the proposed response."},{id:"f27",moduleId:"exploration",kind:"definition",front:"Feasibility risk",back:"Whether the team can build and operate the solution with available technology, data, skills and time."},{id:"f28",moduleId:"exploration",kind:"definition",front:"Viability risk",back:"Whether policy, operational, legal, financial and organisational conditions can sustain the solution."},{id:"f29",moduleId:"exploration",kind:"definition",front:"MVP",back:"The smallest coherent thing that delivers value and generates learning. Focused, intentional, uncertainty-reducing \u2014 not poor quality and not unfinished."},{id:"f30",moduleId:"exploration",kind:"discrimination",front:"Trade-off pair: affordable to run and technically sound, but no validated user problem",back:"Feasible + Viable = operable and sustainable. The risk is that it does not solve a genuine user problem."},{id:"f31",moduleId:"exploration",kind:"discrimination",front:"Trade-off pair: users need it and policy supports it, but it needs real-time data from batch systems",back:"Desirable + Viable = valuable and needed. The risk is that it is not technically achievable in the current landscape. You owe a feasibility spike."},{id:"f32",moduleId:"exploration",kind:"application",front:"Which method tests whether people can complete a task, versus whether an integration will hold?",back:"Prototype and usability testing for comprehension and usability; a technical spike against representative interfaces and data for feasibility."},{id:"f33",moduleId:"exploration",kind:"application",front:"When is an A/B test the right method?",back:"When you need to compare the effect of variants on a measure, at sufficient scale, with a working build. It shows difference, never explanation."},{id:"f34",moduleId:"delivery",kind:"definition",front:"Product Goal",back:"The long-term objective for the Scrum Team and the target against which the Product Backlog emerges."},{id:"f35",moduleId:"delivery",kind:"definition",front:"Product Backlog",back:"An emergent, ordered list of what is needed to improve the product; the Scrum Team's single source of work. Anyone may add; product management orders."},{id:"f36",moduleId:"delivery",kind:"definition",front:"Sprint",back:"Two weeks (10 working days) in the DES cadence, delivering small increments of releasable value."},{id:"f37",moduleId:"delivery",kind:"definition",front:"Program Increment (PI)",back:"Ten weeks (50 working days) in the DES cadence, delivering key business outcomes. Five sprints fit inside one."},{id:"f38",moduleId:"delivery",kind:"definition",front:"Epic",back:"A measurable business outcome spanning many PIs and teams. Maps to business-case benefits and blueprint pain points. Carries a hypothesis, description, outcomes/benefits and objective."},{id:"f39",moduleId:"delivery",kind:"definition",front:"Feature \u2014 minimum detail",back:"Hypothesis; sizing estimate; acceptance criteria; in/out of scope; feature measurement; risks, issues and dependencies. Demonstrable within a PI."},{id:"f40",moduleId:"delivery",kind:"definition",front:"Story \u2014 minimum detail",back:"As a [persona] I want [goal] so that [reason]; story points; area path; iteration path aligned to the expected sprint."},{id:"f41",moduleId:"delivery",kind:"definition",front:"WSJF",back:"Relative cost of delay \xF7 relative job duration or size. Cost of delay combines user/business value, time criticality, and risk reduction or opportunity enablement."},{id:"f42",moduleId:"delivery",kind:"discrimination",front:"Which of epic, feature, story and Program Increment are Scrum terms?",back:"None of them. Scrum defines the Product Goal, Product Backlog, Sprint Backlog and Increment. The rest come from scaled frameworks and local DES practice."},{id:"f43",moduleId:"delivery",kind:"application",front:"While delivery teams build PI N, what is product management doing?",back:"Discovery and solution exploration for PI N+1, so refined validated features are ready when the next increment starts."},{id:"f44",moduleId:"delivery",kind:"definition",front:"Outcome roadmap",back:"Now / Next / Later bands carrying objectives and key results, communicating direction at a confidence the evidence supports."},{id:"f45",moduleId:"delivery",kind:"application",front:"Eight features proposed, six refined, historical throughput five. What do you commit to?",back:"The refined six at most, with the capacity gap named. Send the two unrefined items to refinement \u2014 sponsorship is not refinement."},{id:"f46",moduleId:"lifecycle",kind:"definition",front:"Discovery phase (DTA)",back:"Understand the service landscape, user needs, policy intent and technology constraints."},{id:"f47",moduleId:"lifecycle",kind:"definition",front:"Alpha phase",back:"Explore several approaches and test hypotheses through prototypes and research, before committing to Beta."},{id:"f48",moduleId:"lifecycle",kind:"definition",front:"Beta phase",back:"Build and trial an accessible, secure service based on successful Alpha learning \u2014 the first test under real conditions."},{id:"f49",moduleId:"lifecycle",kind:"definition",front:"Live phase",back:"Operate the service and continue improving it through performance data and user feedback."},{id:"f50",moduleId:"lifecycle",kind:"application",front:"Alpha tested three approaches; two failed. The board wants all three carried into Beta. What do you say?",back:"Eliminating two options is Alpha succeeding, not effort wasted. Carrying failed approaches forward converts learning into rework."},{id:"f51",moduleId:"lifecycle",kind:"discrimination",front:"DTA phases or DES phases: Pre-Approval, Pre-Delivery, Delivery, Closure",back:"DES delivery phases. The DTA process is Discovery, Alpha, Beta and Live. They coexist and are not interchangeable."},{id:"f52",moduleId:"roles",kind:"definition",front:"Product trio",back:"Product manager (viable), designer (desirable) and technology lead (feasible) collaborating on discovery and product decisions."},{id:"f53",moduleId:"roles",kind:"definition",front:"Product manager horizon",back:"Vision, strategy, outcomes, roadmaps and stakeholder alignment. Asks: are we working on the right things?"},{id:"f54",moduleId:"roles",kind:"definition",front:"Product Owner horizon",back:"Backlog management, story refinement, acceptance criteria, sprint support and clarifying requirements. Asks: do teams have what they need to deliver?"},{id:"f55",moduleId:"roles",kind:"definition",front:"Senior Responsible Officer",back:"Owns the project outcomes, the delivery roadmap and championing the change."},{id:"f56",moduleId:"roles",kind:"definition",front:"The three layers and their questions",back:"Strategic: what future are we trying to create? Coordination: what should we deliver next? Delivery: how do we successfully deliver this work?"},{id:"f57",moduleId:"roles",kind:"definition",front:"Decision rights",back:"Explicit agreement about who decides, who contributes evidence, who is consulted and when escalation is required."},{id:"f58",moduleId:"roles",kind:"application",front:"The Product Owner spends every sprint relaying questions between the team and three business areas. What is the real problem?",back:"The PO has become a requirements courier because decision rights were never agreed. Fix the authority, not the calendar."},{id:"f59",moduleId:"government",kind:"definition",front:"Digital Service Standard 2.0",back:"The Australian Government's current 10-criterion standard, reduced from 13. Fully in effect: new services from 1 July 2024, pre-existing public-facing services from 1 July 2025."},{id:"f60",moduleId:"government",kind:"definition",front:"DES delivery phases",back:"Pre-Approval, Pre-Delivery, Delivery, Closure \u2014 with stage gates between them."},{id:"f61",moduleId:"government",kind:"definition",front:"Principle 1 and its implication",back:"Start with the problem, not the solution: understand user needs, policy intent and root causes first. Discovery comes before build."},{id:"f62",moduleId:"government",kind:"definition",front:"Principle 6 and its implication",back:"Design for the whole service: optimise the end-to-end experience across channels and systems, not individual projects. Reuse before rebuild."},{id:"f63",moduleId:"government",kind:"definition",front:"Policy intent vs user need",back:"Policy defines a required public result; research shows how people experience and can successfully meet it. A policy requirement is not automatically a user need."},{id:"f64",moduleId:"government",kind:"definition",front:"Evidence-based gate",back:"A governance decision using outcome evidence, readiness, unresolved assumptions and material risk \u2014 not document completion alone."},{id:"f65",moduleId:"government",kind:"application",front:"Which DES phase carries the greatest product risk, and why?",back:"Closure. The project ends but the product does not, so ownership of performance, measures and improvement must be handed over or the service decays unowned."},{id:"f66",moduleId:"government",kind:"application",front:"Policy mandates a declaration screen users cannot understand. The assisted channel already uses a plain-language script. What do you do?",back:"Meet the policy intent using the evidence and the existing script, then measure comprehension. Compliance says what must be true; design determines how it is experienced."},{id:"f67",moduleId:"integration",kind:"definition",front:"Evidence chain",back:"Need \u2192 problem \u2192 outcome \u2192 options \u2192 evidence \u2192 ordered delivery \u2192 measurement \u2192 learning."},{id:"f68",moduleId:"integration",kind:"definition",front:"Assumption",back:"Something believed true but not yet supported strongly enough for the decision being made."},{id:"f69",moduleId:"integration",kind:"definition",front:"What good looks like \u2014 the six qualities",back:"Outcome focused, user centred, evidence based, collaborative, adaptive, value driven."},{id:"f70",moduleId:"integration",kind:"definition",front:"Product judgement",back:"Choosing a defensible course under uncertainty by balancing evidence, outcomes, constraints, risk and learning."},{id:"f71",moduleId:"integration",kind:"application",front:"A pilot improves the average but worsens results for assistive-technology users. What does the evidence require?",back:"Treat it as a guardrail failure, investigate the cause and adapt before scaling. Averages can conceal distributional harm."},{id:"f72",moduleId:"integration",kind:"application",front:"Ten minutes with the SRO: delivery is green but the outcome measure probably will not move. What do you lead with?",back:"The outcome risk, the evidence behind it and the decision you need \u2014 schedule as context. The SRO owns the project outcomes."}],Hn=[{id:"vision",title:"Product vision",prompt:"For [users], create a future where [meaningful state], so that [public/user/organisational value].",example:"For employment-service providers, create a future where application progress is understandable and actionable, so they can support participants confidently with less avoidable effort."},{id:"problem",title:"Problem statement",prompt:"Our [who] are currently experiencing [what] when trying to [goal]. This occurs in [where] and has been happening since [when]. This is critical because [why / impact]. Evidence: [sources].",example:"Our providers are currently experiencing an inability to determine application progress when trying to support participants. This occurs across the provider portal and the support line, and has been happening since the 2023 platform split. This is critical because it generates avoidable support demand and leaves participants without answers. Evidence: call-reason coding, 12 interviews, journey observation.",note:"This follows the deck's who/what/goal/where/when/why structure from slide 30."},{id:"hmw",title:"How might we",prompt:"How might we [intended action] for [who] so that [desired outcome], while [important guardrail]?",example:"How might we make application progress understandable for providers so they can act without assistance, while preserving clear escalation for unresolved cases?",note:"The deck's format (slide 31) omits the guardrail clause. It is added here because government services almost always have a group whose access must not be traded away."},{id:"hypothesis",title:"Hypothesis",prompt:"We believe [intervention] for [audience] will [outcome]. We will know this is true when we see [signal], and false if [disconfirming signal], without [guardrail failure].",example:"We believe plain-language status and next-step guidance will reduce avoidable calls for providers. We will know it is true if successful self-service rises above 65%, and false if call volume holds while page views rise \u2014 without unresolved-case escalation dropping below 95%.",note:"The deck's version (slide 32) has no disconfirming signal and no guardrail. Both are added here: a hypothesis you cannot imagine being wrong is not testable."},{id:"okr",title:"Objective and key results",prompt:"Objective: [meaningful direction]. KR1: move [metric] from [baseline] to [target] by [date]. KR2: [second measure]. Guardrail: [must not worsen]. Grade at review: [1\u20134] because [insight].",example:"Objective: Make application progress understandable without assistance. KR1: successful self-service 42% \u2192 70% by June. KR2: avoidable status calls down 30%. Guardrail: unresolved-case escalation stays above 95%."},{id:"experiment",title:"Experiment brief",prompt:"Decision: [what will change]. Riskiest assumption: [claim]. Method: [test]. Participants/data: [sample]. Success/stop signals: [thresholds decided in advance].",example:"Decision: whether to invest in live status integration. Assumption: the proposed information resolves the main uncertainty. Test: realistic prototype with 8 representative providers using manually supplied data. Proceed if 6 of 8 correctly state the next action unprompted."},{id:"epic",title:"Epic",prompt:"Epic hypothesis: [outcome we believe this delivers]. Description: [scope]. Business outcomes and benefits: [measurable outcomes tracked, linked to the business case]. Objective: [the objective it serves].",example:"Epic hypothesis: consolidating application status into a single provider view will materially reduce avoidable support demand. Benefits: 30% reduction in status-related contacts; linked to business-case benefit B3. Objective: reduce administrative effort for providers.",note:"Epics span many PIs and multiple teams. Written to the deck's minimum detail, slide 61."},{id:"feature",title:"Feature",prompt:"Feature hypothesis: [user outcome expected]. Sizing estimate: [relative size]. Acceptance criteria: [conditions]. In scope / out of scope: [boundaries]. Feature measurement: [metric, e.g. 30% reduction in processing time]. Risks, issues, dependencies: [items].",example:"Feature hypothesis: providers shown a plain-language status with a next action will resolve their query without contacting support. Measurement: successful self-service rate for status queries, target 65% in the first PI after release. Out of scope: payment status. Dependency: status API availability from the assessment platform.",note:"Features are demonstrable within a PI. Feature measurement is the field most often skipped and the one that decides whether you learn anything."},{id:"story",title:"User story with evidence",prompt:"As a [persona], I want [capability] so that [reason]. Acceptance: [observable conditions]. Story points: [estimate]. Area path: [team/product]. Iteration path: [sprint]. Outcome link: [measure].",example:"As a provider, I want to see the current application status and the required next action so I can support the participant without calling. Acceptance: status meaning is available to screen readers, a timestamp is shown, and the escalation path is visible. Outcome link: successful self-service rate."},{id:"gate",title:"Evidence-based gate brief",prompt:"Decision requested: [decision]. Phase gate: [Pre-Approval / Pre-Delivery / Delivery / Closure]. Outcome: [result sought]. Evidence: [what supports it]. Uncertainty: [what remains]. Risks and standards: [material items, including DSS criteria]. Ownership after this gate: [named owner]. Next test or investment: [proposal].",example:"Proceed to a controlled Beta after accessibility remediation and baseline capture. Evidence supports comprehension; data freshness remains a material operational risk. Enduring owner named for post-Live performance."}],io=60,kt=[{id:"c1",title:"User and service context",prompt:"Identify the users, their real goal, the end-to-end service and the strongest available evidence.",checks:["Names a specific user group and what they are trying to achieve","Describes the service across channels, not just the digital interface","Cites the evidence relied on and its limits"]},{id:"c2",title:"Problem and root cause",prompt:"Write a solution-neutral problem statement. Separate the visible symptom from the likely root causes and mark remaining assumptions.",checks:["Problem statement contains no proposed solution","Distinguishes symptom from root cause","Flags which claims are still assumptions"]},{id:"c3",title:"Vision and strategic choice",prompt:"Describe the future state, the first strategic focus and at least one deliberate non-priority.",checks:["Vision describes a state, not a feature","Names the first problem to solve and why it is first","States something explicitly deferred"]},{id:"c4",title:"Outcome and measures",prompt:"Write one objective, two key results, one leading indicator and one guardrail with definitions and baselines.",checks:["Key results have baseline, target and timeframe","Leading indicator is distinguished from the outcome","Guardrail names a group or channel that must not be harmed"]},{id:"c5",title:"Options and risks",prompt:"Generate at least three materially different options, including at least one non-build option. Compare value/usability, feasibility and viability risks.",checks:["Three genuinely different options, not three variants of one","At least one process, policy or non-build option","Each option assessed against all three lenses"]},{id:"c6",title:"Experiment",prompt:"Choose the riskiest assumption and design the cheapest credible test, including decision thresholds set in advance.",checks:["Identifies one assumption as both critical and uncertain","Method matches the kind of risk","States the result that would stop or change the idea"]},{id:"c7",title:"Delivery approach",prompt:"Define a Product Goal, an initial ordered backlog with at least one item written to the deck's minimum detail, and an outcome-oriented Now/Next/Later roadmap.",checks:["Backlog is ordered with a stated rationale","At least one epic, feature or story written to its required fields","Roadmap uses confidence bands rather than false dates"]},{id:"c8",title:"Government readiness",prompt:"Address policy intent, accessibility, privacy and security, operational ownership, Digital Service Standard evidence, the relevant DES phase gate and the next governance decision.",checks:["Names the DES phase gate and what must be true to pass it","Treats accessibility as a delivery obligation, not an enhancement","Names an enduring owner for post-Live performance"]},{id:"c9",title:"Learning loop",prompt:"Explain how live performance, research and service feedback will change priorities after release.",checks:["Names the evidence that will be observed and by whom","States the cadence connecting learning to the next increment","Identifies who makes the resulting backlog decisions"]}],Ga=[{id:"traceable",title:"Traceable",detail:"Every action connects to evidence and an outcome."},{id:"testable",title:"Testable",detail:"Critical assumptions have credible tests and predefined thresholds."},{id:"balanced",title:"Balanced",detail:"User, policy, operational and technical constraints are all visible."},{id:"measurable",title:"Measurable",detail:"Baselines, outcomes and guardrails are defined, not implied."},{id:"sustainable",title:"Sustainable",detail:"Ownership and learning continue after release."}],so=[{id:"des-phases",title:"DES delivery phases",summary:"The agreed end-to-end pipeline for all DES projects, with stage gates between phases. Distinct from the DTA service phases and from the Digital Service Standard.",slides:"90\u201391",sourceIds:["deck"],items:[{term:"Pre-Approval",detail:"Establishing the case for investment. Product contribution: problem definition, user evidence, outcome hypotheses, options and risks."},{term:"Pre-Delivery",detail:"Planning with the right amount of detail and establishing the delivery runway. Product contribution: refined backlog, validated approach, measures and baselines defined before build."},{term:"Delivery",detail:"Building and releasing increments. Product contribution: ordering the backlog, protecting the outcome, running discovery an increment ahead."},{term:"Closure",detail:"Transition and completion. Product contribution: handing over enduring ownership, measures and an improvement cadence \u2014 the phase where product risk is highest."}]},{id:"dta-phases",title:"DTA service design and delivery phases",summary:"The government service process the product lifecycle aligns to. The deck presents Beta and Live combined; they are separated here because the ownership question at go-live is where services most often fail.",slides:"73",sourceIds:["dss","deck"],items:[{term:"Discovery",detail:"Understand the service landscape, user needs, policy intent and technology constraints."},{term:"Alpha",detail:"Explore several approaches and test hypotheses through prototypes and research."},{term:"Beta",detail:"Build and trial an accessible, secure service based on successful Alpha learning."},{term:"Live",detail:"Operate the service and continue improving through performance data and user feedback."}]},{id:"principles",title:"The seven principles in practice",summary:"DES operating principles and what each one changes about day-to-day product work.",slides:"88\u201389",sourceIds:["deck"],items:[{term:"1. Start with the problem, not the solution",detail:"Understand user needs, policy intent and root causes before committing. Discovery comes before build."},{term:"2. Validate before you scale",detail:"Reduce risk through prototypes, testing and incremental releases."},{term:"3. Deliver value early and often",detail:"Prefer incremental delivery of valuable outcomes over large, infrequent releases."},{term:"4. Decisions belong closest to the problem",detail:"People with the greatest understanding of users and delivery realities make day-to-day decisions."},{term:"5. Focus on outcomes, not outputs",detail:"Outcomes over features, benefits over deliverables, value over activity."},{term:"6. Design for the whole service",detail:"Optimise end-to-end experience across channels and systems. Reuse before rebuild."},{term:"7. Learn continuously",detail:"Discovery, validation and improvement continue throughout the life of a service."}]},{id:"wow",title:"Ways of Working \u2014 behaviours",summary:"The behavioural half of DES ways of working. The other half is the Digital Delivery Framework.",slides:"87",sourceIds:["deck"],items:[{term:"We put user needs at the centre",detail:"Decisions are grounded in what users actually do and need."},{term:"We are accountable and take ownership",detail:"Issues are owned and solved, not routed."},{term:"We empower our people",detail:"Authority sits with the people doing the work."},{term:"We connect and work across boundaries",detail:"Whole-of-service beats local optimisation."},{term:"We do the basics brilliantly",detail:"Reliability and quality before novelty."},{term:"We are innovative and contemporary",detail:"Current practice, adopted deliberately rather than fashionably."}]},{id:"cadence",title:"Cadence and backlog fields",summary:"The DES planning rhythm and the minimum detail each backlog level must carry. Area path and iteration path are Azure DevOps fields.",slides:"60\u201367",sourceIds:["deck","scrum"],items:[{term:"Sprint",detail:"2 weeks / 10 working days. Delivers small increments of releasable value."},{term:"Program Increment (PI)",detail:"10 weeks / 50 working days. Delivers key business outcomes. Five sprints per PI."},{term:"PI flow",detail:"Business outcome \u2192 candidate features \u2192 refinement \u2192 increment planning \u2192 delivery \u2192 measurement."},{term:"Epic fields",detail:"Epic hypothesis; description; business outcomes and benefits; objective."},{term:"Feature fields",detail:"Hypothesis; sizing estimate; acceptance criteria; in/out of scope; feature measurement; risks, issues and dependencies."},{term:"Story fields",detail:"As a [persona] I want [goal] so that [reason]; story points; area path; iteration path."},{term:"Not Scrum terms",detail:"Epic, feature and Program Increment come from scaled frameworks and local practice. Scrum defines Product Goal, Product Backlog, Sprint Backlog and Increment."}]},{id:"roles",title:"Roles around the product manager",summary:"Who owns what across governance, coordination and delivery.",slides:"79, 92",sourceIds:["deck"],items:[{term:"Senior Responsible Officer",detail:"Owns project outcomes, the delivery roadmap and championing the change."},{term:"Senior Supplier",detail:"Supplier-side commitment and capability."},{term:"Project Board",detail:"Investment and material risk decisions."},{term:"Lead Delivery Manager",detail:"Delivery across teams; removing systemic impediments."},{term:"Product Manager",detail:"Outcomes, priorities and product direction. Asks: are we working on the right things?"},{term:"Product Owner",detail:"Building, curating and prioritising a refined, validated backlog. Asks: do teams have what they need?"},{term:"UX Lead and designers",detail:"User research, service and interaction design."},{term:"Solution Architect",detail:"Technical approach and integrity."},{term:"Scrum Master",detail:"Team process, flow and impediment removal."},{term:"BAs, developers, testers",detail:"Making working increments."}]},{id:"wsjf",title:"Prioritisation reference",summary:"WSJF components and the impact/effort quadrants, for use in refinement.",slides:"64",sourceIds:["wsjf","deck"],items:[{term:"WSJF formula",detail:"Cost of delay \xF7 job size. Higher sequences earlier."},{term:"Cost of delay",detail:"User and business value + time criticality + risk reduction or opportunity enablement."},{term:"Job size",detail:"Relative effort or duration. The denominator \u2014 which is why small valuable work moves early."},{term:"Quick wins",detail:"High impact, low effort. Do first."},{term:"Big-ticket items",detail:"High impact, high effort. Plan deliberately."},{term:"Fill-in jobs",detail:"Low impact, low effort. Do when capacity allows."},{term:"Thankless tasks",detail:"Low impact, high effort. Challenge whether they should be done at all."},{term:"Judgement still applies",detail:"Dependencies, safety, legislated mandates and confidence can and should override a score."}]}],vl=[{id:"d1",topic:"Hypothesis statement",slides:"32",deck:"'We believe that [doing this] for [these people] will achieve [this outcome]. We'll know this is true when we see [this feedback / behaviour change].'",here:"Adds a disconfirming signal and a guardrail clause.",why:"The deck's form can only be confirmed, never falsified, and it has no protection against achieving the outcome by harming another group. Both additions are required for the measure design taught in Stage 3 to work."},{id:"d2",topic:"How might we",slides:"31",deck:"'How might we [intended action] for [who] so that [desired outcome]?'",here:"Adds 'while [important guardrail]'.",why:"Government services almost always have a group whose access must not be traded away for an average improvement. Naming it in the opportunity framing stops it being discovered at accessibility testing."},{id:"d3",topic:"Beta and Live",slides:"73",deck:"Presents the DTA process as Discovery, Alpha, and a combined Beta/Live.",here:"Treats Beta and Live as distinct phases.",why:"The transition from Beta to Live is where enduring ownership is either assigned or lost. Combining them makes the most common product failure in government invisible."},{id:"d4",topic:"Digital Service Standard",slides:"not covered",deck:"The deck does not mention the Digital Service Standard.",here:"Stage 8 covers Version 2.0: 10 criteria, applicability dates and lifecycle-wide use.",why:"The standard is a live obligation for public-facing services and post-dates much of the deck's framing. Omitting it would leave a learner unaware of a requirement that applies to their work."},{id:"d5",topic:"Attribution of the PM definition",slides:"8, 54",deck:"Quotes 'the intersection of business, technology and user experience...' without attribution.",here:"Attributes the framing to Martin Eriksson and lists him as a source.",why:"Eriksson appears on the deck's own recommended-reading list (slide 97). Attributing the quote is a small correction that also points learners at the fuller argument."},{id:"d6",topic:"MVP and accessibility",slides:"56",deck:"'MVPs aren't: a poor-quality solution, an unfinished product.'",here:"Adds that an MVP must still meet accessibility and security obligations.",why:"In practice 'minimum' is the word most often used to defer accessibility. Making the obligation explicit closes that gap."},{id:"d7",topic:"Problem statement structure",slides:"30",deck:"Who / what / goal / where / when / why-impact.",here:"Retained in full, with an added 'Evidence:' line.",why:"An earlier version of this course collapsed where and when into 'context'. That diverged from what learners are asked to produce at work, so the deck's structure has been restored and only the evidence line added."}],vf=[{id:"dx-thinking",moduleId:"thinking",prompt:"The clearest sign that a team is doing project thinking rather than product thinking is that\u2026",options:["success is declared when the agreed scope is delivered","they work to a fixed budget","they report to a Project Board","they use a stage-gated delivery pipeline"],answer:0,rationale:"Stage gates, fixed budgets and boards are all normal in government and compatible with product thinking. Defining success as scope delivered rather than a change achieved is the actual tell."},{id:"dx-discovery",moduleId:"discovery",prompt:"You have analytics showing where users drop out, and interviews explaining why they find a step confusing. What do you still not know?",options:["How many users are affected","Whether the confusion is the binding constraint, or whether something else would stop them anyway","What users say about the service","Where in the journey the problem occurs"],answer:1,rationale:"Quantitative tells you where and how many; qualitative tells you what people experience. Neither establishes that removing this barrier would change the outcome \u2014 that requires a test."},{id:"dx-outcomes",moduleId:"outcomes",prompt:"Which of these is the strongest evidence that an OKR is well written?",options:["The objective is ambitious and inspiring","Every key result has a named owner","You could tell from the key results alone whether the objective was achieved","The key results are all within the team's direct control"],answer:2,rationale:"Key results exist to make the objective's achievement observable. If they can all be met while the objective plainly is not, they are measuring activity. Note that outcome key results usually are not fully within a team's control \u2014 that is expected."},{id:"dx-exploration",moduleId:"exploration",prompt:"The cheapest credible test is usually the one that\u2026",options:["produces the most data","involves the fewest people","can be run without engineering effort","resolves the assumption most likely to kill the idea"],answer:3,rationale:"Cheapness is measured against the decision, not against effort. A test that is quick but answers a question you were not going to act on is expensive."},{id:"dx-delivery",moduleId:"delivery",prompt:"A backlog item has a clear title, an estimate and an assigned team, but no stated outcome. What is missing that matters most?",options:["A technical design","Acceptance criteria","The link that would let anyone judge whether it should be prioritised at all","A due date"],answer:2,rationale:"Without a connection to a user or service outcome, priority is unjustifiable and success is unmeasurable. Acceptance criteria and design matter, but they answer 'is it done', not 'should we do it'."},{id:"dx-delivery2",moduleId:"delivery",prompt:"Two items have similar value and urgency. One is a quarter the size of the other. Which usually goes first, and why?",options:["Whichever the sponsor prefers","They should be started together to balance the team's workload","The larger one, because it delivers more total value","The smaller one, because value and learning arrive sooner per unit of effort"],answer:3,rationale:"This is the whole point of dividing cost of delay by job size. Smaller valuable work realises benefit and produces learning earlier, which also improves the next decision."},{id:"dx-lifecycle",moduleId:"lifecycle",prompt:"What most reliably distinguishes a service that will keep improving after launch from one that will not?",options:["Whether an owner, measures and an improvement cadence exist after the project ends","The size of the original budget","Whether the technology stack is modern","The quality of the closure documentation"],answer:0,rationale:"Improvement requires someone accountable, something observed and a rhythm for acting on it. Without all three, a service degrades regardless of how well it launched."},{id:"dx-roles",moduleId:"roles",prompt:"A decision is reversible, low cost, and the delivery team has the most relevant information. Where should it be made?",options:["By whoever raised it","By the delivery team","By the product manager, to maintain consistency","At the next governance forum, for transparency"],answer:1,rationale:"Reversible, local decisions belong closest to the evidence. Escalating them consumes governance capacity that material risk and investment decisions need."},{id:"dx-roles2",moduleId:"roles",prompt:"Product manager and Product Owner disagree about what the team should build next. What does this most likely indicate?",options:["There is no shared product direction that both are working from","The Product Owner should defer, since the product manager owns strategy","One of them is wrong about the requirement","The roles have been defined badly and should be merged"],answer:0,rationale:"The two roles cover different horizons of one direction. Persistent disagreement about next steps usually means the direction itself has never been made explicit."},{id:"dx-government",moduleId:"government",prompt:"A stage gate reviews document completeness, schedule and budget, but not evidence or unresolved risk. What is the likely consequence?",options:["Projects will be delivered faster","Well-documented projects will be approved regardless of whether they will work","Teams will produce less documentation","Accessibility issues will be found earlier"],answer:1,rationale:"A gate assesses whatever it asks about. If it does not ask about evidence, outcome confidence or residual risk, it cannot distinguish a sound project from a well
