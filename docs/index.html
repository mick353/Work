deck","scrum"]},{heading:"The trio combines product, design and technology",body:"A product trio brings viability, desirability and feasibility into the same discovery conversation \u2014 product manager (viable), designer (desirable), technology lead (feasible). It is a collaboration pattern, not a committee that replaces broader research, delivery and stakeholder expertise. The deck shows trios operating at all three organisational layers, not only in delivery teams.",sourceIds:["cdh","svpg","deck"]},{heading:"Three layers, three questions",body:"The deck separates the organisation into strategic, coordination and delivery layers, each with its own question, scope and accountability. Escalate constraints, not every routine decision.",table:{caption:"Slides 82\u201385 \u2014 how the layers work together",head:["Layer","Its question","Responsible for","Typical work"],rows:[["Strategic","What future are we trying to create?","Direction, user needs and service outcomes \u2014 the why","Service strategy, cross-product experience, future service design, long-term technology direction, emerging user needs, organisational outcomes"],["Solution / coordination","What should we deliver next?","Translating strategy into roadmaps, priorities and features \u2014 the what and when","Roadmaps, feature prioritisation, dependency management, exploring solution options, product-level outcomes, cross-team coordination"],["Tactical / delivery","How do we successfully deliver this work?","Design, build, test and release \u2014 the how and how much","Refinement, sprint planning, story development, quality assurance, user validation, sprint showcases"]]},bullets:["State who decides, who contributes evidence and who must be consulted.","Place reversible, local decisions closest to the team.","Reserve governance attention for material risk, investment and cross-service trade-offs."],sourceIds:["deck","svpg"]},{heading:"The roles around you",body:"Product managers in DES do not operate alone, and the deck names the surrounding structure explicitly. Knowing who owns what saves you from either escalating unnecessarily or making a decision that was never yours.",table:{caption:"Slides 79 and 92 \u2014 the wider delivery and governance structure",head:["Role","Layer","Owns"],rows:[["Senior Responsible Officer","Governance","The project outcomes, delivery roadmap, championing the change"],["Senior Supplier","Governance","Supplier-side commitment and capability"],["Project Board","Governance","Investment and material risk decisions"],["Lead Delivery Manager","Coordination","Delivery across teams; removing systemic impediments"],["Product Manager","Coordination / strategic","Outcomes, priorities, product direction"],["Product Owner","Delivery","Building, curating and prioritising a refined, validated backlog"],["UX Lead / Designers","Solution","User research, service and interaction design"],["Solution Architect / Architects","Solution","Technical approach and integrity"],["Scrum Master","Delivery","Team process, flow and impediment removal"],["BAs, Developers, Testers","Delivery","Making working increments"]]},sourceIds:["deck"]},{heading:"Worked reasoning: the Product Owner who became a courier",body:`The delivery team asks a question in refinement. The Product Owner says they will find out, goes to the business area, returns two days later with an answer. This repeats. Velocity drops, the Product Owner is working late, and the obvious diagnosis is that they need better time management or the team should ask fewer questions. Both are wrong, and both blame a person for a structural fault. 

Nobody has agreed who is allowed to decide what. In the absence of that agreement, every question becomes an escalation by default, and the Product Owner becomes a relay rather than a decision-maker. 

Sort the questions from a fortnight of refinement into three piles and the shape appears. Some are reversible and local \u2014 the wording of a validation message, the order of two fields. Those should be decided in the room, by the people in it, and changed later if they are wrong. Some are business rules with a genuine owner: eligibility thresholds, retention periods. Those need a named person and an agreed response time, not an ad-hoc hunt. A few are genuinely strategic \u2014 whether to support a channel at all \u2014 and belong at a forum. The fix is one conversation naming which pile is which, and who holds the second. The Product Owner's week changes immediately, and so does the team's, because the default stops being 'ask and wait'.`,bullets:["Reversible and local decisions belong with the people closest to the work; the cost of being wrong is a later change.","Business rules need a named owner and an agreed response time, not goodwill.","If decision rights are unstated they default to whoever is most persistent or most available \u2014 neither of which is a design."],example:"Of 31 questions raised in one fortnight, 24 were reversible and local. The team had been treating all 31 the same way because nobody had ever said they could decide anything."}],questions:[{id:"roles-q1",moduleId:"roles",prompt:"What is the product trio intended to achieve?",options:["Approve every user story before development can begin on it","Separate discovery work cleanly from delivery work","Replace stakeholder consultation with a smaller decision group","Combine product, design and technology perspectives in discovery"],answer:3,optionNotes:["Approval gates are the opposite of the intent. The trio is for shaping options, not signing off tickets.","It exists to connect them. Separating the two is the failure mode it addresses.","The trio is a working pattern, not a substitute for the people who hold policy, operational and user expertise.",""],rationale:"The trio improves cross-functional judgement about value, usability, feasibility and viability at the point options are shaped."},{id:"roles-q2",moduleId:"roles",prompt:"Where should a reversible, team-local design decision usually sit?",options:["With the delivery team closest to the evidence","At the highest governance board","With whichever stakeholder raises it most persistently","Outside the product team entirely"],answer:0,optionNotes:["","Board time is a scarce resource for material risk and investment. Spending it on reversible decisions delays everything else.","Persistence is not authority. This is how decision rights are captured by whoever has the most availability.","Removing the decision from the people with the relevant knowledge guarantees a slower and worse answer."],rationale:"Placing reversible decisions close to the relevant knowledge reduces delay while governance retains material risk and investment decisions."},{id:"roles-q3",moduleId:"roles",prompt:"Which question belongs to the solution / coordination layer?",options:["What future are we trying to create?","What should we deliver next?","How do we successfully deliver this work?","Who approves the business case?"],answer:1,optionNotes:["That is the strategic layer.","","That is the tactical / delivery layer.","Approval sits with governance and is not one of the three layer questions."],rationale:"The coordination layer translates strategy into roadmaps, priorities and features \u2014 it owns the what and the when, between the strategic why and the delivery how."},{id:"roles-q4",moduleId:"roles",prompt:"In the deck's structure, who owns the project outcomes and champions the change?",options:["The Senior Responsible Officer","The Lead Delivery Manager for the project","The Product Manager for the service","The Scrum Master on the team"],answer:0,optionNotes:["","The Lead Delivery Manager owns delivery across teams, not the project outcomes themselves.","The product manager owns product outcomes, priorities and direction \u2014 which is related but narrower, and sits below the SRO in the governance structure.","The Scrum Master owns team process and impediment removal within a delivery team."],rationale:"The SRO owns the project outcomes, the delivery roadmap and championing the change. Knowing this matters because product decisions that alter the outcome need the SRO, not just the board."}],scenarios:[{id:"roles-s1",moduleId:"roles",context:"Designers research users, analysts write requirements and developers receive work months later. Each group says the others missed critical context.",prompt:"What structural change is most useful?",options:["Add a more thorough hand-over document between the functions","Create shared cross-functional discovery with clear decision rights","Remove the user research step in order to shorten the chain","Let each function maintain and publish its own roadmap"],answer:1,optionNotes:["Better documentation reduces loss at a hand-off. It does not remove the hand-off, which is where the context is lost.","","The chain would be shorter and the output worse. Research is not the bottleneck; sequencing is.","Three roadmaps is three strategies. This formalises the disagreement instead of resolving it."],rationale:"Shared work reduces information loss and lets design, product and technology shape viable options together."},{id:"roles-s2",moduleId:"roles",context:"Your Product Owner is spending most of each sprint relaying questions between the delivery team and three business areas, and has no time for refinement. The backlog is filling with unrefined items and the team is starting sprints with unclear acceptance criteria.",prompt:"What is the underlying problem?",options:["The Product Owner needs better time management and prioritisation","The delivery team should be asking considerably fewer questions","The Product Owner has become a requirements courier, with no agreed decision rights","The role should be merged into the product manager position entirely"],answer:2,optionNotes:["Treating a structural problem as a personal one guarantees it recurs with the next person in the seat.","The questions are legitimate. They arise because nobody has been given authority to answer them.","","Merging the roles increases the load on one person without resolving where the answers are supposed to come from."],rationale:"The deck warns specifically against the Product Owner becoming a requirements courier. The fix is agreeing who can decide what \u2014 reversible and local decisions to the team, business rules with named owners and agreed response times."}],assignment:{title:"Clarify decision rights",instruction:"Choose one recurring product decision and make the accountability explicit.",prompts:["Who owns the decision?","Whose evidence or expertise must shape it?","What threshold requires escalation, and what should remain with the team?","Which layer does this decision actually belong to \u2014 strategic, coordination or delivery \u2014 and where is it being made now?"],modelAnswer:`Decisions the team should make without asking: wording of validation messages, field order, which of two equivalent technical approaches, how to split a story. All reversible, all local, and the cost of being wrong is a later change.

Decisions with a named business owner and an agreed response time: what counts as acceptable evidence for a claim; retention periods; whether a rejection reason can be waived. Owner is the claims policy lead, agreed response within three working days.

Decisions that belong at a forum: whether to support bulk upload at all; whether to change the evidence requirement in policy; investment beyond the current PI.

The trio on this work: me on the outcome and the trade-offs, the designer on how providers understand a rejection, the tech lead on what is knowable at submission time. The feasibility question was the one that reframed the whole approach, which is the argument for having them in discovery rather than consulted after it.

What I would stop doing: writing acceptance criteria. It is Product Owner work, and while I am doing it nobody is on the outcome.`,criteria:["Sorts decisions into at least two tiers by reversibility and cost of being wrong","Business-rule decisions have a named owner and an agreed response time","The trio is described by the question each member answers, not by job title","Identifies something the product manager should stop absorbing"]}},{id:"government",number:8,title:"Product practice in government",subtitle:"Work with policy, assurance and delivery constraints without losing the outcome",minutes:65,slides:"86\u201392",outcome:"Apply product principles inside DES ways of working and delivery phases, use the current Digital Service Standard accurately, distinguish it from internal governance, and protect inclusion, accessibility, security and service continuity.",coreIdea:"Government product practice combines user-centred evidence with public value, policy intent, stewardship, assurance and whole-of-service responsibility.",sections:[{heading:"Constraints are design inputs",body:"Policy intent, legislation, privacy, security, accessibility, records, procurement, funding and legacy systems shape the feasible solution space. Surface them early in discovery so they inform options rather than arriving as late-stage blockers.",bullets:["A policy requirement is not automatically a user need.","Compliance says what must be true; design still determines how people experience it.","Whole-of-service outcomes include assisted and non-digital channels."],sourceIds:["deck","dss"]},{heading:"Ways of Working: behaviours and framework",body:"DES ways of working has two core elements. The behaviours describe how people are expected to operate; the Digital Delivery Framework is the end-to-end, repeatable delivery pipeline that ensures consistent practice.",bullets:["We put user needs at the centre.","We are accountable and take ownership for solving issues.","We empower our people.","We connect and work across boundaries.","We do the basics brilliantly.","We are innovative and contemporary."],sourceIds:["deck"]},{heading:"The seven principles in practice",body:"These are the division's stated operating principles. Each one has an implication that changes what a product manager actually does \u2014 which is why they are worth knowing by number, not just by sentiment.",table:{caption:"Slides 88\u201389 \u2014 principles and their implications",head:["#","Principle","What it means in practice"],rows:[["1","Start with the problem, not the solution","Understand user needs, policy intent and root causes before committing to solutions. Discovery comes before build."],["2","Validate before you scale","Reduce risk through prototypes, testing and incremental releases rather than a single large commitment."],["3","Deliver value early and often","Prefer incremental delivery of valuable outcomes over large, infrequent releases."],["4","Decisions belong closest to the problem","People with the greatest understanding of users and delivery realities make day-to-day decisions."],["5","Focus on outcomes, not outputs","Measure success by value created, not volume of work completed. Outcomes over features, benefits over deliverables, value over activity."],["6","Design for the whole service","Optimise the end-to-end experience rather than individual systems, projects or organisational silos. Reuse before rebuild."],["7","Learn continuously","Discovery, validation and improvement continue throughout the life of a service."]]},sourceIds:["deck"]},{heading:"The four DES delivery phases",body:"DES has an agreed end-to-end delivery pipeline for all projects, divided into four phases with stage gates between them. This is the pipeline your work actually sits inside, and it is distinct from both the DTA service phases and the Digital Service Standard.",table:{caption:"Slides 90\u201391 \u2014 the DES pipeline",head:["Phase","Focus","Product management contribution"],rows:[["Pre-Approval","Establishing the case for investment","Problem definition, user evidence, outcome hypotheses, options and their risks"],["Pre-Delivery","Planning with the right amount of detail; establishing the runway","Refined backlog, validated approach, measures and baselines defined before build"],["Delivery","Building and releasing increments","Ordering the backlog, protecting the outcome, running discovery an increment ahead"],["Closure","Transitioning and completing the project","Handing over enduring ownership, measures and improvement cadence \u2014 not just documentation"]]},bullets:["The stated purpose: projects are well planned with the right amount of detail, teams have a clear runway, there is a shared view of success, and stage gates build in quality and predictability.","The product risk sits at Closure \u2014 a project closes, but the product does not.","Do not confuse these four phases with the DTA's Discovery/Alpha/Beta/Live, or with the Digital Service Standard. They are three different things that coexist."],sourceIds:["deck"]},{heading:"Use the current Digital Service Standard accurately",body:"Version 2.0 has 10 criteria, reduced from the former 13, and forms part of the Digital Experience Policy. It expects agile, user-centred work and consideration of the criteria across the service lifecycle. It is now fully in effect: it applied to new and redeveloped services from 1 July 2024, and to public-facing services that already existed before that date from 1 July 2025.",bullets:["The standard covers accessibility, inclusion, security, trust, adaptability and measurement.","Internal DES delivery phases can coexist with this external standard but should not be mistaken for it.","Governance evidence should demonstrate how the criteria are being met, not merely that a template was completed.","Staff-facing internal services sit outside the Phase 2 scope; check current DTA guidance before assuming applicability."],sourceIds:["dss"]},{heading:"Make governance a learning and risk conversation",body:"Strong gates examine evidence, unresolved risk, outcome confidence and readiness for the next investment \u2014 not only schedule and document completion. Product evidence can strengthen business cases and assurance decisions rather than competing with them.",bullets:["Show what was learned and what changed as a result.","Make residual assumptions and guardrails visible.","Preserve a clear owner for benefits and service performance after project closure.","A gate that only checks artefact completeness will approve a well-documented failure."],sourceIds:["deck","dss"]},{heading:"Worked reasoning: the policy requirement that made things worse for users",body:`Policy requires a declaration screen with specific wording before submission. Research shows providers do not understand it, skim it, and a proportion abandon at that point. The weak responses sit at two extremes. Refusing to implement it treats a legitimate policy instrument as an obstacle and is not a decision a product manager gets to make. Implementing it without comment discards evidence that the department paid to gather and would want. Neither is the job. 

Separate the intent from the implementation, because a policy requirement almost always specifies both and only one of them is actually binding. The intent here is that providers make an informed declaration and that the department can demonstrate they did. The implementation is a particular screen with particular words. The evidence does not challenge the intent \u2014 it shows the implementation is failing to achieve it, since a declaration nobody understands is not informed consent, and the department's assurance position is weaker than it looks. 

That reframes the conversation with the policy owner from 'we would like an exemption' to 'the current wording is not producing the thing you need, and here is what people did.' The move is to meet the intent with an evidence-informed design, keep the mandated wording where it must appear, and take the comprehension data back to the owner as a finding rather than a complaint.`,bullets:["Policy usually specifies both an intent and an implementation. Establish which is binding before proposing anything.","Evidence that an implementation fails its own intent is useful to the policy owner, not hostile to them.","Take friction data to the owner as a finding. An exemption request invites a no; a finding invites a conversation."],example:"The mandated sentence stayed, in a plain-language frame explaining what it meant and why. Comprehension went from 31% to 78% in testing, and the policy owner used the result to revise the standard wording department-wide."}],questions:[{id:"government-q1",moduleId:"government",prompt:"Which statement about the Digital Service Standard Version 2.0 is correct?",options:["It replaces internal departmental governance arrangements entirely","It contains 13 criteria and applies at one gate","It applies only during the Alpha phase of delivery","It contains 10 criteria and applies across the service lifecycle"],answer:3,optionNotes:["It sits alongside internal governance. Both apply, and confusing them is a common source of duplicated or missed evidence.","Thirteen was the former standard. Version 2.0 reduced it to 10.","It is explicitly lifecycle-wide. Treating it as a single-phase checkpoint is exactly what that framing exists to prevent.",""],rationale:"Version 2.0 reduced the former 13 criteria to 10 and explicitly encourages lifecycle-wide application."},{id:"government-q2",moduleId:"government",prompt:"How should policy constraints enter product work?",options:["They should be set aside during design and applied afterwards","Only at final assurance","As early discovery inputs that shape options and evidence","As user needs, since they define what the service must do"],answer:2,optionNotes:["Designing without constraints produces options that cannot be built, and wastes the design effort.","Late arrival is what turns a constraint into a blocker and forces rework.","","A policy requirement is not automatically a user need. Conflating them means never noticing when policy is creating the difficulty."],rationale:"Early involvement helps the team design within the real service and legal context and prevents late rework."},{id:"government-q3",moduleId:"government",prompt:"Which are the four DES delivery phases, in order?",options:["Initiation, Planning, Execution, Benefits Realisation","Problem, Options, Build, Measure","Discovery, Alpha, Beta, Live","Pre-Approval, Pre-Delivery, Delivery, Closure"],answer:3,optionNotes:["Generic project phasing, not the DES pipeline.","This resembles the product lifecycle loop rather than the delivery pipeline.","That is the DTA service design and delivery process \u2014 a different framework that coexists with the DES pipeline.",""],rationale:"DES divides its end-to-end pipeline into Pre-Approval, Pre-Delivery, Delivery and Closure, with stage gates between them. Keep it distinct from the DTA phases and from the Digital Service Standard."},{id:"government-q4",moduleId:"government",prompt:"Principle 6 is 'design for the whole service'. Which decision best reflects it?",options:["Considering phone, paper and assisted channels, and reusing existing capability","Delivering the digital service first and addressing other channels in a later project","Standardising the interface across all departmental systems","Optimising the online form's completion rate as the primary measure"],answer:0,optionNotes:["","Deferring other channels to a later project is how end-to-end problems become permanent, since the later project is rarely funded.","Interface consistency is a usability concern. Whole-of-service is about the end-to-end journey across channels and systems.","A single-channel measure can improve while the overall service worsens \u2014 for example by pushing failures to the phone queue."],rationale:"The principle optimises the end-to-end service experience rather than individual systems, projects or silos \u2014 and its stated implications include whole-of-service thinking and reuse before rebuild."},{id:"government-q5",moduleId:"government",prompt:"Which product-management risk is concentrated in the Closure phase?",options:["The backlog becomes too detailed to manage","The project closes without enduring ownership of performance","Stakeholders lose interest in the published roadmap after handover","The team over-invests in further discovery"],answer:1,optionNotes:["Backlog detail is a Pre-Delivery and Delivery concern.","","Attention does fade, but the structural risk is that nobody is accountable, not that nobody is interested.","Over-investment in discovery is a Pre-Approval or Pre-Delivery risk, if it is one at all."],rationale:"A project closes; the product does not. Closure must hand over ownership, measures and an improvement cadence, or the service degrades with nobody accountable for noticing."}],scenarios:[{id:"government-s1",moduleId:"government",context:"The project has completed its templates, but research found a major accessibility barrier and the benefits measures have no baseline.",prompt:"What should the team present at the gate?",options:["Present the evidence, remediation plan and impact on readiness","Reclassify the accessibility issue as a future enhancement instead","Proceed on the basis that the documentation is complete","Defer the accessibility issue to Beta and proceed now"],answer:0,optionNotes:["","Accessibility is a legal and standard obligation and part of service quality. It cannot be reclassified as optional polish.","This is precisely the failure mode the stage exists to describe: a gate that checks artefacts approves a well-documented failure.","Deferral without a plan is the same decision as ignoring it, taken with better manners."],rationale:"Assurance should use evidence to make an informed risk and investment decision; accessibility is part of service quality, not optional polish. A missing baseline also means benefits cannot later be demonstrated."},{id:"government-s2",moduleId:"government",context:"A policy area asks you to add a mandatory declaration screen. Research shows most users cannot tell what they are declaring, and the assisted channel already handles the same declaration verbally with a plain-language script.",prompt:"What is the strongest product response?",options:["Decline, since research shows that users do not understand it","Meet the policy intent, design with the evidence, and measure comprehension","Escalate to the Project Board for a decision on it","Implement the screen exactly as specified, since the requirement is mandatory"],answer:1,optionNotes:["The obligation is real and cannot be declined. The question is how it is met, not whether.","","Board time is for material risk and investment. This is a design decision that belongs with the team and the policy owner.","Compliance says what must be true; it rarely dictates the interaction. Implementing the specification literally satisfies the letter and fails the intent."],rationale:"A policy requirement is not automatically a user need, but nor is it optional. Compliance defines what must be true; design determines how people experience it \u2014 and the assisted channel has already solved the comprehension problem."}],assignment:{title:"Prepare an evidence-based gate brief",instruction:"Frame a decision for governance in one page.",prompts:["What outcome and public value justify the work?","What evidence supports the proposed direction and what remains uncertain?","What risks, standards, guardrails and ownership conditions must be satisfied before proceeding?","Which DES phase gate is this, and what specifically must be true to pass it?"],modelAnswer:`Constraint: claims evidence requirements are set in the program guidelines, which are not changing this financial year.

What is actually binding versus inherited: binding is that specified evidence must be held before payment. Inherited is that the provider must upload it as a document at submission \u2014 the guidelines do not specify the mechanism, and where the department already holds the evidence it could be checked rather than re-supplied.

Digital Service Standard criteria most engaged: solve a whole problem for users (the claim spans portal, phone and assessment), make it accessible and inclusive (providers vary enormously in capability and connection), and use and contribute to open standards and common platforms (the participant record already exists).

Inclusion risk: small providers without dedicated admin staff are the ones most affected by rejections and least able to absorb rework. Measure their rejection rate separately rather than in the aggregate, because the aggregate is dominated by large providers.

What I take to the policy owner: the proportion of rejections caused by evidence the department already holds. That is a finding they cannot get from anywhere else, and it is not an exemption request.`,criteria:["Separates what the instrument binds from the implementation inherited with it","Names specific Standard criteria rather than the Standard in general","Identifies a group at risk of exclusion and how it will be measured separately","Any policy conversation is framed as evidence, not as a request for relief"]}},{id:"integration",number:9,title:"Integration and capstone",subtitle:"Run the whole chain from need to measured value",minutes:60,slides:"93\u201398",outcome:"Integrate the course into a defensible product approach and explain the reasoning to users, delivery partners, stakeholders and governance.",coreIdea:"Product management is a connected chain of decisions: need \u2192 problem \u2192 outcome \u2192 options \u2192 evidence \u2192 ordered delivery \u2192 measurement \u2192 learning.",sections:[{heading:"Maintain the chain of evidence",body:"Every major item should trace backward to an outcome and forward to a way of learning. If a feature cannot be connected to a user or service problem, an intended result and a measure, its priority is unclear. The deck's closing questions are the shortest version of this test: what problem are we solving, what outcome are we trying to create, what evidence do we have, and what have we learned?",sourceIds:["deck","svpg"]},{heading:"What good looks like",body:"The deck names six qualities. They are worth treating as a checklist for your own work rather than as a poster: outcome focused, user centred, evidence based, collaborative, adaptive, value driven.",bullets:["Outcome focused: success is a measured change, not a delivered artefact.","User centred: decisions are grounded in what users actually do.","Evidence based: claims are traceable to something observed.","Collaborative: product, design and technology shape options together.","Adaptive: the plan changes when the evidence does.","Value driven: work that does not move a result needs a different justification."],sourceIds:["deck"]},{heading:"Tell the product story at three levels",body:"Executives need the outcome, evidence, investment and risk. Delivery teams need the problem context, goal, guardrails and near-term decisions. Users and operational partners need clear changes, support and feedback paths.",bullets:["Keep one truth; adjust the depth, not the facts.","Explain trade-offs and confidence honestly.","Separate evidence, assumption and decision in the way you speak."],sourceIds:["deck"]},{heading:"Reflection becomes practice",body:"Mastery comes from repeatedly making and explaining product decisions. The capstone uses the provider application-status case that runs through the source deck so you can practise the complete method, self-assess against a rubric, and export a reusable product brief.",bullets:["The deck's reflection questions: what problem are you solving and is it the right one? How are you measuring success? What assumptions need validation? What feedback loops exist? How will you know you have delivered value?","Retrieval and spacing are why this system makes you recall before it lets you reread."],sourceIds:["deck","retrieval","spacing","techniques"]},{heading:"Worked reasoning: reporting a result you did not want",body:`The headline measure improved 14%. Broken down, one cohort \u2014 providers using assistive technology \u2014 got materially worse. The board meets on Thursday and asked for the headline. The weak move is to report 14% and mention the cohort in an appendix, which is technically complete and functionally a lie, because the number that gets remembered is the one in the first sentence. The move that feels brave and is actually careless is to lead with the failure, which invites cancellation of work that is mostly succeeding. Neither serves the decision the board is there to make. 

Lead with what changes what they do. The board's job is to decide whether to scale this to all providers next quarter. The 14% says scaling is worth considering; the cohort result says scaling now would extend a harm to a larger group, and that is decision-relevant in a way the headline is not. 

So the sentence is: the intervention works, it is not yet safe to scale, here is what we need to establish first, and here is when we will know. That is not softening the finding \u2014 it is putting it where it acts. It also protects the work, because a board that learns about the cohort later, from somebody else, will not remember that it was in an appendix.`,bullets:["Lead with the thing that changes the decision in front of the audience, not the thing that is most flattering or most dramatic.","An average that hides a harmed group is not a summary; it is a different claim.","Say what you need to establish and by when. A finding without a next step reads as either panic or excuse."],example:"The board approved a four-week extension rather than the scale-up. The cause was a single component that had never been tested with a screen reader, and it was fixed inside that window \u2014 which a cancelled programme would not have been."}],questions:[{id:"integration-q1",moduleId:"integration",prompt:"Which chain best represents product reasoning?",options:["Workshop \u2192 roadmap \u2192 backlog \u2192 sprint \u2192 release \u2192 report","Feature \u2192 deadline \u2192 launch \u2192 status report \u2192 next feature","Need \u2192 problem \u2192 outcome \u2192 options \u2192 evidence \u2192 delivery \u2192 measurement","Budget \u2192 requirements \u2192 build \u2192 test \u2192 deploy \u2192 closure \u2192 benefits report"],answer:2,optionNotes:["Each of these is a real artefact, but the chain has no problem at the front and no measurement at the end.","This is delivery without a rationale. It can be executed perfectly and still change nothing.","","This is a funding and assurance sequence. It manages the project, not the product."],rationale:"The full chain preserves the relationship between evidence, decisions, delivery and achieved value."},{id:"integration-q2",moduleId:"integration",prompt:"What should change when presenting the product story to different audiences?",options:["The stated outcome itself","The underlying facts of the situation","The evidence that is cited","The level of detail and framing"],answer:3,optionNotes:["If the outcome changes by audience, there is no shared understanding of what the work is for.","Changing the facts by audience is how organisations end up with three incompatible versions of the same project.","The evidence should be consistent; how much of it you present can vary.",""],rationale:"Different audiences need different depth, but the decision, evidence and outcome should remain consistent."},{id:"integration-q3",moduleId:"integration",prompt:"A stakeholder asks why a highly requested feature is not on the roadmap. What is the strongest form of answer?",options:["It was not included in the approved scope","It did not score highly enough in the prioritisation exercise this quarter","The outcome it serves is already better addressed by work in flight","The team does not have the capacity this year"],answer:2,optionNotes:["Scope is a procedural answer to a value question. It also implies nothing can ever change, which is untrue.","A score is the output of a judgement, not the justification for it. It invites an argument about the scoring instead of the substance.","","Capacity is true but incomplete. It implies the item would be next if resources appeared, which may not be the case."],rationale:"Traceability is what makes a prioritisation decision defensible. Naming the outcome, the evidence and the condition under which you would change your mind turns a refusal into a shared model."},{id:"integration-q4",moduleId:"integration",prompt:"Which of the deck's six 'what good looks like' qualities is most directly at risk when a team keeps a dated plan after the evidence has changed?",options:["Value driven","User centred","Collaborative","Adaptive"],answer:3,optionNotes:["Value drive is about justifying work by results. Related, but the direct failure here is the refusal to change.","User-centredness is about grounding decisions in user evidence. It may also suffer, but it is not what a frozen plan primarily violates.","Collaboration concerns how options are shaped, not how plans respond to evidence.",""],rationale:"Adaptive means the plan changes when the evidence does. Holding a dated plan to protect stakeholder confidence is the specific failure this quality names."}],scenarios:[{id:"integration-s1",moduleId:"integration",context:"A pilot improves self-service overall, but increases unsuccessful attempts among users relying on assistive technology.",prompt:"Which response demonstrates the strongest product judgement?",options:["Treat it as a guardrail failure, investigate and adapt before scaling","Report the aggregate figure and address the detail in a later release cycle","Declare success because the average has improved","Cancel the product permanently and start again"],answer:0,optionNotes:["","Reporting the aggregate while knowing the disaggregated result is misleading by omission, and it scales the harm in the meantime.","An average can improve while a specific group is actively harmed. This is exactly what guardrails exist to surface.","The evidence supports adaptation, not abandonment. Most of the intervention is working."],rationale:"Outcomes must not hide distributional harm. The evidence should change the scaling decision and the next experiment."},{id:"integration-s2",moduleId:"integration",context:"You have ten minutes with the SRO before a board meeting. Delivery is on schedule, but discovery has shown the primary outcome measure will probably not move because the root cause sits in a policy process outside your control.",prompt:"What do you lead with?",options:["Delivery status, since that is what the board reports on","The outcome risk, the evidence behind it, and the decision you need","A request to change the outcome measure to one the project can influence","Nothing yet \u2014 wait until measurement confirms it after release"],answer:1,optionNotes:["Leading with green delivery status when you know the outcome is at risk trains the board to trust a signal that is not measuring the thing that matters.","","Changing the measure to one you can move is how a project reports success while the problem persists. It also destroys the baseline.","Waiting until after release means raising it when the decision can no longer be influenced and the cost is sunk."],rationale:"Executives need outcome, evidence, investment and risk. The chain of evidence is only useful if you are willing to report the link that is breaking \u2014 and the SRO owns the project outcomes, so this is precisely their decision."}],assignment:{title:"Complete the capstone brief",instruction:"Use the dedicated Capstone workspace to produce an end-to-end product approach for the provider application-status case.",prompts:["Can every proposed action trace to evidence and an outcome?","Are the riskiest assumptions explicit and testable?","Would a delivery team and a governance board understand what happens next and why?","Which of the deck's six qualities is weakest in your brief, and what would fix it?"],modelAnswer:`The chain: providers cannot tell whether a claim will be accepted (problem, evidenced by 38% rejection and six observations) \u2192 so claims are rejected and resubmitted, costing provider effort and assessment capacity (why it matters) \u2192 reduce first-submission rejection to 20% by June, with an assisted-channel guardrail (outcome) \u2192 inline validation of the top three reasons, tested first against whether rejections are detectable at submission (option and evidence) \u2192 shipped ahead of the dashboard on cost of delay (ordered delivery) \u2192 rejection rate and validation-correction rate reviewed monthly by a named owner (measurement and learning).

To an executive: rejection rate is down 14 points, the mechanism is confirmed, and the remaining rejections are concentrated in evidence the department already holds \u2014 which is a policy decision, not a build. I need a decision on whether to pursue that.

To the delivery team: the top three reasons are done and working; next is establishing which of the remaining eleven are detectable, before we commit to any of them.

To providers: fewer claims will come back, here is what changed, and here is where to tell us when it gets it wrong.

Same facts, three depths.`,criteria:["Every link in the chain connects backwards to a problem and forwards to a measure","The executive version leads with the decision needed, not with delivery status","The three versions differ in depth and framing but not in facts","Nothing in the chain is asserted without saying what it rests on"]}}],sf=ei.flatMap(e=>[...e.questions,...e.scenarios.map(t=>({id:t.id,moduleId:t.moduleId,prompt:t.prompt,options:t.options,answer:t.answer,rationale:t.rationale,optionNotes:t.optionNotes,context:t.context}))]).concat(ss),bv=220,xv=1,kv=2;function Ia(e){return e?e.trim().split(/\s+/).filter(Boolean).length:0}function $d(e){let t=Ia(e.outcome)+Ia(e.coreIdea);for(let o of e.sections){t+=Ia(o.heading)+Ia(o.body)+Ia(o.example);for(let n of o.bullets??[])t+=Ia(n);if(o.table){for(let n of o.table.head)t+=Ia(n);for(let n of o.table.rows)for(let i of n)t+=Ia(i)}}let a=t/bv+e.questions.length*xv+e.scenarios.length*kv;return Math.max(5,Math.round(a/5)*5)}for(let e of ei)e.minutes=$d(e);var lf=ei.reduce((e,t)=>e+t.minutes,0);var Xe="16 August 2026",df=[{id:"rmg106",title:"Guidance on the Assurance Reviews Process (RMG 106)",publisher:"Australian Government / Department of Finance",url:"https://www.finance.gov.au/publications/resource-management-guides/guidance-assurance-reviews-process-rmg-106",note:"The operating guidance for Gateway. Defines the gates, including Gate 6 (Benefits Realisation), and what a Senior Responsible Officer is accountable for at each.",checked:Xe},{id:"gateway",title:"Gateway Reviews Process",publisher:"Australian Government / Department of Finance",url:"https://www.finance.gov.au/government/assurance-reviews-and-risk-assessment/gateway-reviews-process",note:"Scope and thresholds: $30m for procurement or infrastructure, $30m where the ICT component is at least $10m, $50m for programs. Applies to non-corporate Commonwealth entities.",checked:Xe},{id:"lessons",title:"Gateway Review Process \u2014 Lessons Learned",publisher:"Australian Government / Department of Finance",url:"https://www.finance.gov.au/publications/lessons-learned/gateway-review-process-lessons-learned-first-edition",note:"Aggregated observations across Australian Government Gateway reviews. The closest thing the Commonwealth has to published reference-class data on why delivery goes wrong.",checked:Xe},{id:"closure",title:"Project closure \u2014 Financial Statements Better Practice Guide",publisher:"Australian Government / Department of Finance",url:"https://www.finance.gov.au/government/financial-reporting-and-accounting-policy/financial-statements-better-practice-guide/12-project-closure",note:"The financial-side expectations at closure: costs finalised, assets recognised, obligations settled or transferred.",checked:Xe},{id:"rmg134",title:"Annual performance statements for Commonwealth entities (RMG 134)",publisher:"Australian Government / Department of Finance",url:"https://www.finance.gov.au/government/managing-commonwealth-resources/annual-performance-statements-commonwealth-entities-rmg-134",note:"Where closure evidence ends up. Performance statements are audited, so a claim made at closure can be tested a year later.",checked:Xe},{id:"anao-perf",title:"Reporting Meaningful Performance Information",publisher:"Australian National Audit Office",url:"https://www.anao.gov.au/work/insights/reporting-meaningful-performance-information",note:"The auditor's view of what makes a performance claim meaningful rather than merely reported. Useful as the standard a closure report is written to survive.",checked:Xe},{id:"anao-gateway",title:"Administration of the Gateway Review Process",publisher:"Australian National Audit Office",url:"https://www.anao.gov.au/work/performance-audit/administration-the-gateway-review-process",note:"Performance audit of Gateway itself, including how consistently review recommendations are acted on after the review closes.",checked:Xe},{id:"archives",title:"Archives Act 1983 and records authorities",publisher:"National Archives of Australia",url:"https://www.naa.gov.au/information-management/records-authorities/types-records-authorities",note:"Records authorities give permission to destroy, retain or transfer Commonwealth records and set minimum retention periods. Destruction without authority is unauthorised however it happens.",checked:Xe},{id:"naa-data",title:"Retaining, managing and disposing of data and datasets",publisher:"National Archives of Australia",url:"https://www.naa.gov.au/information-management/disposing-information/retaining-managing-and-disposing-data-and-datasets",note:"Data held in business systems is a Commonwealth record. Access must be maintained for the prescribed period, and migration to a new system does not discharge the obligation.",checked:Xe},{id:"cprs",title:"Commonwealth Procurement Rules",publisher:"Australian Government / Department of Finance",url:"https://www.finance.gov.au/government/procurement/buying-australian-government/commonwealth-procurement-rules",note:"The procurement framework the contract sits inside. Relevant at closure for final acceptance, warranty and defects liability, retentions, and obligations that survive termination.",checked:Xe},{id:"teal",title:"Benefits management \u2014 Government Project Delivery (Teal Book)",publisher:"UK Government / Infrastructure and Projects Authority",url:"https://projectdelivery.gov.uk/teal-book/home/part-e-planning-and-control/chapter-19-benefits-management/",note:"Comparator practice. Benefits management as a whole-of-lifecycle discipline owned by the business, not a closure-time activity owned by the project.",checked:Xe}],ti=[{id:"purpose",number:1,title:"What closure is actually for",subtitle:"Accountability and learning, not administration",minutes:0,slides:"",outcome:"Explain who reads a closure report, what decision it informs, and why most are written to be filed rather than read.",coreIdea:"A closure report is not the last piece of project admin. It is the first piece of evidence about whether the investment was worth making \u2014 and it is written by the people least able to answer that question at the moment they have the least incentive to try.",sections:[{heading:"The structural problem",body:"Closure reports are unusually bad documents, and not because the people writing them are careless. They are produced at the point where the delivery team is being disbanded, the funding has stopped, the sponsor has moved to the next thing, and nobody who will live with the result is in the room. The person holding the pen is usually the project manager, whose professional reputation is the subject of the document. That is a structural conflict, not a personal failing, and no template solves it.",bullets:["Written last, by the people with the least time and the most exposure.","Read \u2014 if at all \u2014 by people who were not there and cannot check the claims.","Approved by a sponsor whose own record is being described.","Filed somewhere that the next project team will not search."],example:"A closure report states 'the project delivered all agreed scope within the revised budget'. Every word is true. The budget was revised twice, upward, and the scope was reduced at the second revision. Nothing has been falsified and nothing useful has been said.",sourceIds:["lessons","anao-gateway"]},{heading:"Who the audiences actually are",body:"Writing well requires knowing who is on the other end. A closure report has at least four distinct readers with incompatible needs, and a report that tries to serve all of them with one register serves none of them. The fix is structural: separate what happened from what it cost, from what it achieved, from what to do differently.",table:{caption:"Four readers, four questions",head:["Reader","What they need to decide","What they do with a vague report"],rows:[["Senior Responsible Officer","Whether benefits are on track and who now owns them","Signs it, because nothing in it is contestable"],["Finance / CFO","Whether costs are final and assets correctly recognised","Chases the numbers separately, ignores the narrative"],["The next project team","What to do differently, with specifics","Never finds it, repeats the failure"],["ANAO or internal audit","Whether claims made are supported by evidence","Tests the claim anyway, and finds the gap"]]},sourceIds:["rmg106","anao-perf"]},{heading:"Gate 6 and why it exists",body:"For proposals inside the Gateway thresholds, closure is not self-assessed. Gate 6 is the Benefits Realisation review: an independent check that the investment delivered what was promised, that benefits have named owners, and that the arrangements to keep harvesting them survive the project's disappearance. The gate exists precisely because self-reported closure was found not to be reliable.",bullets:["Gateway applies to non-corporate Commonwealth entities above the thresholds: $30m procurement or infrastructure, $30m with an ICT component of at least $10m, $50m for programs.","Gate 6 assesses delivery of the purpose and benefits of the investment, not delivery of the scope.","It looks for benefits that are identified, owned, and still being measured after the team has gone.","The Senior Responsible Officer is the accountable party \u2014 not the project manager."],example:"A $42m program with a $14m ICT component is inside scope on two counts. Its Gate 6 review will ask who owns the benefit in eighteen months. If the answer is 'the project', there is no answer.",sourceIds:["gateway","rmg106"]},{heading:"What good looks like",body:"A closure report worth writing does three things a filed one does not: it states what was promised in the original terms rather than the revised ones, it separates what is now known from what is still assumed, and it names a person for every commitment that outlives the project. Everything else in this course is machinery for those three.",bullets:["Baseline stated as originally approved, with every revision shown as a revision.","Claims marked as measured, estimated or asserted \u2014 and the difference visible.","Every residual risk, benefit and obligation has a named owner who has agreed to it."],sourceIds:["anao-perf","teal"]}],questions:[{id:"cl-p1",moduleId:"purpose",prompt:"Why are closure reports structurally prone to being uninformative?",options:["The author's own record is the subject, when candour costs most","They are too long for senior readers to work through properly","The templates in use across the Commonwealth are inconsistent","Project managers are not trained in formal report writing"],answer:0,rationale:"The problem is incentive and timing, not skill or format. The author's record is the subject, the team is dispersing, and the reader cannot verify. Better templates do not change any of those.",optionNotes:["","Length is a symptom at most. A short uninformative report is just as useless.","Template inconsistency is real and largely irrelevant \u2014 consistent templates still get filled in vaguely.","Plenty of well-written closure reports say nothing testable. Writing skill is not the constraint."]},{id:"cl-p2",moduleId:"purpose",prompt:"A program has a total cost of $46m, of which the ICT component is $8m. On the financial thresholds alone, is it in scope for Gateway?",options:["Yes \u2014 it exceeds neither ICT test but is a program under the program threshold of $50m... no, it is below that threshold","Yes, because any program over $30m is captured","No on the ICT test, and no on the program threshold \u2014 $46m is below $50m","Yes, because the ICT component exceeds $5m"],answer:2,rationale:"Programs are captured above $50m; this is $46m. The $30m-with-$10m-ICT test is a projects test and the ICT component here is $8m in any case. Note that Finance may still recommend a review for a high-risk proposal \u2014 the thresholds are a trigger, not a ceiling.",optionNotes:["This option contradicts itself and lands on the wrong answer.","The $30m figure is the projects threshold, not the programs threshold.","","There is no $5m ICT test. The ICT figure is $10m, and it sits alongside a $30m project total."]},{id:"cl-p3",moduleId:"purpose",prompt:"What does a Gate 6 review primarily assess?",options:["Whether the investment delivered its purpose and benefits, and who owns them","Whether the agreed scope was delivered within the revised budget and schedule","Whether the project followed the entity's approved delivery methodology","Whether the financial statements correctly recognise the resulting assets"],answer:0,rationale:"Gate 6 is the Benefits Realisation gate. Scope, method and asset recognition all matter elsewhere; the gate exists to test whether the investment achieved its purpose and whether benefit harvesting survives closure.",optionNotes:["","Scope against revised budget is the question a project reports on itself. Gate 6 exists because that question is not sufficient.","Methodology compliance is an internal assurance matter, not the purpose of Gate 6.","Asset recognition is a Finance and financial-statements concern, covered in the closure guidance rather than the gate."]},{id:"cl-p4",moduleId:"purpose",prompt:"Which reader is most poorly served by a closure report that describes activity rather than outcome?",options:["The next project team, who need specifics and get generalities","The Senior Responsible Officer, who needs a document to sign","The Chief Financial Officer, who needs final cost figures","Internal audit, who need to confirm the report exists"],answer:0,rationale:"The SRO can sign a vague report and the CFO can get numbers elsewhere. The next team is the only reader whose entire need is the specific, transferable detail that activity-description omits \u2014 and they are the reader nobody writes for.",optionNotes:["","A vague report is easier to sign, not harder. This reader is served, badly but comfortably.","Cost figures are obtainable from the ledger regardless of the narrative quality.","Audit tests claims rather than confirming existence, and will find the gap by other means."]}],scenarios:[{id:"cl-p-s1",moduleId:"purpose",context:"You are asked to review a draft closure report for a $60m program. It states: 'The program achieved its objectives, delivering improved service outcomes for participants within the approved funding envelope.' The funding envelope was increased by $9m in year two. Participant outcome measures were never baselined.",prompt:"What is the single most serious problem with that sentence?",options:["It makes an outcome claim that cannot be tested, with no baseline","It describes the funding envelope as approved when it was increased mid-program","It uses vague language such as 'improved service outcomes'","It does not name the officers responsible for delivery"],answer:0,rationale:"The revision and the vagueness are both real faults, and both are fixable by editing. The missing baseline is not: without it, no version of this sentence can be substantiated, and an audit that tests the claim will find nothing behind it. Unmeasurable claims are the failure that cannot be written around.",optionNotes:["","A genuine problem, and a presentational one \u2014 the revision can simply be disclosed.","Vagueness is a symptom here. Sharpening the words without a baseline just makes an untestable claim more specific.","Naming officers is good practice but does not affect whether the claim can be substantiated."]},{id:"cl-p-s2",moduleId:"purpose",context:"A delivery team is disbanding in three weeks. The project manager proposes writing the closure report after the team has gone, 'when things are calmer and we can be objective about it'.",prompt:"What is the strongest argument against waiting?",options:["The undocumented detail leaves with the people, and that is the transferable part","Departmental policy requires closure reports to be submitted before team release","The project manager will be less objective later, not more","Delaying makes it harder to finalise costs in the correct financial year"],answer:0,rationale:"Objectivity may well improve with distance. What does not survive is the specific, unwritten knowledge \u2014 why an approach was abandoned, what the vendor actually said, which assumption broke first. That is precisely the reference-class detail the next team needs, and it walks out of the building with the people.",optionNotes:["","Policy varies by entity, and an argument from policy does not explain why the policy is right.","Distance usually helps objectivity. This argues the opposite of the likely truth.","A real administrative concern, but costs can be finalised without the narrative."]}],assignment:{title:"Name the four readers",instruction:"Take a piece of work you know that has finished or is finishing. Write down, for each of the four readers, the specific decision they would make with its closure report \u2014 and what they would actually do if the report were vague.",prompts:["Senior Responsible Officer \u2014 the decision, and the fallback if the report is vague","Finance \u2014 the decision, and the fallback","The next delivery team \u2014 the decision, and the fallback","Audit \u2014 the decision, and the fallback"],criteria:["Each decision is specific to this piece of work, not generic to closure reports","Each fallback names what the reader does instead, not merely that they are dissatisfied","At least one reader is identified as unable to obtain the information any other way"],modelAnswer:"SRO: decides whether to stand down the benefits governance board. If vague, keeps it running for another six months at cost, or quietly lets it lapse with nobody noticing. Finance: decides what to capitalise and what to expense. If vague, goes to the ledger and the asset register directly and ignores the report entirely. Next team: decides whether to reuse the same vendor integration pattern. If vague, cannot tell whether the pattern failed or the vendor did, and rediscovers the answer at the same cost. This is the reader with no alternative source. Audit: tests whether the reported benefit was measured. If vague, requests the underlying data, finds it was never collected, and raises a finding against the entity rather than the project."}},{id:"evidence",number:2,title:"Evidence, baselines and what you may claim",subtitle:"The difference between measured, estimated and asserted",minutes:0,slides:"",outcome:"Distinguish measured, estimated and asserted claims, and state a baseline that a later audit can test.",coreIdea:"Every sentence in a closure report is one of three things: something you measured, something you estimated, or something you asserted. Reports that survive scrutiny mark which is which. Reports that do not, blur all three into the same confident past tense.",sections:[{heading:"Three kinds of claim",body:"The confident past tense is the enemy. 'Processing time was reduced by 40 per cent' reads identically whether it came from a measured before-and-after, a modelled projection, or a workshop where someone said it felt about right. The reader cannot tell, so the reader either believes all of it or none of it \u2014 and an auditor will assume the weakest interpretation until shown otherwise.",table:{caption:"Marking the claim",head:["Kind","What backs it","How to write it"],rows:[["Measured","Data collected before and after, same definition both times","'Measured: median processing time fell from 14 to 9 days (Jan\u2013Mar vs Jul\u2013Sep 2026, n=4,102).'"],["Estimated","A model, with stated assumptions","'Estimated: 12,000 support contacts avoided annually, assuming the Q3 contact rate holds.'"],["Asserted","Informed judgement, no measurement","'Asserted: caseworker confidence improved. Basis: team lead observation, not measured.'"]]},example:"The third row is the one people resist writing. It is also the one that protects the other two: a report that openly labels its soft claims earns trust for its hard ones.",sourceIds:["anao-perf","rmg134"]},{heading:"Baselines, and the revision trap",body:"A baseline is only useful if it is the one that was approved when the decision was made. Reporting against the most recent revision is the single most common way a closure report is technically accurate and substantively misleading. The fix is not to hide revisions but to show the chain: original, each revision with its date and reason, and current.",bullets:["State the original approved baseline first, always.","Show each revision as a dated, reasoned change \u2014 not as the new normal.","Report performance against both original and final, and let the reader see the gap.","If no baseline was set, say so explicitly. It is a finding, not an embarrassment to be smoothed over."],example:"'Delivered within budget' against a twice-revised budget is the sentence auditors look for. 'Delivered at $51m against an original approved budget of $38m, revised to $47m (Nov 2025, scope addition) and $52m (Apr 2026, integration rework)' is the sentence that survives.",sourceIds:["closure","anao-gateway"]},{heading:"Traceability",body:"A claim is traceable when a reader who was not there can get from the sentence to the underlying data without asking you. In practice this means a reference to a named source, a date range, and a definition \u2014 because the same metric measured two ways produces two answers, and the difference is usually larger than the improvement being claimed.",bullets:["Name the system or dataset, not the team that produced the figure.","Give the date range and the sample size where relevant.","State the definition when the metric could reasonably be defined more than one way.","Where a definition changed mid-project, report both and say which is which."],example:"'Processing time' can mean lodgement to decision, lodgement to notification, or first-touch to decision. A 40 per cent improvement in one may be a 5 per cent improvement in another. Unstated, the reader assumes whichever is most flattering, and is right to.",sourceIds:["anao-perf"]}],questions:[{id:"cl-e1",moduleId:"evidence",prompt:"A closure report says 'processing time reduced by 40 per cent'. What single addition most improves its testability?",options:["The metric definition, periods compared, and data source","The name of the officer who approved the figure","A statement that the figure was validated by the delivery team","The percentage expressed as absolute numbers instead"],answer:0,rationale:"Testability means a stranger can reproduce the figure. Definition, period and source are what let them do that. Approval and internal validation are attestations, which are only as good as the underlying data they do not describe.",optionNotes:["","Attribution tells you who to ask, not whether the number is right.","Self-validation by the party being assessed adds no independent weight.","Absolute numbers help slightly, but without a definition and period they are equally untestable."]},{id:"cl-e2",moduleId:"evidence",prompt:"No baseline was captured before the change was made. What is the correct treatment in the closure report?",options:["State plainly that no baseline exists, and mark any improvement claim as estimated or asserted","Reconstruct a baseline from the best available historical data and report against it as measured","Omit the improvement claim entirely to avoid making an unsupported statement","Report the post-implementation figure alone and let the reader draw their own comparison"],answer:0,rationale:"Disclosure plus honest labelling. A reconstructed baseline may well be worth including \u2014 but as an estimate with its method stated, never as a measurement. Omitting the claim loses real information, and a bare post figure invites the reader to invent the comparison.",optionNotes:["","Reconstruction is legitimate; presenting it as measured is not. The label is the whole issue.","Silence destroys information the next team needs. Say it, and mark its strength.","This is the least honest option: it implies a comparison while taking no responsibility for it."]},{id:"cl-e3",moduleId:"evidence",prompt:"Which claim is correctly marked?",options:["Estimated: 12,000 contacts avoided annually, assuming the Q3 rate persists","The project delivered a significant reduction in avoidable contact volumes","Contact volumes were reduced by approximately 12,000 per year","Stakeholders confirmed that contact volumes fell substantially after release"],answer:0,rationale:"It names its kind (estimated), its magnitude, and the assumption the estimate depends on \u2014 so a reader can judge whether the assumption holds. The others are assertions wearing the grammar of measurements.",optionNotes:["","'Significant' is doing work no data supports here.","'Approximately' softens the number without disclosing whether it was measured or modelled.","Stakeholder confirmation is an assertion about perception, presented as a finding about volumes."]},{id:"cl-e4",moduleId:"evidence",prompt:"Why is reporting only against the final revised baseline misleading even when every figure is accurate?",options:["It conceals the gap between what was approved and what was delivered","Revised baselines are not formally approved and so carry no standing","It overstates delivery performance by using a smaller denominator","Auditors are required to reject reports that reference revised baselines"],answer:0,rationale:"The investment decision was made against the original. Whether the thing approved is the thing delivered is the question the report exists to answer, and reporting only against the revision quietly answers a different, easier one.",optionNotes:["","Revisions are usually formally approved. Their standing is not the problem.","Sometimes true arithmetically, but it is a consequence rather than the reason.","No such requirement exists. Revisions should be disclosed, not avoided."]}],scenarios:[{id:"cl-e-s1",moduleId:"evidence",context:"Your team measured 'time to decision' as lodgement-to-notification during discovery, and as first-touch-to-decision after release, because the new system made first-touch easier to capture. The headline improvement is 38 per cent.",prompt:"What must the closure report do?",options:["Report both definitions, state that it changed, and give a comparable figure","Use the newer definition throughout, since it is the more accurate measure of processing","Use the original definition throughout and discard the post-release data","Report the 38 per cent figure with a footnote noting a minor measurement change"],answer:0,rationale:"A definition change mid-measurement is exactly the circumstance where a real improvement and a measurement artefact are indistinguishable. Full disclosure of both, with a like-for-like comparison if the data allows, is the only treatment that lets a reader tell which they are looking at.",optionNotes:["","Accuracy of the newer definition is beside the point; you cannot compare it to a baseline captured differently.","Discarding data is worse than disclosing it, and the post-release figure has value on its own terms.","A footnote calling this 'minor' understates a change that may account for the entire result."]},{id:"cl-e-s2",moduleId:"evidence",context:"A sponsor asks you to remove the sentence disclosing that caseworker confidence was asserted rather than measured, on the grounds that 'it undermines the rest of the report'.",prompt:"What is the strongest professional response?",options:["Keep the disclosure, because it is what makes the measured claims elsewhere credible","Remove it, since an unmeasured claim adds nothing and its absence changes no conclusion","Move it to an appendix so it is disclosed without affecting the narrative","Replace it with a measured proxy, even a weak one, so the claim can stand"],answer:0,rationale:"The sponsor has the causation backwards. A report that marks its own weak claims signals that its strong ones have been tested; strip the marking and every claim in the document becomes equally unverifiable to a sceptical reader. The disclosure is load-bearing.",optionNotes:["","It changes the reader's calibration of everything else, which is a substantial effect.","Appendix burial is removal with extra steps, and a reader who finds it will trust the main text less.","Substituting a weak proxy to make a claim stand is how untestable numbers enter the record."]}],assignment:{title:"Mark up a claim set",instruction:"Write three claims about a piece of work you know \u2014 one measured, one estimated, one asserted. Mark each, and for the measured one give the definition, period and source.",prompts:["Measured claim, with definition, date range and data source","Estimated claim, with the assumption it depends on","Asserted claim, with the basis for the judgement"],criteria:["The measured claim names a source a stranger could go to without asking you","The estimate states an assumption that could turn out to be false","The assertion is labelled as such rather than dressed as a finding"],modelAnswer:"Measured: median lodgement-to-decision time fell from 14 days to 9 days, comparing Jan\u2013Mar 2026 (n=3,880) with Jul\u2013Sep 2026 (n=4,102), source: case management system extract CMS-RPT-114, definition unchanged across both periods. Estimated: approximately 11,500 support contacts avoided per year, assuming the Q3 2026 contact-per-application rate persists and application volumes remain within 5 per cent of forecast; if volumes grow as the department projects, the figure rises. Asserted: caseworkers report lower frustration with the status screen. Basis: three team-lead debriefs and unsolicited feedback in the September release retro. Not measured, and no survey instrument was in place."}},{id:"benefits",number:3,title:"Benefits realisation",subtitle:"Why benefits are the business's job, not the project's",minutes:0,slides:"",outcome:"Assign benefit ownership that survives closure, and schedule measurement that actually happens.",coreIdea:"Almost no benefit is realised during a project. Benefits accrue afterwards, in the operational business, over months or years \u2014 which means the entity that promised them is not the entity that delivers them, and closure is the handover point where that responsibility either transfers or evaporates.",sections:[{heading:"The timing mismatch",body:"The project spends the money and the business earns the return, usually long after the project has ceased to exist. This is not a flaw in how projects are run; it is what a project is. The consequence is that benefits realisation cannot be a project activity \u2014 by the time it is measurable there is no project. What closure can do is transfer ownership cleanly enough that measurement still happens.",bullets:["Post-implementation review typically sits 6 to 12 months after closure, when effects have had time to appear.","The Senior Responsible Officer remains accountable for benefits across the lifecycle, including after delivery ends.","Realisation is the operational business's responsibility, supported by a named benefit owner per benefit.","A benefit with no named owner is not a benefit; it is a hope recorded in a business case."],sourceIds:["teal","rmg106"]},{heading:"What a benefit owner has to have",body:"Naming an owner is the easy part and is usually where it stops. An owner who cannot act is decoration. Four things have to be true, and closure is the last moment at which you can make them true while anyone is still paying attention.",table:{caption:"The four conditions",head:["Condition","Test","Common failure"],rows:[["Named individual","A person and role, not a branch or committee","'The Service Delivery Group' \u2014 nobody"],["Has agreed","They have seen the number and accepted it","Told after the fact, disputes it later"],["Can influence it","Their decisions plausibly move the measure","Owner has no authority over the driver"],["Has the measurement","The data will exist without new work","Measure requires a collection nobody funded"]]},example:"A benefit owner who agrees to a 20 per cent contact-reduction target, but whose branch does not control the channel strategy driving contact volumes, will report against it honestly and helplessly for two years.",sourceIds:["teal","anao-perf"]},{heading:"Scheduling measurement that survives",body:"The most common cause of unmeasured benefits is not disagreement but decay: the measurement was scheduled into a forward plan that was superseded, in a system that was decommissioned, by a team that was restructured. Durable measurement is boring by design \u2014 it uses data already being collected for another reason, and it lands in a cycle that exists anyway.",bullets:["Prefer measures that ride on existing operational reporting over anything bespoke.","Anchor the review date to an existing governance cycle, not to a standalone calendar entry.","Write the measurement definition into the handover, so a successor can run it without archaeology.","Record what would count as the benefit not being realised \u2014 and what happens then."],example:"'Reviewed at the December Service Performance Committee, using the standing contact-volume report' outlasts 'benefits review scheduled for December 2027' by roughly the length of one restructure.",sourceIds:["rmg134","teal"]}],questions:[{id:"cl-b1",moduleId:"benefits",prompt:"Why can benefits realisation not be completed as a project activity?",options:["Benefits accrue in the business after delivery, when no project remains","Project teams lack the analytical skills to measure benefits properly","Benefits measurement is prohibited from being funded out of project budgets","Business cases deliberately defer benefits to avoid scrutiny during delivery"],answer:0,rationale:"It is a timing fact, not a capability or funding one. The money is spent by the project and the return is earned by the business afterwards, which is why ownership must transfer at closure rather than being retained.",optionNotes:["","Skills vary, but a highly capable team still cannot measure an effect that has not happened yet.","No such prohibition. Funding arrangements vary and are not the structural issue.","Cynical, and it describes a failure mode rather than the reason benefits arrive late."]},{id:"cl-b2",moduleId:"benefits",prompt:"A closure report names 'the Service Delivery Group' as owner of a contact-reduction benefit. What is wrong?",options:["A group cannot hold accountability \u2014 a named individual in a role is required","Service Delivery is the wrong part of the organisation for this benefit","Benefit ownership should sit with the Senior Responsible Officer, not a business area","The benefit should be owned jointly by delivery and operations"],answer:0,rationale:"Ownership diffused across a group is ownership by nobody: no individual's performance depends on it and no calendar entry belongs to anyone. The SRO remains accountable overall, but each benefit needs a person.",optionNotes:["","Service Delivery may well be right. The failure is the level of specificity, not the area.","The SRO is accountable across the lifecycle, which is not the same as owning each individual benefit.","Joint ownership compounds the problem rather than fixing it."]},{id:"cl-b3",moduleId:"benefits",prompt:"Which measurement arrangement is most likely to still be running in two years?",options:["A measure from standing reporting, reviewed at an existing committee","A dedicated benefits dashboard built by the project before it closes","A quarterly survey commissioned specifically to track the benefit","A calendar reminder to the benefit owner to compile figures annually"],answer:0,rationale:"Durability comes from riding on things that exist for independent reasons. A bespoke dashboard loses its maintainer, a commissioned survey loses its funding, and a calendar reminder loses its owner in the next restructure.",optionNotes:["","Built by a team that will not exist to maintain it. These decay fastest of all.","Needs recurring funding that nobody has committed past the project.","Survives exactly as long as the individual stays in the role."]},{id:"cl-b4",moduleId:"benefits",prompt:"A benefit owner accepts a target they cannot influence. What is the most likely outcome?",options:["Honest reporting of a measure that does not move, with no action available","The owner will renegotiate the target at the first review point","The benefit will be reassigned automatically to the area that controls the driver","The measure will be quietly dropped from reporting within a year"],answer:0,rationale:"The predictable result is a conscientious owner reporting a flat line for years. Nothing in the arrangement triggers reassignment or renegotiation, and dropping it requires someone to notice \u2014 which is precisely what a diffuse arrangement prevents.",optionNotes:["","Possible, but it requires initiative the arrangement does not create.","There is no automatic reassignment mechanism. Somebody would have to act.","Sometimes true, but it assumes an active review that the failed arrangement makes unlikely."]}],scenarios:[{id:"cl-b-s1",moduleId:"benefits",context:"At closure, three benefits are listed. Two have named owners who have signed. The third \u2014 a $2.4m annual efficiency saving \u2014 is owned by a branch head who has been on leave throughout the handover period and has not seen the figure.",prompt:"What should the closure report say?",options:["Record the benefit as having no agreed owner, and what must happen next","Name the branch head as owner, since the role is correct even if the individual has not confirmed","Escalate the benefit to the Senior Responsible Officer as an interim owner","Hold the closure report open until the branch head returns and signs"],answer:0,rationale:"The report should describe the world as it is. An unagreed owner recorded as agreed is the exact defect that produces orphaned benefits two years later. Naming the gap and the action requir
