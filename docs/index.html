t-3",moduleId:"outcomes",prompt:"Which pairing would best detect that a faster online form is pushing failures onto the phone channel?",options:["Completion rate and assisted-channel contact volume","Time on page and bounce rate across the whole form journey","Submission count and validation error count","Completion rate and satisfaction score"],answer:0,optionNotes:["","Both are online engagement measures and neither speaks to the other channel.","Both count online activity. A user who abandons and phones instead appears in neither.","Both measure the online channel. Neither can see the phone queue."],rationale:"Displacement is only visible if you measure the place the demand moves to. That is precisely what a guardrail on the assisted channel is for."},{id:"x-out-4",moduleId:"outcomes",prompt:"A dashboard reports 'notifications sent: 42,000'. Under what condition is that worth reporting?",options:["Never \u2014 it is a pure activity count and says nothing about result","When it is paired with whether recipients acted on them","When the number is growing quarter on quarter","When it is compared against the same quarter last year"],answer:1,optionNotes:["Too absolute \u2014 as a denominator for an action rate it is genuinely useful.","","Growth in an activity count tells you the system is busier, not better.","A comparison of two activity counts is still an activity count."],rationale:"Volume becomes meaningful the moment it is the denominator of a behaviour: of 42,000 sent, how many led to the action the notification existed to prompt?"},{id:"x-exp-1",moduleId:"exploration",prompt:"Which option should always be on the table before a build option is chosen?",options:["Extending an existing departmental system to cover it","Doing nothing at all until the next financial year","Removing the step or changing the process entirely","Buying a commercial off-the-shelf product instead"],answer:2,optionNotes:["A sensible reuse option, but again a technology response.","A legitimate choice, but deferral is not the same as questioning whether the step needs to exist.","","Sometimes right, but it is still a build-or-buy solution to an assumed problem."],rationale:"The deck asks for non-build, process and policy options in the option set. The cheapest fix is often deleting a step that only exists because of how the department is organised."},{id:"x-exp-2",moduleId:"exploration",prompt:"You run a prototype test with eight providers. Six complete the task, two do not. What have you learned?",options:["Nothing useful here \u2014 a sample of eight providers is far too small to conclude anything","The design works for roughly 75% of providers, so it is ready","The design is ready to build once the two failures are patched","The concept is broadly comprehensible, and two failure modes are worth understanding"],answer:3,optionNotes:["Eight is a reasonable qualitative sample for comprehension. The failures are the most informative part.","Eight participants cannot support a percentage. Treating qualitative counts as rates is a common misreading.","Comprehension is one risk. Feasibility, viability and scale are untested.",""],rationale:"Small-sample qualitative work tells you what can go wrong and why, not how often. The two failures are the finding; go and understand them."},{id:"x-exp-3",moduleId:"exploration",prompt:"'We'll build a small version and see how it goes.' What is missing for this to be an MVP?",options:["A budget and an approved delivery plan","A defined decision and a result that would change it","Full accessibility conformance from day one","A production release plan agreed with the operations team"],answer:1,optionNotes:["Cost matters, but a funded release that teaches you nothing is still not an MVP.","","Required regardless \u2014 but its presence does not make something an MVP.","An MVP may or may not go to production; that is not the defining property."],rationale:"'See how it goes' has no decision attached, so any result can be rationalised. An MVP exists to produce evidence about a specific question you have committed to acting on."},{id:"x-exp-4",moduleId:"exploration",prompt:"Policy will not permit the detail your design depends on. Which lens has failed, and what happens next?",options:["Viability \u2014 test whether the outcome is reachable within the constraint, or argue to change it","Desirability \u2014 redesign the service around what users say they would prefer instead","Feasibility \u2014 find a technical workaround that avoids the policy constraint entirely and ship it","Usability \u2014 simplify the interface until the missing detail is no longer needed"],answer:0,optionNotes:["","Users may well want it. That is not the blocker.","The technology is not the constraint here; the rule is.","Simplifying does not make a prohibited disclosure permitted."],rationale:"Policy and legal conditions are the viability lens. The two legitimate moves are designing to meet the intent within the constraint, or taking evidence to the policy owner."},{id:"x-del-1",moduleId:"delivery",prompt:"Two items: A is high value, high urgency, very large. B is moderate value, moderate urgency, very small. What does WSJF typically suggest?",options:["Neither \u2014 WSJF cannot compare items like these","A first, because urgency breaks the tie","A first, because value dominates the score","B first, because dividing by size favours it"],answer:3,optionNotes:["Relative comparison is exactly what WSJF is for.","Time criticality is part of cost of delay, still divided by size.","Value is the numerator, but the whole point of the formula is that it is divided by size.",""],rationale:"Cost of delay divided by job size systematically favours small valuable work, because benefit and learning arrive sooner per unit of effort. Judgement can still override."},{id:"x-del-2",moduleId:"delivery",prompt:"A stakeholder asks for a date for something in the 'Later' band. What is the right response?",options:["Give the date the team currently believes is achievable for the work","Give a date with a very wide confidence range attached to it","Explain what must be true before a date is meaningful, and what moves it to Next","Refuse to discuss anything at all beyond the items that are already in the Now band"],answer:2,optionNotes:["A believed date becomes a remembered commitment, regardless of caveats.","A range still implies you have estimated something you have not yet scoped or validated.","","Unhelpful. Stakeholders need direction even where dates are not available."],rationale:"Confidence bands exist because the evidence does not yet support a date. The useful answer converts the question into what would need to be resolved for one to exist."},{id:"x-del-3",moduleId:"delivery",prompt:"Which is the clearest sign a backlog has become a requirements dump?",options:["Items describe solutions with no stated outcome or measure","It has not been reordered for over a month","Multiple business areas are able to add items to it directly","It contains considerably more than 200 items"],answer:0,optionNotes:["","Concerning, but the ordering could still be correct.","The deck explicitly says anyone in the team may add; product management orders.","Size alone is normal for a long-lived product."],rationale:"The defect is not volume or authorship, it is items that cannot be traced to a user or service outcome \u2014 which makes their priority unjustifiable and their success unmeasurable."},{id:"x-del-4",moduleId:"delivery",prompt:"Halfway through a PI, discovery invalidates the hypothesis behind a committed feature. What should happen?",options:["Finish it anyway \u2014 the PI commitment was already made and communicated","Stop it, record what was learned, and re-plan the remaining capacity","Finish a reduced version of it to show progress","Continue and re-evaluate it at PI close instead"],answer:1,optionNotes:["Delivering something you now believe will not work is the sunk-cost fallacy with a governance wrapper.","","A smaller version of an invalidated idea is still an invalidated idea.","Waiting until close means spending the remaining weeks on it regardless."],rationale:"The plan changes when the evidence does \u2014 that is the 'adaptive' quality. Learning mid-increment is the parallel discovery stream working as intended."},{id:"x-life-1",moduleId:"lifecycle",prompt:"Which is the strongest evidence that a Discovery phase has actually finished?",options:["The discovery report has been written and signed off by the board","The time allocated to the phase has elapsed","You can state the problem, the users, the constraints and the unknowns","A preferred solution has been agreed with all of the stakeholders involved"],answer:2,optionNotes:["Sign-off records agreement with a document, not that the uncertainty has reduced.","Time elapsing is a budget event, not a knowledge event.","","Agreeing a solution in Discovery means it has run past its purpose into Alpha's territory."],rationale:"Discovery ends when you can articulate the problem and constraints clearly and name the remaining unknowns. Naming what you still do not know is part of the output."},{id:"x-life-2",moduleId:"lifecycle",prompt:"A Live service's completion rate has drifted down 8% over six months with no release in that period. What is the most likely cause?",options:["The original design was simply wrong from the start and is only now showing","Measurement error somewhere in the analytics","The code has degraded over time without releases","Something outside the service changed \u2014 users, policy or upstream systems"],answer:3,optionNotes:["Possible, but it would not explain a gradual change with a stable baseline earlier.","Worth ruling out, but drift with no release usually points outward, not at the instrument.","Code does not rot on its own without deploys. Dependencies around it do change.",""],rationale:"Services sit inside a moving system. Live-phase measurement exists to catch exactly this: the product did not change, but its context did."},{id:"x-life-3",moduleId:"lifecycle",prompt:"Why does the deck describe the lifecycle as a loop rather than a sequence?",options:["Because teams often have to redo work they thought was finished","Because measuring one release is the discovery input for the next","Because Agile delivery methods are iterative by design","Because in practice the phases frequently overlap with one another"],answer:1,optionNotes:["Rework is a symptom of a broken sequence, not the reason for the loop.","","True but circular \u2014 it names the method rather than the reason.","They do overlap, but overlap is not what makes it a loop."],rationale:"The loop closes because what you measure after release is what tells you which problem to solve next. Treating measurement as a terminal report breaks it."},{id:"x-life-4",moduleId:"lifecycle",prompt:"Which handover is sufficient at the Beta-to-Live transition?",options:["Documentation and runbooks, plus a named owner and an improvement cadence","A closure report and a benefits realisation statement signed off by the board","Transfer to the operations team with an agreed SLA","Documentation, runbooks and an agreed support rota"],answer:0,optionNotes:["","Documents the past and assigns nobody to the future.","An SLA covers availability, not whether the service achieves its outcome.","Keeps it running. Nobody is accountable for whether it still works for users."],rationale:"Operational support keeps a service up; product ownership keeps it useful. Without a named owner, measures and a cadence, quality decays with nobody accountable for noticing."},{id:"x-role-1",moduleId:"roles",prompt:"A designer and an engineer disagree about an approach in refinement. What is the product manager's job?",options:["Ask the Product Owner to break the tie between them","Decide it personally, since the product manager owns the product","Escalate the disagreement to the Solution Architect for a ruling","Make the trade-off explicit against the outcome, then get it decided"],answer:3,optionNotes:["It is not a backlog-clarity question, so it is not the PO's to break.","Deciding technical detail by authority wastes the expertise in the room.","Escalating a reversible team decision spends senior time and teaches the team not to decide.",""],rationale:"The trio exists so desirability, feasibility and viability are argued in the same conversation. The PM's contribution is framing the trade-off against the outcome, not overruling it."},{id:"x-role-2",moduleId:"roles",prompt:"Which decision most clearly belongs at the strategic layer?",options:["How a particular validation error message is worded","Whether to split a story into two smaller ones","Whether to retire a service and fold it into another","Which features go into the next Program Increment"],answer:2,optionNotes:["Delivery layer \u2014 'how do we deliver this well?'","Delivery layer.","","Coordination layer \u2014 'what should we deliver next?'"],rationale:"The strategic layer asks what future we are trying to create, and owns cross-product experience and service direction. Retirement and consolidation sit squarely there."},{id:"x-role-3",moduleId:"roles",prompt:"What is the practical cost of leaving decision rights unstated?",options:["Decisions default to whoever is most persistent","Teams make considerably more mistakes","Documentation grows without bound","Governance forums become longer and more frequent"],answer:0,optionNotes:["","Sometimes, but the deeper issue is that nobody knows whose call it was.","Documentation is not the mechanism by which authority gets captured.","A symptom, but not the core cost."],rationale:"Authority does not stay vacant. Unstated rights get filled by availability and persistence, which is how a service ends up shaped by whoever attends the most meetings."},{id:"x-role-4",moduleId:"roles",prompt:"In the deck's model, who is best placed to say whether the team is working on the right things?",options:["The Senior Responsible Officer","The Product Manager","The Scrum Master","The Product Owner"],answer:1,optionNotes:["Owns the project outcomes and champions the change, at a level above product direction.","","Owns team process and flow, not product direction.","Asks the complementary question: do teams have what they need to deliver successfully?"],rationale:"The deck pairs the two questions explicitly: the product manager asks whether we are working on the right things; the Product Owner asks whether teams can deliver them."},{id:"x-gov-1",moduleId:"government",prompt:"Which is the best evidence that the Digital Service Standard is being met, rather than merely claimed?",options:["Sign-off by the delivery manager at the governance gate","A completed self-assessment template held by the delivery team","Research, testing and performance data for each criterion","A statement of intent recorded in the approved business case"],answer:2,optionNotes:["Sign-off attests to process, not to criteria being met.","A template records that the questions were asked, not what the answers were.","","Intent is not evidence, and business cases are written before the work."],rationale:"The standard expects demonstration across the lifecycle. Governance evidence should show how criteria are being met, not that a document was completed."},{id:"x-gov-2",moduleId:"government",prompt:"Principle 4 says decisions belong closest to the problem. What does that require of governance?",options:["Delegating every decision to the delivery teams without exception","Faster approval turnaround from the forums","Fewer governance forums in the schedule","Delegating reversible decisions, reserving forums for risk"],answer:3,optionNotes:["Material risk, investment and cross-service trade-offs still need governance.","Speed helps but does not change which decisions need to go there at all.","Fewer forums without changed thresholds just delays the same decisions.",""],rationale:"The principle is about placement, not volume or speed. Reversible and local decisions go down; material risk and investment stay up."},{id:"x-gov-3",moduleId:"government",prompt:"Which is a legitimate reason for an accessibility issue to reach a governance gate unresolved?",options:["The assessment template did not require it to be checked at all","It was found late and a dated remediation plan is presented","It affects only a small number of users","It will be fixed in a later delivery phase"],answer:1,optionNotes:["Gate scope does not change the legal and standard obligation.","","Small user numbers do not reduce the obligation, and they usually undercount the people who never got far enough to be measured.","Deferral without a plan is the same decision as ignoring it."],rationale:"Finding a problem late is normal. Arriving without a plan, dates and interim mitigation is what turns a finding into a failure of assurance."},{id:"x-gov-4",moduleId:"government",prompt:"Which artefact belongs to the Pre-Delivery phase rather than Pre-Approval?",options:["A refined backlog with measures and baselines defined","The investment case for the programme","Options analysis with the associated risks and mitigations","Outcome hypotheses and early user evidence"],answer:0,optionNotes:["","The investment case is the Pre-Approval output by definition.","Options and risks support the investment decision \u2014 Pre-Approval.","Evidence and hypotheses make the case for investment \u2014 Pre-Approval."],rationale:"Pre-Delivery is where planning gets the right level of detail and the runway is established: refined backlog, validated approach, and baselines captured before build starts."},{id:"x-int-1",moduleId:"integration",prompt:"Which is the most honest thing to put in a status report when the outcome measure has not moved?",options:["It is too early to tell anything from the data yet","The measure needs revising because it is not the right one","Delivery is on track against the agreed plan and budget","The measure has not moved \u2014 here is what we will do"],answer:3,optionNotes:["Sometimes legitimate \u2014 but stated without a date by which it will be tellable, it is a way of deferring the conversation.","Sometimes right, but leading with it looks like moving the goalposts and destroys the baseline.","True and irrelevant if the work is not producing the change it was funded for.",""],rationale:"The chain of evidence is only useful if you report the link that is breaking. Naming it early is what lets a decision still be made."},{id:"x-int-2",moduleId:"integration",prompt:"Which of the six 'what good looks like' qualities is most at risk when a team optimises a single headline metric?",options:["Collaborative","Evidence based","User centred","Adaptive"],answer:2,optionNotes:["Collaboration concerns how options get shaped, which single-metric focus does not directly damage.","Ironically the metric is evidence \u2014 the problem is that it is the wrong evidence, narrowly held.","","The plan may still adapt; it just adapts toward the wrong target."],rationale:"Optimising one number reliably produces decisions that serve the number rather than the people behind it \u2014 which is the failure mode user-centredness names."},{id:"x-int-3",moduleId:"integration",prompt:"You have three minutes with a Minister's adviser. What do they need?",options:["The outcome, the evidence, the risk, and the decision","The full evidence base behind the current product position","The technical architecture and integration detail","The delivery timeline with all of its milestones"],answer:0,optionNotes:["","Depth without framing is unusable in three minutes.","Almost never the right level for this audience.","Timeline without outcome invites a question about dates rather than value."],rationale:"Adjust the depth, not the facts. At the most senior level that means outcome, evidence, risk and the decision required \u2014 in that order."},{id:"x-int-4",moduleId:"integration",prompt:"What most reliably distinguishes a defensible prioritisation decision from a defensive one?",options:["It was made in a formal governance forum with minutes","It can name the evidence that would change it","It has agreement from all stakeholders","It follows an agreed scoring model"],answer:1,optionNotes:["Venue is not reasoning.","","Agreement can be reached about an unjustifiable decision.","A score is the output of a judgement, not the justification for it."],rationale:"A defensible decision is falsifiable: you can state what would make you change your mind. A defensive one is protected from evidence rather than grounded in it."}],gt=[{id:"provider-status",title:"Provider application status",subtitle:"The deck's running case, worked end to end",outcome:"worked",summary:"Providers phone the support centre constantly to check where participant applications have got to. The obvious response is a status page. This case follows the chain properly and arrives somewhere better than the obvious response.",steps:[{moduleId:"thinking",stage:1,heading:"Framing it as a product, not a ticket",body:"The request arrived as 'build a status page', already scoped and already funded as a project deliverable. The product manager's first move was not to refuse it but to ask what would still be true in two years: who owns the status experience, who notices when it degrades, and what happens when the underlying systems change again.",insight:"The request was not wrong, it was premature. Reframing it as an owned capability rather than a deliverable is what created room to ask why the calls happen at all."},{moduleId:"discovery",stage:2,heading:"Finding the actual difficulty",body:"Call-reason coding said 'status enquiry' was the top driver. Twelve provider interviews and four hours of contact-centre observation said something more specific: providers were not confused about where an application was, they were unable to tell whether they needed to do anything. Most calls ended with the agent saying 'nothing needed at your end'.",artefact:"Our providers are currently experiencing uncertainty about whether action is required from them when supporting a participant's application. This occurs across the provider portal and the support line, and has been happening since the 2023 platform split. This is critical because it generates avoidable support demand and delays participants. Evidence: call-reason coding, 12 interviews, 4 hours of contact-centre observation.",insight:"The stated problem was 'I cannot see the status'. The real problem was 'I cannot tell whether it is my turn.' A status page answers the first and not the second."},{moduleId:"outcomes",stage:3,heading:"Defining success before building",body:"The team wrote the objective around resolution rather than deflection, precisely because deflection is easy to fake by making it harder to call. A guardrail was set on the assisted channel so that any improvement achieved by pushing demand elsewhere would show up immediately.",artefact:`Objective: providers can tell whether action is required, without contacting us.
KR1: avoidable status contacts down 30% (baseline 4,100/month).
KR2: providers correctly state their next action unprompted in 8 of 10 usability sessions.
Leading: proportion of sessions reaching the next-action panel.
Guardrail: median time to resolution for unresolved cases does not worsen.`,insight:"The guardrail is the part that gets cut under pressure and the part that later proves you did not simply displace the problem."},{moduleId:"exploration",stage:4,heading:"Testing the cheap thing first",body:"Three options went on the table: the requested status page, an action-required notification, and a non-build option of changing the provider's default view. The riskiest assumption was shared by all three \u2014 that providers would trust departmental status enough to act on it. A prototype with manually supplied data tested comprehension and trust before any integration work was scoped.",artefact:`Decision: whether to fund the status integration.
Riskiest assumption: providers will act on departmental status rather than ringing to confirm it.
Method: clickable prototype, manually supplied data, 8 representative providers.
Proceed if 6 of 8 state the correct next action unprompted AND say they would not call to confirm.`,insight:"The expensive integration was never the question. Whether the information would be believed was the question, and it cost eight conversations to answer."},{moduleId:"delivery",stage:5,heading:"Ordering the work honestly",body:"The feature was sized to a single PI and written with a measurement field from the start. A dependency on the assessment platform's status API was recorded as a risk rather than assumed away, and the roadmap said Now/Next/Later rather than naming dates the evidence could not support.",artefact:`Feature hypothesis: providers shown a plain-language next action will resolve without contacting support.
Measurement: successful self-service rate for status queries, target 65% in the first PI after release.
In scope: application progress and required action. Out of scope: payment status.
Dependency: status API refresh frequency from the assessment platform.`,insight:"The measurement field is what made the next stage possible. Without it the PI would have closed with the benefit assumed."},{moduleId:"government",stage:8,heading:"Meeting the standard without theatre",body:"Accessibility testing during Beta found that status was conveyed by colour alone in the first build. It was fixed before Live rather than logged as an enhancement. At the gate the team presented the finding, the fix and the residual risk on data freshness rather than a completed template.",insight:"Presenting a problem you have already fixed builds more governance confidence than presenting a clean template. It also makes the next honest report easier."},{moduleId:"integration",stage:9,heading:"What the evidence said afterwards",body:"Avoidable contacts fell 34%. The guardrail held: time to resolution for unresolved cases was flat. Usability sessions reached 9 of 10 on next-action comprehension. One finding was uncomfortable \u2014 providers with the largest caseloads still called, because they were checking several participants at once and the design assumed one.",insight:"The result was good and incomplete. Naming the caseload finding turned a successful release into the start of the next cycle rather than the end of the project."}],closing:"The team ended up building roughly what was originally asked for, but with a different core: an action-required signal rather than a status display. That difference came entirely from stage 2, and would have been invisible if the work had started at stage 5."},{id:"employer-vacancy",title:"Employer vacancy drop-off",subtitle:"A case where the method catches the mistake \u2014 late",outcome:"corrected",summary:"Employers were abandoning the vacancy-advertising form at high rates. The team fixed the form, the completion rate improved sharply, and the outcome did not move at all. This case is included because a method that only ever endorses itself teaches nothing.",steps:[{moduleId:"discovery",stage:2,heading:"Where the team started \u2014 and stopped",body:"Analytics showed 61% abandonment at the position-details step. The team ran a heuristic review, found the step long and the wording dense, and moved straight to redesign. No employer was interviewed. The reasoning felt sound: the data showed exactly where people left.",insight:"Analytics told them WHERE. Nobody established WHY. The team treated a location as a diagnosis \u2014 the single most common discovery failure."},{moduleId:"outcomes",stage:3,heading:"The measure that let it happen",body:"Success was defined as form completion rate. It was specific, baselined and time-bound \u2014 it looked like a good key result and satisfied every formal test. What it never asked was whether a completed form produced a filled vacancy.",artefact:`Objective: make advertising a vacancy easier.
KR1: completion rate 39% \u2192 65% by March.
(no guardrail, no outcome measure beyond the form itself)`,insight:"A well-formed key result measuring the wrong thing is more dangerous than a vague one, because it passes review and then drives the work."},{moduleId:"delivery",stage:5,heading:"A clean delivery of the wrong thing",body:"The redesign shipped in one PI. Completion rose from 39% to 71%, beating the target. The team graded the key result a 4 and closed the epic. Delivery performance was genuinely excellent.",insight:"Every delivery signal was green. This is what makes output-based measurement so persistent: it rewards teams accurately for the wrong achievement."},{moduleId:"integration",stage:9,heading:"The finding nobody was looking for",body:"Six months later an unrelated analysis showed vacancies filled had not moved. Digging in: the abandoned step had been acting as an unintentional filter. Employers who found it hard were largely those posting roles with pay or conditions that would not attract candidates. Making the form easier produced more listings, not more filled vacancies \u2014 and increased assessment workload downstream.",insight:"The friction was doing work nobody had noticed. Removing it optimised the measure and degraded the service, which is the exact failure a guardrail on a downstream outcome would have caught within weeks."},{moduleId:"outcomes",stage:3,heading:"What the correction looked like",body:"The team rewrote the measure set around the outcome the service exists for, kept the completion improvement, and added the guardrail that should have been there. Crucially they did not revert the redesign \u2014 the form genuinely was better, it just was not sufficient.",artefact:`Objective: employers fill roles through the service.
KR1: vacancies filled within 30 days 22% \u2192 30%.
Leading: completion rate (retained \u2014 it moves early).
Guardrail: downstream assessment workload per filled vacancy does not rise.
Guardrail: proportion of listings receiving zero applications does not rise.`,insight:"Completion rate was not a bad measure. It was a leading indicator being used as an outcome. That distinction is the whole of stage 3."}],closing:"Nothing in this case required unusual insight to avoid. A single guardrail on a downstream outcome would have surfaced the problem in the first month instead of the sixth. That is the entire argument for defining the measure set before delivery rather than after."}],Fn=[{id:"provider",title:"Provider application status",short:"The deck's case. Support demand driven by uncertainty.",brief:"Providers frequently contact support because they cannot reliably understand participant application progress. Information is fragmented across systems, policy and operational constraints matter, and any response must remain accessible, secure and clear about escalation.",twist:"The obvious answer \u2014 a status page \u2014 is close to right but not quite. Whether you find the gap depends entirely on how you handle stage 2."},{id:"vacancy",title:"Employer vacancy drop-off",short:"High abandonment on a form. The obvious fix makes things worse.",brief:"Employers abandon the vacancy-advertising service at 61% at the position-details step. Leadership wants the form simplified and has asked for a completion-rate target. The service exists so that roles get filled, and downstream assessment capacity is already stretched.",twist:"Removing the friction is straightforward and will move the completion rate. Whether it moves the outcome is a different question, and the brief contains enough to work out why."},{id:"own",title:"A service you actually work on",short:"Bring your own. Hardest and most useful.",brief:"Choose a service you are responsible for or close to. You will not have clean evidence, the constraints will be real, and someone will already have a preferred solution. That is the point \u2014 the method has to survive contact with an actual organisation.",twist:"The discipline that matters here is honesty about what you do not know. Mark assumptions as assumptions rather than quietly promoting them to facts."}],ko=[{moduleId:"thinking",good:"The team can name the outcome the work is meant to change, and who owns it after go-live.",usual:"The team can name the scope and the date, and ownership after go-live is unassigned.",tell:"Ask three people what changes for users if this succeeds. If you get three different answers, there is no outcome \u2014 only scope."},{moduleId:"thinking",good:"Strategy states what is deliberately not being pursued this year.",usual:"Strategy lists priorities, all of which are 'high'.",tell:"Count the things labelled top priority. More than three and the prioritisation has not happened yet."},{moduleId:"discovery",good:"The problem statement describes observed behaviour and cites where the evidence came from.",usual:"The problem statement describes a missing feature.",tell:"Remove every proposed solution from the statement. If nothing meaningful is left, it was a solution wearing a problem's clothes."},{moduleId:"discovery",good:"Analytics locate the problem; qualitative work explains it; the two are checked against each other.",usual:"Analytics locate the problem and the team infers the cause from the location.",tell:"Ask what would have to be true for the obvious explanation to be wrong. If nobody has checked, you have a location, not a diagnosis."},{moduleId:"outcomes",good:"Every key result has a baseline, and at least one guardrail protects a group or channel.",usual:"Key results have targets but no baselines, and no guardrails at all.",tell:"Ask what number it is today. If nobody knows, you cannot demonstrate improvement later \u2014 only assert it."},{moduleId:"outcomes",good:"The measure would change the decision if it moved the wrong way.",usual:"The measure is reported monthly and has never changed anything.",tell:"Name the last decision this metric altered. If there isn't one, it is a vanity metric regardless of how rigorous it looks."},{moduleId:"exploration",good:"At least one option in the set is non-build \u2014 process, policy, guidance, or removing a step.",usual:"Every option is a different way to build the same thing.",tell:"If all your options need engineering, you started generating after the solution had already been chosen."},{moduleId:"exploration",good:"The stop condition was written before the test ran.",usual:"The result is interpreted after the fact, and always supports continuing.",tell:"Ask what result would have killed this. If the honest answer is 'none', the test was theatre."},{moduleId:"delivery",good:"Every feature carries a measurement field, and it is filled in.",usual:"Features carry acceptance criteria, so you learn whether it was built but never whether it worked.",tell:"Open the last three completed features. If none records what changed, the loop is not closing."},{moduleId:"delivery",good:"The roadmap uses confidence bands beyond the current increment.",usual:"The roadmap gives dates for everything, and the far ones are quietly known to be fiction.",tell:"Ask what evidence supports the date twelve months out. If it is 'that is when the funding ends', it is a constraint, not a forecast."},{moduleId:"lifecycle",good:"A live service has a named owner, a measure and a review cadence.",usual:"A live service has a support rota and an SLA for availability.",tell:"Ask who decides what gets improved next. If the answer is a team that no longer exists, decay has already started."},{moduleId:"roles",good:"Reversible decisions are made by the team; governance sees material risk and investment.",usual:"Everything is escalated, so governance is busy and slow on the things that matter.",tell:"Look at the last governance agenda. Count items that could have been decided by the team without meaningful risk."},{moduleId:"roles",good:"The Product Owner spends most of the week on refinement and acceptance.",usual:"The Product Owner spends most of the week relaying questions between the team and the business.",tell:"If the PO is the only route to an answer, decision rights were never agreed \u2014 that is a structural problem, not a workload one."},{moduleId:"government",good:"Gate papers show what was learned, what changed as a result, and what is still uncertain.",usual:"Gate papers show that the required documents exist and are signed.",tell:"Search the last gate paper for the word 'assumption'. Zero mentions usually means the risks were smoothed rather than surfaced."},{moduleId:"government",good:"Accessibility is tested during Beta and blockers are fixed before Live.",usual:"Accessibility is assessed near Live and issues become post-launch enhancements.",tell:"Ask when the first assistive-technology test is scheduled. If it is after the build is complete, it is an audit, not design."},{moduleId:"integration",good:"Priority decisions can name the evidence that would reverse them.",usual:"Priority decisions cite a scoring model or a sponsor.",tell:"Ask what would change your mind. An answer you cannot give is a decision that cannot be argued with \u2014 which is not the same as a good one."},{moduleId:"integration",good:"Results are reported disaggregated, so harm to a subgroup is visible.",usual:"Results are reported as averages, and the average is genuinely better.",tell:"Split the headline number by channel, assistive technology and caseload size. If nobody has, you do not yet know who you helped."}];var pe="15 August 2026",Io=[{id:"deck",title:"Product Management Fundamentals \u2014 12AUG2026",publisher:"DEWR / Digital Experience and Solutions Division",note:"Primary course spine, 98 slides across nine sections. Slide ranges are shown on each stage.",checked:pe},{id:"dss",title:"Digital Service Standard, Version 2.0",publisher:"Australian Government / Digital Transformation Agency",url:"https://www.digital.gov.au/policy/digital-experience/digital-service-standard",note:"Current standard: 10 criteria, reduced from the former 13. Fully in effect \u2014 new services from 1 July 2024, and public-facing services that existed before that date from 1 July 2025.",checked:pe},{id:"dsspdf",title:"The Digital Service Standard Version 2.0 (PDF)",publisher:"Australian Government",url:"https://www.digital.gov.au/sites/default/files/documents/2024-10/Digital%20Service%20Standard.pdf",note:"The criteria in full. This October 2024 file supersedes the July 2024 PDF that earlier versions of this course linked to.",checked:pe},{id:"scrum",title:"The Scrum Guide (2020)",publisher:"Ken Schwaber and Jeff Sutherland",url:"https://scrumguides.org/docs/scrumguide/v2020/2020-Scrum-Guide-US.pdf",note:"Authoritative definitions for Product Goal, Product Backlog, Sprint Goal and Increment. Note that Scrum does not define epics, features or Program Increments.",checked:pe},{id:"wsjf",title:"Weighted Shortest Job First",publisher:"Scaled Agile Framework",url:"https://framework.scaledagile.com/wsjf/",note:"Defines WSJF as relative cost of delay divided by relative job duration/size, and cost of delay as user/business value plus time criticality plus risk reduction or opportunity enablement.",checked:pe},{id:"cdh",title:"Opportunity Solution Trees",publisher:"Teresa Torres, Product Talk",url:"https://www.producttalk.org/2016/08/opportunity-solution-tree/",note:"Free, full article. Mapping a clear outcome to opportunities, then to solutions and assumption tests, by a product trio.",checked:pe},{id:"svpg",title:"The Product Operating Model: An Introduction",publisher:"Marty Cagan, Silicon Valley Product Group",url:"https://www.svpg.com/product-vs-feature-teams/",note:"Outcome-accountable teams and the value, usability, feasibility and viability risks addressed in discovery.",checked:pe},{id:"eriksson",title:"What, exactly, is Product Management?",publisher:"Martin Eriksson, Mind the Product",url:"https://www.mindtheproduct.com/what-exactly-is-a-product-manager/",note:"Origin of the business / technology / user-experience intersection framing quoted on slides 8 and 54 of the source deck, where it appears unattributed.",checked:pe},{id:"ideo",title:"Introduction to Design Thinking",publisher:"IDEO",url:"https://designthinking.ideo.com/introduction",note:"Human-centred innovation balancing desirability, feasibility and viability.",checked:pe},{id:"lean",title:"What is a Lean Canvas?",publisher:"Ash Maurya",url:"https://ashmaurya.com/blog/what-is-lean-canvas",note:"The canvas as a one-page model of assumptions to expose and test, adapted on slide 33 of the deck.",checked:pe},{id:"perri",title:"Product strategy and the build trap",publisher:"Melissa Perri",url:"https://melissaperri.com/blog",note:"Free articles. Named in the deck's recommended reading (slide 97); the source of the 'build trap' framing behind outputs-versus-outcomes.",checked:pe},{id:"pichler",title:"Product Roadmaps and Product Strategy",publisher:"Roman Pichler",url:"https://www.romanpichler.com/blog/goal-oriented-agile-product-roadmap/",note:"Named in the deck's recommended reading (slide 97). Goal-oriented roadmaps as an alternative to dated feature lists.",checked:pe},{id:"retrieval",title:"Test-Enhanced Learning",publisher:"Roediger and Karpicke (2006)",url:"https://pubmed.ncbi.nlm.nih.gov/16507066/",note:"Retrieving knowledge strengthens later retention more effectively than passive restudy over longer delays.",checked:pe},{id:"spacing",title:"Distributed Practice in Verbal Recall Tasks",publisher:"Cepeda et al. (2006)",url:"https://pubmed.ncbi.nlm.nih.gov/16719566/",note:"Quantitative review supporting study distributed across time rather than massed into one sitting.",checked:pe},{id:"techniques",title:"Improving Students' Learning With Effective Learning Techniques",publisher:"Dunlosky et al. (2013)",url:"https://pubmed.ncbi.nlm.nih.gov/26173288/",note:"Rates practice testing and distributed practice as high-utility. Note that it rates rereading and highlighting as low-utility \u2014 which is why this system makes you retrieve.",checked:pe}],U=[{id:"thinking",number:1,title:"Product thinking and strategy",subtitle:"Move from delivering scope to creating value",minutes:45,slides:"1\u201320",outcome:"Explain what makes something a product, distinguish product from project thinking, connect vision to strategic choices, and apply product thinking inside a project-funded environment.",coreIdea:"A product is an enduring vehicle for value. Product management keeps user needs, organisational outcomes and technical reality in productive tension \u2014 and it works partially before it works perfectly.",sections:[{heading:"Product is an ownership model, not merely software",body:"A product can be a digital service, a policy-enabled capability, an operational system or a combination of these. What matters is that it serves identifiable users, has ongoing ownership, evolves through evidence and is judged by the value it creates. The deck puts it directly: a service is the series of interactions that helps someone do something; a product is the tool created to deliver that service.",bullets:["A project is a temporary structure for coordinating investment and delivering change.","A product persists after launch and must be operated, measured and improved.","A release is an output; a changed user or organisational result is an outcome.","A product solves a problem, delivers value, supports outcomes, evolves over time and has ongoing ownership."],example:"Launching an application-status page is an output. Providers resolving their status questions without calling support is an outcome.",sourceIds:["deck","scrum"]},{heading:"The product manager's central judgement",body:"Product management is often described as the intersection of business, technology and user experience \u2014 a framing that originates with Martin Eriksson and appears on slides 8 and 54 of the deck without attribution. The role is not to collect every request or write every requirement. It is to make evidence-informed choices where user value, organisational value and technical constraints meet, and to keep the team aligned on why the work matters.",bullets:["Desirable or valuable: people have a meaningful need and will use the result.","Viable: policy, operational, financial, legal and service constraints can sustain it.","Feasible and usable: the team can build and operate it, and people can understand it.","The deck names three accountabilities: vision and strategy, execution and delivery, and product success."],sourceIds:["eriksson","svpg","ideo","deck"]},{heading:"Vision gives direction; strategy makes choices",body:"Vision describes the future state worth moving toward. Strategy identifies the critical problems and choices that create progress toward it. A roadmap then communicates a current sequence of bets \u2014 it is not the strategy itself. The deck is blunt about this: strategy is not doing everything, building every feature or satisfying every stakeholder. It is choosing priorities, focusing investment, making trade-offs and deciding what not to do.",bullets:["Vision should be stable enough to orient multiple delivery cycles.","Strategy says where to focus and, crucially, what not to pursue now.","Priorities should be traceable to evidence, constraints and desired outcomes.","A list that accommodates every stakeholder is a decision deferred, not a strategy."],example:"Vision: providers can understand and manage applications with confidence. Strategy: first reduce uncertainty at the three points that generate most avoidable support demand. Deliberate non-priority: no changes to the assessment workflow this year.",sourceIds:["deck","svpg","perri"]},{heading:"Product thinking survives inside project funding",body:"Government funds projects, not products. Departments run project frameworks, not product frameworks. Delivery is measured by outputs more often than by value. All of this is true, and none of it makes product thinking impossible \u2014 it makes partial adoption the realistic goal. The deck's own framing is that product management is not all or nothing.",bullets:["Doing some discovery is better than doing none.","Using outcomes imperfectly is better than tracking only outputs.","Testing one assumption is better than testing none.","Getting some user feedback after a release is better than none."],example:"A project with fixed scope and a fixed date can still run a two-week bounded discovery on the riskiest assumption, and still define one outcome measure and one guardrail before build starts.",sourceIds:["deck"]},{heading:"The shift in thinking, in four pairs",body:"The deck compresses the whole first section into four contrasts. They are worth memorising because they diagnose most disagreements you will have about priority.",table:{caption:"Slide 13 \u2014 A shift in thinking",head:["From","To","What changes in practice"],rows:[["Projects","Products","Ownership continues after go-live; someone is accountable for performance."],["Outputs","Outcomes","Success is a measured change, not a delivered artefact."],["Requirements","Problems","The team is briefed on the problem and constraints, not handed a solution."],["Delivery","Learning","Each release is expected to produce evidence that changes the next decision."]]},sourceIds:["deck","perri"]}],questions:[{id:"thinking-q1",moduleId:"thinking",prompt:"Which statement best distinguishes a product from a project?",options:["A product has ongoing ownership and is improved against outcomes","A product uses Agile delivery while a project uses waterfall planning","A product is digital while a project can also include policy work","A product has no fixed constraints on time, cost or scope"],answer:0,optionNotes:["","Method is not the distinction. A project can be run iteratively and a product can be managed badly in either method.","Both can be either. The deck explicitly says a product may be a digital application, a policy, a set of operational procedures, or a combination.","Products operate under constraints permanently \u2014 funding, policy, legacy systems and capacity. The difference is duration of ownership, not absence of limits."],rationale:"Method and medium do not define the distinction. Ongoing ownership, learning and outcome accountability do."},{id:"thinking-q2",moduleId:"thinking",prompt:"A list containing every stakeholder's requested feature is primarily\u2026",options:["A product strategy","An unmade set of choices","A measurable outcome set","A product vision statement"],answer:1,optionNotes:["Strategy requires focus and trade-offs. A list that accommodates everyone has made no trade-off.","","An outcome is a measured change. A feature list is a set of proposed outputs.","A vision describes a future state, not an inventory of requests."],rationale:"Strategy requires focus and trade-offs. Accepting everything avoids the strategic decision."},{id:"thinking-q3",moduleId:"thinking",prompt:"Your department funds projects, runs a project framework and reports on delivery milestones. What does the deck say this means for product management?",options:["Product management applies only to the digital components of the project itself","Product management cannot be applied until the departmental funding model changes","Product thinking can operate inside project delivery, and partial adoption is worthwhile","The project framework should be abandoned entirely for a product framework"],answer:2,optionNotes:["Whole-of-service thinking is the point. Restricting product practice to the digital layer reproduces the problem it is meant to solve.","This is the counsel of despair the deck explicitly argues against. Waiting for the operating model to change means never starting.","","Nothing in the deck proposes replacing the departmental framework. The two are designed to coexist."],rationale:"'Product management is not all or nothing.' Some discovery beats none; imperfect outcomes beat outputs alone."},{id:"thinking-q4",moduleId:"thinking",prompt:"In the shift-in-thinking pairs, what replaces 'requirements'?",options:["Feature epics","Acceptance criteria","Roadmap items","Problems to solve"],answer:3,optionNotes:["An epic is a backlog container. It can carry a requirement mindset just as easily as an outcome mindset.","Acceptance criteria are still needed \u2014 they define done for a slice. The shift is about what the team is briefed on.","A roadmap communicates sequence and confidence. It is not the counterpart to requirements.",""],rationale:"Slide 13 pairs projects/products, outputs/outcomes, requirements/problems and delivery/learning. Teams briefed on problems can find better solutions than the one someone specified."}],scenarios:[{id:"thinking-s1",moduleId:"thinking",context:"Funding and the delivery date are fixed. A senior stakeholder says discovery is pointless because the team must deliver the approved scope.",prompt:"What is the strongest product-management response?",options:["Remove all discovery and ask the business for detailed requirements up front","Reject the project outright because product work cannot operate under these constraints","Use bounded discovery to test the riskiest assumptions within the approved constraints","Promise every requested feature and measure success after the project closes"],answer:2,optionNotes:["This guarantees the approved scope is built exactly as imagined, including whichever parts are wrong. It converts a delivery risk into a certainty.","Constraints are the normal condition of government delivery. Refusing to work inside them removes product practice from where it is most needed.","","Measuring after closure means measuring after the team has disbanded and the budget has closed \u2014 the point at which nothing can be changed."],rationale:"Product thinking can operate within project constraints. The practical move is to reduce uncertainty early and protect the most valuable outcome inside the approved envelope."},{id:"thinking-s2",moduleId:"thinking",context:"You inherit a service with a clear vision statement, a 40-item feature list and no stated priorities. Every item has an internal sponsor and the team is delivering roughly in the order requests arrived.",prompt:"What is the first thing to establish?",options:["A steering committee vote to rank all forty of the items","A commitment to deliver the top twenty items this financial year","A detailed estimate for all forty items so the sponsors can see the total cost","The two or three problems that most block the vision, and what will be deferred"],answer:3,optionNotes:["A vote ranks preferences, not value. It converts the loudest voice into a number and gives the result false authority.","This picks a quantity before establishing a rationale. It also re-commits to the arrival-order problem, just with a cut line.","Estimating everything is expensive and answers a question nobody needs answered. It also implies all 40 items are still candidates.",""],rationale:"The missing artefact is not an estimate or a ranking \u2014 it is the strategic choice. Naming the critical problems, and what is explicitly not being pursued, is what turns a vision and a list into a strategy."}],assignment:{title:"Write a one-page strategic chain",instruction:"Choose a service you know. Connect one user group to a future state, a strategic focus and a deliberate non-priority.",prompts:["Who is the user and what are they trying to achieve?","What future state should the vision describe?","What problem will you focus on first \u2014 and what will you explicitly defer?","Which of the four shift-in-thinking pairs is hardest in your context, and what would make it easier?"]}},{id:"discovery",number:2,title:"Discovery and problem framing",subtitle:"Build evidence before committing to a solution",minutes:55,slides:"21\u201335",outcome:"Plan discovery, distinguish four kinds of user need, tell evidence from assumption, diagnose root causes, and write testable problem, opportunity and hypothesis statements.",coreIdea:"Discovery reduces uncertainty about users, problems and opportunities. It produces insight, not requirements \u2014 and it should change a decision, not merely generate artefacts.",sections:[{heading:"Understand behaviour in context",body:"Interviews, observation, workshops, analytics, support data and surveys reveal different parts of the service. Triangulation matters because stated preferences, actual behaviour and system constraints frequently disagree.",bullets:["Research the whole journey, including non-digital channels and workarounds.","Separate direct evidence from interpretation and inherited belief.","Include people with varied access, capability and support needs."],sourceIds:["deck","dss","cdh"]},{heading:"Four kinds of need \u2014 and the one government creates",body:"The deck distinguishes what users are experiencing now from what they say, what they assume and what the system forces on them. The fourth category is the one most often mistaken for a user need, and it is the one product managers in government are uniquely placed to challenge.",table:{caption:"Slide 23 \u2014 what are we trying to understand?",head:["Kind of need","What it is","How you find it"],rows:[["Current experience","What users do now, and the tools they already use to reach their goal.","Observation, analytics, support data, walking the process."],["Stated needs","What users explicitly tell you they need \u2014 for example, a mobile-responsive service.","Interviews, surveys, feedback channels."],["Unstated needs","What users expect without ever asking \u2014 for example, information they can understand.","Observation of failure and hesitation; usability testing."],["Created needs","What users are forced to do because of policy or the way government works.","Journey mapping and blueprinting; asking why a step exists at all."]]},example:"'Providers need a form to request a status update' is a created need. The underlying need is to know the status. The form exists because the department has no self-service channel \u2014 that is a design decision, not a user requirement.",sourceIds:["deck"]},{heading:"Artefacts are thinking tools",body:"Personas summarise meaningful behavioural patterns; journey maps show the experience over time; service blueprints connect visible interactions to backstage people, processes and systems. None of them is the outcome. Their value is the decision they improve.",table:{caption:"Slides 25\u201327 \u2014 what each artefact is for",head:["Artefact","Purpose","Typically contains"],rows:[["Persona","Shared understanding of who the users are.","Goals, needs, behaviours, motivations, challenges, context."],["Journey map","Find where improvement will have the greatest impact.","User goals, activities, touchpoints, emotions, pain points, opportunities."],["Service blueprint","Understand how the service operates behind the scenes.","User actions, front-stage activities, back-stage activities, supporting systems and processes."]]},bullets:["A persona must be grounded in research, not a demographic stereotype.","A blueprint exposes why the front-stage experience behaves as it does.","If an artefact would not change what the team does next, it is decoration."],sourceIds:["deck","dss"]},{heading:"Discovery produces insight, not requirements",body:"The deck draws a hard line here. Discovery produces interview notes, survey responses, analytics, feedback and observations. It does not produce requirements, features or solutions. The moment a discovery report contains a solution, it has stopped being evidence and started being advocacy.",bullets:["Discovery outputs: insights, personas, journey maps, blueprints, problem statements, opportunities, hypotheses.","These become the inputs to solution exploration \u2014 the next stage, not this one.","A five-whys chain moves from the visible symptom to the structural cause."],example:"Five whys, from the deck: providers call support \u2192 they cannot determine application status \u2192 status is not available through self-service \u2192 progress is stored across multiple systems \u2192 the service grew through several projects and was never consolidated \u2192 past investment prioritised policy commitments and functionality over end-to-end user experience.",sourceIds:["deck"]},{heading:"Move from symptom to testable opportunity",body:"A good problem statement names the affected group, their goal, the observed difficulty, where and when it occurs, and the consequence \u2014 without embedding a preferred solution. 'How might we' then reframes the problem as an invitation to explore several responses, and a hypothesis commits to one of them in a form that evidence can contradict.",bullets:["Problem: an evidence-based description of the current gap. Who / what / goal / where / when / why it matters.","How might we: an invitation to explore, not a proposal.","Hypothesis: a proposed intervention, audience, expected outcome and observable signal.","A hypothesis you cannot imagine being wrong is not a hypothesis."],example:"We believe giving providers timely application-status visibility will reduce avoidable status calls. We will look for lower call volume and higher successful self-service, while checking that unresolved cases still reach support.",sourceIds:["deck","cdh"]},{heading:"The Lean Canvas as an assumption model",body:"The deck adapts Ash Maurya's Lean Canvas as a one-page way to hold the whole problem-to-measure chain while it is still uncertain. Its real function is not documentation \u2014 it is to make the riskiest assumption visible so you know what to test first.",table:{caption:"Slide 33 \u2014 the deck's canvas fields",head:["Field","The question it answers"],rows:[["Problem","What problem does the organisation have that you are trying to solve?"],["Users","What types of users are impacted?"],["Solution ideas","What options could solve the problem and meet user needs?"],["Business outcomes","How will you know if you have solved it? What will you measure?"],["Hypotheses","Combine the assumptions above into testable hypothesis statements."],["Riskiest assumption","For each hypothesis: what, if wrong, makes the whole thing fail?"]]},sourceIds:["lean","deck"]}],questions:[{id:"discovery-q1",moduleId:"discovery",prompt:"Which is the best problem statement?",options:["Providers cannot reliably determine application progress and make avoidable calls","We need an application-status dashboard built for providers","The old system is bad and providers dislike using it","Build automated status notifications by the end of October this year"],answer:0,optionNotes:["","This is a solution. It forecloses every other option \u2014 including changing the notification, the policy or the process.","This has no user, no goal, no evidence and no consequence. Nothing can be tested against it.","This is a commitment with a date. It presumes both the solution and the timeline before the problem is understood."],rationale:"It names the affected group, the goal they cannot reach, the observed behaviour and the consequence, without prescribing a solution."},{id:"discovery-q2",moduleId:"discovery",prompt:"What makes a discovery artefact useful?",options:["It is visually polished","It improves a consequential decision","It was created collaboratively in a workshop","It contains every research quote"],answer:1,optionNotes:["Polish helps communication but is not the test. A beautiful journey map that changes nothing has failed.","","Collaboration improves shared understanding, but a workshop can equally produce a well-attended guess.","Completeness is not the goal \u2014 synthesis is. A document nobody can act on is an archive, not an artefact."],rationale:"Artefacts are means for shared understanding and decision quality, not ends in themselves."},{id:"discovery-q3",moduleId:"discovery",prompt:"A provider says: 'I need the weekly reconciliation spreadsheet emailed to me every Monday.' The spreadsheet exists only because two departmental systems do not talk to each other. What kind of need is this?",options:["A stated need that is also a created need","A description of the current experience only","A viability constraint on the service","An unstated need the provider has not articulated"],answer:0,optionNotes:["","It does describe current experience, but stopping there misses the point: the need exists because of a system boundary, and that boundary is changeable.","Viability is about whether the organisation can sustain a solution. This is about where the requirement came from.","Unstated needs are the expectations users never articulate. This one was articulated very precisely."],rationale:"It is stated \u2014 they asked for it explicitly \u2014 and created, because it exists only as a workaround for how government has organised its systems. Treating it as a pure user requirement would automate the workaround instead of removing it."},{id:"discovery-q4",moduleId:"discovery",prompt:"According to the deck, which of these does discovery NOT produce?",options:["Problem statements","Requirements","Hypotheses","Insights"],answer:1,optionNotes:["Problem statements are a discovery output \u2014 they synthesise evidence into a testable framing.","","Hypotheses are a discovery output and the bridge into solution exploration.","Insights are the primary output of discovery."],rationale:"Slide 28 is explicit: discovery produces interview notes, survey responses, analytics, feedback and observations \u2014 not requirements, features or solutions. Those belong to solution exploration and delivery."}],scenarios:[{id:"discovery-s1",moduleId:"discovery",context:"Analytics show users abandon a form at the identity step. Stakeholders assume the page needs clearer instructions.",prompt:"What should the team do next?",options:["Treat the drop-off rate as proof of the underlying cause","Rewrite the instructions immediately and measure the effect afterwards","Observe representative users and inspect error and support data first","Remove the identity verification step from the journey"],answer:2,optionNotes:["Analytics tell you where users stop, never why. Drop-off is the symptom the investigation starts from.","Possibly the right fix, but chosen before the cause is known. If the real barrier is a document people do not have, clearer instructions change nothing.","","This treats a legal and security control as an inconvenience. Viability constraints are design inputs, not obstacles to delete."],rationale:"The data identifies where the problem occurs, not why. Targeted qualitative and operational evidence should diagnose the cause before an intervention is chosen."},{id:"discovery-s2",moduleId:"discovery",context:"A discovery report lands on your desk. It is 60 pages, beautifully produced, and concludes with a recommendation to build a mobile app. The research section contains 14 interviews, none of which mention mobile.",prompt:"What is the most useful critique?",options:["The interviews should have asked directly about mobile preferences","The sample size is far too small to support any firm conclusion at all","The report should have been considerably shorter","The recommendation is not traceable to the evidence, and discovery should not recommend solutions"],answer:3,optionNotes:["Asking users to choose a channel invites them to design for you. Stated channel preferences are weak evidence compared with observed behaviour.","Fourteen interviews is a reasonable qualitative sample. Sample size is not the defect here.","Length is a symptom, not the problem. A three-page report with the same disconnect would be equally unusable.",""],rationale:"Two failures at once: the conclusion has no evidential chain, and discovery has crossed into prescribing a solution. The deck separates these deliberately \u2014 discovery produces insight and hypotheses, solution exploration chooses among options."}],assignment:{title:"Build an evidence ledger",instruction:"For a real service problem, separate what is known, inferred and unknown before proposing an intervention.",prompts:["What direct evidence exists?","What assumptions are being treated as facts?","Which unknown could most change the decision, and how would you investigate it?","Which of the current requirements are created needs \u2014 artefacts of how the department works rather than what users need?"]}},{id:"outcomes",number:3,title:"Outcomes, measures and OKRs",subtitle:"Define success before delivery begins",minutes:50,slides:"36\u201346",outcome:"Write useful outcomes and OKRs, grade them honestly, distinguish leading from lagging signals, and design measures that support learning rather than vanity reporting.",coreIdea:"An output says what was produced. An outcome says what changed. Measurement closes the loop between intent, delivery and evidence \u2014 and if the work does not move a key result, it needs a different justification.",sections:[{heading:"Start with the change, not the artefact",body:"Outcomes may describe user behaviour or experience, operational performance, financial impact, risk reduction or learning. They must be specific enough to influence choices but not so narrow that teams optimise a proxy at the expense of the service.",table:{caption:"Slides 37\u201339 \u2014 outputs and the outcomes they are meant to create",head:["Output (the what)","Outcome (the why)"],rows:[["New login feature","Users can access the service faster"],["New form","Submission time reduced by 20%"],["System deployed","Increased user satisfaction"],["Status notifications sent","Providers resolve status questions without assistance"]]},bullets:["The deck names five kinds of good outcome: user value, operational efficiency, financial impact, risk reduction, and learning or reduced uncertainty.","Learning counts as an outcome. Reducing uncertainty is a legitimate result of a cycle.","Guardrail: accessibility, support demand or error risk does not worsen for other groups."],sourceIds:["deck","dss","svpg","perri"]},{heading:"OKRs connect direction to evidence",body:"An objective describes a meaningful direction. Key results describe measurable evidence that the objective is being achieved. Actions are hypotheses about how to move those results; they are not substitutes for the result. The deck's formula is compact: we will [objective], as measured by [key results], via [actions].",bullets:["Objective: qualitative, specific and motivating.","Key result: a measurable change with baseline, target and timeframe. Two to five per objective.","Action: work the team believes will influence a key result.","Insight: what the movement in the key result taught you."],example:"Objective: Make application progress understandable without assistance. KR1: Increase successful status self-service from 42% to 70% by June. KR2: Reduce avoidable status calls by 30%. Guardrail: unresolved-case escalation stays above 95%.",sourceIds:["deck"]},{heading:"Grade key results honestly",body:"The deck uses a four-point grading scale. Its value is that it makes partial achievement sayable. A team that scores 2 and explains why has produced more organisational learning than a team that quietly rewrites the target to 100%.",table:{caption:"Slide 41 \u2014 OKR grading",head:["Grade","Meaning"],rows:[["4","Exceeded expected results"],["3","Sufficient achievement against expected results"],["2","Made progress, but fell short of expected results"],["1","No progress against expected results"]]},bullets:["Grade the key result, not the effort that went into it.","A consistent 4 across every objective usually means the targets were set too low.","Record the insight alongside the grade \u2014 the grade without the reason teaches nobody anything."],sourceIds:["deck"]},{heading:"Use a measurement system, not one magic number",body:"Lagging indicators measure past performance and confirm an outcome after it occurs. Leading indicators are predictive measures of future performance and provide earlier signals, but they require validation. Pair them with diagnostic measures and guardrails, and define the population, denominator, baseline, period and exclusions before anyone reports on them.",table:{caption:"Slide 42 \u2014 indicator types with worked examples",head:["Type","Purpose","Example"],rows:[["Leading","Predictive signal of future performance","Feature usage; completion rate"],["Lagging","Confirmation of past performance","Customer satisfaction; outcome achieved"],["Guardrail","Detects harm or displacement","Escalation rate for unresolved cases; assistive-technology success rate"]]},bullets:["Outcome: did the desired change occur?","Leading: are behaviours moving in the expected direction?","Guardrail: did the intervention create unacceptable harm or push the problem somewhere else?","Define the denominator before you publish the percentage."],sourceIds:["deck","dss"]}],questions:[{id:"outcomes-q1",moduleId:"outcomes",prompt:"Which is a key result rather than an action or output?",options:["Launch the redesigned provider portal to every user group by June","Run five discovery interviews with providers before the June release","Reduce median completion time from 18 to 12 minutes by June","Create a delivery roadmap covering the next three quarters"],answer:2,optionNotes:["A launch is an output. It can happen on time and change nothing.","Interviews are an action. They might produce insight, but the count of interviews is not a result.","","A roadmap is a communication artefact, not a measured change."],rationale:"It describes a measurable change with a baseline, a target and a timeframe. The others are activities or outputs."},{id:"outcomes-q2",moduleId:"outcomes",prompt:"Why pair an outcome measure with a guardrail?",options:["To avoid the effort of agreeing a baseline before delivery starts","To convert a delivery output into a strategic objective","To make the reporting dashboard look more comprehensive","To detect harmful trade-offs or displaced problems"],answer:3,optionNotes:["Guardrails need baselines just as much as targets do. Without one you cannot tell whether it has worsened.","Guardrails constrain how an outcome is pursued. They have nothing to do with strategy formation.","More metrics is not the aim. A guardrail has a specific job: catching the harm your target might cause.",""],rationale:"A target can be achieved in a way that harms another user group, channel or risk domain. Guardrails make that visible before it scales."},{id:"outcomes-q3",moduleId:"outcomes",prompt:"Under the deck's grading scale, what does a grade of 2 mean?",options:["Made progress, but fell short of expected results","Sufficient achievement against expected results","Exceeded the expected results by a clear margin this quarter","No measurable progress against the expected results"],answer:0,optionNotes:["","That is grade 3 \u2014 the target was substantially met.","That is grade 4.","That is grade 1."],rationale:"The four-point scale exists to make partial achievement reportable. A 2 with a clear explanation of what was learned is more useful to the organisation than a target quietly revised downward."},{id:"outcomes-q4",moduleId:"outcomes",prompt:"Which pairing correctly matches an indicator to its type?",options:["Form completion rate measured at quarter end \u2014 lagging indicator","Feature usage in the first fortnight \u2014 leading indicator","Number of releases shipped this quarter \u2014 lagging indicator","Customer satisfaction score after release \u2014 leading indicator"],answer:1,optionNotes:["Completion rate is leading \u2014 it moves early and predicts the later outcome.","","Release count is an output measure. It is neither leading nor lagging with respect to any outcome, because it measures activity rather than change.","Satisfaction is lagging: it reports how people felt about an experience they have already had."],rationale:"The deck pairs feature usage and completion rate as leading, and customer satisfaction and outcome achievement as lagging. Release counts measure activity, which is the trap the whole stage warns about."}],scenarios:[{id:"outcomes-s1",moduleId:"outcomes",context:"A team launches status notifications and wants to know whether they created value.",prompt:"Which measure set is strongest?",options:["Successful self-service, avoidable status-call rate, user comprehension and unresolved-case escalation","Number of notifications sent, emails opened and portal sessions started each week","Release delivered on the agreed date, within the agreed budget and to the scope signed off at planning","Status page views, unique visitors and average time spent on the page"],answer:0,optionNotes:["","This counts the activity the team performed. It would rise even if every notification were ignored or misunderstood.","This measures project performance, not product value. Both can be true while nothing improves for users.","Views tell you people arrived, not that they understood or that their question was answered."],rationale:"The set combines outcome, behavioural, experience and guardrail evidence instead of counting activity alone."},{id:"outcomes-s2",moduleId:"outcomes",context:"Your key result is 'reduce avoidable status calls by 30%'. Two months in, calls are down 34%. Support tells you the improvement began the week the phone menu was restructured to route status enquiries to a callback queue with a four-day wait.",prompt:"What is the correct reading?",options:["The key result has been met and the objective can now be closed off","Displacement, not resolution, moved the measure \u2014 the missing guardrail is the finding","The key result should be raised to 50% since progress is already ahead of schedule","The phone menu change should be reversed so the product's true effect can be isolated"],answer:1,optionNotes:["The number moved; the problem did not. Closing here would bank an improvement that users experienced as a four-day wait.","","Raising a target you have not actually influenced compounds the error rather than correcting it.","Reversing an operational change to protect the cleanliness of a metric puts measurement ahead of service. Instrument the displacement instead."],rationale:"Calls fell because the demand was pushed into a queue, not because uncertainty was resolved. A guardrail on time-to-resolution or unresolved-case escalation would have caught it \u2014 which is exactly what guardrails are for."}],assignment:{title:"Create a measure tree",instruction:"Turn one service objective into measurable evidence and safeguards.",prompts:["State one objective in plain language.","Write two key results with baselines, targets and timeframes.","Add one leading indicator and one guardrail; explain what each protects against.","For each key result, state what a grade of 2 would look like and what you would do about it."]}},{id:"exploration",number:4,title:"Solution exploration and validation",subtitle:"Learn cheaply before you build deeply",minutes:55,slides:"47\u201357",outcome:"Generate options, apply the desirable/viable/feasible lenses and their trade-off pairs, expose assumptions, select appropriate experiments, and define an MVP as the smallest coherent test of value.",coreIdea:"Discovery asks whether a solution is valuable, usable, feasible and viable before the organisation makes an expensive commitment. A trade-off is not a compromise you regret \u2014 it is a choice you make on purpose.",sections:[{heading:"Diverge before you converge",body:"Generate several ways to address the opportunity before comparing them. Workshops, co-design, brainstorming and AI-assisted ideation all broaden the option space, but evidence and constraints \u2014 not workshop popularity \u2014 must drive the decision.",bullets:["Generate many ideas; encourage diverse perspectives; avoid premature judgement; focus on outcomes.","Separate idea generation from evaluation, in time and prefer
