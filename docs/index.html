lps users achieve a goal and delivers measurable value to the organisation. Solves a problem Delivers value Supports outcomes Evolves over time Has ongoing ownership"},{n:6,stage:"thinking",title:"Products enable Service Delivery",text:"A service is a series of interactions that helps someone (i.e. a job seeker, employer or provider) do something like apply for a job, add a vacancy, or book an appointment. A product is a tool created to deliver the services. It could be a digital product (i.e. a web application), a policy, a set of operational procedures, or (often) a combination of these"},{n:7,stage:"thinking",title:"What is Product Management?",text:""},{n:8,stage:"thinking",title:"What is Product Management?",text:"\u201Cthe intersection of business, technology and user experience to strategically drive the vision, development, launch and continued support an improvement of a product\u201D You are here"},{n:9,stage:"thinking",title:"What is Product Management?",text:""},{n:10,stage:"thinking",title:"OK cool\u2026so what should Product Managers actually do?",text:"Vision and Strategy Define why a product exists. This involves understanding user needs, conducting market research, generating insights, defining problems, framing opportunities, aligning stakeholders and producing artifacts that clearly articulate the product strategy Execute and Deliver Translate validated assumptions into actionable solution artifacts (requirements). Product Managers continuously prioritise backlogs and work closely with digital delivery teams to turn requirements into delivered value Product Success Ensure the product delivers continuous value to users/customers whilst achieving organisation objectives. This involves launching the product, analysing performance metrics and iterating based on user feedback Explore Options Translate problems and opportunities into potential solution options. This includes designing experiments to validate your riskiest assumptions, defining the MVP and refining measures of success Deliver value to users and customers"},{n:11,stage:"thinking",title:"The reality can be somewhat different\u2026",text:"\u201CDiscovery? Validation? We don\u2019t have time for all that \u2013 we just have to deliver something!\u201D \u201CI don\u2019t have any experience doing this\u201D \u201CWait this looks like a full-time gig \u2013 I already have a day job!\u201D \u201CJust do what IT wants\u201D \u201CJust give me the requirements so I can build something\u201D"},{n:12,stage:"thinking",title:"Product Management is not all or nothing",text:"Doing some discovery is better than none Using outcomes imperfectly is better than only focusing on outputs Testing one assumption is better than testing none Getting some user feedback after a release is better than none"},{n:13,stage:"thinking",title:"A Shift in Thinking",text:"Projects Outputs Requirements Delivery Products Outcomes Problems Learning"},{n:14,stage:"thinking",title:"Product Vision",text:"Vision describes the future we want to create \u201C A simpler, faster and more transparent experience for employers and providers\u201D Vision Characteristics:"},{n:15,stage:"thinking",title:"Product Strategy",text:"Strategy explains how we will move towards the vision \u201C A simpler, faster and more transparent experience for employers and providers\u201D Vision = Destination Reduce administrative effort Increase self-service Improve transparency Strategy = Direction"},{n:16,stage:"thinking",title:"Sources of Strategy",text:""},{n:17,stage:"thinking",title:"Strategy is about choices",text:"Strategy is NOT: Doing everything Building every feature Satisfying every stakeholder Strategy IS: Choosing priorities Focusing investment Making trade-offs Deciding what not to do Strategy is primarily about prioritisation and deciding what not to do"},{n:18,stage:"thinking",title:"That all sounds great but\u2026.",text:"Government funds projects, not products Our department has a project management framework, not a product management framework User Impact is often a secondary consideration We are largely measured by delivery outputs not value"},{n:19,stage:"thinking",title:"Product thinking can exist inside project delivery",text:"Constraint | What we can still do Fixed funding | Validate assumptions early Fixed scope | Prioritise within scope Project governance | Measure outcomes Delivery pressure | Seek feedback sooner"},{n:20,stage:"thinking",title:"Key Messages",text:"1. Products create value, projects deliver change 2. Product Management balances user needs, business outcomes and technology constraints. 3. Product Managers are accountable for value, not just delivery. 4. Product Management is about progress, not perfection. 5. Vision describes the destination. 6. Strategy provides the direction. 7. Strategy requires making choices. 8. Product Thinking can exist inside traditional project environments. 9. The goal is to move from activity and delivery towards outcomes and value."},{n:21,stage:"discovery",title:"Product Discovery",text:"Discovery helps us identify the right problems to solve before exploring solutions."},{n:22,stage:"discovery",title:"Product Discovery Overview",text:""},{n:23,stage:"discovery",title:"Understanding Users",text:"Sources of Insight: Interviews Observation Workshops Analytics Support Data Surveys What are we trying to understand? current experience: what users are experiencing now and the products they use to complete their goal stated needs: the things users explicitly tell you that they need, for example they may need your service to be mobile responsive unstated needs: the things users expect your service to have, for example they may need information that\u2019s easy to understand created needs: what users are forced to do because of policy or the way government works, for example they may have to use different online accounts for different stages of the same service actual goals: what the users are really trying to do when they use the service and its products, for example planning to travel, not just applying for a passport."},{n:24,stage:"discovery",title:"Discovery Artefacts",text:"Artefacts help us make user insights visible Personas Understand Users Journey Maps Understand Experiences Service Blueprints Understand Service Delivery"},{n:25,stage:"discovery",title:"Personas",text:"Purpose Personas help teams develop a shared understanding of their users. Key Inputs Interviews Observation Surveys Analytics Existing service knowledge Key Characteristics A persona typically contains: User Goals Needs Behaviours Motivations Challenges Context"},{n:26,stage:"discovery",title:"Journey Maps",text:"Purpose Journey Maps help teams identify where improvements will have the greatest impact on users. Key Inputs Research findings Interviews Observations Process knowledge Key Characteristics A Journey Map typically contains: User goals Activities Touchpoints Emotions / experience indicators Pain Points Opportunities"},{n:27,stage:"discovery",title:"Service Blueprints",text:"Purpose Understand how services operate behind the scenes. Key Inputs User research Journey Maps Process documentation Operational knowledge Key Characteristics A Service Blueprint typically contains: User actions Front Stage activities Back Stage activities Supporting systems Supporting processes"},{n:28,stage:"discovery",title:"From Insights to Problems",text:"Discovery generates insights, not solutions Discovery produces: Interview notes Survey responses Analytics Feedback Observations Discovery does not produce: Requirements Features Solutions"},{n:29,stage:"discovery",title:"Root Cause Analysis",text:"Symptom | Root Cause High call volume | Information difficult to find Low adoption | Process too complex Long processing times | Manual activities Problem Providers frequently call the support centre to check the status of participant applications Why? Because they cannot easily determine the status of an application Why? Because status information is not available through self-service channels Why? Because application progress is stored across multiple systems Why? Because the service evolved through several projects over time and information was never consolidated Why? Because previous investments focused on delivering policy commitments and functionality rather than end-to-end user visibility. Root Cause The problem is not high call volumes. The problem is users lack visibility of application progress due to fragmented service design and system architecture. The 5 Whys Analysis Fishbone (cause-and-effect) diagram"},{n:30,stage:"discovery",title:"Problem Statements",text:'\u201COur [Who] are currently experiencing [What] when trying to [Goal]. This issue occurs in [Where] and has been happening since [When]. This is a critical problem because [Why/Impact].\u201D Who: Who is directly affected by the problem (e.g. customers, employees, users)? What: What is the unmet need or the specific symptom of the problem? Goal: what is the user trying to achieve? Where: Where does this problem occur (e.g. what service/product)? When: When does an issue happen or how long has it been occurring? Why: Why is this problem important and what is the impact (e.g. poor user experience, operational inefficiency)? "Our customer service team is currently experiencing a 48-hour average ticket resolution time when trying to resolve account issues. This issue occurs in our Sydney and Melbourne call centres and has been happening since we upgraded the CRM platform last month. This is a critical problem because it has caused a 15% drop in customer satisfaction scores and a rise in subscription cancellations."'},{n:31,stage:"discovery",title:"Reframing Problems as Opportunities",text:"\u201CHow Might We\u201D is a popular design thinking technique used to reframe problems into actionable opportunities How might we format How might we [Intended Action] for [Who] so that [Desired Outcome]? Opportunity How might we improve visibility for providers so that they can easily view the progress of an application? Problem: Users struggle to track application progress"},{n:32,stage:"discovery",title:"Hypothesis Statements",text:"We believe that [doing this] for [these people] will achieve [this outcome]. We\u2019ll know this is true when we see [this feedback / behaviour change] We believe providing providers with application status visibility will reduce support calls by 20%. We'll know this is true when call volumes reduce following implementation."},{n:33,stage:"discovery",title:"Lean Canvas",text:"Problem What problem does the organisation have that you are trying to solve? Users What types of users are impacted? Hypotheses Combine the assumptions from 2, 3, 4 and 5 into hypothesis statement(s) Solution Ideas What options will solve our problem and meet the needs of our users at the same time? Business Outcomes How will you know if you have solved the problem? What will you measure? What\u2019s the most important thing we need to learn first? For each hypothesis, identify its riskiest assumptions (i.e. the whole thing will fail if it\u2019s wrong User Outcomes & Benefits What behaviour changes can we observe that tells us they\u2019ve achieved their goal? 1 How will we validate our assumptions? Design experiments to learn quickly whether the riskiest assumptions are true or false 2 3 4 5 6 7 8"},{n:34,stage:"discovery",title:"Discovery Outputs",text:"Discovery generates: Insights Personas Journey Maps Service Blueprints Problem Statements Opportunities Hypotheses These become inputs into solution exploration"},{n:35,stage:"discovery",title:"From Vision to Value",text:"Discovery creates evidence and understanding. We now know what problem we are trying to solve and what change we want to create."},{n:36,stage:"outcomes",title:"Outcomes & Success",text:"Success must be defined before delivery begins"},{n:37,stage:"outcomes",title:"Outcomes over Outputs",text:"Outcomes Outputs The things we build or deliver that represent tangible artefacts of work. e.g. a new feature in an app, or a deployed service aka The What The changes in behaviour, performance, or experience that result from delivering outputs, reflecting real-world impact. e.g. increased client satisfaction, reduced time to complete a task aka The Why"},{n:38,stage:"outcomes",title:"What good outcomes look like",text:"User / Customer Value Making services easier, faster or better Operational Efficiency Reduce effort, waste or cost Financial Impact Deliver savings or avoid expenditure Risk Reduction Improve compliance, security or operational resilience Learning and Feedback Reducing uncertainty and validating assumptions"},{n:39,stage:"outcomes",title:"Outcome Examples",text:"New login feature Users can access service faster New form Submission time reduced by 20% System deployed Increased user satisfaction"},{n:40,stage:"outcomes",title:"What are OKRs?",text:"Objectives and Key Results (OKRs) is a simple goal/outcome setting framework used by teams and individuals to create alignment and engagement around challenging & ambitious goals with measurable results. Objectives Key Results Actions Insights Inspirational goals that describe what you want to achieve and set clear direction. An objective should motivate and challenge teams and individuals Metrics that show how you are progressing towards achieving your objective. For each objective, you should have a small set (two to five) of key results The actions/activities (i.e. Releases / Features) you will need to execute to drive progress towards your key results Analysis of actual results once you have completed the required actions and activities. Your learnings provide insight as to whether you should persevere or pivot Where do we need to go? How do we know if we are getting there? What will we do to get there? What can we change or do better?"},{n:41,stage:"outcomes",title:"OKR Structure",text:"Objective Key Results Actions / Activities We will as measured by via OKR Formula Enhance digital experience for Service X by the end of this FY Increase the use of Product Y by 20% Improve average user satisfaction rating from 3.5 to 4.5 Reduce number of calls to help desk by 15% 4 Exceeded expected results 3 Sufficient achievement against expected results 2 Made progress, but fell short of expected results No progress against expected results 1"},{n:42,stage:"outcomes",title:"Lagging vs Leading Indicators",text:"Lagging Indicators Leading Indicators Used to measure past performance Used as a predictive measure of future performance Feature usage Completion rate Customer satisfaction Outcome achieved"},{n:43,stage:"outcomes",title:"From Problem to Outcome",text:"Product Managers maintain a clear connection between Discovery, Delivery and Measurement"},{n:44,stage:"outcomes",title:"Connecting Strategy to Delivery",text:""},{n:45,stage:"outcomes",title:"Take-aways",text:"Outcomes matter more than outputs Success should be defined before delivery begins OKRs help connect strategy and delivery Measurement is essential Learning is continuous If it doesn\u2019t move a key result, why are we doing it?"},{n:46,stage:"outcomes",title:"We have defined the outcome(s). We now know how success will be measured",text:""},{n:47,stage:"exploration",title:"Solution Exploration",text:"Turning ideas into solutions"},{n:48,stage:"exploration",title:"Solution Exploration Overview",text:"We now understand: Users Problems Opportunities Outcomes Now we explore solutions."},{n:49,stage:"exploration",title:"Generating Ideas",text:"Workshops Co-Design Brainstorming AI Tools Ideation Principles Generate many ideas Encourage diverse perspectives Avoid premature judgement Focus on outcomes"},{n:50,stage:"exploration",title:"Desirable: people want it Viable: the organisation can sustain it Feasible: teams can build and operate it",text:"Desirable, Viable, Feasible Desirable (Human) Feasible (Technology) Viable (Business & Policy) The ideal solution sits at the intersection of desirability (human), feasibility (technology) and viability (business). The Desirable, Viable and Feasible (DVF) is a three-lens approach used in Design thinking to act as a filter before teams invest time and resources in delivery. Product delivery requires a conscious balance:"},{n:51,stage:"exploration",title:"DESIGN THINKING In Practice",text:"Desirable \u2013 do users want it? Ask yourself the following questions: Can we demonstrate evidence of validated user needs to support why we\u2019re proposing a particular solution? Is it clear how our solution will solve these identified user needs? Can we clearly state how our solution contributes to ambition of the business case and policy intent? Does the proposed solution align to the approved business case and/or policy intent? Can the solution be reasonably sustained over the long term, through either existing or proposed changes to business processes? Do we understand the business changes required to support the new solution, have these been validated with impacted stakeholders? Have they been costed and planned? Does the solution align with both endorsed WofG and internal DES technology strategies and frameworks? Is it technically possible to deliver our solution within the time allowed and with our current resources and technology stack? Have we taken a security-by-design approach? Does our solution scale to meet future demand? Viable \u2013 does it support business/policy outcomes? Feasible \u2013 can we realistically deliver and sustain it?"},{n:52,stage:"exploration",title:"Delivery fails when one perspective dominates",text:"User-led but unsustainable Strategically valuable but undeliverable Technically elegant but unused Easiest to build right now but unlikely to deliver the outcome Desirable (Human) Feasible (Technology) Viable (Business & Policy)"},{n:53,stage:"exploration",title:"Common Trade-Offs",text:"Balance means finding the right trade-offs. A trade-off isn\u2019t a compromise you regret \u2013 it\u2019s a choice you make on purpose Desirable and Feasible = Usable and Buildable Users will use it Teams can realistically deliver it Risk: may not align to business priorities Feasible and Viable = Operable and Sustainable Affordable to run Technically sound Risk: may not solve genuine user problems Desirable and Viable = Valuable and Needed Delivers meaningful benefits Aligns to strategic objectives Risk: may not be technically achievable in current constraints"},{n:54,stage:"exploration",title:"Bringing the Three Lenses Together",text:"\u201Cthe intersection of business, technology and user experience to strategically drive the vision, development, launch and continued support an improvement of a product\u201D You are here"},{n:55,stage:"exploration",title:"Idea Validation",text:"Prototypes and experiments provide opportunities to validate assumptions before committing to full delivery. Wireframes Prototypes A/B Testing"},{n:56,stage:"exploration",title:"Minimum Viable Product (MVP)",text:"The smallest thing we can build that delivers value and generates learning MVPs are: Focused Intentional Designed to reduce uncertainty MVPs aren\u2019t: A poor-quality solution An unfinished product"},{n:57,stage:"exploration",title:"From Vision to Value",text:"We have reduced uncertainty and selected a viable solution approach."},{n:58,stage:"delivery",title:"Product Delivery",text:"Validated ideas become deliverable product backlog items"},{n:59,stage:"delivery",title:"Product Backlog(s)",text:"The Product Backlogs are emerging lists of all the things that need to be done. Teams draw from a common Product Backlog to fill their Sprint backlogs with high-value work. Somewhere to capture all the things that need to be done Owned and maintained by Product Management; can be added to by anyone in the team Prioritised in order of value, with priority being set by product management It changes and adapts as new work is identified Work is captured in an agreed hierarchy of Epics, Features, Stories and Tasks depending on the granularity of the work There are different levels of granularity that are important for each role Backlog Basics Tracks the overall project details and is used for DES project status reports. A significant body of work that delivers substantial organisational or user value Demonstrable functionality delivered at the end of each increment. Smaller increments of testable outcomes delivered inside a Sprint. How teams describe their steps to deliver a Story. Project Epic Feature Story Task Backlog hierarchy in DES At a high level, all backlogs in DSD follow the same hierarchy: Product Management use the product backlog to: Identify emerging work as more is understood about the solution Refine upcoming work with the team so that it\u2019s ready to be delivered in the near term Monitor progress of deliverables against project outcomes Manage scope through regular conversations with the delivery team Monitor the quality of work produced, ensuring it aligns against project outcomes"},{n:60,stage:"delivery",title:"Common Backlog Structure",text:"Most teams will use a multi-dimensional product backlog to capture, prioritise and visualise the key activities we need to undertake to complete the project. Below is a high-level view of our Product Backlog and how it informs work across the project. Epics are typically contributed by multiple teams and delivered over many PIs. They describe key project outcomes and help us logically group out work into higher themes. Features are delivered within a PI and typically require input from multiple teams to complete. They describe chunks of valuable functionality that directly contribute to realising the outcomes of the Epic it relates to. Stories are delivered within a Sprint and owned by specific teams. Completed Stories should demonstrate the smallest amount of value that contributes to a Feature. Tasks are a set of small actions that need to be completed to finish a Story. Tasks help build accountability and transparency of effort for the team."},{n:61,stage:"delivery",title:"What Is An Epic?",text:"An Epic describes a measurable business outcome to be delivered. Epics map directly to identified benefits in the project\u2019s business case, high-level requirements and significant pain points/opportunities captured in the service blueprint. Minimum Epic Detail Epics are hypothesis-driven and should be captured in terms that describe the delivery of an outcome, when the work has been completed. Epic Hypothesis Epic Description Business Outcomes & Benefits What measurable outcomes are we tracking to confirm we\u2019ve completed what we set out to do? Objectives and Key Results Desired Delivery Period In and Out of Scope Dependencies When do we anticipate the Epic to be complete? Remember, Epics can span multiple PIs. Captures what the intended solution should deliver to users, in comparison to the current state. Tie each Epic to one or many anticipated business outcomes and/or benefits. Be prescriptive on what\u2019s in and out of scope for each Epic. What critical dependencies are associated with the Epic? Sizing Estimate Epics are sized on estimated people days, relative to other Epics."},{n:62,stage:"delivery",title:"What Is A Feature?",text:"Features describe smaller tangible outcomes that contribute directly to realising the intent of the Epic it relates to. Features are our key artefact to measure medium-term progress and should result in a demonstrable output each PI. Describe the user outcome/s you\u2019d expect to see demonstrated should the work be completed. Feature Hypothesis Sizing Estimate Acceptance Criteria In/Out of Scope Include metrics in which to measure the success of the Feature. For example, \u201C30% reduction in processing time\u201D. Feature Measurement Risks/Issues/Dependencies Area/Iteration Path What are known risks and dependencies can be identified against the Feature? Active issues may result in the Feature being refined or reprioritised. The minimum quality, functionality and usability requirements for the Feature to be deemed complete. Provide a T-Shirt size for each Feature based on collective effort to deliver. Base estimates relative to other Features of similar scope/complexity. What scope are we explicitly targeting for delivery for this Feature? Ensure Features have been created under the correct Area Path (backlog) and Iteration Path (PI/Sprint) so we can track its delivery. Minimum Feature Detail Written as a position statement: \u201Cfor [users], who [opportunity/outcome], the [solution] is a [tangible deliverable] that [provides value] unlike [current solution]. Feature Description"},{n:63,stage:"delivery",title:"What Is A User Story?",text:"User Stories help us communicate an outcome and have a conversation about the detail, scope and shared expectations in a multi-disciplinary team. Stories help track short-term delivery outcomes and give us opportunities to adjust based on regularly feedback. Written in the following format: as a <persona> (the who) I want <a goal> (the what) so that <I can do something> (the why) Story Description Story Points Area Path Stories are scoped for delivery inside a Sprint. The Iteration Path needs to align with the expected delivery of the work. Iteration Path Related Work Stories need to be \u201Cchildren\u201D of their parent Features. Ensure we\u2019ve properly created Stories under their related Feature. The team\u2019s estimated effort to deliver the Story. Captured as Story Points, using the following scale: 1, 2, 3, 5, 8, 13, 20, 100. Stories should be owned by individual delivery teams with an Area Path mapped to their backlog. Minimum Story Detail The minimum quality, functionality and usability requirements for the Story. Common formats described later in the deck. Acceptance Criteria"},{n:64,stage:"delivery",title:"Backlog Prioritisation",text:"Weighted Shortest Job First (WSJF) Value Time Criticality Risk Reduction Opportunity Enablement Job Size (Effort) Impact vs Effort High Impact Low Impact Low Effort High Effort Quick Wins Big Ticket Items Fill-in jobs Thankless tasks Prioritisation is not a one-off activity \u2013 it happens continuously"},{n:65,stage:"delivery",title:"Product Roadmaps",text:"Outcome Now Next Later Objective 1 Objective 2 Objective 3 Objective 4 Key Result 1 Key Result 2 Key Result 1 Key Result 1 Key Result 2 Key Result 1 Key Result 1 Key Result 1 Key Result 2 Key Result 1 Key Result 1 Key Result 2 Key Result 1 Key Result 2 Key Result 1 Key Result 1 Key Result 2 Key Result 1 Outcome PI X PI Y PI X Objective 1 Objective 2 Objective 3 Objective 4 Feature Feature Feature Feature Feature Feature Feature Feature Outcome Roadmap Feature Roadmap Direction Priorities Outcomes Detailed Plans Commitments Fixed Scope"},{n:66,stage:"delivery",title:"Thursday Day 1 | Friday Day 2 | Monday Day 3 | Tuesday Day 4 | Wednesday Day 5 | Thursday Day 6 | Friday Day 7 | Monday Day 8 | Tuesday Day 9 | Wednesday Day 10",text:"Sprint Planning (Scrum of Scrums) | Stand Up | Stand Up (Scrum of Scrums) Refinement #1 | Stand Up | Stand Up (Scrum of Scrums) | Stand Up Refinement #2 | Stand Up | Stand Up (Scrum of Scrums) | Stand Up (Sprint Showcase) Review + Retro DES maintain a common planning and delivery cycle that unlocks greater synchronisation and collaboration. We do this by: 2 week (10 day) Sprints to deliver small increments of value. 10 week (50 day) Program Increments (PIs) to deliver key business outcomes. Sprint 1 10 Days | Sprint 2 10 Days | Sprint 3 10 Days | Sprint 4 10 Days | Sprint 5 10 Days Program Increment 1 50 Days | Program Increment 2 50 Days | Program Increment 3 50 Days | Program Increment 4 50 Days | Program Increment 5 50 Days Delivery Cadence"},{n:67,stage:"delivery",title:"Iterative Delivery",text:"Teams deliver usable increments of releasable functionality on a regular cadence that solve validated user needs. Below is the high-level flow of work: [10 Week Timebox] Business Outcome Highest-priority and highest-value user need/s to be delivered at a specific point in time. Refinement Delivery Candidate Features Taken from the Product Backlog, representing the key functionality to be delivered. Measurement Increment Planning Confirming the detail, scope and feasibility of each feature to be delivered over a 10-week increment. Team Backlogs Product Backlog feeds team-level backlogs of work to be delivered over the PI. Delivery Sprints Teams produce increments of testable functionality within 5 x 10-day timeboxes. Releasable Product The output of each PI should result in releasable functionality to users that satisfies the business outcome. Measure Teams measure the impact and success of the functionality released to inform future planning and delivery cycles."},{n:68,stage:"delivery",title:"Continuous Discovery, Exploration and Delivery",text:"Refinement activities Increment 5 Product Discovery | Solution Exploration Delivery activities Increment 5 Program Increment Planning | Beta and Live Implementation Team Backlogs | Sprints Refinement activities increment 6 Product Discovery | Solution Exploration Delivery activities Increment 6 Program Increment Planning | Beta and Live Implementation Team Backlogs | Sprints Delivery Activities Increment 7 Program Increment Planning | Beta and Live Implementation Team Backlogs | Sprints Refinement | PI #2 | PI #3 | PI #4 | PI #5 | PI #6 | PI #7 | PI #8 Delivery | PI #1 | PI #2 | PI #3 | PI #4 | PI #5 | PI #6 | PI #7 Refinement activities Increment 4 Product Discovery | Solution Exploration Continuous delivery relies on parallel Discovery/Solution exploration streams of work, where Product Management is working on discovery and exploration an increment in advance, while delivery teams are delivering the features identified from the previous refinement work. Release Release Release"},{n:69,stage:"delivery",title:"Linking it all Together",text:""},{n:70,stage:"delivery",title:"We have moved from ideas into delivery.",text:""},{n:71,stage:"lifecycle",title:"The Product Lifecycle",text:"From \u201Cuser need identified\u201D to \u201Cuser need met\u201D"},{n:72,stage:"lifecycle",title:"The Product Lifecycle",text:"Product Management continuously improve product performance by leading the end-to-end product development lifecycle from \u2018need identified\u2019 to \u2018need met\u2019 Solve the right problem Build the right thing Build the thing right"},{n:73,stage:"lifecycle",title:"Alignment with Government best practice",text:"The Product Lifecycle aligns closely with the DTA Service design and delivery process DISCOVERY ALPHA BETA / LIVE"},{n:74,stage:"lifecycle",title:"A continuous loop",text:"The product lifecycle is a continuous loop \u2013 not a linear process We: Discover problems or opportunities Define solutions Deliver value Measure Outcomes Iterate and Improve"},{n:75,stage:"roles",title:"Roles and Responsibilities",text:""},{n:76,stage:"roles",title:"Product Management Responsibilities",text:"Strategy and Vision Define why a product exists. This involves understanding user needs, conducting market research, generating insights, defining problems, framing opportunities, aligning stakeholders and producing artifacts that clearly articulate the product strategy Execute and Deliver Translate validated assumptions into actionable solution artifacts (backlogs). Product Managers continuously prioritise backlogs and work closely with digital delivery teams to turn backlog items into delivered value Product Success Ensure the product delivers continuous value to users/customers whilst achieving organisation objectives. This involves launching the product, analysing performance metrics and iterating based on user feedback Explore Options Translate problems and opportunities into potential solution options. This includes designing experiments to validate your riskiest assumptions, defining the MVP and refining measures of success Deliver value to users and customers"},{n:77,stage:"roles",title:"Product Managers vs Product Owners",text:"Product Managers and Product Owners share a common objective but focus on different horizons. Product Managers Product Owners Vision Strategy Outcomes Roadmaps Stakeholder Alignment Backlog management Story refinement Acceptance criteria Sprint support Clarifying requirements"},{n:78,stage:"roles",title:"What does a Typical Sprint Look Like?",text:"Thursday Day 1 | Friday Day 2 | Monday Day 3 | Tuesday Day 4 | Wednesday Day 5 | Thursday Day 6 | Friday Day 7 | Monday Day 8 | Tuesday Day 9 | Wednesday Day 10 Sprint Planning (Scrum of Scrums) | Stand Up | Stand Up (Scrum of Scrums) Refinement #1 | Stand Up | Stand Up Product Sync | Stand Up Refinement #2 | Stand Up | Stand Up (Scrum of Scrums) | Stand Up (Sprint Showcase) Review + Retro Thursday Day 1 | Friday Day 2 | Monday Day 3 | Tuesday Day 4 | Wednesday Day 5 | Thursday Day 6 | Friday Day 7 | Monday Day 8 | Tuesday Day 9 | Wednesday Day 10 Priority workshop | Roadmap updates | Testing prep | Testing Tuesday | Backlog refinement | Product Sync | Golf | Research prep | User Interviews | Backlog refinement Product Manager Product Owner Are we working on the right things? Do teams have everything they need to deliver successfully?"},{n:79,stage:"roles",title:"Other Key Roles",text:"Senior Supplier Delivery Manager Architects Scrum Master Senior Responsible Officer Designers BAs / Devs / Testers"},{n:80,stage:"roles",title:"The Product Trio",text:"Product Manager (Viable) Technology Lead (Feasible) Designer (Desirable)"},{n:81,stage:"roles",title:"Product Trios at Multiple Levels",text:"Design Product Strategy Coordination Delivery Technology Design Product Technology Design Product Technology"},{n:82,stage:"roles",title:"Tactical Team",text:"Refinement Spring Planning Story Development Quality Assurance User validation Sprint Showcases \u201CHow do we successfully deliver this work?\u201D"},{n:83,stage:"roles",title:"Solution / Coordination Team",text:"Roadmaps Feature prioritisation Dependency management Exploring solution options Product-level outcomes Cross-team coordination \u201CWhat should we deliver next?\u201D"},{n:84,stage:"roles",title:"Strategic Team",text:"Service Strategy Cross-product experience Future service design Long term tech direction Emerging user needs Organisational outcomes \u201CWhat future are we trying to create?\u201D"},{n:85,stage:"roles",title:"How the layers work together",text:"Design Product Strategy Coordination Delivery Responsible for Responsible for Responsible for Direction, user needs and service outcomes Translate strategy into roadmaps, priorities and features Design, build, test and release solutions Why What When How How much Technology Design Product Technology Design Product Technology"},{n:86,stage:"government",title:"DES Context",text:"How these concepts apply in the DES landscape"},{n:87,stage:"government",title:"WoW Foundations",text:"Our Ways of Working has several core elements. We are accountable and take ownership for solving issues Behaviours We empower our people We connect and work across boundaries We do the basics brilliantly We put user needs at the centre We are innovative and contemporary Digital Delivery Framework Methods Our Digital Delivery Framework is an end-to-end, repeatable delivery pipeline. It ensures consistent delivery practices and the best outcomes for customers and clients. The following principles underpin the framework: Have a plan, but adjust as you go Set clear governance and a shared purpose Be disciplined and transparent Collaboration underpins success We apply industry best practices and whole of government endorsed methods, including: Design Thinking: central to the DES delivery framework. It ensures solutions are built around real user needs, driving higher adoption, satisfaction, and business value. Project Management: Delivery enabled through defined scope, structured planning, risk management, and disciplined tracking against milestones tied to business outcomes. Agile: Adaptability and rapid delivery of project outcomes through iterative development and continuous feedback. Lean: Lean thinking emphasises identifying value, minimising waste, optimising delivery and continually improving."},{n:88,stage:"government",title:"PRINCIPLES IN PRACTICE",text:"1. Start with the problem, not the solution We seek to understand user needs, policy intent and root causes before committing to solutions. 2. Validate before you scale 3. Deliver value early and often 4. Decisions belong closest to the problem. We reduce risk through prototypes, testing and incremental releases. We prefer incremental delivery of valuable outcomes over large, infrequent releases. People with the greatest understanding of users and delivery realities should make day-to-day decisions. Implications Discovery comes before design Evidence outweighs assumptions Costing follows understanding Implications MVP before full solution Alpha before large scale investment Feeback before broad rollout Implications Smaller releases Faster feedback Reduced delivery risk Implications Empowered teams Reduced governance bottlenecks Faster decision making"},{n:89,stage:"government",title:"PRINCIPLES IN PRACTICE",text:"5. Focus on outcomes, not outputs We measure success by the value we create, not the volume of work we complete. 6. Design for the whole service 7. Learn continuously We optimise for the end-to-end service experience rather than individual systems, projects or organisational silos. Discovery, validation and improvement continue throughout the life of a service. Implications Outcomes over features Benefits over deliverables Value over activity Implications Whole of service thinking Reuse before rebuild Better user experience Implications Continuous Discovery Continuous Alpha Ongoing measurement and improvement"},{n:90,stage:"government",title:"Our Agreed Delivery Phases",text:"DES have an agreed end-to-end delivery pipeline for all projects. This pipeline is divided into 4 key phases: Pre-Approval, Pre-Delivery, Delivery and Closure. At a high level, these phases are described below: Phase Objective | Work with business areas and technical SMEs to understand the problem, create high-level vision and refine the funding request (NPP, DCB etc.). | Refine the problem and create a suite of experience, architecture and planning artefacts that confirm the target state of the project. | Teams work agreed timeboxes and deliver demonstratable increments of the agreed solution, through design/build/test/refine practices. | Business take ownership of the delivered product as the project closes and the service transitions to BAU. Focus What this provides: Applying these phases consistently across the Division will ensure: Projects are well planned with the right amount of detail Teams have a clear runway to maximise delivery output There is a shared view of success across all interested / impacted stakeholders Stage gates between the phases builds in quality and predictability PRE-APPROVAL PRE-DELIVERY DELIVERY CLOSURE"},{n:91,stage:"government",title:"Mapping to DES Project Phases",text:"PRE APPROVAL PRE DELIVERY DELIVERY"},{n:92,stage:"government",title:"Team Structures",text:"To deliver modern digital solutions, we need a structure that brings product, design and technology partners into the delivery process. Senior Responsible Officer Senior Supplier Lead Delivery Manager Product Manager Project Board Strategy Solution Delivery UX Lead Product Owner Solution Architect Scrum Master Dev Tester Responsible for Responsible for Responsible for Owning the project outcomes, delivery roadmap and championing the change. Building, curating and prioritising a backlog of refined and validated work. Making working increments to that product that solve customer needs. BA What Why When How How much"},{n:93,stage:"integration",title:"Closing",text:""},{n:94,stage:"integration",title:"Bringing It All Together",text:"What problem are we solving? What outcome are we trying to create? What evidence do we have? What have we learned?"},{n:95,stage:"integration",title:"What good looks like",text:"Outcome focused User Centred Evidence based Collaborative Adaptive Value driven"},{n:96,stage:"integration",title:"Reflection and Next Steps",text:"What problem are you solving? Is it actually the right one? How are you measuring success? What assumptions need validation? What feedback loops exist? How will you know you've delivered value?"},{n:97,stage:"integration",title:"Recommended reading",text:"Martin Eriksson \u2013 Foundational Product Management concepts and product leadership Marty Cagan - Empowered teams, product operating models and modern Product Management practices Teresa Torres \u2013 Continuous Discovery and research-driven Product Management Melissa Perri \u2013 Product Strategy and organisational alignment Roman Pichler \u2013 Product leadership, roadmaps and strategic Product Management"},{n:98,stage:"integration",title:"",text:""}];var V=H(Z(),1),Un;function Id(e){if(Un===void 0){let t=document.getElementById("slide-data");try{Un=t?.textContent?JSON.parse(t.textContent):null}catch{Un=null}}return Un?.[String(e)]??`slides/slide-${String(e).padStart(2,"0")}.webp`}function Ld(e){return Ba.find(t=>t.n===e)}function Hn(e){return e.title||"Image only"}function Sd(e){return e.title?`Slide ${e.n}: ${e.title}`:`Slide ${e.n}: an illustration with no text on it`}var Vp=(0,ke.createContext)({open:()=>{}});function Vn(){return(0,ke.useContext)(Vp)}function jp({children:e}){let[t,a]=(0,ke.useState)(null),o=(0,ke.useCallback)(i=>a(i),[]),r=(0,ke.useMemo)(()=>({open:o}),[o]);return(0,V.jsxs)(Vp.Provider,{value:r,children:[e,t!==null&&(0,V.jsx)(bv,{n:t,onChange:a,onClose:()=>a(null)})]})}function bv({n:e,onChange:t,onClose:a}){let o=Ld(e),r=(0,ke.useRef)(null),i=(0,ke.useRef)(null),n=(0,ke.useRef)(null);if((0,ke.useEffect)((
