ed transfers a real, visible obligation instead of a fictional one.",optionNotes:["","Recording unconfirmed acceptance as acceptance is how the record becomes untrue.","SRO accountability is already continuous; substituting them as owner obscures the unresolved handover.","Delaying closure indefinitely for one signature usually means the report is written under worse conditions later."]},{id:"cl-b-s2",moduleId:"benefits",context:"A benefit was forecast at $3.1m annually. At the 9-month post-implementation review the measured figure is $1.2m, and the shortfall is traced to lower-than-forecast take-up rather than to the system performing poorly.",prompt:"What is the most valuable thing the record can now capture?",options:["The forecasting error itself \u2014 how take-up was estimated, and why optimistically","A revised benefit forecast of $1.2m, replacing the original","A remediation plan to raise take-up to the level originally forecast","A note that the system performed as designed and the shortfall is not a delivery failure"],answer:0,rationale:"The system worked and the forecast did not. The transferable asset is why the forecast was wrong, because the same optimism will otherwise be applied to the next business case. Revising the number, remediating take-up and defending delivery are all reasonable \u2014 none of them stops the error recurring.",optionNotes:["","Necessary bookkeeping, but it records the outcome while discarding the cause.","Possibly worth doing, and it does nothing for the next forecast made by someone else.","True, and it reads as defensive. It closes the enquiry at the point it becomes useful."]}],assignment:{title:"Test a benefit against the four conditions",instruction:"Take one benefit from a business case you know. Work it against the four conditions \u2014 named individual, has agreed, can influence, has the measurement \u2014 and write what is missing.",prompts:["The benefit, stated with its number and period","Named individual and role, or the gap","Evidence they have agreed, or the gap","Whether they can influence the driver, and how the measurement will be obtained"],criteria:["The owner is an individual in a role, or the absence is stated plainly","The influence test is answered by naming the driver and who controls it","The measurement identifies data that will exist without new funded work"],modelAnswer:"Benefit: $2.4m annual reduction in avoidable support contact, from FY2027-28. Owner: Director, Provider Support Branch \u2014 named, and has seen the figure at the June governance meeting, but has not formally accepted it; acceptance is scheduled for the August committee and is the outstanding item. Influence: partial. The Director controls support staffing and triage, but contact volume is driven substantially by the notification policy owned by Policy Branch. This is the real gap \u2014 the target should be jointly held or the driver moved. Measurement: contact volumes are already reported monthly through the standing Service Performance pack; no new collection is needed, and the definition (inbound contacts tagged 'application status') is stable back to 2024."}},{id:"lessons",number:4,title:"Lessons that change behaviour",subtitle:"Why lessons registers fail, and what works instead",minutes:0,slides:"",outcome:"Write a lesson that is specific, transferable and addressed to a decision someone will actually face.",coreIdea:"Every entity has a lessons learned register and almost none of them change what the next project does. The failure is not that lessons are not captured \u2014 it is that they are captured as sentiments rather than as decisions, and stored where nobody looking for a decision would search.",sections:[{heading:"Why registers fail",body:"Read any lessons register and the entries look like this: 'engage stakeholders earlier', 'ensure requirements are well defined', 'improve communication between teams'. These are not lessons. They are the categories under which lessons would sit, if any had been written. Nobody has ever read 'engage stakeholders earlier' and changed a decision, because it contains no information about which stakeholders, how early, or what happened when you did not.",bullets:["Written as sentiment, not as a decision that could have gone another way.","Stored in a register organised by project, when the reader arrives with a problem.","Generated in a workshop at the end, when memory has flattened into narrative.","Never assigned to anyone with the standing to change the practice they describe."],example:"'Engage stakeholders earlier' versus 'The state housing authorities needed 11 weeks to approve the data-sharing schedule, which we discovered in week 3 of a 16-week build. Any project touching state housing data should start that approval before design begins.' Only one of those changes a plan.",sourceIds:["lessons","anao-gateway"]},{heading:"The shape of a usable lesson",body:"A lesson is usable when a reader facing a similar decision can act on it without contacting you. That requires four parts, and dropping any one of them returns it to sentiment.",table:{caption:"Four parts",head:["Part","Question it answers","Example fragment"],rows:[["Context","When does this apply?","Projects requiring data-sharing agreements with state agencies"],["What happened","What was the specific event?","11-week approval cycle discovered in week 3 of a 16-week build"],["Cost","Why should I care?","6-week schedule slip, $340k in held resources"],["Action","What should I do differently?","Initiate the schedule approval before design starts, not at integration"]]},sourceIds:["lessons"]},{heading:"Reference class data",body:"The most valuable thing a closure report contributes to an entity is not its narrative but its numbers, pooled with other projects' numbers. How long did the approval actually take, against the estimate? By what factor did the integration estimate miss? Enough of these and the next business case can be forecast from what comparable work actually cost, rather than from what this team hopes.",bullets:["Record estimate versus actual for the things that were estimated, not just the final totals.","Capture the ratio, not only the absolute \u2014 a 3\xD7 miss on integration transfers; $400k does not.","Note the class the project belongs to, so a future reader can tell whether it is comparable.","Publish into a pool the next team will search, not into a project folder they will not."],example:"The Commonwealth's published Gateway lessons material exists precisely to serve this function \u2014 aggregated observations across many reviews, which is the only level at which a pattern becomes visible.",sourceIds:["lessons","anao-gateway"]}],questions:[{id:"cl-l1",moduleId:"lessons",prompt:"Why does 'engage stakeholders earlier' fail as a lesson?",options:["It names no context, event, cost or action, so nobody can act on it","It is too critical of the stakeholder management approach taken","It belongs in the risk register rather than the lessons register","It repeats guidance already published in departmental methodology"],answer:0,rationale:"It is a category label, not a lesson. Which stakeholders, how early, and what it cost not to are the entire content \u2014 and all three are absent, so the reader ends where they started.",optionNotes:["","It is not critical at all, which is part of why it is comfortable and useless.","Register placement is not the issue; the same sentence is empty in either.","Duplicating methodology is a minor fault compared with containing no information."]},{id:"cl-l2",moduleId:"lessons",prompt:"Which is the most transferable form of a cost overrun lesson?",options:["Integration exceeded estimate by 3.2\xD7, across three external systems","The project exceeded its integration budget by $840,000","Integration proved more complex than anticipated during planning","The integration vendor underperformed against contracted expectations"],answer:0,rationale:"A ratio plus a class definition lets a different team with different dollar figures apply it. An absolute overrun applies only to a project of the same size, and the other two contain no number at all.",optionNotes:["","Useful locally, but a team with a $200k integration cannot use a $840k figure.","True of nearly every project ever run, and therefore actionable by nobody.","Attributes cause without evidence, and does not help a team using a different vendor."]},{id:"cl-l3",moduleId:"lessons",prompt:"Lessons are captured in a workshop on the final day of a project. What is the main weakness of that timing?",options:["Memory has compressed into a narrative, losing what would transfer","Team members are demotivated and contribute less than they would earlier","There is insufficient time to write the lessons up properly","The project manager dominates the discussion at that stage"],answer:0,rationale:"By the end, a team has told itself the story of the project many times, and the story has smoothed over the branch points. What survives is a coherent account; what is lost is the messy specifics that made a decision hard at the time \u2014 which is exactly the transferable part.",optionNotes:["","Motivation may dip, but a motivated team recalling a flattened narrative still produces flat lessons.","Write-up time is a scheduling problem, easily solved and not the substantive issue.","A real group dynamic, and secondary to the memory effect that affects everyone present."]},{id:"cl-l4",moduleId:"lessons",prompt:"What makes reference class data more valuable than a project narrative for future forecasting?",options:["Pooled estimate-versus-actual ratios reveal patterns no single account shows","Numerical data is inherently more objective than written accounts","Narratives are usually written to protect the reputation of the delivery team","Future teams have insufficient time to read full project narratives"],answer:0,rationale:"A single project cannot tell you whether its 3\xD7 integration miss was bad luck or the norm. Twenty can. The value is in the pooling, which is why the data has to be published somewhere it accumulates.",optionNotes:["","Numbers carry their own biases, including in how the class was defined.","Often true and beside the point \u2014 an honest narrative still cannot establish a base rate alone.","A practical constraint, not the reason pooled data forecasts better."]}],scenarios:[{id:"cl-l-s1",moduleId:"lessons",context:"Your lessons register entry reads: 'Data-sharing approvals with state agencies took longer than expected and delayed integration.' A colleague says it is fine because it names the specific issue.",prompt:"What is still missing?",options:["How long it took, what it cost, and what a future team should do","The name of the state agency involved, for accountability","An assessment of whether the delay was avoidable","A recommendation that the department negotiate standing agreements"],answer:0,rationale:"It has context but no magnitude, no discovery point, no cost and no action. A reader now knows the category of problem and still cannot plan around it \u2014 which is where the register entry was before it was made specific.",optionNotes:["","Naming the agency invites defensiveness and adds little; the pattern matters more than the party.","Worth knowing, but avoidability is a judgement that follows from the missing facts.","That is one possible action, and asserting it skips the evidence that would justify it."]},{id:"cl-l-s2",moduleId:"lessons",context:"You have written eight specific, costed, actionable lessons. They are filed in the project's SharePoint folder, in the closure report appendix.",prompt:"What most limits their value?",options:["Nobody with that problem will search a completed project's folder","Eight lessons is too many for a reader to absorb in one sitting","Appendices are conventionally treated as non-authoritative","SharePoint permissions will likely restrict access to the original team"],answer:0,rationale:"Discoverability is the binding constraint. Readers arrive with a problem \u2014 'how long do state data-sharing approvals take' \u2014 and search by problem, not by the name of a project they have never heard of. Well-written lessons in an unsearchable location perform identically to badly written ones.",optionNotes:["","Eight is a reasonable number, and a reader who found them would happily read all eight.","A convention that would not matter if anyone were reading the appendix.","A fixable technicality, and access is worthless without discovery anyway."]}],assignment:{title:"Rewrite a sentiment as a lesson",instruction:"Take a real lessons-register entry you have seen \u2014 or write the sentiment version yourself \u2014 and rewrite it with all four parts: context, what happened, cost, action.",prompts:["The original sentiment version","Context: when does this apply?","What happened, with specifics and magnitude","Cost, and the action a future team should take"],criteria:["The context defines a class of work, so a reader can tell whether it applies to them","The event carries a number \u2014 duration, factor or dollar figure","The action is something a team could put in a plan, not an attitude to hold"],modelAnswer:"Sentiment: 'Requirements from policy areas need to be clearer earlier.' Rewritten \u2014 Context: any delivery where eligibility rules are set by a policy area outside the delivery group. What happened: eligibility criteria were confirmed as stable at design sign-off in March, then changed twice (May, July) following Ministerial correspondence neither change was flagged through the project's governance. We rebuilt the rules engine twice. Cost: 5 weeks of a 22-week build, roughly $290k, and the second rebuild consumed the contingency that was covering integration. Action: for work depending on policy-set rules, do not treat design sign-off as rule stability. Ask the policy area directly what is currently before the Minister that could alter the rules, and build the rules engine to be configurable rather than compiled if the answer is anything other than 'nothing'."}},{id:"handover",number:5,title:"Handover to business as usual",subtitle:"What has to be true before the team can leave",minutes:0,slides:"",outcome:"Specify an operational handover that does not depend on the delivery team remaining reachable.",coreIdea:"The test of a handover is not whether a document was signed. It is whether the receiving team can run, support and change the thing without calling anyone who has left.",sections:[{heading:"The reachability test",body:"Most handovers pass on paper and fail in practice, and the failure has one signature: three months later, someone is still messaging a former team member who now works elsewhere. That informal channel is what makes an inadequate handover survivable, which is why it hides the problem instead of exposing it. The honest test is to ask what breaks if that person does not reply.",bullets:["Can the receiving team deploy a change without the delivery team present?","Can they diagnose the three most likely failures from documentation alone?","Do they know what the system costs to run, and who pays?","Do they know which parts are understood to be fragile, and why?"],example:"A useful exercise before closure: have the receiving team perform a routine change with the delivery team explicitly unavailable for a day. What they need to ask is the handover backlog.",sourceIds:["rmg106","teal"]},{heading:"What transfers, and to whom",body:"Handover is not one transfer but several, often to different places, and the closure report should say which went where. Bundling them into 'handed over to operations' is how run costs end up unfunded and licences lapse.",table:{caption:"The transfers",head:["What","Typically to","Failure if unassigned"],rows:[["Operational support","Service desk / operations team","Users report faults to nobody"],["Change and enhancement","Product or platform owner","System freezes, then decays"],["Run cost and licences","A funded budget line","Renewal lapses, service stops"],["Residual risks","Named risk owner in the entity register","Risk disappears from view, not from existence"],["Benefits measurement","Named benefit owner","Never measured, quietly dropped"],["Data and records obligations","Records / information governance","Retention breach discovered at audit"]]},sourceIds:["closure","rmg106"]},{heading:"Known fragility",body:"Every delivered system has parts the team knows are weak \u2014 the integration that only works because of a retry loop, the batch job that fails if it runs past 2am, the config nobody fully understands. Delivery teams rarely write these down, because writing them down feels like confessing. Not writing them down means the receiving team discovers each one during an incident.",bullets:["List the parts you would not want to change without care, and say why.","Name the failure modes you have already seen, and what fixed them.","Record the workarounds in place and what they are compensating for.","Say which dependencies are outside your control and who owns them."],example:"'The nightly reconciliation assumes the provider feed arrives before 02:00. It has been late twice; both times the job was rerun manually by the platform team. There is no alerting on this.' That paragraph is worth more than most handover packs.",sourceIds:["teal"]}],questions:[{id:"cl-h1",moduleId:"handover",prompt:"What is the strongest practical test of whether a handover is complete?",options:["The receiving team can run and change it without anyone who has left","A handover document has been signed by both the delivery and receiving managers","The receiving team has attended a full walkthrough of the system","All documentation has been transferred to the operational repository"],answer:0,rationale:"Signature, walkthrough and document transfer are all inputs that can each be completed while leaving the receiving team unable to act. The only test that matters is capability without the original team.",optionNotes:["","Signatures record that a process occurred, not that capability transferred.","A walkthrough is attended and largely forgotten; it demonstrates exposure, not readiness.","Documents can be complete, transferred and unusable."]},{id:"cl-h2",moduleId:"handover",prompt:"Why does informal contact with departed team members conceal a handover failure?",options:["It keeps the service running, so the gap never surfaces as a problem","It breaches the terms of the formal handover agreement","Departed staff give inconsistent advice without current context","It creates a dependency that the entity cannot contractually enforce"],answer:0,rationale:"The channel works, which is the problem. Because nothing visibly fails, nobody funds the documentation or training that would remove the dependency \u2014 until the person stops replying, usually during an incident.",optionNotes:["","Formality is not the issue; an informal channel that revealed the gap would be fine.","Advice quality varies, and good advice conceals the gap just as effectively.","Enforceability is a real risk and downstream of the concealment."]},{id:"cl-h3",moduleId:"handover",prompt:"Run costs and licences are recorded as 'handed to operations' without a funded budget line. What is the likely consequence?",options:["A renewal lapses because no budget holder recognises the cost as theirs","Operations absorbs the cost within existing allocations without difficulty","Finance identifies the gap during the next budget cycle and corrects it","The vendor continues service and invoices retrospectively"],answer:0,rationale:"An unassigned cost has no owner to approve it at renewal. The failure typically surfaces when a licence expires and the service degrades, which is later and more expensive than assigning the line at closure.",optionNotes:["","Sometimes possible, and it cannot be assumed \u2014 unbudgeted costs are exactly what gets refused.","Budget processes work from submitted requirements, and nobody submitted this one.","Vendors generally stop service rather than extend unpaid credit."]},{id:"cl-h4",moduleId:"handover",prompt:"Why do delivery teams under-document known fragility?",options:["Recording weaknesses feels like confessing fault, so nobody does","Fragility is usually discovered only after the delivery team has left","Documentation standards do not include a section for it","The information is considered too technical for a handover audience"],answer:0,rationale:"The team usually knows exactly where the weak points are. The obstacle is that writing them into a closure document reads as a confession at the moment the team's record is being assessed \u2014 the same incentive problem the whole course keeps returning to.",optionNotes:["","The team generally knows before it leaves. That is what makes the omission costly.","A missing template section is trivially fixed and is not why the information is withheld.","Receiving teams are technical. Audience is not the barrier."]}],scenarios:[{id:"cl-h-s1",moduleId:"handover",context:"Two weeks before closure, you run a test where the receiving team attempts a routine configuration change with your team unavailable. They complete it in four hours instead of the expected 30 minutes, and needed to read source code to find a setting.",prompt:"How should this be treated?",options:["As a successful test that produced a specific gap to close before handover","As a failure of the handover, requiring the transition date to be deferred","As acceptable, since the change was completed without escalation","As evidence the receiving team needs additional general training"],answer:0,rationale:"The test did its job: it converted an unknown dependency into a named, fixable gap while there was still time. Deferring is an overreaction to one finding, accepting it wastes the finding, and 'more training' generalises a problem that is actually one undocumented setting.",optionNotes:["","One documentation gap found early is not grounds to defer; it is the test working as intended.","Completion is not the standard \u2014 four hours and a source-code dive is the signal.","General training does not fix a specific missing document, and blames the receiving team."]},{id:"cl-h-s2",moduleId:"handover",context:"Your team knows the nightly reconciliation job fails if the upstream provider feed arrives after 02:00. It has happened twice, both fixed by a manual rerun. There is no alerting. The system owner asks whether there is anything they should know about ongoing risks.",prompt:"What is the right response?",options:["Document the failure mode, the occurrences and the missing alerting, with an owner","Note it verbally, since it has only occurred twice and was resolved both times","Add alerting before closure so the risk no longer needs to be disclosed","Record it as a low-severity defect in the backlog for future prioritisation"],answer:0,rationale:"This is exactly the fragility that must transfer in writing with an owner. Building alerting is good and does not remove the need to disclose the underlying dependency. Verbal notes and unowned backlog items both evaporate when the people change.",optionNotes:["","Verbal transfer of an incident pattern survives about as long as the listener's role does.","Worth doing, and it addresses detection rather than the dependency itself \u2014 still disclose it.","An unowned backlog entry is where known problems go to be forgotten."]}],assignment:{title:"Write the fragility section",instruction:"For a system you know, write the section a delivery team would not want to write: what is fragile, what has already failed, what workarounds are in place, and what is outside your control.",prompts:["Parts you would not change without care, and why","Failure modes already seen, and what fixed them","Workarounds in place and what they compensate for","Dependencies outside your control, and who owns them"],criteria:["At least one item would be uncomfortable to put in a report, and is included anyway","Each failure mode names what was actually done to recover, not just that it recovered","External dependencies name an owner, not just a system"],modelAnswer:"Fragile: the eligibility rules engine is compiled rather than configured; a rule change requires a build and a release, so an urgent policy change cannot be applied in under five working days. Do not promise faster. Seen failures: nightly reconciliation has failed twice (14 Mar, 2 Jun) when the provider feed arrived after 02:00; both were recovered by a manual rerun by the platform team the following morning, with no data loss but a one-day lag in status accuracy. There is no alerting \u2014 the failures were noticed by a caseworker both times. Workarounds: the retry loop on the provider API compensates for intermittent 503s from their gateway, which their team has acknowledged and not scheduled a fix for. If the retry count is reduced, expect failures. Outside our control: provider gateway availability (owner: Provider Systems, external vendor), and the identity broker token lifetime (owner: Platform Identity team) \u2014 a change to that lifetime would break our session handling and we would not be notified."}},{id:"financial",number:6,title:"Financial and contractual closeout",subtitle:"Settling the money before the people go",minutes:0,slides:"",outcome:"Close the financial and contractual position: costs finalised, assets recognised, obligations either discharged or transferred with an owner.",coreIdea:"The financial close is the one part of closure with a hard deadline and a statutory audience, and it is routinely left to a finance officer who was not there. Commitments that are neither settled nor transferred do not disappear \u2014 they surface as an unexplained accrual, a lapsed warranty, or a payment nobody can approve.",sections:[{heading:"What must be true before the ledger closes",body:"Financial closure is not 'we stopped spending'. It is a set of positive assertions: every cost incurred is recorded in the right period, every commitment is either paid or accrued, everything capitalised is an asset that exists and works, and everything that will keep costing money has a budget holder who knows.",bullets:["All invoices received, matched and either paid or accrued in the correct period.","Purchase orders and commitments closed, or carried with a documented reason.","Capitalised costs tested against what was actually delivered \u2014 assets that exist and are in use.","Work-in-progress cleared: nothing left sitting in a WIP account with no owner.","Recurring costs transferred to a named, funded budget line for the next financial year."],example:"A program closes in May. In September, Finance queries a $410k accrual nobody can explain. The delivery team is gone; the invoice related to a variation cancelled in March that was never backed out. Two hours of work in May became two weeks of forensic work in September.",sourceIds:["closure"]},{heading:"Capitalise or expense",body:"The distinction matters beyond accounting tidiness: capitalised costs sit on the balance sheet and depreciate, so an over-capitalised project reports a smaller hit now and an unexplained drag for years. The test is whether the spend produced an identifiable asset the entity controls and will derive benefit from \u2014 not whether the project would prefer it that way.",table:{caption:"Common judgements at closure",head:["Spend","Usual treatment","Where it goes wrong"],rows:[["Build of the delivered system","Capitalise","Includes work on abandoned options"],["Discovery and options analysis","Expense","Capitalised to protect the operating result"],["Data migration","Depends on whether it creates the asset","Treated inconsistently across releases"],["Training and change management","Expense","Bundled into the build cost"],["Post-go-live defect fixing","Usually expense","Capitalised as 'completion of build'"],["Licences prepaid beyond year end","Prepayment","Expensed in full, distorting the year"]]},example:"Discovery explored four options and three were abandoned. The cost of the three is not part of the asset \u2014 an asset is the thing you have, not the thinking that led to it. Capitalising all four overstates the asset and understates what the decision cost.",sourceIds:["closure"]},{heading:"Contract closeout",body:"A contract does not end when the work stops. Final acceptance is a formal act with consequences: it starts warranty periods, releases retentions, and closes the window in which defects are the supplier's problem rather than yours. Signing it because the project is over \u2014 rather than because the obligations were met \u2014 transfers risk quietly and permanently.",bullets:["Confirm every deliverable was received and accepted against the contract, not against the current expectation.","Record the warranty or defects-liability period, when it ends, and who will act on it.","Settle retentions, milestone holdbacks and any liquidated damages position.","Confirm intellectual property, source code and data have actually been delivered \u2014 not merely licensed in principle.","Check transition-out obligations: what the supplier must still do, and for how long.","Note obligations that survive termination \u2014 confidentiality, records access, audit rights."],example:"A twelve-month warranty is worth nothing if it expires unnoticed. Name the person who holds it, put the end date somewhere they will see it, and record what to do if a defect appears in month eleven.",sourceIds:["cprs","closure"]}],questions:[{id:"cl-f1",moduleId:"financial",prompt:"Why is an unexplained accrual at closure more expensive than it looks?",options:["It is resolved months later by people who were not there","Accruals attract additional audit scrutiny under the PGPA framework","It prevents the entity from closing its financial statements on time","Unresolved accruals must be written off against the following year"],answer:0,rationale:"The cost is the forensic work later. What takes two hours while the team remembers the variation takes weeks once they have gone and only the ledger entry remains.",optionNotes:["","Audit interest is a consequence, not the reason it costs more.","Entities close their statements regardless; the item is resolved or provided for.","No such automatic rule \u2014 the treatment depends on what the accrual turns out to be."]},{id:"cl-f2",moduleId:"financial",prompt:"Discovery explored four options; three were abandoned. How should that cost be treated?",options:["Expensed \u2014 an asset is what you have, not the analysis that led to it","Capitalised in full, as necessary cost of producing the delivered asset","Capitalised in proportion to the option that proceeded","Deferred and amortised over the life of the delivered system"],answer:0,rationale:"Capitalisation requires an identifiable asset the entity controls. Abandoned options produced none. Including them overstates the asset and hides what the decision actually cost.",optionNotes:["","This is the common error, and it protects the operating result at the cost of a misstated balance sheet.","Apportionment does not fix it \u2014 the abandoned work still produced no asset.","Deferral has the same effect as capitalising, by another route."]},{id:"cl-f3",moduleId:"financial",prompt:"What does final acceptance under a contract actually do?",options:["Starts warranties, releases retentions, closes the defects window","Confirms the supplier has been paid in full for all work performed","Formally terminates the contract and all obligations under it","Transfers ownership of the delivered system to the entity"],answer:0,rationale:"It is a substantive legal act with timing consequences, which is why signing it because the project is over rather than because obligations were met transfers risk to the entity.",optionNotes:["","Payment usually follows acceptance; it is not what acceptance means.","Several obligations survive \u2014 confidentiality, warranty, records access, audit rights.","IP and ownership are governed by their own clauses, not by acceptance."]},{id:"cl-f4",moduleId:"financial",prompt:"Which is most often missed at contract closeout?",options:["Naming who holds the warranty and when it ends","Obtaining a final invoice from the supplier","Confirming the last milestone payment was made","Recording the contract as complete in the register"],answer:0,rationale:"Invoices, payments and register updates all have owners in the finance process. A warranty is a right with no natural owner once the project dissolves, so it expires unnoticed.",optionNotes:["","Suppliers reliably pursue their own final invoices.","Payment runs are systematised and chased by the supplier.","Administrative, and usually prompted by the procurement team."]}],scenarios:[{id:"cl-f-s1",moduleId:"financial",context:"Two weeks before closure the supplier asks you to sign final acceptance so they can invoice before their financial year end. Three low-severity defects remain open, all with agreed fixes scheduled for the following month.",prompt:"What is the right course?",options:["Withhold, or accept subject to the defects, recorded in writing","Sign, since the defects are low severity and the fixes are already agreed","Sign, and raise the defects separately as warranty claims after acceptance","Refuse to engage until all three defects are closed, regardless of timing"],answer:0,rationale:"Acceptance changes who carries the defects. Signing while they are open moves three known problems onto the entity in exchange for the supplier's reporting convenience. Conditional acceptance with the obligation written down is the ordinary commercial answer and costs nobody anything.",optionNotes:["","Severity is not the issue \u2014 an agreed fix before acceptance is a right; after acceptance it is a request.","This converts a present entitlement into a future claim, which is strictly worse.","Unnecessarily rigid; conditional acceptance meets both parties' needs."]},{id:"cl-f-s2",moduleId:"financial",context:"Your program capitalised $31m of $47m spend. Included in the capitalised figure are $2.1m of change management and training, and $1.4m of post-go-live defect fixing.",prompt:"What should closure do?",options:["Flag both to Finance before the ledger closes, with reasoning","Leave the treatment as approved, since it was agreed with Finance during delivery","Reclassify both to expense immediately without further consultation","Disclose the amounts in the closure report and leave the accounting unchanged"],answer:0,rationale:"Both are conventionally expensed and both are large enough to matter. Closure is the last point at which the judgement can be revisited cheaply, and the decision belongs jointly with Finance \u2014 which is why it is raised with reasoning rather than either accepted silently or reclassified unilaterally.",optionNotes:["","A treatment agreed mid-delivery was agreed on expectations, not on what was ultimately delivered.","The delivery team does not own the accounting judgement, and acting alone invites reversal.","Disclosure without correction leaves a known misstatement in place."]}],assignment:{title:"Close the position",instruction:"For a piece of work you know, write the financial and contractual closing position: commitments, capitalisation judgements you would question, and every contractual obligation that outlives the project.",prompts:["Open commitments, and whether each is settled, accrued or carried","One capitalisation judgement you would put back to Finance, and why","Warranty or defects-liability periods: end dates and who holds them","Recurring costs and the funded budget line receiving them"],criteria:["Every surviving obligation has an end date and a named holder","The capitalisation question is argued from what was delivered, not from preference","Recurring costs name a budget line, not a business area"],modelAnswer:"Commitments: two purchase orders remain open \u2014 $84k with the integration vendor, to be accrued as the work was performed in June and invoiced in July; $12k of unused contingency on the training PO, which should be closed rather than carried. Capitalisation to question: $2.1m of change management and training is inside the capitalised figure. It produced no asset the entity controls and is conventionally expensed; I would put this back to Finance with the delivery breakdown before the ledger closes rather than after. Warranty: twelve-month defects liability on the integration build, expiring 14 August 2027, held by the Assistant Director, Platform Services \u2014 recorded in the platform team's risk register with a calendar entry, because a warranty with no holder expires unnoticed. Transition-out: the supplier must provide source code and build documentation within 30 days of acceptance; this is outstanding and acceptance should not be signed until it is delivered. Recurring: $310k p.a. licences and hosting, transferred to cost centre PLT-4420 from FY2027-28, accepted by the Platform Services budget holder at the July finance meeting."}},{id:"records",number:7,title:"Decommissioning, data and records",subtitle:"What the law requires you to keep after you switch it off",minutes:0,slides:"",outcome:"Decommission a system without destroying Commonwealth records or losing access the entity is obliged to maintain.",coreIdea:"Data held in a government business system is a Commonwealth record, and the obligation to keep it accessible does not end when the system holding it is switched off. Decommissioning is therefore a records decision before it is a technical one.",sections:[{heading:"Data in a business system is a record",body:"Information created or received in the course of Australian Government business is a Commonwealth record under the Archives Act 1983, including the data sitting inside a business system. It cannot be destroyed because a project ended, a contract lapsed, or a cloud subscription was not renewed. Destruction requires authority \u2014 normally a records authority issued by the National Archives, which sets the minimum retention period.",bullets:["Records authorities give permission to destroy, retain or transfer, and set minimum retention.","The obligation attaches to the information, not to the system that happens to hold it.","Migration to a new system does not restart or discharge the obligation.","Access must be maintained for the prescribed period, which can outlast several platforms.","Disposal can mean secure destruction, transfer to the Archives, or transfer to another entity."],example:"A cloud workspace deleted when the subscription lapsed took eleven years of case data with it. Nobody decided to destroy those records; that is precisely the problem \u2014 destruction without authority is still destruction.",sourceIds:["archives","naa-data"]},{heading:"Continuing access, not just continuing storage",body:"Keeping a database backup is not keeping a record accessible. If the only way to read the data is software the entity no longer licenses, running on an operating system it no longer supports, the obligation is not met in any practical sense \u2014 and the failure is discovered when someone asks for the data, usually under FOI or in litigation.",table:{caption:"Retention approaches at decommissioning",head:["Approach","Access in five years","When it is appropriate"],rows:[["Leave the system running","Good, at full run cost","Short residual period, active use continues"],["Migrate records to the successor","Good, if the migration is complete","A successor exists and the records fit"],["Export to an open, documented format","Good, with the schema retained","Most decommissioning of retired systems"],["Retain a database backup","Poor \u2014 needs the original software","Almost never sufficient on its own"],["Virtual machine snapshot","Fragile, degrades over time","Short-term bridge only"],["Transfer to National Archives","Good, permanent","Records of archival value, per the authority"]]},example:"An export to CSV with the schema, the code tables and a plain-English data dictionary will be readable in a decade. A .bak file for a database version nobody licenses will not.",sourceIds:["naa-data","archives"]},{heading:"Sequencing the shutdown",body:"Decommissioning done in the wrong order destroys the evidence the closure report depends on and the records the entity is obliged to keep. The ordering is not complicated; it is simply never planned, because switching things off is treated as an operational task rather than part of closure.",bullets:["Sentence the records first: what must be kept, for how long, under which authority.","Export and verify \u2014 read the export back and confirm it is complete before anything is deleted.","Retain the closure evidence separately, with its queries and definitions.","Confirm no downstream system, report or interface still consumes the data.","Revoke access and integrations before deleting anything, so failures surface while recovery is still possible.","Only then release infrastructure, close accounts and cancel subscriptions."],example:"Turn off the integrations a fortnight before deleting the data. Anything that breaks in that fortnight was a dependency nobody had documented, and you still have the system to turn back on.",sourceIds:["naa-data","closure"]},{heading:"The legacy system nobody switched off",body:"The mirror-image failure: the new service goes live, the closure report describes it, and the thing it replaced keeps running \u2014 costing money, holding duplicate data, and quietly accepting transactions. Closure should state the disposition of what was replaced, or say plainly that it remains in service and why.",bullets:["Name the system or process replaced, and its current status.","If it is still running, say who owns it, what it costs, and when it will stop.","If both are running, name the system of record \u2014 two sources of truth is a data-integrity issue, not a transitional inconvenience.","Record any residual users who have not migrated, and what the plan for them is."],sourceIds:["closure","naa-data"]}],questions:[{id:"cl-r1",moduleId:"records",prompt:"A cloud subscription lapses and eleven years of case data is deleted. How is this best characterised?",options:["Destruction of Commonwealth records without authority","A procurement failure with data loss as a consequence","An acceptable outcome, since the retention period was not specified","A technical incident to be managed through the incident process"],answer:0,rationale:"Nobody decided to destroy the records, which is the point. Data in a government business system is a Commonwealth record under the Archives Act, and unauthorised destruction is unauthorised however it happens.",optionNotes:["","Accurate as a proximate cause, and it understates what was actually breached.","An unspecified retention period does not create a permission to destroy.","Incident handling addresses the outage; it does not address the legal position."]},{id:"cl-r2",moduleId:"records",prompt:"Why is a database backup usually insufficient for long-term retention?",options:["Reading it needs software the entity may no longer have","Backups are not recognised as records under the Archives Act","Backup media degrade faster than the required retention periods","Backups exclude the metadata needed to interpret the records"],answer:0,rationale:"The obligation is continuing access, not continuing storage. A backup that can only be read by a database version nobody licenses does not deliver access, and the gap is discovered when the data is requested.",optionNotes:["","Format has no bearing on whether something is a record.","Media degradation is real and secondary to the software dependency.","Often true, and the binding problem is being unable to open it at all."]},{id:"cl-r3",moduleId:"records",prompt:"What should happen first when decommissioning a system?",options:["Sentence the records \u2014 what to keep, how long, under what authority","Revoke user access to prevent further data being created","Export the data to an open format for long-term retention","Confirm that no downstream system still consumes the data"],answer:0,rationale:"Everything else depends on the answer. Exporting, revoking and checking dependencies are all necessary, and doing any of them before you know what must be retained risks doing them to the wrong scope.",optionNotes:["","Necessary, and premature \u2014 do it after you know what must be preserved.","You cannot decide the export scope before sentencing tells you what to keep.","Essential, and it comes after retention scope is known."]},{id:"cl-r4",moduleId:"records",prompt:"Why revoke integrations before deleting data rather than after?",options:["Undocumented dependencies surface while the system can still be restored","Deletion is faster once integrations are removed","Retaining integrations during deletion risks propagating the deletion downstream","Access revocation is required before disposal under records authorities"],answer:0,rationale:"It is a deliberately reversible test. Whatever breaks in that window is a dependency nobody documented, and you still have the system to turn back on \u2014 which you do not once the data is gone.",optionNotes:["","Speed is irrelevant to the sequencing decision.","Plausible-sounding and not the reason; the point is discovering dependencies safely.","Records authorities govern disposal of records, not access sequencing."]}],scenarios:[{id:"cl-r-s1",moduleId:"records",context:"The replaced legacy system is still running six months after go-live. It costs $190k a year, holds duplicate participant data, and about 40 users still transact in it because a niche function was never rebuilt.",prompt:"What must the closure report do?",options:["Name it as still in service, its owner and cost, and the system of record","Record the new service as delivered and treat the legacy system as a separate operational matter","Recommend immediate decommissioning of the legacy system to realise the saving","Defer the closure report until the residual users have been migrated"],answer:0,rationale:"Two live systems holding the same participant data is a data-integrity problem and an unfunded cost, and it is a direct consequence of what this project did. Naming the system of record is the urgent part \u2014 without it, staff cannot know which record is authoritative.",optionNotes:["","It is not separate; the duplication exists because of this delivery.","Premature \u2014 40 users depend on a function that was never rebuilt.","Deferral leaves the ambiguity unrecorded for however long migration takes."]},{id:"cl-r-s2",moduleId:"records",context:"You plan to export case records to CSV before decommissioning. A colleague suggests also keeping a VM snapshot of the whole system 'just in case', and skipping the data dictionary since the column names are self-explanatory.",prompt:"What is the correct position?",options:["Keep the dictionary and schema; the snapshot is a short-term bridge","The snapshot is sufficient on its own, since it preserves the system exactly as it was","Both are unnecessary if the CSV export is verified as complete","Skip the CSV and rely on the snapshot, which preserves relationships the CSV would lose"],answer:0,rationale:"Column names are self-explanatory to people who worked on the system, which is a group that shrinks to zero. Code tables, units and exclusions are what a future reader needs. A snapshot degrades \u2014 it needs a hypervisor, an OS and licences that all age.",optionNotes:["","Snapshots depend on infrastructure and licensing that will not survive the retention period.","A verified export without its schema is a grid of values nobody can interpret.","Relationships can be preserved in exports; long-term readability cannot be preserved in a snapshot."]}],assignment:{title:"Plan the shutdown",instruction:"For a system you know, write the decommissioning position: what must be retained and under what authority, how access will be maintained, the shutdown sequence, and the disposition of whatever it replaced.",prompts:["Records to be retained, retention period, and the authority relied on","How access will be maintained \u2014 format, schema, dictionary, holder","Shutdown sequence, with the reversible checkpoint identified","Disposition of the system or process replaced"],criteria:["Retention names an authority or states plainly that one has not been identified","The access approach would still be readable without the original software","The sequence puts a reversible step before anything irreversible"],modelAnswer:"Retention: participant case records, minimum seven years from last action, under the entity's records authority for programme administration \u2014 confirmed with the information governance team rather than assumed. Financial transaction records fall under a separate authority with a longer period; both were checked. Access: export to CSV per table, with the DDL schema, all code and lookup tables, and a plain-English data dictionary covering every column, its units and its exclusions. Held by the Assistant Director, Information Governance, in the departmental records store \u2014 not in the platform team's storage, which is itself subject to future decommissioning. Sequence: sentence records \u2192 export \u2192 read the export back and reconcile row counts and totals against the live system \u2192 retain closure evidence separately \u2192 confirm no downstream consumers \u2192 revoke integrations and monitor for a fortnight, which is the reversible checkpoint and the last point at which the system can simply be turned back on \u2192 then release infrastructure and cancel subscriptions. Replaced system: the legacy register is still running and will be until the niche reporting function is rebuilt, currently scheduled for Q3. Owner: Platform Services; cost $190k p.a.; the new service is the system of record from go-live and the legacy register is read-only for the 40 residual users \u2014 stated explicitly because two writable copies of participant data would be a data-integrity failure, not a transitional inconvenience."}},{id:"writing",number:8,title:"Writing the report",subtitle:"Structure, candour and the shortfall paragraph",minutes:0,slides:"",outcome:"Produce a closure report structured so a reader can find the decision-relevant content, including where targets were not met.",coreIdea:"A closure report is read by people looking for one thing, in a hurry. Structure it so they find it, and say the difficult part plainly enough that the rest of the document becomes believable.",sections:[{heading:"Structure for a reader in a hurry",body:"Nobody reads a closure report front to back. They arrive with a question and scan for it, and if they cannot find it in about ninety seconds they either ask you directly or give up and assume the answer. Structure is therefore not presentation \u2014 it is the difference between the document being used and being filed.",bullets:["Lead with what was promised, what was delivered, and the gap. One page, no preamble.","Put the benefits table where it can be found without reading the narrative.","Give shortfalls their own heading. Buried bad news reads as concealed bad news.","Put detail in appendices, but keep every claim's evidence reference in the body."],sourceIds:["anao-perf","rmg106"]},{heading:"The shortfall paragraph",body:"Every substantial project misses something. The instinct is to distribute those misses through the document so that none of them lands hard, which produces a report where nothing is wrong and nothing is trusted. The alternative is a single, direct passage that states what was not achieved, by how much, and why \u2014 early, in plain terms.",bullets:["State the shortfall in the same units as the original commitment.","Give the cause without allocating blame, and distinguish forecast error from delivery failure.","Say what was learned, and where that lesson has been recorded.","Do not pair it with a compensating success in the same sentence. That reads as deflection."],example:"'The forecast $3.1m annual saving is currently measuring at $1.2m. The system performs as designed; take-up is at 41 per cent against a forecast of 85 per cent. The forecasting method \u2014 which assumed take-up equivalent to the 2023 online lodgement rollout \u2014 is recorded in the lessons pool as an over-optimistic comparator for opt-in services.'",sourceIds:["anao-perf","lessons"]},{heading:"Language that survives scrutiny",body:"Certain constructions signal to an experienced reader that a claim is weaker than it appears, and they will be tested first. Removing them is not about writing style; it is about not spending the reader's trust on sentences that cannot repay it.",table:{caption:"Constructions to avoid",head:["Written","Read as","Better"],rows:[["Successfully delivered","Delivered, with 'successfully' doing no work","Delivered [what], on [date], against [baseline]"],["Broadly in line with expectations","Missed, by an amount not stated","Missed by X per cent; expectation was Y"],["Stakeholders were engaged throughout","We held meetings","[Group] approved [decision] on [date]"],["Lessons have been captured","A workshop occurred","N lessons recorded in [pool], of which [example]"],["Within the revised budget","Over the original budget","Delivered at $X against original $Y, revised to $Z"]]},sourceIds:["anao-perf"]}],questions:[{id:"cl-w1",moduleId:"writing",prompt:"Why should shortfalls be given their own heading rather than distributed through the narrative?",options:["Buried bad news reads as concealed, and costs credibility","Departmental templates require a dedicated shortfalls section","It makes the report shorter and easier to scan","It isolates negative content so senior readers can skip it"],answer:0,rationale:"A reader who finds a significant miss tucked inside a paragraph about something else immediately re-reads everything sceptically, looking for what else was placed carefully. Directness is cheaper than the suspicion it prevents.",optionNotes:["","Template requirements vary and would not explain why the practice is right.","It does aid scanning, which is a side benefit rather than the reason.","The purpose is to make it findable, not skippable \u2014 this inverts the intent."]},{id:"cl-w2",moduleId:"writing",prompt:"An experienced reader sees 'broadly in line with expectations'. What do they conclude?",options:["The target was missed, by an amount the writer did not state","The result was within an acceptable tolerance that was defined in advance","The expectations themselves were never quantified","The writer lacks the data to make a precise statement"],answer:0,rationale:"Results that meet expectations are reported as meeting them, with the number. The hedge appears when the number would not flatter, so the construction reliably signals a miss and invites the reader to test it.",optionNotes:["","A defined tolerance would be stated as a tolerance, with the figure.","Sometimes true, and the phrase is used just as often where expectations were perfectly clear.","Missing data would more naturally be disclosed as missing data."]},{id:"cl-w3",moduleId:"writing",prompt:"Why should a shortfall not be paired with a compensating success in the same sentence?",options:["It reads as deflection, and undermines the success being cited","It makes the sentence too long for a senior audience","Successes and shortfalls belong in separate sections by convention","It implies a causal relationship between the two that may not exist"],answer:0,rationale:"The pairing is transparent, and the cost is asymmetric: the shortfall is not softened, and the success now looks like it was deployed defensively rather than reported on its merits.",optionNotes:["","Length is trivial next to the credibility effect.","Convention is not the reason, and both can appear in the same section written separately.","An occasional side effect, but not the main problem with the construction."]},{id:"cl-w4",moduleId:"writing",prompt:"What should the first page of a closure report contain?",options:["What was promised, what was delivered, and the gap between them","A summary of the project's governance arrangements and delivery approach","Acknowledgement of the contributions of delivery partners and stakeholders","The financial position, including final costs against the revised budget"],answer:0,rationale:"It is the question every reader has, and the one that determines how they read the rest. Governance, acknowledgements and finance all matter and none of them is what the reader opened the document to find.",optionNotes:["","Governance describes how the work was run, not what it achieved.","Appropriate somewhere, and it delays the answer the reader came for.","Important to Finance specifically, and against the revised budget it answers the wrong question."]}],scenarios:[{id:"cl-w-s1",moduleId:"writing",context:"Your draft states: 'While the take-up target was not fully achieved, the platform delivered strong performance and high user satisfaction, and the project was completed within the revised budget.'",prompt:"What is the most important single edit?",options:["Separate the shortfall, with figures, and report against the original","Replace 'strong performance' and 'high user satisfaction' with measured figures","Remove 'while', which frames the shortfall as a concession","Add the reason take-up fell short of the target"],answer:0,rationale:"All four edits are worth making. The first is the one that changes the document's character: it stops the sentence functioning as a device for absorbing bad news, and it removes the 'revised budget' construction in the same move. The other edits improve a sentence that should not exist in this shape.",optionNotes:["","Necessary, and it improves a sentence whose structure is the deeper problem.","A good catch on framing, and the smallest of the four in effect.","Should certainly be added \u2014 in the separated shortfall passage, not in this sentence."]},{id:"cl-w-s2",moduleId:"writing",context:"A senior reviewer returns your draft with the comment: 'Can we soften the benefits section? The numbers are accurate but the framing is quite stark for an incoming Deputy Secretary.'",prompt:"What is the most defensible response?",options:["Add context and cause, keeping every figure and the shortfall heading","Soften the language as requested, since the figures remain available in the appendix","Decline to change anything, on the basis that the numbers are accurate","Add the successes achieved elsewhere alongside the shortfall to balance the section"],answer:0,rationale:"The reviewer's concern is legitimate \u2014 a stark section without cause or context is harder to act on, not just harder to read. Context and explanation are real improvements; removing figures or diluting the heading is not, and balancing with unrelated successes is the deflection pattern.",optionNotes:["","Appendix availability does not repair a body text that misleads.","Refusing engagement wastes a reasonable point about how the section reads.","This is the compensating-success pattern, and it damages both claims."]}],assignment:{title:"Write the shortfall paragraph",instruction:"For a piece of work you know, write the passage stating what was not achieved: the shortfall in original units, the cause, whether it was forecast error or delivery failure, and where the lesson is recorded.",prompts:["The shortfall, in the same units as the original commitment","The cause, distinguishing forecast error from delivery failure","Where the lesson has been recorded, and in what form"],criteria:["The shortfall is stated against the original commitment, not a revision","Forecast error and delivery failure are explicitly distinguished","No compensating success appears in the same passage"],modelAnswer:"The business case forecast a $3.1m annual reduction in processing cost from FY2027-28. Current measurement at nine months post-release indicates $1.2m annualised, a shortfall of $1.9m against the original commitment. The cause is forecast error rather than delivery failure: the system performs to specification and processes within the designed service levels, but take-up is at 41 per cent against a forecast 85 per cent. The forecast assumed take-up equivalent to the 2023 online lodgement rollout, which was a mandatory channel change; this service is opt-in. That comparator error is recorded in the departmental lessons pool as entry LP-2026-118, classed against opt-in digital service forecasting, with the recommendation that opt-in take-up be forecast from opt-in precedents only."}},{id:"assurance",number:9,title:"Assurance and audit readiness",subtitle:"Writing for a reader who will test the claim",minutes:0,slides:"",outcome:"Anticipate how a closure claim will be tested, and hold the evidence that makes it stand.",coreIdea:"A closure report is not the end of the accountability chain. Its claims can reappear in annual performance statements, which are audited, and in ANAO performance audits years later. Write as though the claim will be tested, because it may be.",sections:[{heading:"Where closure claims resurface",body:"Performance information from delivery flows into the entity's corporate plan reporting and annual performance statements, which are subject to audit. A benefit claimed at closure can therefore be tested by someone with statutory powers, no relationship with the project, and a year's distance. That is a different reader from the sponsor who signed the report.",bullets:["Annual performance statements report against the entity's purposes and are audited.","ANAO performance audits examine whether reported information is meaningful and supported.","Gateway lessons material aggregates across entities, so patterns become visible beyond one project.","The evidence has to survive the project's systems being decommissioned."],sourceIds:["rmg134","anao-perf","anao-gateway"]},{heading:"What a tester actually does",body:"Audit does not read for tone. It selects a claim, asks what supports it, and follows the chain until it either reaches primary data or runs out. Most claims fail not because they were false but because the chain breaks \u2014 the analyst left, the extract was not retained, the definition was not written down.",table:{caption:"The chain",head:["Step","What must exist","Where it usually breaks"],rows:[["The claim","A specific, quantified statement","Vague wording admits no test"],["The method","How the figure was derived, written down","Lived in an analyst's spreadsheet"],["The data","Retained extract or reproducible query","System decommissioned, extract not kept"],["The definition","What was counted, and what was not","Never recorded; two readings possible"],["The approval","Who accepted the figure and when","Approved verbally, no record"]]},sourceIds:["anao-perf","rmg134"]},{heading:"Retention as a design decision",body:"The single most common audit failure at closure is that the evidence existed and was not kept. Systems are decommissioned, licences lapse, cloud accounts are closed, and the extract that supported the headline benefit goes with them. Deciding what to retain is part of writing the report, not an afterthought for records management.",bullets:["Retain the extract, not the dashboard \u2014 dashboards depend on systems that will be turned off.","Keep the query or method alongside the data, so the figure can be reproduced rather than merely cited.","Record the definition in the same place, in plain words.","Confirm the retention period against the entity's obligations, and name who holds it."],example:"A benefit claim supported by 'the Power BI dashboard' is supported by nothing eighteen months after the workspace is deleted. A retained CSV, the SQL that produced it, and a paragraph defining the metric will still answer the question.",sourceIds:["closure","rmg134"]}],questions:[{id:"cl-a1",moduleId:"assurance",prompt:"Why does a closure claim warrant more care than the immediate audience suggests?",options:["It can flow into audited performance statements and be tested years later","Closure reports are published externally and attract media attention","The Senior Responsible Officer is personally liable for inaccurate closure claims","Gateway reviewers re-examine closure reports at each subsequent gate"],answer:0,rationale:"The immediate reader is a sponsor who will sign it. The eventual reader may be an auditor testing a performance statement that inherited the claim, with statutory powers and no stake in the original narrative.",optionNotes:["","Most closure reports are internal. Media exposure is not the general case.","Accountability is real; personal liability of that kind overstates it.","Gate 6 is normally the final gate. Later gates do not re-examine it."]},{id:"cl-a2",moduleId:"assurance",prompt:"Where does an evidence chain most commonly break?",options:["The data \u2014 the system was decommissioned and no extract kept","The claim \u2014 the statement is too specific to defend","The approval \u2014 nobody was willing to sign off the figure","The method \u2014 the calculation was too complex to reproduce"],answer:0,rationale:"Retention is the usual failure. The number was real, the analysis was done, and the thing it was drawn from no longer exists \u2014 which is why deciding what to keep belongs in the closure process rather than after it.",optionNotes:["","Specificity strengthens a claim's defensibility rather than weakening it.","Sign-off is usually obtained; the record of it is what sometimes goes missing.","Complexity is manageable when the method was written down; the writing-down is the issue."]},{id:"cl-a3",moduleId:"assurance",prompt:"Which is the more durable evidence for a benefit claim?",options:["A retained extract, with the query and metric definition beside it","A Power BI dashboard showing the trend, linked from the report","A signed statement from the analyst confirming the figure","A screenshot of the reporting tool taken at the time of closure"],answer:0,rationale:"Only the first survives decommissioning and allows reproduction. A dashboard depends on a live system, an attestation is not the underlying data, and a screenshot proves what was displayed rather than what was true.",optionNotes:["","Depends entirely on a workspace that may be deleted well within the retention period.","An attestation about data is weaker than the data, and the analyst will move on.","Shows a rendering, not a reproducible figure, and carries no definition."]},{id:"cl-a4",moduleId:"assurance",prompt:"Why should the metric definition be retained alongside the data?",options:["The same metric defined two ways gives two answers, and a tester cannot tell","Records management policy requires definitions to accompany datasets","It demonstrates that the delivery team followed a rigorous process","Definitions are needed to rebuild the reporting solution if required"],answer:0,rationale:"Ambiguity in the definition is where a real improvement and a measurement artefact become indistinguishable. Without it, a tester has a number and no way to know what it counts.",optionNotes:["","Policy may or may not require it, and that would not explain why it matters.","Process rigour is a by-product, not the reason.","System rebuild is a rare and separate concern."]}],scenarios:[{id:"cl-a-s1",moduleId:"assurance",context:"Eighteen months after closure, an ANAO performance audit selects your reported benefit for testing. The reporting system was decommissioned at closure. You have the closure report, a summary slide, and an email from the analyst confirming the figure.",prompt:"What is the position?",options:["The claim is unsupported \u2014 nothing left is primary data or reproducible","The analyst's email is sufficient contemporaneous evidence of the figure","The closure report itself stands as the record, having been formally approved","The summary slide provides adequate support if it shows the underlying trend"],answer:0,rationale:"Everything retained is a restatement of the claim by parties connected to it. Audit follows the chain to primary data or a reproducible method, and neither exists. This is the ordinary way closure claims fail \u2014 not falsification, but evaporation.",optionNotes:["","An email asserts the figure; it does not evidence it, and the analyst is an interested party.","Approval records that someone accepted the claim, not that the claim was supported.","A slide is a presentation of a figure, without definition, source or reproducibility."]},{id:"cl-a-s2",moduleId:"assurance",context:"You are two weeks from closure. The cloud workspace holding all reporting data will be deleted 30 days after closure under the decommissioning plan. The benefit measurement period runs for another nine months.",prompt:"What is the necessary action?",options:["Establish a durable data source now, and retain the baseline extract","Extend the workspace retention until the measurement period ends","Complete a final measurement before deletion and report that as the outcome","Transfer the workspace ownership to the receiving operational team"],answer:0,rationale:"The measurement has to run for nine more months, so it needs a durable source regardless of what happens to this workspace \u2014 and the baseline must be preserved now, while it still exists. Extending or transferring the workspace defers the same problem and leaves the benefit owner dependent on infrastructure nobody has funded.",optionNotes:["","Buys time without solving it, and the extension will expire during a period when nobody is watching.","Measuring at closure measures nothing \u2014 the benefit has not accrued yet.","Hands the receiving team a cost and a dependency they have not agreed to fund or support."]}],assignment:{title:"Trace the chain",instruction:"Take one benefit claim and trace its evidence chain: the claim, the method, the data, the definition, the approval. Mark where it breaks and what you would retain to fix it.",prompts:["The claim, stated as it would appear in the report","Method and where it is written down","Data source, and what happens to it after closure","Definition, approval, and the weakest link"],criteria:["The chain is traced to primary data or the break is named honestly","The retention action names a format and a holder, not just an intention","The weakest link is identified explicitly rather than left for the reader to infer"],modelAnswer:"Claim: median lodgement-to-decision time fell from 14 to 9 days between Q1 and Q3 2026. Method: monthly extract from the case management system, median calculated across all decided applications in the period, excluding withdrawn applications \u2014 written up in the measurement note appended to the closure report, not only in the analyst's notebook. Data: CMS reporting replica, which is retained under the entity's standard operational retention and is not part of the project decommissioning scope \u2014 so it survives, which is the fortunate case rather than the designed one. Definition: lodgement timestamp to decision timestamp, both system-generated; withdrawn and duplicate applications excluded; definition unchanged across both periods and recorded in the measurement note. Approval: figure accepted by the Director, Provider Support Branch, at the 14 July governance meeting \u2014 minuted, which is the record that would otherwise be missing. Weakest link: the exclusion rule for duplicates was applied by a script held in the analyst's personal repository. If she leaves, the figure cannot be reproduced exactly. Action: move the script into the branch's shared analytics repository with the measurement note, owned by the Assistant Director, Performance Reporting."}}];var cf=[{id:"cf1",moduleId:"purpose",kind:"definition",front:"What is a closure report for?",back:"To provide the first evidence about whether an investment was worth making, and to transfer every obligation that outlives the project to a named owner."},{id:"cf2",moduleId:"purpose",kind:"definition",front:"What does Gateway Gate 6 assess?",back:"Benefits realisation: whether the purpose and benefits of the investment were delivered, and whether benefit harvesting survives the project's closure."},{id:"cf3",moduleId:"purpose",kind:"definition",front:"Gateway financial thresholds",back:"$30m for procurement or infrastructure projects; $30m where the ICT component is at least $10m; $50m for programs. Non-corporate Commonwealth entities."},{id:"cf4",moduleId:"purpose",kind:"discrimination",front:"Project manager or SRO \u2014 who is accountable at Gate 6?",back:"The Senior Responsible Officer. Gateway provides assurance to the SRO, who remains accountable for benefits across the lifecycle."},{id:"cf5",moduleId:"purpose",kind:"application",front:"Which closure-report reader has no alternative source of information?",back:"The next delivery team. The SRO can ask, Finance has the ledger, audit can test \u2014 only the next team depends entirely on what was written down."},{id:"cf6",moduleId:"purpose",kind:"discrimination",front:"Why is a structural conflict, not carelessness, the reason closure reports are weak?",back:"The author's own record is the subject, written at the point of least time and least incentive to be candid, for readers who cannot verify."},{id:"cf7",moduleId:"evidence",kind:"definition",front:"The three kinds of claim",back:"Measured (data before and after, same definition), estimated (a model with stated assumptions), asserted (informed judgement, no measurement). Mark which is which."},{id:"cf8",moduleId:"evidence",kind:"application",front:"What makes a claim traceable?",back:"A reader who was not there can reach the underlying data without asking you: named source, date range, sample size, and the metric definition."},{id:"cf9",moduleId:"evidence",kind:"discrimination",front:"Original baseline or revised baseline?",back:"Both. State the original approved baseline first, show each revision dated and reasoned, and report against both so the reader sees the gap."},{id:"cf10",moduleId:"evidence",kind:"application",front:"No baseline was captured. What now?",back:"Say so plainly. Any improvement claim becomes estimated or asserted. A reconstructed baseline is legitimate as an estimate, never as a measurement."},{id:"cf11",moduleId:"evidence",kind:"discrimination",front:"Why disclose that a claim is merely asserted?",back:"It is what makes the measured claims credible. Strip the marking and a sceptical reader treats every claim in the document as equally unverifiable."},{id:"cf12",moduleId:"evidence",kind:"application",front:"The metric definition changed mid-project. What must the report do?",back:"Report both definitions, state that it changed, and give a like-for-like figure if the data allows \u2014 otherwise improvement and measurement artefact are indistinguishable."},{id:"cf13",moduleId:"benefits",kind:"definition",front:"Why can benefits realisation not be a project activity?",back:"Benefits accrue in the operational business after delivery. By the time they are measurable there is no project \u2014 so ownership must transfer at closure."},{id:"cf14",moduleId:"benefits",kind:"definition",front:"The four conditions of a real benefit owner",back:"A named individual; who has agreed; who can influence the driver; and who has a measurement that will exist without new funded work."},{id:"cf15",moduleId:"benefits",kind:"discrimination",front:"'The Service Delivery Group owns this benefit' \u2014 what is wrong?",back:"A group holds no accountability. No individual's work depends on it and no calendar entry belongs to anyone. Name a person in a role."},{id:"cf16",moduleId:"benefits",kind:"application",front:"When does post-implementation review typically occur?",back:"Roughly 6 to 12 months after closure, once effects have had time to appear. Anchor it to an existing governance cycle, not a standalone date."},{id:"cf17",moduleId:"benefits",kind:"application",front:"Which benefit measurement survives two years?",back:"One drawn from standing operational reporting, reviewed at a committee that meets anyway. Bespoke dashboards lose maintainers; commissioned surveys lose funding."},{id:"cf18",moduleId:"benefits",kind:"discrimination",front:"Benefit missed because take-up was low, system worked. What is the finding?",back:"Forecast error, not delivery failure \u2014 and the transferable asset is why the forecast was optimistic, not the revised number."},{id:"cf19",moduleId:"lessons",kind:"definition",front:"The four parts of a usable lesson",back:"Context (when does this apply), what happened (specific, with magnitude), cost (why care), action (what to do differently)."},{id:"cf20",moduleId:"lessons",kind:"discrimination",front:"Why is 'engage stakeholders earlier' not a lesson?",back:"It is the category a lesson would sit under. No context, event, cost or action \u2014 so no reader can act differently than they would have."},{id:"cf21",moduleId:"lessons",kind:"definition",front:"Reference class data",back:"Pooled estimate-versus-actual ratios across comparable projects. A single project cannot establish a base rate; twenty can."},{id:"cf22",moduleId:"lessons",kind:"application",front:"Ratio or absolute figure \u2014 which transfers?",back:"The ratio. 'Integration exceeded estimate by 3.2\xD7' applies to a project of any size; '$840k over' applies only to one the same size."},{id:"cf23",moduleId:"lessons",kind:"discrimination",front:"Why does an end-of-project lessons workshop produce weak lessons?",back:"The team has told itself the story many times and the story has smoothed over the branch points. What survives is coherent; what is lost is transferable."},{id:"cf24",moduleId:"lessons",kind:"application",front:"Well-written lessons in the project's own folder \u2014 what is wrong?",back:"Discoverability. Readers search by problem, not by the name of a project they have never heard of. Publish into a pool that accumulates."},{id:"cf25",moduleId:"handover",kind:"definition",front:"The test of a completed handover",back:"The receiving team can run and change it without anyone who has left. Not: a document was signed."},{id:"cf26",moduleId:"handover",kind:"discrimination",front:"Why does informal contact with departed staff hide a handover failure?",back:"It keeps the service running, so nothing visibly fails and nobody funds the fix \u2014 until the person stops replying, usually mid-incident."},{id:"cf27",moduleId:"handover",kind:"definition",front:"What transfers at handover?",back:"Operational support, change and enhancement, run cost and licences, residual risks, benefits measurement, and data and records obligations \u2014 each to a named holder."},{id:"cf28",moduleId:"handover",kind:"application",front:"Run costs 'handed to operations' with no budget line \u2014 consequence?",back:"A renewal lapses because no budget holder recognises the cost as theirs, and it surfaces when the service degrades."},{id:"cf29",moduleId:"handover",kind:"application",front:"What is known fragility, and why is it omitted?",back:"The parts the team knows are weak \u2014 retry loops, timing dependencies, config nobody understands. Omitted because writing it down feels like confessing."},{id:"cf30",moduleId:"handover",kind:"application",front:"How do you find the real handover gaps?",back:"Have the receiving team make a routine change, delivery team away. What they need to ask is the handover backlog."},{id:"cf43",moduleId:"financial",kind:"definition",front:"What must be true before the ledger closes?",back:"Costs recorded in the right period; commitments paid or accrued; capitalised spend tests as a real asset; WIP cleared; recurring costs o
