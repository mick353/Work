<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Product Practice — Feedback Review</title><style>body{margin:0;background:#f2f6f8;color:#153244;font:16px system-ui,Segoe UI,sans-serif}main{max-width:1100px;padding:20px;margin:auto}header{background:#17475a;color:white;padding:22px;border-radius:12px}h1{margin:0}.bar{background:white;padding:20px;border-radius:10px;margin-top:18px}input{padding:10px;font:inherit;border:1px solid #a6b8c2;border-radius:6px;width:260px;max-width:100%}button{border:0;background:#12647d;color:white;font:inherit;padding:11px 18px;border-radius:7px;cursor:pointer;margin:5px}button:disabled{opacity:.5}table{border-collapse:collapse;width:100%;background:white}td,th{border-bottom:1px solid #dae5ec;padding:9px;text-align:left;vertical-align:top;font-size:.88rem}th{background:#e8eff3}.wrap{overflow:auto;margin-top:16px}details{margin:3px}dt{font-weight:bold;margin-top:10px}dd{margin-left:15px;white-space:pre-wrap}small{color:#536878}#status{font-weight:600;margin:12px 0}</style></head><body><main><header><h1>Trainer Feedback — Owner Review</h1><p>Private response analysis and CSV export. Requires your review key.</p></header><section class="bar"><label for="key">Review key (not saved by this page)</label><p><input id="key" type="password" autocomplete="off"></p><button id="load">Load responses</button><button id="csv" disabled>Export CSV</button><p id="status" role="status" aria-live="polite"></p><small>Responses are stored separately from Course Workshop drafts. Never share the review key or CSV outside the authorised review group.</small></section><div class="wrap"><table id="table" hidden><thead><tr><th>Submitted</th><th>Course</th><th>Stage</th><th>Progress</th><th>Ease</th><th>Independence</th><th>Answers</th></tr></thead><tbody></tbody></table></div></main>
<script>
const API='https://product-practice-trainer-feedback.gobbos-sportsbet.workers.dev/results';let rows=[];
const labels={submittedAt:'Submitted at',courseReference:'Course reference',feedbackStage:'Feedback stage',courseProgress:'Course progress',priorExperience:'Prior experience',startingPoint:'Starting point',materialReadiness:'Material readiness',authoringTime:'Active time',previewTime:'Time to preview',assistanceLevel:'Assistance level',assistanceDuration:'Assistance duration',featuresUsed:'Features used',easeRating:'Ease of use',hardestStep:'Hardest step',problemsSeen:'Problems seen',mainObstacle:'Main obstacle',mostHelpful:'Most helpful',usableOutput:'Output produced',independentNext:'Repeat independently',biggestImprovement:'Biggest improvement',missingCapability:'Missing feature'};
const value=v=>Array.isArray(v)?v.join('; '):String(v??'');
document.getElementById('load').onclick=async()=>{const status=document.getElementById('status');status.textContent='Loading…';try{const key=document.getElementById('key').value.trim();if(!key)throw Error('Enter the review key');const r=await fetch(API,{headers:{Authorization:'Bearer '+key}}),v=await r.json();if(!r.ok||!v.ok)throw Error(v.error||'Request failed');rows=v.records||[];status.textContent=rows.length+' response(s) recorded'+(v.more?' (additional pages not loaded)':'')+'.';const t=document.getElementById('table');t.hidden=rows.length===0;document.getElementById('csv').disabled=rows.length===0;t.tBodies[0].replaceChildren();for(const row of rows){const tr=document.createElement('tr');for(const key of ['submittedAt','courseReference','feedbackStage','courseProgress','easeRating','independentNext']){const td=document.createElement('td');td.textContent=value(row[key]);tr.append(td);}const td=document.createElement('td'),details=document.createElement('details'),summary=document.createElement('summary');summary.textContent='View answers';details.append(summary);const dl=document.createElement('dl');for(const [key,label] of Object.entries(labels)){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;dd.textContent=value(row[key]);dl.append(dt,dd);}details.append(dl);td.append(details);tr.append(td);t.tBodies[0].append(tr);}}catch(err){rows=[];document.getElementById('table').hidden=true;document.getElementById('csv').disabled=true;status.textContent='Unable to load: '+err.message;}};
document.getElementById('csv').onclick=()=>{const keys=Object.keys(labels);const q=v=>'"'+value(v).replace(/"/g,'""')+'"';const lines=[keys.map(k=>q(labels[k])).join(','),...rows.map(r=>keys.map(k=>q(r[k])).join(','))];const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='course-workshop-trainer-feedback.csv';document.body.append(a);a.click();a.remove();URL.revokeObjectURL(url)};
</script></body></html>
