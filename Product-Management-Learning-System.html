 the score.","Take your top item and write it to the deck's minimum detail for its level \u2014 epic, feature or story."]}},{id:"lifecycle",number:6,title:"Lifecycle and continuous learning",subtitle:"Connect discovery, delivery, release and improvement",minutes:40,slides:"71\u201374",outcome:"Relate the product lifecycle to the DTA service design and delivery process, and explain why discovery and measurement continue after release.",coreIdea:"The lifecycle is a loop: discover problems, define solutions, deliver value, measure outcomes, iterate and improve.",sections:[{heading:"Solve the right problem; build the right thing; build it right",body:"These are linked responsibilities, not three isolated departments. Product, design and technology need shared context so that feasibility knowledge improves discovery and user evidence improves delivery. The deck frames the whole lifecycle as moving a service from 'need identified' to 'need met'.",sourceIds:["deck","svpg"]},{heading:"Government phases manage increasing confidence",body:"The DTA service design and delivery process moves through Discovery, Alpha and Beta/Live. Discovery understands users and constraints; Alpha explores and tests different ways to meet those needs; Beta builds and trials an accessible, secure service; Live sustains and improves it. Note the deck presents Beta and Live as a combined stage \u2014 this course separates them because the ownership question at go-live is where services most often fail.",table:{caption:"Slide 73 \u2014 DTA phases",head:["Phase","Purpose","Typical evidence produced"],rows:[["Discovery","Understand users, policy intent and constraints","Insights, problem statements, opportunities"],["Alpha","Explore and test several approaches","Prototypes, validated or killed hypotheses"],["Beta","Build and trial an accessible, secure service","Live usage under real conditions, performance data"],["Live","Operate and continue improving","Ongoing performance, research and feedback"]]},bullets:["A phase is not permission to stop learning.","The Digital Service Standard should be considered across the whole lifecycle, not at a single gate.","Non-digital channels and end-to-end service impacts remain in scope throughout."],sourceIds:["dss","deck"]},{heading:"Continuous does not mean chaotic",body:"Teams can explore upcoming opportunities while delivering validated work, provided both streams share outcomes, people and feedback. Reviews, operational data and research continuously update the opportunity and product backlogs. The loop is: discover problems or opportunities, define solutions, deliver value, measure outcomes, iterate and improve.",sourceIds:["deck","cdh","svpg"]}],questions:[{id:"lifecycle-q1",moduleId:"lifecycle",prompt:"What is the primary job of Alpha in the government service process?",options:["Operate the service indefinitely","Explore and test different ways to meet user needs","Freeze the requirements before build","Complete procurement"],answer:1,optionNotes:["That is Live.","","Freezing requirements is the opposite of what Alpha is for \u2014 it exists to find out which approach works.","Procurement may occur, but it is not the purpose of the phase."],rationale:"Alpha is for testing hypotheses and approaches before committing to the Beta service."},{id:"lifecycle-q2",moduleId:"lifecycle",prompt:"When should product discovery stop?",options:["It should continue as new evidence and needs emerge","At the end of the Discovery phase","When the business case is approved","At first release"],answer:0,optionNotes:["","The phase is named Discovery; it is not the only place discovery happens.","Approval funds the work. It does not resolve the uncertainty in it.","First release is where the most valuable evidence starts arriving, not where enquiry ends."],rationale:"The intensity and the questions change, but continuous improvement requires ongoing discovery and measurement."},{id:"lifecycle-q3",moduleId:"lifecycle",prompt:"Which phase produces evidence about how the service behaves under real conditions with real users at scale?",options:["Alpha","Beta","None \u2014 that only happens after the project closes","Discovery"],answer:1,optionNotes:["Alpha tests approaches with prototypes. Useful, but not under real operating conditions.","","Waiting until after closure means nobody is funded or accountable to act on what is found.","Discovery produces evidence about needs and constraints, before a service exists."],rationale:"Beta builds and trials an accessible, secure service with real users. It is the first point at which operational reality tests the design."},{id:"lifecycle-q4",moduleId:"lifecycle",prompt:"The deck describes the product lifecycle as 'a continuous loop, not a linear process'. What does that imply for measurement?",options:["Measurement should wait until the service is stable enough to give clean numbers","Measurement is a closure activity that confirms benefits were realised","Measurement feeds the next cycle of discovery and reprioritisation","Measurement is only required where a business case claimed a benefit"],answer:2,optionNotes:["Waiting for clean numbers usually means waiting past the point where the finding could have changed anything.","Measurement at closure informs a report. It cannot inform a decision, because the decisions are already made.","","Benefit claims set a floor for what must be measured, not a ceiling. Guardrails and user outcomes matter regardless."],rationale:"In a loop, measurement is an input to the next iteration: discover, define, deliver, measure, iterate. Treating it as a terminal reporting step breaks the loop."}],scenarios:[{id:"lifecycle-s1",moduleId:"lifecycle",context:"A service has moved to Live. The project team is disbanding and no owner has been assigned for performance, research or backlog decisions.",prompt:"What is the strongest response?",options:["Wait for complaints to indicate where attention is needed","Produce a more thorough closure report","Accept this \u2014 Live means the work is finished","Assign enduring ownership, measures and an improvement cadence before transition"],answer:3,optionNotes:["Complaints are a lagging, heavily filtered signal. Most users who fail simply stop.","A closure report documents the past. It assigns nobody to the future.","Live is the phase where the service meets the most users. Treating it as an endpoint is how accessibility and performance decay unnoticed.",""],rationale:"A live service needs durable ownership and feedback loops; otherwise value, accessibility and operational quality decay invisibly."},{id:"lifecycle-s2",moduleId:"lifecycle",context:"An Alpha tested three approaches. Two failed with users and one succeeded. The governance board asks the team to move all three into Beta so that no work is wasted.",prompt:"What should the product manager argue?",options:["Move the successful option and archive the other two without discussion","Agree \u2014 the development effort is already sunk and should be used","Explain that Alpha's purpose is to eliminate approaches, and that carrying failed options into Beta converts learning into rework","Move all three but resource the successful one more heavily"],answer:2,optionNotes:["The right decision, but taken silently. The board needs to see that Alpha worked \u2014 eliminating two options is a return on the investment, not a loss.","Sunk cost is the fallacy the phase gate exists to interrupt. The money is spent either way; the only question is what happens next.","","Splitting resource across approaches that failed with users spreads the same mistake across a larger budget."],rationale:"Alpha exists to narrow the option space. Two eliminated approaches are the phase succeeding, and saying so out loud is what protects the next Alpha from the same pressure."}],assignment:{title:"Draw the evidence loop",instruction:"Map how evidence will flow through a real service after release.",prompts:["What operational and user evidence will be observed?","Who interprets it and makes backlog decisions?","What cadence will connect learning to the next increment?","Which phase is your service in, and what would have to be true to move to the next one?"]}},{id:"roles",number:7,title:"Roles, teams and decision rights",subtitle:"Put accountability close to the evidence",minutes:50,slides:"75\u201385",outcome:"Distinguish complementary product roles, name the surrounding delivery and governance roles, explain the product trio, and design decision rights across strategic, coordination and delivery layers.",coreIdea:"Strong product work is cross-functional. Role clarity should make collaboration and decisions easier \u2014 not create hand-offs between silos.",sections:[{heading:"Product manager and Product Owner are different horizons",body:"Organisations define these titles differently, and arguing about the definitions is usually a proxy for an unresolved accountability question. In the deck's model the two share a common objective but focus on different horizons.",table:{caption:"Slide 77 \u2014 the split",head:["Product Manager","Product Owner"],rows:[["Vision","Backlog management"],["Strategy","Story refinement"],["Outcomes","Acceptance criteria"],["Roadmaps","Sprint support"],["Stakeholder alignment","Clarifying requirements"]]},bullets:["The deck's two guiding questions: the PM asks 'are we working on the right things?'; the PO asks 'do teams have everything they need to deliver successfully?'","Do not use titles as a substitute for explicit accountability.","Avoid making the Product Owner a requirements courier.","Avoid separating strategic discovery from the team that must deliver and operate the result."],sourceIds:["deck","scrum"]},{heading:"The trio combines product, design and technology",body:"A product trio brings viability, desirability and feasibility into the same discovery conversation \u2014 product manager (viable), designer (desirable), technology lead (feasible). It is a collaboration pattern, not a committee that replaces broader research, delivery and stakeholder expertise. The deck shows trios operating at all three organisational layers, not only in delivery teams.",sourceIds:["cdh","svpg","deck"]},{heading:"Three layers, three questions",body:"The deck separates the organisation into strategic, coordination and delivery layers, each with its own question, scope and accountability. Escalate constraints, not every routine decision.",table:{caption:"Slides 82\u201385 \u2014 how the layers work together",head:["Layer","Its question","Responsible for","Typical work"],rows:[["Strategic","What future are we trying to create?","Direction, user needs and service outcomes \u2014 the why","Service strategy, cross-product experience, future service design, long-term technology direction, emerging user needs, organisational outcomes"],["Solution / coordination","What should we deliver next?","Translating strategy into roadmaps, priorities and features \u2014 the what and when","Roadmaps, feature prioritisation, dependency management, exploring solution options, product-level outcomes, cross-team coordination"],["Tactical / delivery","How do we successfully deliver this work?","Design, build, test and release \u2014 the how and how much","Refinement, sprint planning, story development, quality assurance, user validation, sprint showcases"]]},bullets:["State who decides, who contributes evidence and who must be consulted.","Place reversible, local decisions closest to the team.","Reserve governance attention for material risk, investment and cross-service trade-offs."],sourceIds:["deck","svpg"]},{heading:"The roles around you",body:"Product managers in DES do not operate alone, and the deck names the surrounding structure explicitly. Knowing who owns what saves you from either escalating unnecessarily or making a decision that was never yours.",table:{caption:"Slides 79 and 92 \u2014 the wider delivery and governance structure",head:["Role","Layer","Owns"],rows:[["Senior Responsible Officer","Governance","The project outcomes, delivery roadmap, championing the change"],["Senior Supplier","Governance","Supplier-side commitment and capability"],["Project Board","Governance","Investment and material risk decisions"],["Lead Delivery Manager","Coordination","Delivery across teams; removing systemic impediments"],["Product Manager","Coordination / strategic","Outcomes, priorities, product direction"],["Product Owner","Delivery","Building, curating and prioritising a refined, validated backlog"],["UX Lead / Designers","Solution","User research, service and interaction design"],["Solution Architect / Architects","Solution","Technical approach and integrity"],["Scrum Master","Delivery","Team process, flow and impediment removal"],["BAs, Developers, Testers","Delivery","Making working increments"]]},sourceIds:["deck"]}],questions:[{id:"roles-q1",moduleId:"roles",prompt:"What is the product trio intended to achieve?",options:["Approve every user story before development","Separate discovery from delivery","Replace stakeholder consultation","Combine product, design and technology perspectives in discovery"],answer:3,optionNotes:["Approval gates are the opposite of the intent. The trio is for shaping options, not signing off tickets.","It exists to connect them. Separating the two is the failure mode it addresses.","The trio is a working pattern, not a substitute for the people who hold policy, operational and user expertise.",""],rationale:"The trio improves cross-functional judgement about value, usability, feasibility and viability at the point options are shaped."},{id:"roles-q2",moduleId:"roles",prompt:"Where should a reversible, team-local design decision usually sit?",options:["With the delivery team closest to the evidence","At the highest governance board","With whichever stakeholder raises it most persistently","Outside the product team entirely"],answer:0,optionNotes:["","Board time is a scarce resource for material risk and investment. Spending it on reversible decisions delays everything else.","Persistence is not authority. This is how decision rights are captured by whoever has the most availability.","Removing the decision from the people with the relevant knowledge guarantees a slower and worse answer."],rationale:"Placing reversible decisions close to the relevant knowledge reduces delay while governance retains material risk and investment decisions."},{id:"roles-q3",moduleId:"roles",prompt:"Which question belongs to the solution / coordination layer?",options:["What future are we trying to create?","What should we deliver next?","How do we successfully deliver this work?","Who approves the business case?"],answer:1,optionNotes:["That is the strategic layer.","","That is the tactical / delivery layer.","Approval sits with governance and is not one of the three layer questions."],rationale:"The coordination layer translates strategy into roadmaps, priorities and features \u2014 it owns the what and the when, between the strategic why and the delivery how."},{id:"roles-q4",moduleId:"roles",prompt:"In the deck's structure, who owns the project outcomes and champions the change?",options:["The Senior Responsible Officer","The Lead Delivery Manager","The Product Manager","The Scrum Master"],answer:0,optionNotes:["","The Lead Delivery Manager owns delivery across teams, not the project outcomes themselves.","The product manager owns product outcomes, priorities and direction \u2014 which is related but narrower, and sits below the SRO in the governance structure.","The Scrum Master owns team process and impediment removal within a delivery team."],rationale:"The SRO owns the project outcomes, the delivery roadmap and championing the change. Knowing this matters because product decisions that alter the outcome need the SRO, not just the board."}],scenarios:[{id:"roles-s1",moduleId:"roles",context:"Designers research users, analysts write requirements and developers receive work months later. Each group says the others missed critical context.",prompt:"What structural change is most useful?",options:["Add a more thorough hand-over document","Create shared cross-functional discovery and refinement with clear decision rights","Remove the user research step to shorten the chain","Let each function maintain its own roadmap"],answer:1,optionNotes:["Better documentation reduces loss at a hand-off. It does not remove the hand-off, which is where the context is lost.","","The chain would be shorter and the output worse. Research is not the bottleneck; sequencing is.","Three roadmaps is three strategies. This formalises the disagreement instead of resolving it."],rationale:"Shared work reduces information loss and lets design, product and technology shape viable options together."},{id:"roles-s2",moduleId:"roles",context:"Your Product Owner is spending most of each sprint relaying questions between the delivery team and three business areas, and has no time for refinement. The backlog is filling with unrefined items and the team is starting sprints with unclear acceptance criteria.",prompt:"What is the underlying problem?",options:["The Product Owner needs better time management","The delivery team should be asking fewer questions","The Product Owner has become a requirements courier, and decision rights have not been agreed with the business areas","The role should be merged into the product manager position"],answer:2,optionNotes:["Treating a structural problem as a personal one guarantees it recurs with the next person in the seat.","The questions are legitimate. They arise because nobody has been given authority to answer them.","","Merging the roles increases the load on one person without resolving where the answers are supposed to come from."],rationale:"The deck warns specifically against the Product Owner becoming a requirements courier. The fix is agreeing who can decide what \u2014 reversible and local decisions to the team, business rules with named owners and agreed response times."}],assignment:{title:"Clarify decision rights",instruction:"Choose one recurring product decision and make the accountability explicit.",prompts:["Who owns the decision?","Whose evidence or expertise must shape it?","What threshold requires escalation, and what should remain with the team?","Which layer does this decision actually belong to \u2014 strategic, coordination or delivery \u2014 and where is it being made now?"]}},{id:"government",number:8,title:"Product practice in government",subtitle:"Work with policy, assurance and delivery constraints without losing the outcome",minutes:65,slides:"86\u201392",outcome:"Apply product principles inside DES ways of working and delivery phases, use the current Digital Service Standard accurately, distinguish it from internal governance, and protect inclusion, accessibility, security and service continuity.",coreIdea:"Government product practice combines user-centred evidence with public value, policy intent, stewardship, assurance and whole-of-service responsibility.",sections:[{heading:"Constraints are design inputs",body:"Policy intent, legislation, privacy, security, accessibility, records, procurement, funding and legacy systems shape the feasible solution space. Surface them early in discovery so they inform options rather than arriving as late-stage blockers.",bullets:["A policy requirement is not automatically a user need.","Compliance says what must be true; design still determines how people experience it.","Whole-of-service outcomes include assisted and non-digital channels."],sourceIds:["deck","dss"]},{heading:"Ways of Working: behaviours and framework",body:"DES ways of working has two core elements. The behaviours describe how people are expected to operate; the Digital Delivery Framework is the end-to-end, repeatable delivery pipeline that ensures consistent practice.",bullets:["We put user needs at the centre.","We are accountable and take ownership for solving issues.","We empower our people.","We connect and work across boundaries.","We do the basics brilliantly.","We are innovative and contemporary."],sourceIds:["deck"]},{heading:"The seven principles in practice",body:"These are the division's stated operating principles. Each one has an implication that changes what a product manager actually does \u2014 which is why they are worth knowing by number, not just by sentiment.",table:{caption:"Slides 88\u201389 \u2014 principles and their implications",head:["#","Principle","What it means in practice"],rows:[["1","Start with the problem, not the solution","Understand user needs, policy intent and root causes before committing to solutions. Discovery comes before build."],["2","Validate before you scale","Reduce risk through prototypes, testing and incremental releases rather than a single large commitment."],["3","Deliver value early and often","Prefer incremental delivery of valuable outcomes over large, infrequent releases."],["4","Decisions belong closest to the problem","People with the greatest understanding of users and delivery realities make day-to-day decisions."],["5","Focus on outcomes, not outputs","Measure success by value created, not volume of work completed. Outcomes over features, benefits over deliverables, value over activity."],["6","Design for the whole service","Optimise the end-to-end experience rather than individual systems, projects or organisational silos. Reuse before rebuild."],["7","Learn continuously","Discovery, validation and improvement continue throughout the life of a service."]]},sourceIds:["deck"]},{heading:"The four DES delivery phases",body:"DES has an agreed end-to-end delivery pipeline for all projects, divided into four phases with stage gates between them. This is the pipeline your work actually sits inside, and it is distinct from both the DTA service phases and the Digital Service Standard.",table:{caption:"Slides 90\u201391 \u2014 the DES pipeline",head:["Phase","Focus","Product management contribution"],rows:[["Pre-Approval","Establishing the case for investment","Problem definition, user evidence, outcome hypotheses, options and their risks"],["Pre-Delivery","Planning with the right amount of detail; establishing the runway","Refined backlog, validated approach, measures and baselines defined before build"],["Delivery","Building and releasing increments","Ordering the backlog, protecting the outcome, running discovery an increment ahead"],["Closure","Transitioning and completing the project","Handing over enduring ownership, measures and improvement cadence \u2014 not just documentation"]]},bullets:["The stated purpose: projects are well planned with the right amount of detail, teams have a clear runway, there is a shared view of success, and stage gates build in quality and predictability.","The product risk sits at Closure \u2014 a project closes, but the product does not.","Do not confuse these four phases with the DTA's Discovery/Alpha/Beta/Live, or with the Digital Service Standard. They are three different things that coexist."],sourceIds:["deck"]},{heading:"Use the current Digital Service Standard accurately",body:"Version 2.0 has 10 criteria, reduced from the former 13, and forms part of the Digital Experience Policy. It expects agile, user-centred work and consideration of the criteria across the service lifecycle. It is now fully in effect: it applied to new and redeveloped services from 1 July 2024, and to public-facing services that already existed before that date from 1 July 2025.",bullets:["The standard covers accessibility, inclusion, security, trust, adaptability and measurement.","Internal DES delivery phases can coexist with this external standard but should not be mistaken for it.","Governance evidence should demonstrate how the criteria are being met, not merely that a template was completed.","Staff-facing internal services sit outside the Phase 2 scope; check current DTA guidance before assuming applicability."],sourceIds:["dss","dsspdf"]},{heading:"Make governance a learning and risk conversation",body:"Strong gates examine evidence, unresolved risk, outcome confidence and readiness for the next investment \u2014 not only schedule and document completion. Product evidence can strengthen business cases and assurance decisions rather than competing with them.",bullets:["Show what was learned and what changed as a result.","Make residual assumptions and guardrails visible.","Preserve a clear owner for benefits and service performance after project closure.","A gate that only checks artefact completeness will approve a well-documented failure."],sourceIds:["deck","dss"]}],questions:[{id:"government-q1",moduleId:"government",prompt:"Which statement about the Digital Service Standard Version 2.0 is correct?",options:["It replaces internal departmental governance","It contains 13 criteria","It applies only during the Alpha phase","It contains 10 criteria and should be considered across the service lifecycle"],answer:3,optionNotes:["It sits alongside internal governance. Both apply, and confusing them is a common source of duplicated or missed evidence.","Thirteen was the former standard. Version 2.0 reduced it to 10.","It is explicitly lifecycle-wide. Treating it as a single-phase checkpoint is the failure it was revised to prevent.",""],rationale:"Version 2.0 reduced the former 13 criteria to 10 and explicitly encourages lifecycle-wide application."},{id:"government-q2",moduleId:"government",prompt:"How should policy constraints enter product work?",options:["They should be set aside during design and applied afterwards","Only at final assurance","As early discovery inputs that shape options and evidence","As user needs, since they define what the service must do"],answer:2,optionNotes:["Designing without constraints produces options that cannot be built, and wastes the design effort.","Late arrival is what turns a constraint into a blocker and forces rework.","","A policy requirement is not automatically a user need. Conflating them means never noticing when policy is creating the difficulty."],rationale:"Early involvement helps the team design within the real service and legal context and prevents late rework."},{id:"government-q3",moduleId:"government",prompt:"Which are the four DES delivery phases, in order?",options:["Initiation, Planning, Execution, Benefits Realisation","Problem, Options, Build, Measure","Discovery, Alpha, Beta, Live","Pre-Approval, Pre-Delivery, Delivery, Closure"],answer:3,optionNotes:["Generic project phasing, not the DES pipeline.","This resembles the product lifecycle loop rather than the delivery pipeline.","That is the DTA service design and delivery process \u2014 a different framework that coexists with the DES pipeline.",""],rationale:"DES divides its end-to-end pipeline into Pre-Approval, Pre-Delivery, Delivery and Closure, with stage gates between them. Keep it distinct from the DTA phases and from the Digital Service Standard."},{id:"government-q4",moduleId:"government",prompt:"Principle 6 is 'design for the whole service'. Which decision best reflects it?",options:["Considering the phone, paper and assisted channels alongside the digital journey, and reusing an existing capability rather than rebuilding","Delivering the digital service first and addressing other channels in a later project","Standardising the interface across all departmental systems","Optimising the online form's completion rate as the primary measure"],answer:0,optionNotes:["","Deferring other channels to a later project is how end-to-end problems become permanent, since the later project is rarely funded.","Interface consistency is a usability concern. Whole-of-service is about the end-to-end journey across channels and systems.","A single-channel measure can improve while the overall service worsens \u2014 for example by pushing failures to the phone queue."],rationale:"The principle optimises the end-to-end service experience rather than individual systems, projects or silos \u2014 and its stated implications include whole-of-service thinking and reuse before rebuild."},{id:"government-q5",moduleId:"government",prompt:"Which product-management risk is concentrated in the Closure phase?",options:["The backlog becomes too detailed","The project closes without enduring ownership of the product's performance and improvement","Stakeholders lose interest in the roadmap","The team over-invests in discovery"],answer:1,optionNotes:["Backlog detail is a Pre-Delivery and Delivery concern.","","Attention does fade, but the structural risk is that nobody is accountable, not that nobody is interested.","Over-investment in discovery is a Pre-Approval or Pre-Delivery risk, if it is one at all."],rationale:"A project closes; the product does not. Closure must hand over ownership, measures and an improvement cadence, or the service degrades with nobody accountable for noticing."}],scenarios:[{id:"government-s1",moduleId:"government",context:"The project has completed its templates, but research found a major accessibility barrier and the benefits measures have no baseline.",prompt:"What should the team present at the gate?",options:["Present the evidence, remediation plan, missing baseline and impact on readiness before seeking the next investment","Reclassify accessibility as a future enhancement","Proceed on the basis that documentation is complete","Defer the accessibility issue to Beta and proceed"],answer:0,optionNotes:["","Accessibility is a legal and standard obligation and part of service quality. It cannot be reclassified as optional polish.","This is precisely the failure mode the stage exists to describe: a gate that checks artefacts approves a well-documented failure.","Deferral without a plan is the same decision as ignoring it, taken with better manners."],rationale:"Assurance should use evidence to make an informed risk and investment decision; accessibility is part of service quality, not optional polish. A missing baseline also means benefits cannot later be demonstrated."},{id:"government-s2",moduleId:"government",context:"A policy area asks you to add a mandatory declaration screen. Research shows most users cannot tell what they are declaring, and the assisted channel already handles the same declaration verbally with a plain-language script.",prompt:"What is the strongest product response?",options:["Decline, since research shows users do not understand it","Meet the policy intent, but design the interaction using the evidence and the existing plain-language script, and measure comprehension","Escalate to the Project Board for a decision","Implement the screen as specified \u2014 the requirement is mandatory"],answer:1,optionNotes:["The obligation is real and cannot be declined. The question is how it is met, not whether.","","Board time is for material risk and investment. This is a design decision that belongs with the team and the policy owner.","Compliance says what must be true; it rarely dictates the interaction. Implementing the specification literally satisfies the letter and fails the intent."],rationale:"A policy requirement is not automatically a user need, but nor is it optional. Compliance defines what must be true; design determines how people experience it \u2014 and the assisted channel has already solved the comprehension problem."}],assignment:{title:"Prepare an evidence-based gate brief",instruction:"Frame a decision for governance in one page.",prompts:["What outcome and public value justify the work?","What evidence supports the proposed direction and what remains uncertain?","What risks, standards, guardrails and ownership conditions must be satisfied before proceeding?","Which DES phase gate is this, and what specifically must be true to pass it?"]}},{id:"integration",number:9,title:"Integration and capstone",subtitle:"Run the whole chain from need to measured value",minutes:60,slides:"93\u201398",outcome:"Integrate the course into a defensible product approach and explain the reasoning to users, delivery partners, stakeholders and governance.",coreIdea:"Product management is a connected chain of decisions: need \u2192 problem \u2192 outcome \u2192 options \u2192 evidence \u2192 ordered delivery \u2192 measurement \u2192 learning.",sections:[{heading:"Maintain the chain of evidence",body:"Every major item should trace backward to an outcome and forward to a way of learning. If a feature cannot be connected to a user or service problem, an intended result and a measure, its priority is unclear. The deck's closing questions are the shortest version of this test: what problem are we solving, what outcome are we trying to create, what evidence do we have, and what have we learned?",sourceIds:["deck","svpg"]},{heading:"What good looks like",body:"The deck names six qualities. They are worth treating as a checklist for your own work rather than as a poster: outcome focused, user centred, evidence based, collaborative, adaptive, value driven.",bullets:["Outcome focused: success is a measured change, not a delivered artefact.","User centred: decisions are grounded in what users actually do.","Evidence based: claims are traceable to something observed.","Collaborative: product, design and technology shape options together.","Adaptive: the plan changes when the evidence does.","Value driven: work that does not move a result needs a different justification."],sourceIds:["deck"]},{heading:"Tell the product story at three levels",body:"Executives need the outcome, evidence, investment and risk. Delivery teams need the problem context, goal, guardrails and near-term decisions. Users and operational partners need clear changes, support and feedback paths.",bullets:["Keep one truth; adjust the depth, not the facts.","Explain trade-offs and confidence honestly.","Separate evidence, assumption and decision in the way you speak."],sourceIds:["deck"]},{heading:"Reflection becomes practice",body:"Mastery comes from repeatedly making and explaining product decisions. The capstone uses the provider application-status case that runs through the source deck so you can practise the complete method, self-assess against a rubric, and export a reusable product brief.",bullets:["The deck's reflection questions: what problem are you solving and is it the right one? How are you measuring success? What assumptions need validation? What feedback loops exist? How will you know you have delivered value?","Retrieval and spacing are why this system makes you recall before it lets you reread."],sourceIds:["deck","retrieval","spacing","techniques"]}],questions:[{id:"integration-q1",moduleId:"integration",prompt:"Which chain best represents product reasoning?",options:["Workshop \u2192 roadmap \u2192 backlog","Feature \u2192 deadline \u2192 launch","Need \u2192 problem \u2192 outcome \u2192 options \u2192 evidence \u2192 delivery \u2192 measurement \u2192 learning","Budget \u2192 requirements \u2192 closure"],answer:2,optionNotes:["Each of these is a real artefact, but the chain has no problem at the front and no measurement at the end.","This is delivery without a rationale. It can be executed perfectly and still change nothing.","","This is a funding and assurance sequence. It manages the project, not the product."],rationale:"The full chain preserves the relationship between evidence, decisions, delivery and achieved value."},{id:"integration-q2",moduleId:"integration",prompt:"What should change when presenting the product story to different audiences?",options:["The stated outcome","The underlying facts","The evidence cited","The level of detail and framing"],answer:3,optionNotes:["If the outcome changes by audience, there is no shared understanding of what the work is for.","Changing the facts by audience is how organisations end up with three incompatible versions of the same project.","The evidence should be consistent; how much of it you present can vary.",""],rationale:"Different audiences need different depth, but the decision, evidence and outcome should remain consistent."},{id:"integration-q3",moduleId:"integration",prompt:"A stakeholder asks why a highly requested feature is not on the roadmap. What is the strongest form of answer?",options:["It was not in the approved scope","It did not score highly enough in prioritisation","The outcome it would serve is already better addressed by work in flight, and here is the evidence and the measure that would change that judgement","The team does not have capacity this year"],answer:2,optionNotes:["Scope is a procedural answer to a value question. It also implies nothing can ever change, which is untrue.","A score is the output of a judgement, not the justification for it. It invites an argument about the scoring instead of the substance.","","Capacity is true but incomplete. It implies the item would be next if resources appeared, which may not be the case."],rationale:"Traceability is what makes a prioritisation decision defensible. Naming the outcome, the evidence and the condition under which you would change your mind turns a refusal into a shared model."},{id:"integration-q4",moduleId:"integration",prompt:"Which of the deck's six 'what good looks like' qualities is most directly at risk when a team keeps a dated plan after the evidence has changed?",options:["Value driven","User centred","Collaborative","Adaptive"],answer:3,optionNotes:["Value drive is about justifying work by results. Related, but the direct failure here is the refusal to change.","User-centredness is about grounding decisions in user evidence. It may also suffer, but it is not what a frozen plan primarily violates.","Collaboration concerns how options are shaped, not how plans respond to evidence.",""],rationale:"Adaptive means the plan changes when the evidence does. Holding a dated plan to protect stakeholder confidence is the specific failure this quality names."}],scenarios:[{id:"integration-s1",moduleId:"integration",context:"A pilot improves self-service overall, but increases unsuccessful attempts among users relying on assistive technology.",prompt:"Which response demonstrates the strongest product judgement?",options:["Treat the accessibility result as a critical guardrail failure, investigate the cause and adapt before scaling","Report the aggregate figure and address the detail in a later release","Declare success because the average improved","Cancel the product permanently"],answer:0,optionNotes:["","Reporting the aggregate while knowing the disaggregated result is misleading by omission, and it scales the harm in the meantime.","An average can improve while a specific group is actively harmed. This is exactly what guardrails exist to surface.","The evidence supports adaptation, not abandonment. Most of the intervention is working."],rationale:"Outcomes must not hide distributional harm. The evidence should change the scaling decision and the next experiment."},{id:"integration-s2",moduleId:"integration",context:"You have ten minutes with the SRO before a board meeting. Delivery is on schedule, but discovery has shown the primary outcome measure will probably not move because the root cause sits in a policy process outside your control.",prompt:"What do you lead with?",options:["Delivery status, since that is what the board reports on","The outcome risk, the evidence behind it, and the decision you need \u2014 with the schedule position as context","A request to change the outcome measure to one the project can influence","Nothing yet \u2014 wait until the measurement confirms it after release"],answer:1,optionNotes:["Leading with green delivery status when you know the outcome is at risk trains the board to trust a signal that is not measuring the thing that matters.","","Changing the measure to one you can move is how a project reports success while the problem persists. It also destroys the baseline.","Waiting until after release means raising it when the decision can no longer be influenced and the cost is sunk."],rationale:"Executives need outcome, evidence, investment and risk. The chain of evidence is only useful if you are willing to report the link that is breaking \u2014 and the SRO owns the project outcomes, so this is precisely their decision."}],assignment:{title:"Complete the capstone brief",instruction:"Use the dedicated Capstone workspace to produce an end-to-end product approach for the provider application-status case.",prompts:["Can every proposed action trace to evidence and an outcome?","Are the riskiest assumptions explicit and testable?","Would a delivery team and a governance board understand what happens next and why?","Which of the deck's six qualities is weakest in your brief, and what would fix it?"]}}],si=G.flatMap(e=>[...e.questions,...e.scenarios.map(t=>({id:t.id,moduleId:t.moduleId,prompt:t.prompt,options:t.options,answer:t.answer,rationale:t.rationale,optionNotes:t.optionNotes,context:t.context}))]).concat(ql),Ol=G.reduce((e,t)=>e+t.minutes,0),ex=si.length;function zf(e){let t=G.find(a=>a.id===e);return t?[...t.questions,...ql.filter(a=>a.moduleId===e)]:[]}function rr(e){return G.find(t=>t.id===e)}function Wf(e){return ii.find(t=>t.id===e)}var zl="module/",Ul="module:",mg=["dashboard","path","diagnostic","review","practice","results","toolkit","capstone","fieldguide","glossary","sources","divergences","search","settings"];function gg(e){return e.startsWith(Ul)}function vg(e){return e.slice(Ul.length)}function Uf(e){return gg(e)?`${zl}${vg(e)}`:e}function Hl(e){let t=e.replace(/^#\/?/,"");return t?t.startsWith(zl)?`${Ul}${t.slice(zl.length)}`:mg.includes(t)?t:"dashboard":"dashboard"}function or(e=new Date){let t=e.getFullYear(),a=String(e.getMonth()+1).padStart(2,"0"),r=String(e.getDate()).padStart(2,"0");return`${t}-${a}-${r}`}function Ao(e){let t=new Date;return t.setDate(t.getDate()-e),or(t)}var yg=new Intl.DateTimeFormat("en-AU",{day:"numeric",month:"short"}),xg=new Intl.DateTi
