back:"A temporary structure for coordinating investment and delivery toward a defined change."},{id:"f03",moduleId:"thinking",kind:"definition",front:"Product vision",back:"A description of the future state the product or service is trying to create."},{id:"f04",moduleId:"thinking",kind:"definition",front:"Product strategy",back:"The focused choices about which critical problems to solve to progress toward the vision \u2014 including what not to pursue."},{id:"f05",moduleId:"thinking",kind:"discrimination",front:"Vision or strategy: 'Reduce administrative effort, increase self-service, improve transparency'",back:"Strategy. It names directions of travel and implies trade-offs. The vision is the destination \u2014 'a simpler, faster and more transparent experience for employers and providers'."},{id:"f06",moduleId:"thinking",kind:"application",front:"A sponsor says the fixed date means there is no time for discovery. What is the product move?",back:"Bounded discovery on the riskiest assumption inside the approved constraints. Product management is not all or nothing \u2014 some discovery beats none."},{id:"f07",moduleId:"thinking",kind:"definition",front:"The four shift-in-thinking pairs",back:"Projects \u2192 products. Outputs \u2192 outcomes. Requirements \u2192 problems. Delivery \u2192 learning."},{id:"f08",moduleId:"discovery",kind:"definition",front:"Discovery",back:"Work that reduces uncertainty about users, problems, opportunities and solution risks before and during delivery."},{id:"f09",moduleId:"discovery",kind:"definition",front:"Persona",back:"A research-grounded synthesis of user goals, needs, behaviours, motivations, challenges and context \u2014 not a demographic stereotype."},{id:"f10",moduleId:"discovery",kind:"definition",front:"Service blueprint",back:"A view connecting user actions and front-stage interactions to back-stage activities, supporting systems and processes."},{id:"f11",moduleId:"discovery",kind:"definition",front:"Created need",back:"Something users are forced to do because of policy or the way government works \u2014 a need manufactured by the system, not held by the user."},{id:"f12",moduleId:"discovery",kind:"discrimination",front:"Stated, unstated or created: 'I need the reconciliation spreadsheet emailed each Monday' \u2014 the spreadsheet exists only because two systems don't integrate",back:"Stated and created. Explicitly asked for, but the need exists only as a workaround. Automating it would entrench the workaround instead of removing it."},{id:"f13",moduleId:"discovery",kind:"definition",front:"Hypothesis",back:"A testable statement linking a proposed action for a group to an expected outcome and observable evidence \u2014 including what would show it false."},{id:"f14",moduleId:"discovery",kind:"application",front:"Discovery has produced a 60-page report recommending a mobile app. What are the two failures?",back:"The recommendation is not traceable to the evidence, and discovery has crossed into prescribing a solution. Discovery produces insight and hypotheses, not requirements or features."},{id:"f15",moduleId:"discovery",kind:"definition",front:"Lean Canvas riskiest assumption",back:"For each hypothesis, the claim that \u2014 if wrong \u2014 makes the whole thing fail. It is what you test first."},{id:"f16",moduleId:"discovery",kind:"discrimination",front:"Journey map or service blueprint?",back:"Journey map: the user's experience over time \u2014 goals, activities, touchpoints, emotions, pain points. Blueprint: what happens behind the scenes to produce that experience."},{id:"f17",moduleId:"outcomes",kind:"definition",front:"Output",back:"The thing produced or delivered \u2014 a feature, form, policy or release. The what."},{id:"f18",moduleId:"outcomes",kind:"definition",front:"Outcome",back:"A meaningful change in behaviour, performance, experience, risk or value resulting from the work. The why."},{id:"f19",moduleId:"outcomes",kind:"definition",front:"Leading indicator",back:"A predictive measure of future performance \u2014 for example feature usage or completion rate. It must itself be validated."},{id:"f20",moduleId:"outcomes",kind:"definition",front:"Lagging indicator",back:"A measure of past performance \u2014 for example customer satisfaction or outcome achieved."},{id:"f21",moduleId:"outcomes",kind:"definition",front:"Guardrail measure",back:"A measure that detects unacceptable harm, trade-offs or displacement while pursuing the primary outcome."},{id:"f22",moduleId:"outcomes",kind:"definition",front:"OKR grading scale",back:"4 exceeded expected results; 3 sufficient achievement; 2 made progress but fell short; 1 no progress."},{id:"f23",moduleId:"outcomes",kind:"application",front:"Calls fell 34% \u2014 but only because status enquiries were routed to a four-day callback queue. What happened?",back:"Displacement, not resolution. The measure moved without the outcome changing. A guardrail on time-to-resolution would have caught it."},{id:"f24",moduleId:"outcomes",kind:"discrimination",front:"Key result or action: 'Run five user interviews'",back:"Action. A key result is a measurable change with baseline, target and timeframe \u2014 'reduce median completion time from 18 to 12 minutes by June'."},{id:"f25",moduleId:"outcomes",kind:"definition",front:"The five kinds of good outcome",back:"User value; operational efficiency; financial impact; risk reduction; learning and reduced uncertainty."},{id:"f26",moduleId:"exploration",kind:"definition",front:"Desirability / value risk",back:"Whether the problem matters and people will choose or benefit from the proposed response."},{id:"f27",moduleId:"exploration",kind:"definition",front:"Feasibility risk",back:"Whether the team can build and operate the solution with available technology, data, skills and time."},{id:"f28",moduleId:"exploration",kind:"definition",front:"Viability risk",back:"Whether policy, operational, legal, financial and organisational conditions can sustain the solution."},{id:"f29",moduleId:"exploration",kind:"definition",front:"MVP",back:"The smallest coherent thing that delivers value and generates learning. Focused, intentional, uncertainty-reducing \u2014 not poor quality and not unfinished."},{id:"f30",moduleId:"exploration",kind:"discrimination",front:"Trade-off pair: affordable to run and technically sound, but no validated user problem",back:"Feasible + Viable = operable and sustainable. The risk is that it does not solve a genuine user problem."},{id:"f31",moduleId:"exploration",kind:"discrimination",front:"Trade-off pair: users need it and policy supports it, but it needs real-time data from batch systems",back:"Desirable + Viable = valuable and needed. The risk is that it is not technically achievable in the current landscape. You owe a feasibility spike."},{id:"f32",moduleId:"exploration",kind:"application",front:"Which method tests whether people can complete a task, versus whether an integration will hold?",back:"Prototype and usability testing for comprehension and usability; a technical spike against representative interfaces and data for feasibility."},{id:"f33",moduleId:"exploration",kind:"application",front:"When is an A/B test the right method?",back:"When you need to compare the effect of variants on a measure, at sufficient scale, with a working build. It shows difference, never explanation."},{id:"f34",moduleId:"delivery",kind:"definition",front:"Product Goal",back:"The long-term objective for the Scrum Team and the target against which the Product Backlog emerges."},{id:"f35",moduleId:"delivery",kind:"definition",front:"Product Backlog",back:"An emergent, ordered list of what is needed to improve the product; the Scrum Team's single source of work. Anyone may add; product management orders."},{id:"f36",moduleId:"delivery",kind:"definition",front:"Sprint",back:"Two weeks (10 working days) in the DES cadence, delivering small increments of releasable value."},{id:"f37",moduleId:"delivery",kind:"definition",front:"Program Increment (PI)",back:"Ten weeks (50 working days) in the DES cadence, delivering key business outcomes. Five sprints fit inside one."},{id:"f38",moduleId:"delivery",kind:"definition",front:"Epic",back:"A measurable business outcome spanning many PIs and teams. Maps to business-case benefits and blueprint pain points. Carries a hypothesis, description, outcomes/benefits and objective."},{id:"f39",moduleId:"delivery",kind:"definition",front:"Feature \u2014 minimum detail",back:"Hypothesis; sizing estimate; acceptance criteria; in/out of scope; feature measurement; risks, issues and dependencies. Demonstrable within a PI."},{id:"f40",moduleId:"delivery",kind:"definition",front:"Story \u2014 minimum detail",back:"As a [persona] I want [goal] so that [reason]; story points; area path; iteration path aligned to the expected sprint."},{id:"f41",moduleId:"delivery",kind:"definition",front:"WSJF",back:"Relative cost of delay \xF7 relative job duration or size. Cost of delay combines user/business value, time criticality, and risk reduction or opportunity enablement."},{id:"f42",moduleId:"delivery",kind:"discrimination",front:"Which of epic, feature, story and Program Increment are Scrum terms?",back:"None of them. Scrum defines the Product Goal, Product Backlog, Sprint Backlog and Increment. The rest come from scaled frameworks and local DES practice."},{id:"f43",moduleId:"delivery",kind:"application",front:"While delivery teams build PI N, what is product management doing?",back:"Discovery and solution exploration for PI N+1, so refined validated features are ready when the next increment starts."},{id:"f44",moduleId:"delivery",kind:"definition",front:"Outcome roadmap",back:"Now / Next / Later bands carrying objectives and key results, communicating direction at a confidence the evidence supports."},{id:"f45",moduleId:"delivery",kind:"application",front:"Eight features proposed, six refined, historical throughput five. What do you commit to?",back:"The refined six at most, with the capacity gap named. Send the two unrefined items to refinement \u2014 sponsorship is not refinement."},{id:"f46",moduleId:"lifecycle",kind:"definition",front:"Discovery phase (DTA)",back:"Understand the service landscape, user needs, policy intent and technology constraints."},{id:"f47",moduleId:"lifecycle",kind:"definition",front:"Alpha phase",back:"Explore several approaches and test hypotheses through prototypes and research, before committing to Beta."},{id:"f48",moduleId:"lifecycle",kind:"definition",front:"Beta phase",back:"Build and trial an accessible, secure service based on successful Alpha learning \u2014 the first test under real conditions."},{id:"f49",moduleId:"lifecycle",kind:"definition",front:"Live phase",back:"Operate the service and continue improving it through performance data and user feedback."},{id:"f50",moduleId:"lifecycle",kind:"application",front:"Alpha tested three approaches; two failed. The board wants all three carried into Beta. What do you say?",back:"Eliminating two options is Alpha succeeding, not effort wasted. Carrying failed approaches forward converts learning into rework."},{id:"f51",moduleId:"lifecycle",kind:"discrimination",front:"DTA phases or DES phases: Pre-Approval, Pre-Delivery, Delivery, Closure",back:"DES delivery phases. The DTA process is Discovery, Alpha, Beta and Live. They coexist and are not interchangeable."},{id:"f52",moduleId:"roles",kind:"definition",front:"Product trio",back:"Product manager (viable), designer (desirable) and technology lead (feasible) collaborating on discovery and product decisions."},{id:"f53",moduleId:"roles",kind:"definition",front:"Product manager horizon",back:"Vision, strategy, outcomes, roadmaps and stakeholder alignment. Asks: are we working on the right things?"},{id:"f54",moduleId:"roles",kind:"definition",front:"Product Owner horizon",back:"Backlog management, story refinement, acceptance criteria, sprint support and clarifying requirements. Asks: do teams have what they need to deliver?"},{id:"f55",moduleId:"roles",kind:"definition",front:"Senior Responsible Officer",back:"Owns the project outcomes, the delivery roadmap and championing the change."},{id:"f56",moduleId:"roles",kind:"definition",front:"The three layers and their questions",back:"Strategic: what future are we trying to create? Coordination: what should we deliver next? Delivery: how do we successfully deliver this work?"},{id:"f57",moduleId:"roles",kind:"definition",front:"Decision rights",back:"Explicit agreement about who decides, who contributes evidence, who is consulted and when escalation is required."},{id:"f58",moduleId:"roles",kind:"application",front:"The Product Owner spends every sprint relaying questions between the team and three business areas. What is the real problem?",back:"The PO has become a requirements courier because decision rights were never agreed. Fix the authority, not the calendar."},{id:"f59",moduleId:"government",kind:"definition",front:"Digital Service Standard 2.0",back:"The Australian Government's current 10-criterion standard, reduced from 13. Fully in effect: new services from 1 July 2024, pre-existing public-facing services from 1 July 2025."},{id:"f60",moduleId:"government",kind:"definition",front:"DES delivery phases",back:"Pre-Approval, Pre-Delivery, Delivery, Closure \u2014 with stage gates between them."},{id:"f61",moduleId:"government",kind:"definition",front:"Principle 1 and its implication",back:"Start with the problem, not the solution: understand user needs, policy intent and root causes first. Discovery comes before build."},{id:"f62",moduleId:"government",kind:"definition",front:"Principle 6 and its implication",back:"Design for the whole service: optimise the end-to-end experience across channels and systems, not individual projects. Reuse before rebuild."},{id:"f63",moduleId:"government",kind:"definition",front:"Policy intent vs user need",back:"Policy defines a required public result; research shows how people experience and can successfully meet it. A policy requirement is not automatically a user need."},{id:"f64",moduleId:"government",kind:"definition",front:"Evidence-based gate",back:"A governance decision using outcome evidence, readiness, unresolved assumptions and material risk \u2014 not document completion alone."},{id:"f65",moduleId:"government",kind:"application",front:"Which DES phase carries the greatest product risk, and why?",back:"Closure. The project ends but the product does not, so ownership of performance, measures and improvement must be handed over or the service decays unowned."},{id:"f66",moduleId:"government",kind:"application",front:"Policy mandates a declaration screen users cannot understand. The assisted channel already uses a plain-language script. What do you do?",back:"Meet the policy intent using the evidence and the existing script, then measure comprehension. Compliance says what must be true; design determines how it is experienced."},{id:"f67",moduleId:"integration",kind:"definition",front:"Evidence chain",back:"Need \u2192 problem \u2192 outcome \u2192 options \u2192 evidence \u2192 ordered delivery \u2192 measurement \u2192 learning."},{id:"f68",moduleId:"integration",kind:"definition",front:"Assumption",back:"Something believed true but not yet supported strongly enough for the decision being made."},{id:"f69",moduleId:"integration",kind:"definition",front:"What good looks like \u2014 the six qualities",back:"Outcome focused, user centred, evidence based, collaborative, adaptive, value driven."},{id:"f70",moduleId:"integration",kind:"definition",front:"Product judgement",back:"Choosing a defensible course under uncertainty by balancing evidence, outcomes, constraints, risk and learning."},{id:"f71",moduleId:"integration",kind:"application",front:"A pilot improves the average but worsens results for assistive-technology users. What does the evidence require?",back:"Treat it as a guardrail failure, investigate the cause and adapt before scaling. Averages can conceal distributional harm."},{id:"f72",moduleId:"integration",kind:"application",front:"Ten minutes with the SRO: delivery is green but the outcome measure probably will not move. What do you lead with?",back:"The outcome risk, the evidence behind it and the decision you need \u2014 schedule as context. The SRO owns the project outcomes."},{id:"f73",moduleId:"thinking",kind:"application",front:"A stakeholder says 'the users want it' about a feature nobody has researched. What do you ask?",back:"Which users, doing what, and what evidence shows they cannot do it today? 'Users want it' is an assumption wearing the costume of a finding."},{id:"f74",moduleId:"thinking",kind:"discrimination",front:"Output or outcome: 'Portal migrated to the new platform'",back:"Output. The outcome would be what changed for users or operations because of the migration \u2014 faster completion, fewer failures, lower running cost."},{id:"f75",moduleId:"discovery",kind:"application",front:"Analytics show a 60% drop-off. Interviews say the wording is confusing. What have you still not established?",back:"That wording is the binding constraint. Removing it might reveal a second barrier. Only a test establishes that fixing it changes the outcome."},{id:"f76",moduleId:"discovery",kind:"definition",front:"Triangulation",back:"Comparing evidence from different methods \u2014 behaviour, stated preference, operational data \u2014 because they routinely disagree, and the disagreement is itself the finding."},{id:"f77",moduleId:"discovery",kind:"discrimination",front:"Insight or requirement: 'Providers check status an average of four times per application'",back:"Insight. It describes observed behaviour. The requirement would be a solution someone chose in response to it."},{id:"f78",moduleId:"outcomes",kind:"application",front:"Your only measure is 'user satisfaction'. What is the risk?",back:"It is lagging, slow-moving and heavily confounded. You will not know whether you helped until long after the decisions are made. Pair it with a leading behavioural measure."},{id:"f79",moduleId:"outcomes",kind:"definition",front:"Vanity metric",back:"A number that reliably goes up and never changes a decision \u2014 page views, notifications sent, releases shipped. If no result would make you act differently, stop reporting it."},{id:"f80",moduleId:"outcomes",kind:"discrimination",front:"Guardrail or key result: 'Escalation for unresolved cases stays above 95%'",back:"Guardrail. It must not get worse; it is not what you are trying to improve. Key results move; guardrails hold."},{id:"f81",moduleId:"exploration",kind:"application",front:"You have three weeks and one engineer. Which assumption do you test?",back:"The one that is both most uncertain and most consequential \u2014 where being wrong kills the idea. Cheapness is measured against the decision, not the effort."},{id:"f82",moduleId:"exploration",kind:"definition",front:"Falsifiable test",back:"One where you have written down, in advance, the result that would make you stop or change direction. Without that line, you will rationalise any outcome."},{id:"f83",moduleId:"exploration",kind:"discrimination",front:"Which risk: 'The API exists but only refreshes overnight, and users need same-day status'",back:"Feasibility, surfacing as a value problem. The technology works; it cannot meet the need. Test the data freshness before designing around it."},{id:"f84",moduleId:"delivery",kind:"application",front:"A feature has acceptance criteria but no feature measurement. What breaks?",back:"You can tell whether it was built, never whether it worked. The PI closes, the benefit is assumed, and nothing feeds the next decision."},{id:"f85",moduleId:"delivery",kind:"definition",front:"Refinement",back:"Confirming the detail, scope and feasibility of candidate features before an increment starts. Committing to unrefined work is committing to a guess."},{id:"f86",moduleId:"delivery",kind:"discrimination",front:"Now/Next/Later or PI X/PI Y \u2014 which is the outcome roadmap?",back:"Now/Next/Later, carrying objectives and key results. PI X/PI Y is the feature roadmap, carrying likely solution work. Confidence bands versus committed slots."},{id:"f87",moduleId:"lifecycle",kind:"application",front:"Live service, falling completion rate, nobody has noticed for six months. What was missing?",back:"An owner, a measure and a cadence. Any one of the three missing and decay goes unobserved until someone complains."},{id:"f88",moduleId:"roles",kind:"application",front:"Every decision is going to the Project Board. What is the cost?",back:"Board capacity is spent on reversible detail, so material risk gets less attention, and the team learns not to decide anything. Push reversible decisions down."},{id:"f89",moduleId:"government",kind:"application",front:"You are asked to 'just make it accessible at the end'. What do you say?",back:"Accessibility is a delivery obligation and a design input, not a remediation phase. Retrofitting costs more and usually still fails the people it was meant to serve."},{id:"f90",moduleId:"government",kind:"discrimination",front:"Which framework: 'Discovery, Alpha, Beta, Live'?",back:"The DTA service design and delivery process. The DES pipeline is Pre-Approval, Pre-Delivery, Delivery, Closure. The Digital Service Standard is a third thing again \u2014 10 criteria applied across all of it."},{id:"f91",moduleId:"integration",kind:"application",front:"How do you know a roadmap item is justified?",back:"Trace it back to a user or service problem with evidence, and forward to a measure that would show whether it worked. If either end is missing, priority is unjustifiable."},{id:"f92",moduleId:"integration",kind:"definition",front:"Distributional harm",back:"An intervention that improves the average while making things worse for a specific group. Averages conceal it; disaggregated guardrails reveal it."}],ni=[{id:"vision",title:"Product vision",prompt:"For [users], create a future where [meaningful state], so that [public/user/organisational value].",example:"For employment-service providers, create a future where application progress is understandable and actionable, so they can support participants confidently with less avoidable effort."},{id:"problem",title:"Problem statement",prompt:"Our [who] are currently experiencing [what] when trying to [goal]. This occurs in [where] and has been happening since [when]. This is critical because [why / impact]. Evidence: [sources].",example:"Our providers are currently experiencing an inability to determine application progress when trying to support participants. This occurs across the provider portal and the support line, and has been happening since the 2023 platform split. This is critical because it generates avoidable support demand and leaves participants without answers. Evidence: call-reason coding, 12 interviews, journey observation.",note:"This follows the deck's who/what/goal/where/when/why structure from slide 30."},{id:"hmw",title:"How might we",prompt:"How might we [intended action] for [who] so that [desired outcome], while [important guardrail]?",example:"How might we make application progress understandable for providers so they can act without assistance, while preserving clear escalation for unresolved cases?",note:"The deck's format (slide 31) omits the guardrail clause. It is added here because government services almost always have a group whose access must not be traded away."},{id:"hypothesis",title:"Hypothesis",prompt:"We believe [intervention] for [audience] will [outcome]. We will know this is true when we see [signal], and false if [disconfirming signal], without [guardrail failure].",example:"We believe plain-language status and next-step guidance will reduce avoidable calls for providers. We will know it is true if successful self-service rises above 65%, and false if call volume holds while page views rise \u2014 without unresolved-case escalation dropping below 95%.",note:"The deck's version (slide 32) has no disconfirming signal and no guardrail. Both are added here: a hypothesis you cannot imagine being wrong is not testable."},{id:"okr",title:"Objective and key results",prompt:"Objective: [meaningful direction]. KR1: move [metric] from [baseline] to [target] by [date]. KR2: [second measure]. Guardrail: [must not worsen]. Grade at review: [1\u20134] because [insight].",example:"Objective: Make application progress understandable without assistance. KR1: successful self-service 42% \u2192 70% by June. KR2: avoidable status calls down 30%. Guardrail: unresolved-case escalation stays above 95%."},{id:"experiment",title:"Experiment brief",prompt:"Decision: [what will change]. Riskiest assumption: [claim]. Method: [test]. Participants/data: [sample]. Success/stop signals: [thresholds decided in advance].",example:"Decision: whether to invest in live status integration. Assumption: the proposed information resolves the main uncertainty. Test: realistic prototype with 8 representative providers using manually supplied data. Proceed if 6 of 8 correctly state the next action unprompted."},{id:"epic",title:"Epic",prompt:"Epic hypothesis: [outcome we believe this delivers]. Description: [scope]. Business outcomes and benefits: [measurable outcomes tracked, linked to the business case]. Objective: [the objective it serves].",example:"Epic hypothesis: consolidating application status into a single provider view will materially reduce avoidable support demand. Benefits: 30% reduction in status-related contacts; linked to business-case benefit B3. Objective: reduce administrative effort for providers.",note:"Epics span many PIs and multiple teams. Written to the deck's minimum detail, slide 61."},{id:"feature",title:"Feature",prompt:"Feature hypothesis: [user outcome expected]. Sizing estimate: [relative size]. Acceptance criteria: [conditions]. In scope / out of scope: [boundaries]. Feature measurement: [metric, e.g. 30% reduction in processing time]. Risks, issues, dependencies: [items].",example:"Feature hypothesis: providers shown a plain-language status with a next action will resolve their query without contacting support. Measurement: successful self-service rate for status queries, target 65% in the first PI after release. Out of scope: payment status. Dependency: status API availability from the assessment platform.",note:"Features are demonstrable within a PI. Feature measurement is the field most often skipped and the one that decides whether you learn anything."},{id:"story",title:"User story with evidence",prompt:"As a [persona], I want [capability] so that [reason]. Acceptance: [observable conditions]. Story points: [estimate]. Area path: [team/product]. Iteration path: [sprint]. Outcome link: [measure].",example:"As a provider, I want to see the current application status and the required next action so I can support the participant without calling. Acceptance: status meaning is available to screen readers, a timestamp is shown, and the escalation path is visible. Outcome link: successful self-service rate."},{id:"gate",title:"Evidence-based gate brief",prompt:"Decision requested: [decision]. Phase gate: [Pre-Approval / Pre-Delivery / Delivery / Closure]. Outcome: [result sought]. Evidence: [what supports it]. Uncertainty: [what remains]. Risks and standards: [material items, including DSS criteria]. Ownership after this gate: [named owner]. Next test or investment: [proposal].",example:"Proceed to a controlled Beta after accessibility remediation and baseline capture. Evidence supports comprehension; data freshness remains a material operational risk. Enduring owner named for post-Live performance."}],So=60,Rt=[{id:"c1",title:"User and service context",prompt:"Identify the users, their real goal, the end-to-end service and the strongest available evidence.",checks:["Names a specific user group and what they are trying to achieve","Describes the service across channels, not just the digital interface","Cites the evidence relied on and its limits"]},{id:"c2",title:"Problem and root cause",prompt:"Write a solution-neutral problem statement. Separate the visible symptom from the likely root causes and mark remaining assumptions.",checks:["Problem statement contains no proposed solution","Distinguishes symptom from root cause","Flags which claims are still assumptions"]},{id:"c3",title:"Vision and strategic choice",prompt:"Describe the future state, the first strategic focus and at least one deliberate non-priority.",checks:["Vision describes a state, not a feature","Names the first problem to solve and why it is first","States something explicitly deferred"]},{id:"c4",title:"Outcome and measures",prompt:"Write one objective, two key results, one leading indicator and one guardrail with definitions and baselines.",checks:["Key results have baseline, target and timeframe","Leading indicator is distinguished from the outcome","Guardrail names a group or channel that must not be harmed"]},{id:"c5",title:"Options and risks",prompt:"Generate at least three materially different options, including at least one non-build option. Compare value/usability, feasibility and viability risks.",checks:["Three genuinely different options, not three variants of one","At least one process, policy or non-build option","Each option assessed against all three lenses"]},{id:"c6",title:"Experiment",prompt:"Choose the riskiest assumption and design the cheapest credible test, including decision thresholds set in advance.",checks:["Identifies one assumption as both critical and uncertain","Method matches the kind of risk","States the result that would stop or change the idea"]},{id:"c7",title:"Delivery approach",prompt:"Define a Product Goal, an initial ordered backlog with at least one item written to the deck's minimum detail, and an outcome-oriented Now/Next/Later roadmap.",checks:["Backlog is ordered with a stated rationale","At least one epic, feature or story written to its required fields","Roadmap uses confidence bands rather than false dates"]},{id:"c8",title:"Government readiness",prompt:"Address policy intent, accessibility, privacy and security, operational ownership, Digital Service Standard evidence, the relevant DES phase gate and the next governance decision.",checks:["Names the DES phase gate and what must be true to pass it","Treats accessibility as a delivery obligation, not an enhancement","Names an enduring owner for post-Live performance"]},{id:"c9",title:"Learning loop",prompt:"Explain how live performance, research and service feedback will change priorities after release.",checks:["Names the evidence that will be observed and by whom","States the cadence connecting learning to the next increment","Identifies who makes the resulting backlog decisions"]}],ar=[{id:"traceable",title:"Traceable",detail:"Every action connects to evidence and an outcome."},{id:"testable",title:"Testable",detail:"Critical assumptions have credible tests and predefined thresholds."},{id:"balanced",title:"Balanced",detail:"User, policy, operational and technical constraints are all visible."},{id:"measurable",title:"Measurable",detail:"Baselines, outcomes and guardrails are defined, not implied."},{id:"sustainable",title:"Sustainable",detail:"Ownership and learning continue after release."}],Co=[{id:"des-phases",title:"DES delivery phases",summary:"The agreed end-to-end pipeline for all DES projects, with stage gates between phases. Distinct from the DTA service phases and from the Digital Service Standard.",slides:"90\u201391",sourceIds:["deck"],items:[{term:"Pre-Approval",detail:"Establishing the case for investment. Product contribution: problem definition, user evidence, outcome hypotheses, options and risks."},{term:"Pre-Delivery",detail:"Planning with the right amount of detail and establishing the delivery runway. Product contribution: refined backlog, validated approach, measures and baselines defined before build."},{term:"Delivery",detail:"Building and releasing increments. Product contribution: ordering the backlog, protecting the outcome, running discovery an increment ahead."},{term:"Closure",detail:"Transition and completion. Product contribution: handing over enduring ownership, measures and an improvement cadence \u2014 the phase where product risk is highest."}]},{id:"dta-phases",title:"DTA service design and delivery phases",summary:"The government service process the product lifecycle aligns to. The deck presents Beta and Live combined; they are separated here because the ownership question at go-live is where services most often fail.",slides:"73",sourceIds:["dss","deck"],items:[{term:"Discovery",detail:"Understand the service landscape, user needs, policy intent and technology constraints."},{term:"Alpha",detail:"Explore several approaches and test hypotheses through prototypes and research."},{term:"Beta",detail:"Build and trial an accessible, secure service based on successful Alpha learning."},{term:"Live",detail:"Operate the service and continue improving through performance data and user feedback."}]},{id:"principles",title:"The seven principles in practice",summary:"DES operating principles and what each one changes about day-to-day product work.",slides:"88\u201389",sourceIds:["deck"],items:[{term:"1. Start with the problem, not the solution",detail:"Understand user needs, policy intent and root causes before committing. Discovery comes before build."},{term:"2. Validate before you scale",detail:"Reduce risk through prototypes, testing and incremental releases."},{term:"3. Deliver value early and often",detail:"Prefer incremental delivery of valuable outcomes over large, infrequent releases."},{term:"4. Decisions belong closest to the problem",detail:"People with the greatest understanding of users and delivery realities make day-to-day decisions."},{term:"5. Focus on outcomes, not outputs",detail:"Outcomes over features, benefits over deliverables, value over activity."},{term:"6. Design for the whole service",detail:"Optimise end-to-end experience across channels and systems. Reuse before rebuild."},{term:"7. Learn continuously",detail:"Discovery, validation and improvement continue throughout the life of a service."}]},{id:"wow",title:"Ways of Working \u2014 behaviours",summary:"The behavioural half of DES ways of working. The other half is the Digital Delivery Framework.",slides:"87",sourceIds:["deck"],items:[{term:"We put user needs at the centre",detail:"Decisions are grounded in what users actually do and need."},{term:"We are accountable and take ownership",detail:"Issues are owned and solved, not routed."},{term:"We empower our people",detail:"Authority sits with the people doing the work."},{term:"We connect and work across boundaries",detail:"Whole-of-service beats local optimisation."},{term:"We do the basics brilliantly",detail:"Reliability and quality before novelty."},{term:"We are innovative and contemporary",detail:"Current practice, adopted deliberately rather than fashionably."}]},{id:"cadence",title:"Cadence and backlog fields",summary:"The DES planning rhythm and the minimum detail each backlog level must carry. Area path and iteration path are Azure DevOps fields.",slides:"60\u201367",sourceIds:["deck","scrum"],items:[{term:"Sprint",detail:"2 weeks / 10 working days. Delivers small increments of releasable value."},{term:"Program Increment (PI)",detail:"10 weeks / 50 working days. Delivers key business outcomes. Five sprints per PI."},{term:"PI flow",detail:"Business outcome \u2192 candidate features \u2192 refinement \u2192 increment planning \u2192 delivery \u2192 measurement."},{term:"Epic fields",detail:"Epic hypothesis; description; business outcomes and benefits; objective."},{term:"Feature fields",detail:"Hypothesis; sizing estimate; acceptance criteria; in/out of scope; feature measurement; risks, issues and dependencies."},{term:"Story fields",detail:"As a [persona] I want [goal] so that [reason]; story points; area path; iteration path."},{term:"Not Scrum terms",detail:"Epic, feature and Program Increment come from scaled frameworks and local practice. Scrum defines Product Goal, Product Backlog, Sprint Backlog and Increment."}]},{id:"roles",title:"Roles around the product manager",summary:"Who owns what across governance, coordination and delivery.",slides:"79, 92",sourceIds:["deck"],items:[{term:"Senior Responsible Officer",detail:"Owns project outcomes, the delivery roadmap and championing the change."},{term:"Senior Supplier",detail:"Supplier-side commitment and capability."},{term:"Project Board",detail:"Investment and material risk decisions."},{term:"Lead Delivery Manager",detail:"Delivery across teams; removing systemic impediments."},{term:"Product Manager",detail:"Outcomes, priorities and product direction. Asks: are we working on the right things?"},{term:"Product Owner",detail:"Building, curating and prioritising a refined, validated backlog. Asks: do teams have what they need?"},{term:"UX Lead and designers",detail:"User research, service and interaction design."},{term:"Solution Architect",detail:"Technical approach and integrity."},{term:"Scrum Master",detail:"Team process, flow and impediment removal."},{term:"BAs, developers, testers",detail:"Making working increments."}]},{id:"wsjf",title:"Prioritisation reference",summary:"WSJF components and the impact/effort quadrants, for use in refinement.",slides:"64",sourceIds:["wsjf","deck"],items:[{term:"WSJF formula",detail:"Cost of delay \xF7 job size. Higher sequences earlier."},{term:"Cost of delay",detail:"User and business value + time criticality + risk reduction or opportunity enablement."},{term:"Job size",detail:"Relative effort or duration. The denominator \u2014 which is why small valuable work moves early."},{term:"Quick wins",detail:"High impact, low effort. Do first."},{term:"Big-ticket items",detail:"High impact, high effort. Plan deliberately."},{term:"Fill-in jobs",detail:"Low impact, low effort. Do when capacity allows."},{term:"Thankless tasks",detail:"Low impact, high effort. Challenge whether they should be done at all."},{term:"Judgement still applies",detail:"Dependencies, safety, legislated mandates and confidence can and should override a score."}]}],El=[{id:"d1",topic:"Hypothesis statement",slides:"32",deck:"'We believe that [doing this] for [these people] will achieve [this outcome]. We'll know this is true when we see [this feedback / behaviour change].'",here:"Adds a disconfirming signal and a guardrail clause.",why:"The deck's form can only be confirmed, never falsified, and it has no protection against achieving the outcome by harming another group. Both additions are required for the measure design taught in Stage 3 to work."},{id:"d2",topic:"How might we",slides:"31",deck:"'How might we [intended action] for [who] so that [desired outcome]?'",here:"Adds 'while [important guardrail]'.",why:"Government services almost always have a group whose access must not be traded away for an average improvement. Naming it in the opportunity framing stops it being discovered at accessibility testing."},{id:"d3",topic:"Beta and Live",slides:"73",deck:"Presents the DTA process as Discovery, Alpha, and a combined Beta/Live.",here:"Treats Beta and Live as distinct phases.",why:"The transition from Beta to Live is where enduring ownership is either assigned or lost. Combining them makes the most common product failure in government invisible."},{id:"d4",topic:"Digital Service Standard",slides:"not covered",deck:"The deck does not mention the Digital Service Standard.",here:"Stage 8 covers Version 2.0: 10 criteria, applicability dates and lifecycle-wide use.",why:"The standard is a live obligation for public-facing services and post-dates much of the deck's framing. Omitting it would leave a learner unaware of a requirement that applies to their work."},{id:"d5",topic:"Attribution of the PM definition",slides:"8, 54",deck:"Quotes 'the intersection of business, technology and user experience...' without attribution.",here:"Attributes the framing to Martin Eriksson and lists him as a source.",why:"Eriksson appears on the deck's own recommended-reading list (slide 97). Attributing the quote is a small correction that also points learners at the fuller argument."},{id:"d6",topic:"MVP and accessibility",slides:"56",deck:"'MVPs aren't: a poor-quality solution, an unfinished product.'",here:"Adds that an MVP must still meet accessibility and security obligations.",why:"In practice 'minimum' is the word most often used to defer accessibility. Making the obligation explicit closes that gap."},{id:"d7",topic:"Problem statement structure",slides:"30",deck:"Who / what / goal / where / when / why-impact.",here:"Retained in full, with an added 'Evidence:' line.",why:"An earlier version of this course collapsed where and when into 'context'. That diverged from what learners are asked to produce at work, so the deck's structure has been restored and only the evidence line added."}],Of=[{id:"dx-thinking",moduleId:"thinking",prompt:"The clearest sign that a team is doing project thinking rather than product thinking is that\u2026",options:["success is declared when the agreed scope is delivered","they work to a fixed budget","they report to a Project Board","they use a stage-gated delivery pipeline"],answer:0,rationale:"Stage gates, fixed budgets and boards are all normal in government and compatible with product thinking. Defining success as scope delivered rather than a change achieved is the actual tell."},{id:"dx-discovery",moduleId:"discovery",prompt:"You have analytics showing where users drop out, and interviews explaining why they find a step confusing. What do you still not know?",options:["How many users are affected","Whether the confusion is the binding constraint, or whether something else would stop them anyway","What users say about the service","Where in the journey the problem occurs"],answer:1,rationale:"Quantitative tells you where and how many; qualitative tells you what people experience. Neither establishes that removing this barrier would change the outcome \u2014 that requires a test."},{id:"dx-outcomes",moduleId:"outcomes",prompt:"Which of these is the strongest evidence that an OKR is well written?",options:["The objective is ambitious and inspiring","Every key result has a named owner","You could tell from the key results alone whether the objective was achieved","The key results are all within the team's direct control"],answer:2,rationale:"Key results exist to make the objective's achievement observable. If they can all be met while the objective plainly is not, they are measuring activity. Note that outcome key results usually are not fully within a team's control \u2014 that is expected."},{id:"dx-exploration",moduleId:"exploration",prompt:"The cheapest credible test is usually the one that\u2026",options:["produces the most data","involves the fewest people","can be run without engineering effort","resolves the assumption most likely to kill the idea"],answer:3,rationale:"Cheapness is measured against the decision, not against effort. A test that is quick but answers a question you were not going to act on is expensive."},{id:"dx-delivery",moduleId:"delivery",prompt:"A backlog item has a clear title, an estimate and an assigned team, but no stated outcome. What is missing that matters most?",options:["Acceptance criteria","The link that would let anyone judge whether it should be prioritised at all","A due date","A technical design"],answer:1,rationale:"Without a connection to a user or service outcome, priority is unjustifiable and success is unmeasurable. Acceptance criteria and design matter, but they answer 'is it done', not 'should we do it'."},{id:"dx-delivery2",moduleId:"delivery",prompt:"Two items have similar value and urgency. One is a quarter the size of the other. Which usually goes first, and why?",options:["The smaller one, because value and learning arrive sooner per unit of effort","Whichever the sponsor prefers","They should be started together to balance the team's workload","The larger one, because it delivers more total value"],answer:0,rationale:"This is the whole point of dividing cost of delay by job size. Smaller valuable work realises benefit and produces learning earlier, which also improves the next decision."},{id:"dx-lifecycle",moduleId:"lifecycle",prompt:"What most reliably distinguishes a service that will keep improving after launch from one that will not?",options:["The size of the original budget","Whether the technology stack is modern","The quality of the closure documentation","Whether an owner, measures and an improvement cadence exist after the project ends"],answer:3,rationale:"Improvement requires someone accountable, something observed and a rhythm for acting on it. Without all three, a service degrades regardless of how well it launched."},{id:"dx-roles",moduleId:"roles",prompt:"A decision is reversible, low cost, and the delivery team has the most relevant information. Where should it be made?",options:["At the next governance forum, for transparency","By whoever raised it","By the delivery team","By the product manager, to maintain consistency"],answer:2,rationale:"Reversible, local decisions belong closest to the evidence. Escalating them consumes governance capacity that material risk and investment decisions need."},{id:"dx-roles2",moduleId:"roles",prompt:"Product manager and Product Owner disagree about what the team should build next. What does this most likely indicate?",options:["There is no shared product direction that both are working from","The Product Owner should defer, since the product manager owns strategy","One of them is wrong about the requirement","The roles have been defined badly and should be merged"],answer:0,rationale:"The two roles cover different horizons of one direction. Persistent disagreement about next steps usually means the direction itself has never been made explicit."},{id:"dx-government",moduleId:"government",prompt:"A stage gate reviews document completeness, schedule and budget, but not evidence or unresolved risk. What is the likely consequence?",options:["Projects will be delivered faster","Well-documented projects will be approved regardless of whether they will work","Teams will produce less documentation","Accessibility issues will be found earlier"],answer:1,rationale:"A gate assesses whatever it asks about. If it does not ask about evidence, outcome confidence or residual risk, it cannot distinguish a sound project from a well-presented one."},{id:"dx-government2",moduleId:"government",prompt:"Which best describes the relationship between a policy requirement and a user need?",options:["Policy requirements only constrain the assisted channel","They are the same thing in government services","Policy defines what must be true; research defines how people can successfully meet it","User needs override policy requirements where they conflict"],answer:2,rationale:"Compliance sets the obligation; design determines the experience of meeting it. Treating them as identical means never noticing when policy implementation is what creates the difficulty."},{id:"dx-integration",moduleId:"integration",prompt:"An intervention improves the headline measure but worsens results for one user group. What does this most require?",options:["Removing the affected group from the denominator","Accepting it as an unavoidable trade-off","Reporting the headline figure with a footnote","Investigating the cause and adapting before scaling"],answer:3,rationale:"Averages conceal distributional harm. The disaggregated result is the finding, and it should change the scaling decision rather than be annotated."},{id:"dx-thinking2",moduleId:"thinking",prompt:"A team can describe what it will ship next quarter but not what will be different for users afterwards. What is missing?",options:["Capacity planning","A stated outcome","Stakeholder buy-in","Technical design"],answer:1,rationale:"Knowing the output without the intended change means success can only be measured as 'we shipped it' \u2014 the exact trap the outputs-to-outcomes shift names."},{id:"dx-thinking3",moduleId:"thinking",prompt:"Which is the better test of whether something is a strategy?",options:["Does it say what will not be done?","Is it endorsed by leadership?","Does it cover a full financial year?","Does it list the priorities?"],answer:0,rationale:"Anyone can list priorities. Naming the deliberate exclusion is what turns a list into a choice, and it is the part that gets negotiated away first."},{id:"dx-discovery3",moduleId:"discovery",prompt:"Users repeatedly ask for a feature that would automate a workaround the department itself created. What should you interrogate first?",options:["Which team would own it","Whether the automation is technically feasible","How many users have asked","Whether the step needs to exist at all"],answer:3,rationale:"This is a created need. Automating it entrenches the workaround; the higher-value question is why the step exists."},{id:"dx-discovery4",moduleId:"discovery",prompt:"Which finding would most change a delivery plan?",options:["Most users are on mobile","Users find the current wording confusing","The problem occurs mainly in a channel the team is not funded to change","Satisfaction is below target"],answer:2,rationale:"It relocates the problem outside the team's remit, which changes scope, stakeholders and possibly whether the work should proceed at all."},{id:"dx-outcomes3",moduleId:"outcomes",prompt:"A measure improves sharply in the week a change ships, then returns to baseline within a month. What is the most useful interpretation?",options:["A novelty effect, so judge it on the sustained level not the spike","The measurement is broken","The change should be reverted","The change worked and then wore off"],answer:0,rationale:"Short-lived jumps after a visible change are routine. The decision-relevant number is where it settles, which is why measurement windows matter."},{id:"dx-outcomes4",moduleId:"outcomes",prompt:"Which is the strongest reason to define measures before delivery starts?",options:["It satisfies governance requirements","It prevents choosing the measure that happens to look good afterwards","It speeds up reporting","It helps size the work"],answer:1,rationale:"Measures chosen after the fact are chosen knowing the result. Committing in advance is what makes the evidence capable of contradicting you."},{id:"dx-exploration2",moduleId:"exploration",prompt:"You can only test one thing before a funding decision. What determines the choice?",options:["Which has the clearest method","Which test is quickest","Which assumption is most uncertain and most consequential","Which test the sponsor is most interested in"],answer:2,rationale:"Cheapness is measured against the decision. A fast test of something you would not act on is expensive; a slower test of the thing that kills the idea is not."},{id:"dx-exploration3",moduleId:"exploration",prompt:"An MVP ships without keyboard support 'because it is only a trial'. What is wrong with that reasoning?",options:["Keyboard support is cheap to add","Trials should not go to real users","Trials still need full features","Minimum refers to the scope of the bet, not the quality or accessibility of the build"],answer:3,rationale:"'Minimum' is the word most often used to defer accessibility. It licenses a smaller bet, never an experience that excludes people."},{id:"dx-delivery3",moduleId:"delivery",prompt:"A backlog item has been near the top for six months without being started. What does that most likely indicate?",options:["The team is under-resourced","It is not actually as high a priority as its position claims","It is blocked by a dependency","Estimation is inaccurate"],answer:1,rationale:"Order is a claim about what matters most. Something perpetually next but never started reveals the stated order and the real order have diverged."},{id:"dx-delivery4",moduleId:"delivery",prompt:"Why does the deck insist a feature carries a measurement field?",options:["So you can tell whether it worked, not just whether it was built","To help estimate effort","To satisfy the definition of done","To support reporting to governance"],answer:0,rationale:"Without it, a PI closes, the benefit is assumed, and nothing feeds the next prioritisation decision \u2014 the loop silently stops closing."},{id:"dx-lifecycle2",moduleId:"lifecycle",prompt:"Which is the strongest argument for continuing research after a service goes Live?",options:["Teams have spare capacity post-launch","It generates content for reporting","It is required by the standard","The service now meets its widest and least-selected audience for the first time"],answer:3,rationale:"Pre-launch research uses recruited participants. Live is the first time the whole population, including those who struggle most, encounters the service."},{id:"dx-lifecycle3",moduleId:"lifecycle",prompt:"An Alpha concludes that none of the three tested approaches works. How should that be reported?",options:["As a resourcing problem","As a failed Alpha","As a successful Alpha that avoided an expensive wrong commitment","As a reason to extend the phase"],answer:2,rationale:"Alpha exists to eliminate approaches. Eliminating all three is a return on the investment, and framing it as failure teaches the next team to hide the same result."},{id:"dx-roles3",moduleId:"roles",prompt:"Who should decide the wording of a validation error message?",options:["The delivery team, with content design input","The product manager","The policy area","The Project Board"],answer:0,rationale:"Reversible, local, and the relevant expertise sits in the team. Escalating it spends scarce governance attention and slows the work for no gain."},{id:"dx-roles4",moduleId:"roles",prompt:"A product manager spends most of the week writing acceptance criteria. What has probably gone wrong?",options:["Nothing \u2014 it is part of the role","The horizons have collapsed, leaving nobody on outcomes, direction or stakeholder alignment","The team lacks business analysts","The backlog is too large"],answer:1,rationale:"That is Product Owner work. When the PM absorbs it, the longer-horizon questions go unasked \u2014 which is how a team delivers competently in the wrong direction."},{id:"dx-government3",moduleId:"government",prompt:"Which best describes how the Digital Service Standard relates to the DES delivery phases?",options:["The Standard replaces them","They are the same thing under different names","They coexist: the Standard applies across the lifecycle, the phases sequence the work","The phases apply only to digital services"],answer:2,rationale:"Three distinct things overlap here \u2014 the Standard, the DES pipeline and the DTA phases. Conflating them causes duplicated or missed assurance evidence."},{id:"dx-government4",moduleId:"government",prompt:"A policy requirement makes a task materially harder for users. What is the product manager's legitimate move?",options:["Escalate to the Project Board for a decision","Implement it as specified without comment","Refuse to implement it","Meet the intent with evidence-informed design, and take the friction data to the policy owner"],answer:3,rationale:"Compliance says what must be true; design determines the experience. Evidence about the resulting friction is exactly what a policy owner needs to reconsider implementation."},{id:"dx-integration3",moduleId:"integration",prompt:"Which is the best evidence that a team is operating adaptively rather than just iterating?",options:["It releases frequently","It has changed a plan because evidence contradicted it","It runs retrospectives","It uses two-week sprints"],answer:1,rationale:"Cadence and ceremony are iteration. Adaptation is the plan actually changing when the evidence says it should \u2014 which is uncomfortable and therefore rare."},{id:"dx-integration4",moduleId:"integration",prompt:"You must summarise a product's position in one sentence. Which structure serves best?",options:["The outcome we sought, what the evidence now shows, and the decision that follows","The risks and their mitigations","The budget position against forecast","What we built and when we finished"],answer:0,rationale:"Outcome, evidence, decision is the compression that survives every audience. The others are inputs to it, not substitutes."}],Po=[{term:"Acceptance criteria",origin:"General",moduleId:"delivery",definition:"The observable conditions that must hold for a story or feature to be considered done. They answer 'is it built', not 'should we build it'."},{term:"Alpha",origin:"Government",moduleId:"lifecycle",definition:"The DTA phase for exploring and testing several approaches through prototypes and research, before committing to a Beta service."},{term:"Area path",origin:"SAFe",moduleId:"delivery",definition:"An Azure DevOps field assigning a work item to a team or product. Required on stories in the DES backlog."},{term:"Assumption",origin:"General",moduleId:"integration",definition:"Something believed true but not yet supported strongly enough for the decision being made. The riskiest one is what you test first."},{term:"Beta",origin:"Government",moduleId:"lifecycle",definition:"The DTA phase for building and trialling an accessible, secure service with real users \u2014 the first test under real operating conditions."},{term:"Closure",origin:"Deck",moduleId:"government",definition:"The fourth DES delivery phase. Transition and completion \u2014 and where product risk is highest, because the project ends but the product does not."},{term:"Cost of delay",origin:"SAFe",moduleId:"delivery",definition:"In WSJF, user and business value plus time criticality plus risk reduction or opportunity enablement. The numerator, divided by job size."},{term:"Created need",origin:"Deck",moduleId:"discovery",definition:"Something users are forced to do because of policy or the way government works. A need manufactured by the system, not held by the user."},{term:"Decision rights",origin:"General",moduleId:"roles",definition:"Explicit agreement about who decides, who contributes evidence, who is consulted, and what threshold requires escalation."},{term:"Desirability",origin:"General",moduleId:"exploration",definition:"Whether the problem matters and people will choose or benefit from the proposed response. The human lens in DVF."},{term:"Digital Service Standard",origin:"Government",moduleId:"government",definition:"The Australian Government's current 10-criterion standard, reduced from 13. Fully in effect: new services from 1 July 2024, pre-existing public-facing services from 1 July 2025."},{term:"Discovery",origin:"Deck",moduleId:"discovery",definition:"Work that reduces uncertainty about users, problems, opportunities and solution risks. Produces insight and hypotheses \u2014 never requirements or features."},{term:"Distributional harm",origin:"General",moduleId:"integration",definition:"An intervention that improves the average while worsening outcomes for a specific group. Guardrails on disaggregated measures reveal it."},{term:"DVF",origin:"General",moduleId:"exploration",definition:"Desirable, Viable, Feasible \u2014 a three-lens filter applied before investing. Delivery fails when one perspective dominates."},{term:"Epic",origin:"SAFe",moduleId:"delivery",definition:"A measurable business outcome spanning many PIs and teams. Not a Scrum term. Requires a hypothesis, description, business outcomes and benefits, and an objective."},{term:"Feasibility",origin:"General",moduleId:"exploration",definition:"Whether the team can build and operate the solution with available technology, data, skills and time. The technology lens in DVF."},{term:"Feature",origin:"SAFe",moduleId:"delivery",definition:"A smaller tangible outcome contributing to an epic, demonstrable within a PI. Requires a hypothesis, sizing, acceptance criteria, scope boundaries, measurement, and risks."},{term:"Feature measurement",origin:"Deck",moduleId:"delivery",definition:"The metric that shows whether a delivered feature worked, e.g. '30% reduction in processing time'. The field most often skipped and the one that decides whether you learn anything."},{term:"Guardrail",origin:"General",moduleId:"outcomes",definition:"A measure that detects unacceptable harm, trade-offs or displacement while pursuing the primary outcome. It must not worsen; it is not what you are improving."},{term:"How might we",origin:"Deck",moduleId:"discovery",definition:"A design-thinking reframe turning a problem into an actionable opportunity, without prescribing a solution."},{term:"Hypothesis",origin:"Deck",moduleId:"discovery",definition:"A testable statement linking a proposed action for a group to an expected outcome and observable evidence \u2014 including what would show it false."},{term:"Increment",origin:"Scrum",moduleId:"delivery",definition:"A usable step toward the Product Goal. Each increment is additive to all prior increments and must be verified."},{term:"Iteration path",origin:"SAFe",moduleId:"delivery",definition:"An Azure DevOps field aligning a story to the sprint in which delivery is expected. Misaligned iteration paths make PI reporting silently drift."},{term:"Lagging indicator",origin:"Deck",moduleId:"outcomes",definition:"A measure of past performance \u2014 customer satisfaction, outcome achieved. Confirms the result after it has happened."},{term:"Leading indicator",origin:"Deck",moduleId:"outcomes",definition:"A predictive measure of future performance \u2014 feature usage, completion rate. Moves early, but must itself be validated."},{term:"Lean Canvas",origin:"General",moduleId:"discovery",definition:"A one-page model of problem, users, solution ideas, business outcomes, hypotheses and riskiest assumptions. Its function is to expose what to test first."},{term:"Live",origin:"Government",moduleId:"lifecycle",definition:"The DTA phase for operating the service and continuing to improve it through performance data and user feedback. Needs an owner, measures and a cadence."},{term:"MVP",origin:"Deck",moduleId:"exploration",definition:"The smallest coherent thing that delivers value and generates learning. Focused and intentional \u2014 not a poor-quality or unfinished product, and never an excuse to defer accessibility."},{term:"Objective",origin:"Deck",moduleId:"outcomes",definition:"In OKRs, a qualitative, specific and motivating direction. Measured by two to five key results."},{term:"OKR",origin:"Deck",moduleId:"outcomes",definition:"Objectives and Key Results. We will [objective], as measured by [key results], via [actions]. Graded 1 to 4 at review."},{term:"Opportunity",origin:"General",moduleId:"discovery",definition:"A problem or need reframed as something the team could act on, before any solution has been chosen."},{term:"Outcome",origin:"Deck",moduleId:"outcomes",definition:"A meaningful change in behaviour, performance, experience, risk or value resulting from the work. The why."},{term:"Output",origin:"Deck",moduleId:"outcomes",definition:"The thing produced or delivered \u2014 a feature, form, policy or release. The what. Can be delivered perfectly and change nothing."},{term:"Persona",origin:"Deck",moduleId:"discovery",definition:"A research-grounded synthesis of user goals, needs, behaviours, motivations, challenges and context. Not a demographic stereotype."},{term:"Pre-Approval",origin:"Deck",moduleId:"government",definition:"The first DES delivery phase. Establishing the case for investment: problem definition, user evidence, outcome hypotheses, options and risks."},{term:"Pre-Delivery",origin:"Deck",moduleId:"government",definition:"The second DES delivery phase. Planning with the right amount of detail and establishing the runway: refined backlog, validated approach, baselines defined before build."},{term:"Product",origin:"Deck",moduleId:"thinking",definition:"An enduring vehicle for delivering value to identifiable users, with ongoing ownership and improvement. May be software, policy, operational procedures, or a combination."},{term:"Product Backlog",origin:"Scrum",moduleId:"delivery",definition:"An emergent, ordered list of what is needed to improve the product; the Scrum Team's single source of work. Anyone may add; product management orders."},{term:"Product Goal",origin:"Scrum",moduleId:"delivery",definition:"The long-term objective for the Scrum Team and the target against which the Product Backlog emerges."},{term:"Product Manager",origin:"Deck",moduleId:"roles",definition:"Holds vision, strategy, outcomes, roadmaps and stakeholder alignment. Asks: are we working on the right things?"},{term:"Product Owner",origin:"Scrum",moduleId:"roles",definition:"Holds backlog management, refinement, acceptance criteria and sprint support. Asks: do teams have what they need to deliver? Must not become a requirements courier."},{term:"Product trio",origin:"General",moduleId:"roles",definition:"Product manager (viable), designer (desirable) and technology lead (feasible) collaborating on discovery. A working pattern, not an approval committee."},{term:"Program Increment",origin:"SAFe",moduleId:"delivery",definition:"Ten weeks / 50 working days in the DES cadence, delivering key business outcomes. Five two-week sprints fit inside one. Not a Scrum term."},{term:"Project",origin:"Deck",moduleId:"thinking",definition:"A temporary structure for coordinating investment and delivery toward a defined change. Ends; the product does not."},{term:"Root cause analysis",origin:"Deck",moduleId:"discovery",definition:"Working back from a visible symptom to the structural cause, commonly by asking why repeatedly. Prevents solving the first thing you noticed."},{term:"Senior Responsible Officer",origin:"Deck",moduleId:"roles",definition:"Owns the project outcomes, the delivery roadmap and championing the change. Product decisions that alter the outcome need the SRO."},{term:"Service",origin:"Deck",moduleId:"thinking",definition:"The series of interactions that helps someone do something. A product is a tool created to deliver the service."},{term:"Service blueprint",origin:"Deck",moduleId:"discovery",definition:"A view connecting user actions and front-stage interactions to back-stage activities, supporting systems and processes."},{term:"Spike",origin:"General",moduleId:"exploration",definition:"A bounded piece of technical investigation run against representative interfaces and data, to answer a feasibility question before committing."},{term:"Sprint",origin:"Scrum",moduleId:"delivery",definition:"Two weeks / 10 working days in the DES cadence, delivering small increments of releasable value."},{term:"Story",origin:"General",moduleId:"delivery",definition:"A small slice a team can complete and validate in a sprint. As a [persona] I want [goal] so that [reason], plus points, area path and iteration path."},{term:"Story points",origin:"General",moduleId:"delivery",definition:"A relative estimate of size and complexity, used for forecasting throughput. Not hours, and not a productivity measure."},{term:"Triangulation",origin:"General",moduleId:"discovery",definition:"Comparing evidence from different methods, because stated preference, observed behaviour and system constraints routinely disagree."},{term:"Vanity metric",origin:"General",moduleId:"outcomes",definition:"A number that reliably rises and never changes a decision. If no value would make you act differently, it is not worth reporting."},{term:"Viability",origin:"General",moduleId:"exploration",definition:"Whether policy, operational, legal, financial and organisational conditions can sustain the solution. The business and policy lens in DVF."},{term:"Vision",origin:"Deck",moduleId:"thinking",definition:"A description of the future state the product or service is trying to create. The destination, not the route."},{term:"Ways of Working",origin:"Deck",moduleId:"government",definition:"The DES behaviours plus the Digital Delivery Framework \u2014 an end-to-end, repeatable delivery pipeline underpinned by seven principles."},{term:"Whole-of-service",origin:"Deck",moduleId:"government",definition:"Optimising the end-to-end experience across channels and systems, including assisted and non-digital, rather than one interface or project."},{term:"WSJF",origin:"SAFe",moduleId:"delivery",definition:"Weighted Shortest Job First: relative cost of delay divided by relative job duration or size. A comparative sequencing aid, not a guarantee."}],ql=[{id:"x-think-1",moduleId:"thinking",prompt:"A service has been live for three years, has a named owner, a backlog and a quarterly improvement cycle. Funding arrives as a series of discrete projects. What is it?",options:["A project, mislabelled as a product","Neither \u2014 funding model decides","A programme of work","A product, funded by projects"],answer:3,optionNotes:["Ownership, backlog and improvement cadence are the defining properties. It is a product regardless of how the money arrives.","Funding is a constraint on a product, not its definition. The deck is explicit that product thinking can operate inside project funding.","A programme coordinates related projects. It says nothing about enduring ownership of a service.",""],rationale:"Ongoing ownership, an evolving backlog and an improvement cadence make it a product. The funding model is a constraint to work within, not a definition."},{id:"x-think-2",moduleId:"thinking",prompt:"Which is the clearest example of the deck's 'delivery \u2192 learning' shift?",options:["Publishing a release calendar","Running a retrospective on team process","Instrumenting a release so it produces evidence that changes the next decision","Increasing deployment frequency"],answer:2,optionNotes:["A calendar communicates timing. It generates no evidence about whether the work mattered.","Retrospectives improve how the team works. Useful, but they examine process rather than whether the product changed anything.","","Frequency is a delivery capability. Shipping more often without measuring effect just produces wrong answers faster."],rationale:"The shift is about each release being expected to teach you something that alters what you do next \u2014 not about cadence or process hygiene."},{id:"x-think-3",moduleId:"thinking",prompt:"Your vision statement could describe almost any government service. What is the likely problem?",options:["It describes a generic quality rather than a specific future state for specific users","It is too short","It has no measurable target","It is aspirational rather than operational"],answer:0,optionNotes:["","Length is not the issue; some of the best visions are one line.","Visions are not supposed to carry targets \u2014 that is what key results do.","A vision should be aspirational. That is its job."],rationale:"'Simpler, faster, better' fits everything and therefore guides nothing. A vision has to name who it is for and what specifically becomes possible."},{id:"x-think-4",moduleId:"thinking",prompt:"Which trade-off is the deck actually asking product managers to make?",options:["Users versus the business","What to pursue now versus what to explicitly defer","Discovery versus delivery","Speed versus quality"],answer:1,optionNotes:["The role exists to hold these together, not to pick one.","","The deck argues these run in parallel, an increment apart \u2014 not that you choose between them.","A real tension, but not the strategic choice the deck names."],rationale:"Strategy is choosing priorities, focusing investment and deciding what not to do. Naming the deferral is what makes it a decision rather than a wish list."},{id:"x-disc-1",moduleId:"discovery",prompt:"Support data shows the top call reason is 'status enquiry'. What does that tell you on its own?",options:["That the portal needs a status page","That status information is hard to find","That people are calling about status, and nothing about why","That self-service would reduce calls"],answer:2,optionNotes:["A solution derived from a call-reason code. This is exactly the jump discovery exists to prevent.","Plausible, but it is an inference. They might be calling because they distrust what they can see.","","That is a hypothesis, and an untested one. Calls might move to another channel instead."],rationale:"Operational data tells you what is happening at volume. It never tells you why, and call-reason codes are assigned by staff under time pressure."},{id:"x-disc-2",moduleId:"discovery",prompt:"A five-whys chain ends at 'because the service grew through several projects and was never consolidated'. What kind of finding is that?",options:["An invalid conclusion \u2014 five whys should end at a user","A user need","A usability problem","A structural cause outside the current team's control"],answer:3,optionNotes:["Five whys should end at a cause, wherever it sits. Ending at a structural one is common in government and is useful information.","It describes the system's history, not what any user is trying to achieve.","Usability is what people experience. This explains why the experience is that way.",""],rationale:"The deck's own chain ends here deliberately. Naming a structural cause tells you the problem cannot be fully solved at the interface \u2014 which changes what you propose and to whom."},{id:"x-disc-3",moduleId:"discovery",prompt:"Which is the strongest evidence that a persona is doing real work?",options:["It is grounded in interviews and observation","It changes a prioritisation decision","It has a name and a photograph","It was signed off by stakeholders"],answer:1,optionNotes:["Necessary, but not sufficient \u2014 well-researched personas still gather dust.","","Presentation. It can be beautifully produced and entirely invented.","Sign-off establishes agreement, not accuracy."],rationale:"Research grounding is the entry price. The test the deck applies to every artefact is whether it improves a consequential decision."},{id:"x-disc-4",moduleId:"discovery",prompt:"Which of these belongs in a journey map rather than a service blueprint?",options:["The user's emotional low point","The queue that assessment requests sit in","The legacy system holding application records","The team responsible for manual verification"],answer:0,optionNotes:["","Back-stage process. Blueprint.","Supporting system. Blueprint.","Back-stage people. Blueprint."],rationale:"Journey maps capture the user's experience over time \u2014 goals, touchpoints, emotions, pain points. Blueprints capture what happens behind the curtain to produce it."},{id:"x-out-1",moduleId:"outcomes",prompt:"A key result reads 'improve the provider experience'. What is missing?",options:["An initiative to deliver it","Stakeholder agreement","A named owner","A baseline, a target and a timeframe"],answer:3,optionNotes:["Initiatives are how you might move it. Their absence does not stop it being measurable.","Agreement on an unmeasurable statement is agreement about nothing.","Ownership matters but is not what makes a key result measurable.",""],rationale:"Without a baseline you cannot tell whether it moved; without a target you cannot tell whether it moved enough; without a timeframe you cannot tell when to check."},{id:"x-out-2",moduleId:"outcomes",prompt:"Your team hits a grade 4 on every key result, three quarters running. What is the most likely explanation?",options:["Exceptional delivery performance","The measures are well designed","The targets are being set below what the team already expects to achieve","The grading scale is being applied too generously"],answer:2,optionNotes:["Possible, but consistently exceeding every target is a stronger signal about the targets than the team.","Well-designed targets should occasionally be missed. Never missing means they carry no information.","","Generous grading is a variant of the same problem, but the deck's scale is specific enough that target-setting is the usual culprit."],rationale:"Targets that are always exceeded have stopped being targets. A mix of 2s and 3s with clear insight is more useful to the organisation than a wall of 4s."},{id:"x-out-3",moduleId:"outcomes",prompt:"Which pairing would best detect that a faster online form is pushing failures onto the phone channel?",options:["Completion rate and assisted-channel contact volume","Time on page and bounce rate","Submission count and error count","Completion rate and satisfaction"],answer:0,optionNotes:["","Both are online engagement measures and neither speaks to the other channel.","Both count online activity. A user who abandons and phones instead appears in neither.","Both measure the online channel. Neither can see the phone queue."],rationale:"Displacement is only visible if you measure the place the demand moves to. That is precisely what a guardrail on the assisted channel is for."},{id:"x-out-4",moduleId:"outcomes",prompt:"A dashboard reports 'notifications sent: 42,000'. Under what condition is that worth reporting?",options:["Never \u2014 it is a pure activity count","When it is paired with whether recipients acted on them","When the number is growing","When it is compared against last quarter"],answer:1,optionNotes:["Too absolute \u2014 as a denominator for an action rate it is genuinely useful.","","Growth in an activity count tells you the system is busier, not better.","A comparison of two activity counts is still an activity count."],rationale:"Volume becomes meaningful the moment it is the denominator of a behaviour: of 42,000 sent, how many led to the action the notification existed to prompt?"},{id:"x-exp-1",moduleId:"exploration",prompt:"Which option should always be on the table before a build option is chosen?",options:["Extending an existing system","Doing nothing this financial year","Removing the step or changing the process entirely","Buying a commercial product"],answer:2,optionNotes:["A sensible reuse option, but again a technology response.","A legitimate choice, but deferral is not the same as questioning whether the step needs to exist.","","Sometimes right, but it is still a build-or-buy solution to an assumed problem."],rationale:"The deck asks for non-build, process and policy options in the option set. The cheapest fix is often deleting a step that only exists because of how the department is organised."},{id:"x-exp-2",moduleId:"exploration",prompt:"You run a prototype test with eight providers. Six complete the task, two do not. What have you learned?",options:["Nothing \u2014 the sample is too small","The design works for 75% of providers","The design is ready to build","That the concept is broadly comprehensible, and there are two failure modes worth understanding"],answer:3,optionNotes:["Eight is a reasonable qualitative sample for comprehension. The failures are the most informative part.","Eight participants cannot support a percentage. Treating qualitative counts as rates is a common misreading.","Comprehension is one risk. Feasibility, viability and scale are untested.",""],rationale:"Small-sample qualitative work tells you what can go wrong and why, not how often. The two failures are the finding; go and understand them."},{id:"x-exp-3",moduleId:"exploration",prompt:"'We'll build a small version and see how it goes.' What is missing for this to be an MVP?",options:["A budget","A defined decision and a result that would change it","Full accessibility conformance","A production release plan"],answer:1,optionNotes:["Cost matters, but a funded release that teaches you nothing is still not an MVP.","","Required regardless \u2014 but its presence does not make something an MVP.","An MVP may or may not go to production; that is not the defining property."],rationale:"'See how it goes' has no decision attached, so any result can be rationalised. An MVP exists to produc
